const BLITZ=[["plus","Plus und Minus bis 100",()=>{if(Math.random()<.5){const a=ri(5,70),b=ri(3,100-a);return[`${a} + ${b}`,a+b]}const a=ri(20,100),b=ri(3,a);return[`${a} ${MINUS} ${b}`,a-b]}],
  ["mal","Einmaleins",()=>{const a=ri(2,10),b=ri(2,10);return[`${a} · ${b}`,a*b]}],
  ["geteilt","Geteilt (Einmaleins rückwärts)",()=>{const a=ri(2,10),b=ri(2,10);return[`${a*b} : ${a}`,b]}],
  ["minus","Mit negativen Zahlen",()=>{const a=ri(-20,20),b=ri(-20,20),t=ri(0,2);return t===0?[`${P(a)} + ${P(b)}`,a+b]:t===1?[`${P(a)} ${MINUS} ${P(b)}`,a-b]:(()=>{const x=ri(-9,9),y=ri(-9,9);return[`${P(x)} · ${P(y)}`,x*y]})()}],
  ["prozent","Prozent im Kopf",()=>{const p=pick([10,20,25,50,75]),G0=pick([20,40,60,80,100,120,200,240,400,500,800]);return[`${p} % von ${G0}`,G0*p/100]}],
  ["gross","Kopfrechnen mit Nullen",()=>{const a=ri(2,9),b=ri(2,9),za=pick([10,100]),zb=pick([1,10]);return Math.random()<.6?[`${fmt(a*za)} · ${fmt(b*zb)}`,a*za*b*zb]:[`${fmt(a*b*100)} : ${a}`,b*100]}]];
function openBlitz(){const sh=gameShell("Blitzrechnen");let mode=null;
  const pickM=()=>{sh.onStop(()=>{});sh.score.textContent="0";modePicker(sh.body,BLITZ,"blitz",m=>{mode=m;play()})};
  const play=()=>{let score=0,miss=0,cur,typed="",over=false;const body=sh.body;body.innerHTML="";sh.score.textContent="0";
    const card=h(`<div class="card stack blitz" style="align-items:center;text-align:center"><div class="bq term"></div><div class="ba" aria-live="polite"></div></div>`);
    const pad=h(`<div class="keypad">${["7","8","9","4","5","6","1","2","3",MINUS,"0","⌫"].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join("")}</div>`);
    const tb=timerBar(60,()=>end());body.append(tb,card,pad);
    const nextQ=()=>{cur=mode[2]();typed="";$(".bq",card).innerHTML=cur[0]+" =";$(".ba",card).textContent="?";card.classList.remove("ok","bad")};
    const press=k=>{if(over)return;if(k==="⌫")typed=typed.slice(0,-1);else if(k===MINUS||k==="-"){typed=typed.startsWith("-")?typed.slice(1):"-"+typed}else if(/^\d$/.test(k))typed+=k;
      $(".ba",card).textContent=typed?typed.replace("-",MINUS):"?";const want=String(cur[1]);
      if(typed===want){score++;countTask();sh.score.textContent=score;card.classList.add("ok");setTimeout(nextQ,160)}
      else if(typed.replace("-","").length>=want.replace("-","").length&&typed!=="-"){miss++;card.classList.add("bad");setTimeout(()=>{typed="";$(".ba",card).textContent="?";card.classList.remove("bad")},300)}};
    pad.querySelectorAll("button").forEach(b=>b.onclick=()=>press(b.dataset.k));
    const kh=e=>{if(e.key==="Backspace")press("⌫");else if(e.key==="-")press("-");else if(/^\d$/.test(e.key))press(e.key)};document.addEventListener("keydown",kh);
    const end=()=>{if(over)return;over=true;tb.kill();document.removeEventListener("keydown",kh);if(score)addXP(score);
      gameOver(body,score,"blitz:"+mode[0],`richtige Aufgaben in 60 Sekunden${miss?`, ${miss} daneben`:""}. +${score} XP`,{pick:pickM,same:play})};
    sh.onStop(()=>{over=true;tb.kill();document.removeEventListener("keydown",kh)});nextQ()};
  pickM()}

/* Zahlen-Bubbles */
const BUB=[["10","Mach 10 (Zahlen 1 bis 9)",10,()=>ri(1,9),1],["100","Mach 100 (Zehner und Fünfer)",100,()=>ri(1,19)*5,1],["1","Mach 1 (Zehntel)",1,()=>ri(1,9)/10,.1],["20","Mach 20 (auch negative)",20,()=>ri(-5,18),1]];
function openBubbles(){const sh=gameShell("Zahlen-Bubbles");let mode=null;
  const pickM=()=>{sh.onStop(()=>{});sh.score.textContent="0";modePicker(sh.body,BUB,"bubble",m=>{mode=m;play()})};
  const play=()=>{let score=0,over=false,sel=[],vals=[];const body=sh.body,T=mode[2],eq=(a,b)=>Math.abs(a-b)<1e-9;body.innerHTML="";sh.score.textContent="0";
    const info=h(`<div class="card stack" style="align-items:center;text-align:center;gap:4px"><span class="eyebrow">Ziel</span><div class="bq term">${fmt(T)}</div><div class="muted small" id="bsum">Ausgewählt: 0</div></div>`);
    const grid=h(`<div class="bubbles"></div>`),tb=timerBar(60,()=>end());body.append(tb,info,grid);
    const solvable=()=>{for(let i=0;i<vals.length;i++)for(let j=i+1;j<vals.length;j++){if(eq(vals[i]+vals[j],T))return true;for(let k=j+1;k<vals.length;k++)if(eq(vals[i]+vals[j]+vals[k],T))return true}return false};
    const fix=()=>{let tries=0;while(!solvable()&&tries++<50){const i=ri(0,vals.length-1),j=(i+1+ri(0,vals.length-2))%vals.length,a=vals[i],need=Math.round((T-a)*10)/10;if(need!==0&&(mode[0]==="20"||need>0)&&Math.abs(need)<T)vals[j]=need;else vals[i]=mode[3]()}};
    const draw=()=>{grid.innerHTML="";vals.forEach((v,i)=>{const b=h(`<button type="button" class="bub" aria-pressed="${sel.includes(i)}">${fmt(v)}</button>`);b.onclick=()=>tap(i,b);grid.append(b)});
      const s=sel.reduce((a,i)=>a+vals[i],0);$("#bsum",info).textContent=`Ausgewählt: ${fmt(Math.round(s*10)/10)}`};
    const tap=(i,b)=>{if(over)return;if(sel.includes(i))sel=sel.filter(x=>x!==i);else sel.push(i);const s=Math.round(sel.reduce((a,k)=>a+vals[k],0)*10)/10;
      if(eq(s,T)){score++;countTask();sh.score.textContent=score;sel.forEach(k=>vals[k]=mode[3]());sel=[];fix();draw();grid.classList.add("pop");setTimeout(()=>grid.classList.remove("pop"),250);return}
      if((mode[0]!=="20"&&s>T)||sel.length>3){grid.classList.add("bad");setTimeout(()=>grid.classList.remove("bad"),300);sel=[]}draw()};
    for(let i=0;i<12;i++)vals.push(mode[3]());fix();draw();
    const end=()=>{if(over)return;over=true;tb.kill();if(score)addXP(score*2);gameOver(body,score,"bubble:"+mode[0],`mal die ${fmt(T)} gebaut. +${score*2} XP`,{pick:pickM,same:play})};
    sh.onStop(()=>{over=true;tb.kill()})};
  pickM()}

/* Memory: Bruch, Dezimalzahl, Prozent */
function openMemory(){const sh=gameShell("Memory");
  const play=()=>{const body=sh.body;body.innerHTML="";let moves=0,open=[],found=0,busy=false;sh.score.textContent="0 Züge";
    const sel=shuffle(BDP).slice(0,6),cards=shuffle(sel.flatMap((r,i)=>{const m=ri(0,2),a=[FR(R(r[0],r[1])),r[2],r[3]];const x=m===2?[a[1],a[2]]:[a[0],a[m+1]];return[{t:x[0],p:i},{t:x[1],p:i}]}));
    body.append(h(`<p class="muted small">Decke immer zwei Karten auf. Gleich viel? Dann bleiben sie liegen.</p>`));
    const grid=h(`<div class="memo"></div>`);body.append(grid);
    cards.forEach((c,i)=>{const b=h(`<button type="button" class="mc" aria-label="Karte ${i+1}"><span class="back">?</span><span class="front">${c.t}</span></button>`);
      b.onclick=()=>{if(busy||b.classList.contains("up"))return;b.classList.add("up");open.push([b,c]);
        if(open.length===2){moves++;sh.score.textContent=moves+" Züge";const [[b1,c1],[b2,c2]]=open;open=[];
          if(c1.p===c2.p){b1.classList.add("done");b2.classList.add("done");found++;countTask();if(found===6)setTimeout(()=>{addXP(5);gameOver(body,moves,"memory",`Züge für alle 6 Paare. +5 XP`,{pick:play,same:play},true)},500)}
          else{busy=true;setTimeout(()=>{b1.classList.remove("up");b2.classList.remove("up");busy=false},900)}}};grid.append(b)})};
  play()}

/* ---------- Hell/Dunkel ---------- */
const THKEY="schulkoje.theme";
function themeMode(){try{const t=localStorage.getItem(THKEY);return t==="light"||t==="dark"?t:"auto"}catch(e){return"auto"}}
function themeDark(){const m=themeMode();return m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches)}
function applyTheme(){const m=themeMode(),r=document.documentElement;m==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",m);
  const d=themeDark(),mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=d?"#0D1A15":"#1F6B57";
  const b=$("#themebtn");if(b){b.textContent=d?"☀":"☾";b.title=d?"Zum hellen Modus":"Zum dunklen Modus"}}
function setTheme(v){try{v==="auto"?localStorage.removeItem(THKEY):localStorage.setItem(THKEY,v)}catch(e){}applyTheme()}
function themeCard(){const c=h(`<div class="card stack"><span class="eyebrow">Darstellung</span><div class="row" role="group" aria-label="Hell oder dunkel"></div></div>`);
  [["auto","Automatisch"],["light","Hell"],["dark","Dunkel"]].forEach(([v,l])=>{const on=themeMode()===v,b=h(`<button class="btn small ${on?"":"ghost"}" type="button" aria-pressed="${on}">${l}</button>`);b.onclick=()=>{setTheme(v);openSettings()};$(".row",c).append(b)});return c}
$("#themebtn").onclick=()=>setTheme(themeDark()?"light":"dark");
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
applyTheme();
$("#gear").onclick=openSettings;$("#who").onclick=openProfiles;
renderStats();renderProfileChip();renderPath();
