{const i=PH.bands.findIndex(b=>b.key==="6-7");PH.bands[i]={key:"6-7",title:"Klasse 6–7",topics:[
  T("p-licht","Licht und Schatten","Geradlinige Ausbreitung",["licht"],[["Licht läuft geradeaus",`<p>Licht breitet sich <b>geradlinig</b> aus, in Luft mit etwa 300.000 km/s. Trifft es auf einen undurchsichtigen Körper, entsteht dahinter ein <b>Schatten</b>. Wegen der geraden Strahlen gibt es Kernschatten und, bei größeren Lampen, Halbschatten.</p><p class="tip">Sonnen- und Mondfinsternis sind nur Schatten im All.</p>`]]),
  T("p-spiegel","Spiegel und Reflexion","Einfallswinkel = Reflexionswinkel",["spiegel"],[["Das Reflexionsgesetz",`<p>Winkel misst man immer zum <b>Lot</b> (der Senkrechten auf dem Spiegel).</p><p class="eq">Einfallswinkel = Reflexionswinkel</p><p>Ein ebener Spiegel zeigt das Bild genauso weit hinter dem Spiegel, wie der Gegenstand davor steht.</p>`]]),
  T("p-linse","Linsen und das Auge","Brennweite, Brechkraft",["linse"],[["Sammeln und Zerstreuen",`<p>Eine <b>Sammellinse</b> (in der Mitte dick) bündelt parallele Strahlen im <b>Brennpunkt</b>. Der Abstand heißt <b>Brennweite f</b>. Die <b>Brechkraft</b> D = 1/f (f in m) misst man in Dioptrien. Das Auge ist eine Sammellinse mit einstellbarer Brennweite; Brillen gleichen Fehler aus.</p>`]]),
  T("p-magnet","Magnetismus","Pole, Feldlinien",["magnet"],[["Pole und Felder",`<p>Jeder Magnet hat einen <b>Nord- und Südpol</b>. Gleiche Pole stoßen sich ab, ungleiche ziehen sich an. Das Magnetfeld macht man mit Eisenfeilspänen sichtbar: Die <b>Feldlinien</b> laufen außen von Nord nach Süd. Die Erde ist ein riesiger Magnet, daher zeigt der Kompass nach Norden.</p>`]]),
  T("p-stromkreis","Der elektrische Stromkreis","Reihe und parallel",["stromkreis"],[["Geschlossener Kreis",`<p>Ein Stromkreis braucht eine <b>Quelle</b>, einen <b>Verbraucher</b> und eine <b>geschlossene Leitung</b>. Ein Schalter öffnet oder schließt ihn.</p><ul class="rules"><li><b>Reihenschaltung:</b> ein Weg. Fällt ein Teil aus, ist alles aus.</li><li><b>Parallelschaltung:</b> mehrere Wege. Jeder Verbraucher arbeitet für sich.</li></ul>`]]),
  T("p-leiter","Leiter und Isolatoren","Wer leitet den Strom?",["leiter"],[["Frei bewegliche Ladungen",`<p><b>Leiter</b> (Metalle, Graphit, Salzwasser) haben frei bewegliche Ladungsträger. <b>Isolatoren</b> (Kunststoff, Glas, Gummi, Holz, Luft) haben keine. Darum sind Kabel innen Kupfer und außen Kunststoff.</p><p class="warn">Leitungswasser leitet! Nie mit nassen Händen an Steckdosen oder Geräte.</p>`]]),
  T("p-waerme","Temperatur und Wärme","Celsius, Kelvin, Ausdehnung",["waerme"],[["Temperatur messen",`<p>Die Celsius-Skala hat Fixpunkte bei 0 °C (Eis schmilzt) und 100 °C (Wasser siedet). Physiker nutzen <b>Kelvin</b>: K = °C + 273. Bei 0 K (−273 °C) ruht die Teilchenbewegung.</p><p>Fast alle Stoffe <b>dehnen sich</b> beim Erwärmen aus, darum haben Brücken Dehnungsfugen. Wasser ist bei 4 °C am dichtesten.</p>`]]),
  T("p-dichte","Masse, Volumen und Dichte","ρ = m : V",["dichte"],[["Die Dichte",`<p class="eq">ρ = m : V</p><p>Die Dichte sagt, wie schwer 1 cm³ eines Stoffes ist. Wasser: 1 g/cm³, Eisen: 7,9 g/cm³, Aluminium: 2,7 g/cm³, Holz meist kleiner als 1.</p><p>Kleinere Dichte als Wasser: schwimmt. Größere: sinkt. Ein Schiff schwimmt, weil es mit der Luft im Rumpf insgesamt weniger dicht ist als Wasser.</p>`]])
]}}
{const i=PH.bands.findIndex(b=>b.key==="8-10");PH.bands.splice(i,1,{key:"8",title:"Klasse 8",topics:[
  T("p-v","Geschwindigkeit","v = s : t, km/h und m/s",["geschw"],[["Weg durch Zeit",`<p class="eq">v = s : t</p><p>Umrechnen: <b>km/h : 3,6 = m/s</b> und <b>m/s · 3,6 = km/h</b>. 36 km/h sind 10 m/s.</p><p class="tip">Fährt man 2 h mit 30 km/h und 2 h mit 60 km/h, ist der Durchschnitt 45 km/h (gleiche Zeiten), nicht je nach Strecke gemittelt.</p>`]]),
  T("p-kraft","Kraft","Gewichtskraft, Feder",["kraft"],[["Kraft und Masse",`<p>Kraft misst man in <b>Newton (N)</b>, Masse in kg. Die <b>Gewichtskraft</b> ist F = m · g mit g ≈ 9,81 N/kg (auf dem Mond nur 1,6). Eine Feder dehnt sich proportional zur Kraft: <b>Hookesches Gesetz F = D · s</b>.</p><p>Kräfte haben Betrag <b>und</b> Richtung und werden als Pfeile gezeichnet.</p>`]]),
  T("p-hebel","Hebel und Drehmoment","Kraft mal Kraftarm",["hebel"],[["Das Hebelgesetz",`<p class="eq">F₁ · l₁ = F₂ · l₂</p><p>Ein Hebel ist im Gleichgewicht, wenn die <b>Drehmomente</b> links und rechts gleich sind. Langer Hebelarm: wenig Kraft nötig. Beispiele: Wippe, Brechstange, Schere, Schubkarre.</p>`,"hebel"]]),
  T("p-druck","Druck und Auftrieb","Pascal, Schweredruck, Archimedes",["druck"],[["Druck",`<p class="eq">p = F : A</p><p>Einheit: Pascal (1 Pa = 1 N/m²). Derselbe Druck auf kleiner Fläche drückt stärker: Messer, Nägel, Schneeschuhe breit.</p><p><b>Schweredruck:</b> Alle 10 m Wassertiefe kommt etwa 1 bar dazu. <b>Auftrieb</b> (Archimedes): Ein Körper erfährt so viel Auftrieb, wie das von ihm verdrängte Wasser wiegt.</p>`]]),
  T("p-arbeit","Arbeit, Energie und Leistung","W = F · s, P = W : t",["arbeit"],[["Drei Größen",`<ul class="rules"><li><b>Arbeit:</b> W = F · s (in Joule)</li><li><b>Lageenergie:</b> E = m · g · h</li><li><b>Leistung:</b> P = W : t (in Watt)</li></ul><p>Energie geht nie verloren, sie wird nur umgewandelt (Energieerhaltung). Beim Fahrradfahren wird Muskelenergie zu Bewegung und etwas Wärme.</p>`]]),
  T("p-elektro","Spannung, Stromstärke, Widerstand","Ohmsches Gesetz",["ohm"],[["U, I und R",`<p class="eq">R = U : I</p><p><b>Spannung U</b> (Volt) treibt den Strom an. <b>Stromstärke I</b> (Ampere) sagt, wie viel Ladung pro Sekunde fließt. <b>Widerstand R</b> (Ohm) bremst ihn. In Reihe addieren sich Widerstände.</p>`,"ohm"]])
]},{key:"9-10",title:"Klasse 9–10",planned:["Beschleunigung","Kraft und die Newtonschen Gesetze","Elektromagnetismus und Motor","Radioaktivität","Wärmelehre und Energieerhaltung"]})}
Object.assign(KT,{
 "p-licht":`<p>Zu Hause: Taschenlampe, Gegenstand und Wand. Kind verschiebt die Lampe und beobachtet die Schattengröße. <b>Typischer Fehler:</b> Der Schatten sei „im Gegenstand“ und nicht fehlendes Licht.</p>`,
 "p-spiegel":`<p>Mit Taschenlampe und Handspiegel im Dunkeln ausprobieren. <b>Typischer Fehler:</b> Winkel zur Spiegelfläche statt zum Lot messen.</p>`,
 "p-linse":`<p>Mit einer Lupe ein Fensterbild auf Papier scharf stellen (nie in die Sonne schauen!). <b>Typischer Fehler:</b> Brennweite in cm in die Formel setzen statt in Meter.</p>`,
 "p-magnet":`<p>Büroklammern, Kompass und Eisenfeilspäne unter Papier zeigen das Feld. <b>Typischer Fehler:</b> „Magnete ziehen alle Metalle an“: Nur Eisen, Nickel, Kobalt.</p>`,
 "p-stromkreis":`<p>Mit Flachbatterie, Lämpchen und Draht selbst bauen. Schulen nutzen oft Experimentierkästen. <b>Typischer Fehler:</b> Strom werde im Lämpchen „verbraucht“. Die Stromstärke bleibt im Kreis gleich, Energie wird abgegeben.</p>`,
 "p-leiter":`<p>Testkreis bauen und Gegenstände aus dem Haushalt prüfen lassen, vorher raten. <b>Typischer Fehler:</b> „Alles Metallische leitet gleich gut“ und „Wasser isoliert“.</p>`,
 "p-waerme":`<p>Thermometer in Eiswasser und kochendem Wasser. <b>Typischer Fehler:</b> Wärme und Temperatur verwechseln: Ein See hat weniger Temperatur als ein Tee, aber viel mehr Wärme.</p>`,
 "p-dichte":`<p>Gegenstände in der Badewanne schwimmen oder sinken lassen und Dichten schätzen. <b>Typischer Fehler:</b> „Schwere Dinge sinken“: Entscheidend ist die Dichte, nicht das Gewicht.</p>`,
 "p-v":`<p>Mit Stoppuhr und Schritten auf dem Schulweg messen. <b>Typischer Fehler:</b> Beim Umrechnen km/h und m/s mit 3,6 falschherum verwenden. Merkhilfe: Die Zahl in m/s ist kleiner.</p>`,
 "p-kraft":`<p>Mit einer Federwaage Alltagsgegenstände wiegen. <b>Typischer Fehler:</b> kg und N gleichsetzen. Ein Körper mit 1 kg hat etwa 10 N Gewichtskraft.</p>`,
 "p-hebel":`<p>Eine Wippe auf dem Spielplatz oder Lineal auf einem Stift: Münzen verschieben. <b>Typischer Fehler:</b> Den Abstand vom Rand statt vom Drehpunkt messen.</p>`,
 "p-druck":`<p>Mit der Hand auf eine Nadel und auf einen Stempel drücken. Eine Ente in der Badewanne zeigt Auftrieb. <b>Typischer Fehler:</b> Druck und Kraft verwechseln.</p>`,
 "p-arbeit":`<p>Treppensteigen: Masse, Höhe, Zeit schätzen und Leistung ausrechnen. <b>Typischer Fehler:</b> Arbeit sei auch, wenn man einen Koffer waagerecht trägt. Physikalisch ist F senkrecht zu s: keine Arbeit.</p>`,
 "p-elektro":`<p>Wasserbild: Spannung ist der Wasserdruck, Strom die Menge pro Sekunde, Widerstand die enge Stelle im Rohr. <b>Typischer Fehler:</b> Die Einheiten V, A und Ω verwechseln.</p>`
});

/* ---------- Physik Klasse 9–12 ---------- */
const rd=(x,d=100)=>R(Math.round(x*d),d);
Object.assign(G,{
  beschl(){const t=ri(0,2),a=ri(1,6),s=ri(2,8);
    if(t===0)return{q:`Ein Auto beschleunigt aus dem Stand in ${s} s auf ${fmt(a*s)} m/s. Wie groß ist die Beschleunigung?${unit("m/s²")}`,kind:"num",ans:R(a),sol:`a = Δv : t = ${a*s} : ${s} = <b>${a} m/s²</b>.`};
    if(t===1)return{q:`Ein Körper beschleunigt aus der Ruhe mit a = ${a} m/s². Wie schnell ist er nach ${s} s?${unit("m/s")}`,kind:"num",ans:R(a*s),sol:`v = a · t = ${a} · ${s} = <b>${a*s} m/s</b>.`};
    const b=2*a;return{q:`Ein Körper beschleunigt aus der Ruhe mit a = ${b} m/s². Welchen Weg legt er in ${s} s zurück?${unit("m")}`,kind:"num",ans:R(b*s*s/2),sol:`s = ½ · a · t² = ½ · ${b} · ${s*s} = <b>${b*s*s/2} m</b>.`}},
  newton(){const t=ri(0,2),m=ri(2,20),a=ri(1,6);
    if(t===0)return{q:`Ein Körper (${m} kg) wird mit ${a} m/s² beschleunigt. Welche Kraft wirkt?${unit("N")}`,kind:"num",ans:R(m*a),sol:`2. Newtonsches Gesetz: F = m · a = ${m} · ${a} = <b>${m*a} N</b>.`};
    if(t===1)return{q:`Eine Kraft von ${m*a} N wirkt auf ${m} kg. Wie groß ist die Beschleunigung?${unit("m/s²")}`,kind:"num",ans:R(a),sol:`a = F : m = ${m*a} : ${m} = <b>${a} m/s²</b>.`};
    return CH("Ein Körper im Weltraum, auf den keine Kraft wirkt, …",["bleibt in gleichförmiger Bewegung","wird langsamer","bleibt sofort stehen"],0,"1. Newtonsches Gesetz (Trägheit): Ohne Kraft ändert sich die Geschwindigkeit nicht.")},
  emag(){if(Math.random()<.7){const n1=pick([100,200,500,1000]),k=pick([2,5,10]),U=pick([10,20,50,230]);return{q:`Ein Transformator hat primär ${n1} Windungen, sekundär ${n1/k}. Primärspannung ${U} V. Wie groß ist die Sekundärspannung?${unit("V")}`,kind:"num",ans:rd(U/k,10),tol:.06,sol:`U₁ : U₂ = N₁ : N₂ → U₂ = ${U} · ${n1/k} : ${n1} = <b>${fmt(U/k)} V</b>.`}}
    return CH("Ein Elektromotor wandelt …",["elektrische in mechanische Energie","mechanische in elektrische Energie","Wärme in Licht"],0,"Motor: Strom im Magnetfeld erfährt eine Kraft, es dreht sich. Der Generator ist die Umkehrung.")},
  radio(){const t=ri(0,2),N=pick([800,1600,320,640]),k=ri(1,4),T=pick([5,8,12,30]);
    if(t===0)return{q:`Ein Präparat hat ${N} Mio. Atomkerne und eine Halbwertszeit von ${T} Tagen. Wie viele sind nach ${k*T} Tagen noch nicht zerfallen (in Mio.)?${unit("Mio.")}`,kind:"num",ans:R(N,2**k),sol:`${k} Halbwertszeiten: ${N} : 2<sup>${k}</sup> = <b>${fmt(N/2**k)}</b>.`};
    if(t===1)return{q:`Von einem Stoff mit Halbwertszeit ${T} Tagen ist nach ${k*T} Tagen noch ${fmt(100/2**k)} % übrig. Wie viele Halbwertszeiten sind vergangen?`,kind:"num",ans:R(k),sol:`${k*T} : ${T} = <b>${k}</b>.`};
    return CH("Welche Strahlung durchdringt Materie am stärksten?",["Gammastrahlung","Betastrahlung","Alphastrahlung"],0,"Alpha stoppt schon Papier, Beta Aluminium, <b>Gamma</b> braucht dicke Blei- oder Betonschichten.")},
  waermel(){const t=ri(0,2);
    if(t===0){const m=ri(1,10),d=ri(5,60);return{q:`Wie viel Wärme braucht man, um ${m} kg Wasser um ${d} K zu erwärmen? Rechne mit c = 4,2 kJ/(kg·K).${unit("kJ")}`,kind:"num",ans:rd(4.2*m*d,10),tol:.06,sol:`Q = c · m · ΔT = 4,2 · ${m} · ${d} = <b>${fmt(4.2*m*d)} kJ</b>.`}}
    if(t===1){const a=pick([10,20,30]),b=a+pick([20,40,60]);return{q:`${fmt(1)} kg Wasser mit ${a} °C wird mit ${fmt(1)} kg Wasser mit ${b} °C gemischt. Welche Mischtemperatur ergibt sich?${unit("°C")}`,kind:"num",ans:R((a+b)/2),sol:`Gleiche Massen: Mittelwert (${a} + ${b}) : 2 = <b>${(a+b)/2} °C</b>.`}}
    const z=pick([100,200,500]),e=pick([20,25,40]);return{q:`Eine Maschine bekommt ${z} J Energie und gibt ${z*e/100} J nutzbar ab. Wie groß ist der Wirkungsgrad?${unit("%")}`,kind:"num",ans:R(e),sol:`η = Nutzen : Aufwand = ${z*e/100} : ${z} = <b>${e} %</b>. Der Rest geht als Wärme verloren.`}},
  wurf(){const t=ri(0,2),s=ri(1,4),h=5*s*s;
    if(t===0)return{q:`Ein Ball fällt (waagerechter Wurf) aus ${h} m Höhe. Wie lange dauert der Fall? Rechne mit g = 10 m/s².${unit("s")}`,kind:"num",ans:R(s),sol:`h = ½ · g · t² → t = √(2h : g) = √${2*h/10} = <b>${s} s</b>.`};
    if(t===1){const v=ri(2,10);return{q:`Ein Ball wird aus ${h} m Höhe waagerecht mit ${v} m/s geworfen (g = 10 m/s²). Wie weit fliegt er?${unit("m")}`,kind:"num",ans:R(v*s),sol:`Fallzeit t = ${s} s. Waagerecht gleichförmig: x = v · t = ${v} · ${s} = <b>${v*s} m</b>.`}}
    return{q:`Ein Stein fällt ${s} s lang frei (g = 10 m/s²). Aus welcher Höhe fiel er?${unit("m")}`,kind:"num",ans:R(h),sol:`h = ½ · g · t² = 5 · ${s*s} = <b>${h} m</b>.`}},
  impuls(){const t=ri(0,2),m=ri(2,10),v=ri(2,12);
    if(t===0)return{q:`Wie groß ist der Impuls eines Körpers mit ${m} kg und ${v} m/s?${unit("kg·m/s")}`,kind:"num",ans:R(m*v),sol:`p = m · v = ${m} · ${v} = <b>${m*v} kg·m/s</b>.`};
    if(t===1){const m2=m*ri(1,3),v1=(m+m2)*ri(1,4);return{q:`Ein Wagen (${m} kg, ${v1} m/s) stößt unelastisch gegen einen ruhenden Wagen (${m2} kg). Beide bleiben aneinander. Wie schnell sind sie danach?${unit("m/s")}`,kind:"num",ans:R(m*v1,m+m2),sol:`Impulserhaltung: ${m} · ${v1} = (${m} + ${m2}) · v → v = ${m*v1} : ${m+m2} = <b>${fmt(m*v1/(m+m2))} m/s</b>.`}}
    const tt=pick([2,5,10]);return{q:`Ein Körper mit Impuls ${m*v*tt} kg·m/s wird in ${tt} s abgebremst. Wie groß ist die mittlere Kraft?${unit("N")}`,kind:"num",ans:R(m*v),sol:`F = Δp : t = ${m*v*tt} : ${tt} = <b>${m*v} N</b>.`}},
  kreisb(){const t=ri(0,2),r=pick([2,4,5,10]),v=pick([2,4,5,10,20]);
    if(t===0)return{q:`Ein Körper läuft mit ${v} m/s auf einer Kreisbahn mit r = ${r} m. Wie groß ist die Zentripetalbeschleunigung?${unit("m/s²")}`,kind:"num",ans:R(v*v,r),tol:.006,sol:`a = v² : r = ${v*v} : ${r} = <b>${fmt(v*v/r)} m/s²</b>.`};
    if(t===1){const T=pick([2,4,5,10,20]);return{q:`Ein Rad dreht sich einmal in ${T} s. Wie groß ist die Frequenz?${unit("Hz")}`,kind:"num",ans:R(1,T),tol:.0006,sol:`f = 1 : T = 1 : ${T} = <b>${fmt(1/T)} Hz</b>.`}}
    const m=ri(1,5);return{q:`Ein Körper (${m} kg) läuft mit ${v} m/s auf einer Kreisbahn mit r = ${r} m. Wie groß ist die Zentripetalkraft?${unit("N")}`,kind:"num",ans:R(m*v*v,r),tol:.006,sol:`F = m · v² : r = ${m} · ${v*v} : ${r} = <b>${fmt(m*v*v/r)} N</b>.`}},
  grav(){const t=ri(0,2),k=ri(2,4);
    if(t===0)return{q:`Der Abstand zweier Massen wird auf das ${k}-fache vergrößert. Auf welchen Bruchteil sinkt die Gravitationskraft?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(1,k*k),tol:.002,sol:`F ~ 1/r²: ${F(1,k)}² = <b>${F(1,k*k)}</b>.`};
    if(t===1)return{q:`Eine Masse wird verdoppelt, die andere verdreifacht. Das Wievielfache der Gravitationskraft ergibt sich?`,kind:"num",ans:R(6),sol:`F ~ m₁ · m₂ → 2 · 3 = <b>6</b>.`};
    const m=ri(2,60);return{q:`Auf dem Mond ist g = 1,6 N/kg. Welche Gewichtskraft hat ein Körper mit ${m} kg dort?${unit("N")}`,kind:"num",ans:rd(1.6*m,10),tol:.06,sol:`F = m · g = ${m} · 1,6 = <b>${fmt(1.6*m)} N</b>.`}},
  efeld(){const t=ri(0,2);
    if(t===0){const d=pick([2,4,5,10]),U=pick([100,200,500,1000]);return{q:`Zwischen zwei Platten im Abstand ${d} cm liegen ${U} V. Wie stark ist das Feld E = U : d?${unit("V/cm")}`,kind:"num",ans:R(U,d),tol:.006,sol:`E = ${U} V : ${d} cm = <b>${fmt(U/d)} V/cm</b>.`}}
    if(t===1){const U=pick([5,10,20]),C=pick([2,4,10]);return{q:`Ein Kondensator mit C = ${C} µF wird auf ${U} V geladen. Wie groß ist seine Ladung Q = C · U?${unit("µC")}`,kind:"num",ans:R(C*U),sol:`Q = ${C} · ${U} = <b>${C*U} µC</b>.`}}
    const U=pick([10,20]),C=pick([2,4,10]);return{q:`Wie viel Energie steckt in einem Kondensator (C = ${C} µF, U = ${U} V)? E = ½ · C · U²${unit("µJ")}`,kind:"num",ans:R(C*U*U,2),sol:`E = ½ · ${C} · ${U*U} = <b>${fmt(C*U*U/2)} µJ</b>.`}},
  induk(){if(Math.random()<.5){const N=pick([50,100,200,500]),p=pick([2,4,5,10]),dt=pick([2,5,10]);return{q:`Eine Spule mit ${N} Windungen erlebt eine Flussänderung von ${p} mWb in ${dt} s. Wie groß ist die Induktionsspannung U = N · ΔΦ : Δt?${unit("mV")}`,kind:"num",ans:R(N*p,dt),tol:.006,sol:`U = ${N} · ${p} : ${dt} = <b>${fmt(N*p/dt)} mV</b>.`}}
    const B=pick([.1,.2,.5,1]),I=ri(2,10),l=pick([.2,.5,1]);return{q:`Ein Leiter (${fmt(l)} m) trägt ${I} A im Magnetfeld B = ${fmt(B)} T (senkrecht). Wie groß ist die Kraft F = B · I · l?${unit("N")}`,kind:"num",ans:rd(B*I*l,100),tol:.006,sol:`F = ${fmt(B)} · ${I} · ${fmt(l)} = <b>${fmt(Math.round(B*I*l*100)/100)} N</b>.`}},
  schwing(){const t=ri(0,2);
    if(t===0){const T=pick([.1,.2,.5,2,4]);return{q:`Ein Schwinger braucht ${fmt(T)} s für eine Schwingung. Wie groß ist die Frequenz?${unit("Hz")}`,kind:"num",ans:rd(1/T,1000),tol:.006,sol:`f = 1 : T = 1 : ${fmt(T)} = <b>${fmt(1/T)} Hz</b>.`}}
    if(t===1){const f=pick([2,4,5,10,50]);return{q:`Ein Körper schwingt mit ${f} Hz. Wie lang ist die Periodendauer?${unit("s")}`,kind:"num",ans:rd(1/f,1000),tol:.0006,sol:`T = 1 : f = 1 : ${f} = <b>${fmt(1/f)} s</b>.`}}
    const l=pick([.25,1,4]),T=2*Math.PI*Math.sqrt(l/9.81);return{q:`Ein Fadenpendel ist ${fmt(l)} m lang. Berechne T = 2π · √(l : g) mit g = 9,81 m/s². Runde auf zwei Nachkommastellen.${unit("s")}`,kind:"num",ans:rd(T,100),tol:.016,sol:`T = 2π · √(${fmt(l)} : 9,81) ≈ <b>${fmt(Math.round(T*100)/100)} s</b>. Die Masse spielt keine Rolle.`}},
  wellen(){const t=ri(0,2);
    if(t===0){const f=pick([2,5,10,50,100]),l=pick([2,4,5,10]);return{q:`Eine Welle hat die Frequenz ${f} Hz und die Wellenlänge ${l} m. Wie groß ist ihre Ausbreitungsgeschwindigkeit?${unit("m/s")}`,kind:"num",ans:R(f*l),sol:`c = λ · f = ${l} · ${f} = <b>${f*l} m/s</b>.`}}
    if(t===1){const s=ri(2,9);return{q:`Zwischen Blitz und Donner liegen ${s} s. Wie weit ist das Gewitter entfernt? Schall: 340 m/s.${unit("m")}`,kind:"num",ans:R(340*s),sol:`s = v · t = 340 · ${s} = <b>${fmt(340*s)} m</b>. (Der Blitz kommt praktisch sofort an.)`}}
    return CH("Zwei gleiche Wellen treffen mit einem Gangunterschied von einer halben Wellenlänge zusammen. Was passiert?",["Auslöschung","Verstärkung","Nichts"],0,"Berg trifft Tal: <b>destruktive Interferenz</b>. Bei ganzer Wellenlänge verstärken sie sich.")},
  photo(){const t=ri(0,2);
    if(t===0){const l=pick([620,310,248,124]);return{q:`Wie groß ist die Energie eines Photons mit λ = ${l} nm? Rechne E = 1240 : λ (E in eV, λ in nm).${unit("eV")}`,kind:"num",ans:R(1240,l),sol:`E = 1240 : ${l} = <b>${fmt(1240/l)} eV</b>.`}}
    if(t===1){const W=pick([2,2.5,4]),E=W+ri(1,3);return{q:`Licht mit ${fmt(E)} eV trifft auf Metall mit der Austrittsarbeit ${fmt(W)} eV. Wie groß ist die maximale kinetische Energie der Elektronen?${unit("eV")}`,kind:"num",ans:rd(E-W,10),sol:`E<sub>kin</sub> = E<sub>Photon</sub> ${MINUS} W<sub>A</sub> = ${fmt(E)} ${MINUS} ${fmt(W)} = <b>${fmt(E-W)} eV</b>.`}}
    return CH("Beim Photoeffekt hängt die Energie der ausgelösten Elektronen ab von …",["der Frequenz des Lichts","der Helligkeit des Lichts","der Dauer der Bestrahlung"],0,"Nur die Frequenz bestimmt die Photonenenergie (E = h · f). Mehr Helligkeit bedeutet mehr Elektronen, nicht schnellere.")},
  atom(){const t=ri(0,2);
    if(t===0){const n=ri(1,4);return{q:`Im Wasserstoffatom gilt E<sub>n</sub> = ${MINUS}13,6 eV : n². Wie groß ist die Energie auf der Bahn n = ${n}? Runde auf eine Nachkommastelle.${unit("eV")}`,kind:"num",ans:rd(-13.6/n**2,10),tol:.06,sol:`E = ${MINUS}13,6 : ${n*n} ≈ <b>${fmt(Math.round(-136/n**2)/10)} eV</b>.`}}
    if(t===1){const n=pick([2,3]),d=13.6*(1-1/n**2);return{q:`Ein Wasserstoffatom springt von n = ${n} auf n = 1. Welche Photonenenergie wird frei? Runde auf eine Nachkommastelle.${unit("eV")}`,kind:"num",ans:rd(d,10),tol:.06,sol:`ΔE = 13,6 · (1 ${MINUS} 1/${n*n}) ≈ <b>${fmt(Math.round(d*10)/10)} eV</b>.`}}
    return CH("Heiße, verdünnte Gase senden …",["ein Linienspektrum","ein kontinuierliches Spektrum"],0,"Atome strahlen nur bei bestimmten Energiesprüngen: einzelne Linien, ein Fingerabdruck des Elements.")}
});

WIDGETS.diagramm=function(el,opt={}){const w=wid("dg"),ks=opt.ks||[opt.k];let cur=0,sel=null;
  el.innerHTML=`<div class="wg">${ks.length>1?`<div class="row seg" role="group">${ks.map((k,i)=>`<button type="button" class="btn small ghost" aria-pressed="${i===0}" data-i="${i}">${DIAG[k].name}</button>`).join("")}</div>`:""}<div class="wg-vis" id="${w}-o"></div><div class="ideas" id="${w}-b"></div><p class="wg-out" id="${w}-t"></p></div>`;
  const o=el.querySelector("#"+w+"-o"),b=el.querySelector("#"+w+"-b"),t=el.querySelector("#"+w+"-t");
  const draw=()=>{const D=DIAG[ks[cur]];
    o.innerHTML=`<svg viewBox="0 0 300 220" width="100%" style="max-width:340px" role="img" aria-label="${D.alt}">${D.svg}</svg>`;
    o.querySelectorAll("[data-p]").forEach(n=>{n.style.opacity=sel&&n.dataset.p!==sel?".18":"1";n.style.transition="opacity .2s"});
    b.innerHTML="";D.parts.forEach(([id,lab])=>{const x=document.createElement("button");x.type="button";x.className="idea";x.textContent=lab;x.setAttribute("aria-pressed",id===sel);x.onclick=()=>{sel=sel===id?null:id;draw()};b.append(x)});
    const p=D.parts.find(q=>q[0]===sel);t.innerHTML=p?`<b>${p[1]}:</b> ${p[2]}`:"Tippe auf einen Teil, dann wird er hervorgehoben und erklärt."};
  el.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{cur=+x.dataset.i;sel=null;el.querySelectorAll("[data-i]").forEach(y=>y.setAttribute("aria-pressed",y===x));draw()});
  draw()};

/* ---------- Animationen ---------- */
WIDGETS.fotosynth=function(el){const w=wid("fs");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"l","Lichtstärke",0,100,30,5)}${slider(w+"c","Kohlenstoffdioxid in der Luft",0,100,80,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const L=el.querySelector("#"+w+"l"),C=el.querySelector("#"+w+"c");
  const bar=(y,lab,v,col)=>`<text x="0" y="${y+14}" font-size="12" font-family="var(--f-body)" fill="var(--ink)">${lab}</text><rect x="110" y="${y}" width="180" height="18" rx="6" fill="var(--sunk)" stroke="var(--line)"/><rect x="110" y="${y}" width="${1.8*v}" height="18" rx="6" fill="${col}"/>`;
  const draw=()=>{const l=+L.value,c=+C.value,r=Math.min(l,c);el.querySelector("#"+w+"l-v").textContent=l;el.querySelector("#"+w+"c-v").textContent=c;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 100" width="100%" style="max-width:340px" role="img" aria-label="Licht, Kohlenstoffdioxid und Zuckerbildung">${bar(4,"Licht",l,"var(--signal)")}${bar(34,"CO₂",c,"var(--s-mathe)")}${bar(70,"Zucker + O₂",r,"var(--s-bio)")}</svg>`;
    el.querySelector("#"+w+"-t").innerHTML=r===0?"Ohne Licht oder ohne Kohlenstoffdioxid gibt es keine Fotosynthese.":l<c?"<b>Licht begrenzt</b> die Fotosynthese. Mehr CO₂ würde nichts bringen, mehr Licht schon.":c<l?"<b>Kohlenstoffdioxid begrenzt</b> die Fotosynthese. Mehr Licht würde nichts bringen (Gewächshäuser düngen deshalb mit CO₂).":"Beide Faktoren sind gleich knapp. Jetzt hilft nur, beide zu erhöhen."};
  L.oninput=C.oninput=draw;draw()};

WIDGETS.seeprofil=function(el){const w=wid("sp");let cur=2;
  const D=[0,2,4,6,8,10,15,20];
  const S=[["Winter",[.5,1,2,3,3.5,3.8,4,4],"Unter dem Eis ist es oben fast 0 °C, am Grund 4 °C: Wasser ist bei 4 °C am dichtesten und sinkt nach unten. Der See ist stabil geschichtet."],
    ["Frühling",[6,5.9,5.9,5.8,5.8,5.7,5.6,5.5],"Die Oberfläche erwärmt sich auf 4 °C, wird schwerer und sinkt. Der Wind durchmischt den ganzen See (Frühjahrszirkulation): Sauerstoff kommt nach unten, Nährstoffe nach oben."],
    ["Sommer",[22,21.5,20,14,9,7,5.5,5],"Oben warm und leicht, unten kalt und schwer. Dazwischen liegt die <b>Sprungschicht</b>, in der die Temperatur schnell fällt. Sie verhindert die Durchmischung, in der Tiefe kann der Sauerstoff knapp werden."],
    ["Herbst",[11,11,10.9,10.9,10.8,10.8,10.7,10.7],"Die Oberfläche kühlt ab, wird schwerer und sinkt. Der See durchmischt sich wieder (Herbstzirkulation) und die Tiefe bekommt neuen Sauerstoff."]];
  el.innerHTML=`<div class="wg"><div class="row seg" role="group">${S.map((s,i)=>`<button type="button" class="btn small ghost" aria-pressed="${i===cur}" data-i="${i}">${s[0]}</button>`).join("")}</div><div class="wg-vis" id="${w}-o"></div><p class="wg-out" id="${w}-t"></p></div>`;
  const X=t=>44+t*236/24,Y=d=>26+d*9;
  const draw=()=>{const [nm,T,txt]=S[cur];let g="";
    for(let t=0;t<=20;t+=5)g+=`<line x1="${X(t)}" y1="22" x2="${X(t)}" y2="206" stroke="var(--line)" stroke-width="1"/><text x="${X(t)}" y="14" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">${t}°</text>`;
    [0,5,10,15,20].forEach(d=>g+=`<text x="38" y="${Y(d)+3}" text-anchor="end" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">${d} m</text>`);
    const zone=cur===2?`<rect x="44" y="${Y(4)}" width="236" height="${Y(8)-Y(4)}" fill="var(--signal)" fill-opacity=".22"/><text x="278" y="${Y(6)+3}" text-anchor="end" font-size="10" font-family="var(--f-body)" fill="var(--ink)">Sprungschicht</text>`:"";
    const pts=D.map((d,i)=>`${X(T[i]).toFixed(1)},${Y(d)}`).join(" ");
    o.innerHTML=`<svg viewBox="0 0 300 214" width="100%" style="max-width:340px" role="img" aria-label="Temperaturprofil eines Sees im ${nm}">${g}${zone}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>${D.map((d,i)=>`<circle cx="${X(T[i]).toFixed(1)}" cy="${Y(d)}" r="3.5" fill="var(--signal)" stroke="var(--ink)" stroke-width="1"/>`).join("")}</svg>`;
    t.innerHTML=`<b>${nm}:</b> ${txt}`;el.querySelectorAll("[data-i]").forEach((x,i)=>x.setAttribute("aria-pressed",i===cur))};
  const o=el.querySelector("#"+w+"-o"),t=el.querySelector("#"+w+"-t");
  el.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{cur=+x.dataset.i;draw()});draw()};

WIDGETS.pupille=function(el){const w=wid("pu");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"l","Helligkeit",0,100,50,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const L=el.querySelector("#"+w+"l");
  const draw=()=>{const l=+L.value;el.querySelector("#"+w+"l-v").textContent=l;const r=36-24*l/100;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 160 110" width="100%" style="max-width:200px" role="img" aria-label="Pupille"><ellipse cx="80" cy="55" rx="74" ry="46" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="80" cy="55" r="40" fill="var(--s-mathe)" stroke="var(--ink)" stroke-width="2"/><circle cx="80" cy="55" r="${r.toFixed(1)}" fill="var(--ink)"/><circle cx="92" cy="43" r="5" fill="var(--surface)" fill-opacity=".8"/></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=l>=70?"Hell: Die Pupille ist <b>eng</b>. Das schützt die Netzhaut vor zu viel Licht.":l<=30?"Dunkel: Die Pupille ist <b>weit</b>. So fällt möglichst viel Licht ins Auge.":"Mittlere Helligkeit: Die Pupille regelt ständig nach, ein Reflex, den man nicht steuern kann."};
  L.oninput=draw;draw()};

WIDGETS.mitose=function(el){const w=wid("mi");let cur=0;
  const N=["Vorbereitung","Prophase","Metaphase","Anaphase","Telophase"];
  const TX=["<b>Vorbereitung (Interphase):</b> Der Kern ist sichtbar. Die Zelle wächst und verdoppelt ihre DNA. Jedes Chromosom besteht danach aus zwei identischen Chromatiden.","<b>Prophase:</b> Die Kernhülle löst sich auf. Die Chromosomen verkürzen sich und sind als X-Gebilde sichtbar.","<b>Metaphase:</b> Die Chromosomen ordnen sich in der Zellmitte an (Äquatorialebene). Spindelfasern heften sich an.","<b>Anaphase:</b> Die Spindelfasern ziehen die beiden Chromatiden jedes Chromosoms zu entgegengesetzten Polen.","<b>Telophase:</b> An den Polen bilden sich neue Kerne. Die Zelle schnürt sich durch: Zwei erbgleiche Tochterzellen entstehen."];
  const ys=[52,76,100,124],c1="var(--s-chemie)",c2="var(--accent)";
  const cell=`<circle cx="150" cy="90" r="80" fill="var(--sunk)" stroke="var(--ink)" stroke-width="3"/>`;
  const spindle=x=>ys.map(y=>`<line x1="${x}" y1="90" x2="150" y2="${y}" stroke="var(--muted)" stroke-width="1.2"/>`).join("");
  const SV=[
   cell+`<circle cx="150" cy="90" r="34" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="4 3"/><path d="M130 82 q10 -14 20 0 t20 0 M128 98 q10 12 22 0 t20 0" fill="none" stroke="${c1}" stroke-width="3"/>`,
   cell+XC(118,68,20,c1)+XC(176,64,-30,c1)+XC(128,114,50,c1)+XC(178,112,-10,c1),
   cell+`<circle cx="70" cy="90" r="3" fill="var(--ink)"/><circle cx="230" cy="90" r="3" fill="var(--ink)"/>`+spindle(70)+spindle(230)+ys.map(y=>XC(150,y,0,c1)).join(""),
   cell+`<circle cx="70" cy="90" r="3" fill="var(--ink)"/><circle cx="230" cy="90" r="3" fill="var(--ink)"/>`+ys.map(y=>`<line x1="70" y1="90" x2="112" y2="${y}" stroke="var(--muted)" stroke-width="1.2"/><line x1="230" y1="90" x2="188" y2="${y}" stroke="var(--muted)" stroke-width="1.2"/>`).join("")+ys.map(y=>VC(112,y,90,c1)+VC(188,y,-90,c1)).join(""),
   `<ellipse cx="150" cy="90" rx="120" ry="66" fill="var(--sunk)" stroke="var(--ink)" stroke-width="3"/><path d="M150 26 L150 56 M150 124 L150 154" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="90" r="26" style="${mixc("var(--accent)")}" stroke="var(--accent)" stroke-width="3"/><circle cx="204" cy="90" r="26" style="${mixc("var(--accent)")}" stroke="var(--accent)" stroke-width="3"/><path d="M84 84 q8 -10 16 0 t14 0 M82 96 q8 8 16 0 t14 0" fill="none" stroke="${c1}" stroke-width="2.5" transform="translate(-4 0)"/><path d="M192 84 q8 -10 16 0 t14 0 M190 96 q8 8 16 0 t14 0" fill="none" stroke="${c1}" stroke-width="2.5" transform="translate(-4 0)"/>`];
  el.innerHTML=`<div class="wg"><div class="row seg" role="group">${N.map((n,i)=>`<button type="button" class="btn small ghost" aria-pressed="${i===cur}" data-i="${i}">${i+1}. ${n}</button>`).join("")}</div><div class="wg-vis" id="${w}-o"></div><p class="wg-out" id="${w}-t"></p></div>`;
  const o=el.querySelector("#"+w+"-o"),t=el.querySelector("#"+w+"-t");
  const draw=()=>{o.innerHTML=`<svg viewBox="0 0 300 180" width="100%" style="max-width:340px" role="img" aria-label="Mitose: ${N[cur]}">${SV[cur]}</svg>`;t.innerHTML=TX[cur];el.querySelectorAll("[data-i]").forEach((x,i)=>x.setAttribute("aria-pressed",i===cur))};
  el.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{cur=+x.dataset.i;draw()});draw()};

WIDGETS.enzym=function(el){const w=wid("ez");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"t","Temperatur (°C)",0,70,20,1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Tm=el.querySelector("#"+w+"t");
  const act=T=>T<=37?Math.pow(2,(T-37)/10):Math.max(0,1-(T-37)/22);
  const X=T=>30+T*(260/70),Y=a=>130-a*110;
  let path="";for(let T=0;T<=70;T++)path+=(T?"L":"M")+X(T).toFixed(1)+","+Y(act(T)).toFixed(1);
  const draw=()=>{const T=+Tm.value,a=act(T);el.querySelector("#"+w+"t-v").textContent=T;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 160" width="100%" style="max-width:340px" role="img" aria-label="Enzymaktivität in Abhängigkeit von der Temperatur"><line x1="30" y1="130" x2="292" y2="130" stroke="var(--ink)" stroke-width="1.5"/><line x1="30" y1="14" x2="30" y2="130" stroke="var(--ink)" stroke-width="1.5"/>${[0,20,40,60].map(t=>`<text x="${X(t)}" y="146" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">${t}°</text>`).join("")}<text x="6" y="22" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">Aktivität</text><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="${X(T)}" cy="${Y(a).toFixed(1)}" r="7" fill="var(--signal)" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=T<15?"<b>Zu kalt:</b> Die Teilchen bewegen sich langsam, die Reaktion läuft sehr langsam. Das Enzym bleibt aber intakt (darum konserviert Tiefkühlen).":T<33?"Mit steigender Temperatur läuft die Reaktion schneller (etwa doppelt so schnell pro 10 °C).":T<=41?"<b>Optimum:</b> Beim Menschen arbeiten die Enzyme bei etwa 37 °C am schnellsten.":T<=55?"Über dem Optimum zerfällt die Raumstruktur des Enzyms. Es wird <b>denaturiert</b>, die Aktivität sinkt rasch.":"<b>Denaturiert:</b> Das Enzym ist dauerhaft zerstört. Abkühlen hilft nicht mehr, wie bei einem gekochten Ei."};
  Tm.oninput=draw;draw()};

WIDGETS.regel=function(el){const w=wid("rg");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"z","Blutzucker (mg/dl)",40,200,90,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Z=el.querySelector("#"+w+"z"),X=v=>10+(v-40)*(280/160);
  const draw=()=>{const v=+Z.value;el.querySelector("#"+w+"z-v").textContent=v;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 70" width="100%" style="max-width:340px" role="img" aria-label="Blutzucker-Skala"><rect x="${X(40)}" y="22" width="${X(70)-X(40)}" height="18" fill="var(--err-bg)"/><rect x="${X(70)}" y="22" width="${X(110)-X(70)}" height="18" fill="var(--ok-bg)"/><rect x="${X(110)}" y="22" width="${X(200)-X(110)}" height="18" fill="var(--err-bg)"/><rect x="10" y="22" width="280" height="18" rx="4" fill="none" stroke="var(--line)"/><text x="${X(90)}" y="56" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">Sollbereich</text><path d="M${X(v)} 20 l-7 -12 h14z" fill="var(--ink)"/><text x="12" y="56" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">40</text><text x="288" y="56" text-anchor="end" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">200</text></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=v<70?"<b>Zu niedrig:</b> Die Bauchspeicheldrüse gibt <b>Glukagon</b> ab. Die Leber setzt gespeicherte Glukose frei. Der Wert steigt wieder.":v<=110?"<b>Im Sollbereich:</b> Insulin und Glukagon halten sich die Waage. (Werte gerundet, Ärzte nutzen genaue Grenzen.)":"<b>Zu hoch:</b> Die Bauchspeicheldrüse gibt <b>Insulin</b> ab. Muskeln, Fettzellen und Leber nehmen Glukose auf und speichern sie als Glykogen. Der Wert sinkt wieder."};
  Z.oninput=draw;draw()};

WIDGETS.hzv=function(el){const w=wid("hz");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"p","Puls (Schläge pro Minute)",40,180,70,5)}${slider(w+"s","Schlagvolumen (ml)",40,120,70,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const P=el.querySelector("#"+w+"p"),V=el.querySelector("#"+w+"s");
  const draw=()=>{const p=+P.value,s=+V.value,q=p*s/1000;el.querySelector("#"+w+"p-v").textContent=p;el.querySelector("#"+w+"s-v").textContent=s;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 40" width="100%" style="max-width:340px" role="img" aria-label="Herzzeitvolumen"><rect x="2" y="10" width="296" height="20" rx="6" fill="var(--sunk)" stroke="var(--line)"/><rect x="2" y="10" width="${Math.min(296,q/25*296)}" height="20" rx="6" fill="var(--err)"/></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`Herzzeitvolumen = Puls · Schlagvolumen = ${p} · ${s} ml = ${fmt(p*s)} ml = <b>${fmt(Math.round(q*10)/10)} l pro Minute</b>. In Ruhe sind es etwa 5 l, bei Höchstleistung bis über 20 l. Ausdauertraining vergrößert das Schlagvolumen, darum haben Sportler einen niedrigen Ruhepuls.`};
  P.oninput=V.oninput=draw;draw()};

/* ---------- Biologie Klasse 5–7 ---------- */
const BIO57=[
 BT("b-leben","Kennzeichen des Lebendigen","Was macht etwas lebendig?",[
  ["Sechs Kennzeichen",`<p>Lebewesen erkennt man an mehreren Merkmalen, die <b>alle zusammen</b> auftreten:</p><ul class="rules"><li><b>Stoffwechsel:</b> Stoffe aufnehmen, umbauen, Abfälle abgeben.</li><li><b>Wachstum und Entwicklung</b></li><li><b>Fortpflanzung:</b> Nachkommen bilden.</li><li><b>Reizbarkeit:</b> auf Licht, Wärme oder Berührung reagieren.</li><li><b>Bewegung</b> aus eigener Kraft. Auch Pflanzen bewegen sich, nur langsam: Blüten öffnen sich, Blätter drehen sich zum Licht.</li><li><b>Zellen:</b> Alle Lebewesen bestehen aus Zellen.</li></ul>`],
  ["Lebendig oder nicht?",`<p>Feuer wächst, bewegt sich und braucht Sauerstoff. Trotzdem ist es <b>nicht lebendig</b>: Es hat keine Zellen, keinen eigenen Stoffwechsel und pflanzt sich nicht fort. Ein Kristall „wächst“ nur von außen durch Anlagern.</p><p>Ein trockener Samen wirkt tot, lebt aber: Sein Stoffwechsel läuft auf Sparflamme, bis Wasser und Wärme ihn wecken.</p><p class="tip">Faustregel: Es müssen <b>alle</b> Kennzeichen zutreffen, nicht nur eins.</p>`]],
  [["Welches Merkmal haben alle Lebewesen?","Alle Lebewesen haben einen Stoffwechsel: Sie nehmen Stoffe auf, bauen sie um und scheiden Abfälle aus.","Stoffwechsel","Sie sind grün","Sie haben vier Beine"],
   ["Ein Feuer wächst und bewegt sich. Warum ist es kein Lebewesen?","Feuer hat keine Zellen, keinen eigenen Stoffwechsel und keine Fortpflanzung.","Es hat keine Zellen und keinen Stoffwechsel","Es ist zu heiß","Es hat keine Farbe"],
   ["Pflanzen bewegen sich nie. Stimmt das?","Pflanzen bewegen sich langsam: Blüten öffnen und schließen sich, junge Sonnenblumen folgen dem Licht, die Mimose klappt Blätter ein.","Nein, sie bewegen sich langsam","Ja, nie","Nur Bäume bewegen sich"],
   ["Was bedeutet Reizbarkeit?","Lebewesen reagieren auf Reize aus der Umwelt wie Licht, Wärme oder Berührung.","Auf Reize aus der Umwelt reagieren","Schnell wütend werden","Sich vermehren"],
   ["Woraus bestehen alle Lebewesen?","Zellen sind die Grundbausteine des Lebens.","Aus Zellen","Aus Mineralien","Nur aus Wasser"],
   ["Ein trockener Samen liegt in der Schublade. Lebt er?","Sein Stoffwechsel läuft sehr langsam. Bei Wasser und Wärme keimt er.","Ja, mit sehr langsamem Stoffwechsel","Nein, er ist tot","Erst nach der Blüte"],
   ["Was ist Fortpflanzung?","Lebewesen bilden Nachkommen, so bleibt die Art erhalten.","Nachkommen bilden","Nahrung aufnehmen","Größer werden"]]),

 BT("b-zelle","Die Zelle und das Mikroskop","Bausteine des Lebens sichtbar machen",[
  ["Das Mikroskop",`<ul class="rules"><li><b>Okular:</b> oben, hier schaut man hinein.</li><li><b>Objektiv:</b> unten, drehbarer Revolver mit mehreren Linsen.</li><li><b>Objekttisch</b> mit Klammern für das Präparat.</li><li><b>Lampe</b> (oder Spiegel) beleuchtet von unten.</li><li><b>Grob- und Feintrieb</b> zum Scharfstellen.</li></ul><p class="eq">Vergrößerung = Okular · Objektiv</p><p>Beispiel: Okular 10-fach, Objektiv 40-fach: 10 · 40 = <b>400-fach</b>.</p><p class="tip">Immer mit der <b>kleinsten</b> Vergrößerung beginnen, das Objekt in die Mitte legen und beim Scharfstellen den Tubus vom Präparat <b>weg</b> bewegen. Sonst drückt das Objektiv das Präparat kaputt.</p>`],
  ["Tierzelle und Pflanzenzelle",`<p>Die <b>Zelle</b> ist die kleinste lebende Einheit. Robert Hooke sah 1665 im Kork kleine Kammern und nannte sie „Zellen“. Alle Zellen haben Membran, Plasma und Kern. <b>Pflanzenzellen</b> haben zusätzlich Zellwand, Chloroplasten und eine große Vakuole.</p><p>Wechsle zwischen beiden Zelltypen und tippe die Teile an.</p>`,"diagramm",{ks:["zelle_tier","zelle_pflanze"]}]],

   ["Welche feste Hülle haben Pflanzenzellen außen?","Die Zellwand aus Zellulose gibt Halt. Tierzellen haben sie nicht.","Die Zellwand","Nur das Zellplasma","Den Zellkern"],
   ["Womit beginnt man beim Mikroskopieren?","Mit der kleinsten Vergrößerung findet man das Objekt am leichtesten, und das Objektiv stößt nicht an.","Mit der kleinsten Vergrößerung","Mit der größten Vergrößerung","Ohne Licht"],
   ["Was machen die Mitochondrien?","Sie setzen in der Zellatmung Energie aus Nährstoffen frei.","Energie freisetzen","Erbgut speichern","Blattgrün bilden"],
   ["Wer sah 1665 im Kork die ersten „Zellen“?","Robert Hooke untersuchte Kork unter dem Mikroskop.","Robert Hooke","Charles Darwin","Gregor Mendel"]],["mikro"]),

 BT("b-pflanze","Aufbau einer Blütenpflanze","Wurzel, Spross, Blatt, Blüte",[
  ["Die vier Grundorgane",`<p>Eine Blütenpflanze besteht aus <b>Wurzel</b>, <b>Spross</b>, <b>Blatt</b> und <b>Blüte</b>. Im Spross liegen Leitungsbahnen: Wasser steigt in den <b>Wasserleitbahnen</b> nach oben, Zucker wandert in den <b>Siebröhren</b> nach unten.</p>`,"diagramm",{ks:["pflanze"]}],
  ["Die Blüte",`<p>Eine typische Blüte hat <b>Kelchblätter</b>, <b>Kronblätter</b>, <b>Staubblätter</b> (männlich, bilden Pollen) und ein <b>Fruchtblatt</b> (weiblich).</p>`,"diagramm",{ks:["bluete"]}],
  ["Von der Blüte zur Frucht",`<ol class="rules"><li><b>Bestäubung:</b> Pollen gelangt auf die Narbe (durch Insekten, Wind).</li><li><b>Befruchtung:</b> Ein Pollenschlauch wächst durch den Griffel, die Spermazelle verschmilzt mit der Eizelle in der Samenanlage.</li><li>Aus der Samenanlage wird der <b>Samen</b>, aus dem Fruchtknoten die <b>Frucht</b>.</li><li><b>Verbreitung:</b> durch Wind (Löwenzahn), Tiere (Kletten, Beeren) oder Wasser (Kokosnuss).</li></ol><p class="warn"><b>Bestäubung und Befruchtung sind nicht dasselbe.</b> Erst kommt der Pollen auf die Narbe, dann verschmelzen die Zellen.</p>`]],
  [["Welche Aufgabe hat die Wurzel?","Sie verankert die Pflanze und nimmt Wasser mit Mineralstoffen auf.","Verankern und Wasser aufnehmen","Fotosynthese","Pollen bilden"],
   ["Wo entsteht der Pollen?","Im Staubbeutel auf dem Staubfaden.","Im Staubbeutel","Auf der Narbe","Im Kronblatt"],
   ["Wie heißt es, wenn Pollen auf die Narbe gelangt?","Das ist die Bestäubung. Die Befruchtung kommt danach.","Bestäubung","Befruchtung","Keimung"],
   ["Wozu sind die bunten Kronblätter da?","Sie locken Bestäuber wie Bienen und Schmetterlinge an.","Insekten anlocken","Fotosynthese","Wasser aufnehmen"],
   ["Woraus wird nach der Befruchtung die Frucht?","Der Fruchtknoten wächst zur Frucht, die Samenanlagen werden zu Samen.","Aus dem Fruchtknoten","Aus dem Staubbeutel","Aus dem Kelchblatt"],
   ["Wie verbreitet sich der Löwenzahn?","Seine Früchte sind Schirmchenflieger und segeln im Wind.","Mit dem Wind","Im Fell von Tieren","Über das Wasser"],
   ["Was passiert bei der Befruchtung?","Eine Spermazelle verschmilzt mit der Eizelle.","Spermazelle und Eizelle verschmelzen","Pollen landet auf der Narbe","Die Blüte öffnet sich"],
   ["Was leiten die Wasserleitbahnen im Spross?","Sie bringen Wasser und Mineralstoffe von der Wurzel zu den Blättern.","Wasser nach oben","Zucker nach unten","Pollen zur Narbe"]]),

 BT("b-foto","Fotosynthese einfach erklärt","Aus Licht, Wasser und Luft wird Zucker",[
  ["Die Grundgleichung",`<p>Grüne Pflanzen stellen ihre Nahrung selbst her:</p><p class="eq">Kohlenstoffdioxid + Wasser + Lichtenergie → Traubenzucker + Sauerstoff</p><p class="eq">6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂</p><p>Sie läuft in den <b>Chloroplasten</b> ab. Das Blattgrün (<b>Chlorophyll</b>) fängt das Licht ein. Das CO₂ kommt durch die <b>Spaltöffnungen</b> der Blätter, das Wasser aus der Wurzel. Der Sauerstoff geht in die Luft.</p>`],
  ["Was bremst die Fotosynthese?",`<p>Wie schnell Zucker entsteht, bestimmt der <b>knappste Faktor</b>. Probiere es aus: Verändere Licht und CO₂.</p>`,"fotosynth"],
  ["Zucker, Stärke und ein Irrtum",`<p>Der Traubenzucker dient als Energiequelle, als Baustoff (Zellulose) oder wird zu <b>Stärke</b> gespeichert (Kartoffel, Getreide). Stärke weist man mit <b>Iodlösung</b> nach: Sie färbt sich blauschwarz. Sauerstoff erkennt man mit der <b>Glimmspanprobe</b>: Der Span flammt auf.</p><p class="warn"><b>Irrtum:</b> „Pflanzen atmen CO₂ ein und O₂ aus, Tiere umgekehrt.“ Pflanzen atmen <b>auch</b> (Zellatmung, Tag und Nacht). Bei Licht bilden sie aber mehr Sauerstoff, als sie verbrauchen.</p>`]],
  [["Welche Stoffe nimmt die Pflanze für die Fotosynthese auf?","Sie braucht Kohlenstoffdioxid aus der Luft und Wasser aus dem Boden.","Kohlenstoffdioxid und Wasser","Sauerstoff und Zucker","Stickstoff und Salz"],
   ["Was entsteht bei der Fotosynthese?","Traubenzucker als Nährstoff und Sauerstoff als Abgas.","Traubenzucker und Sauerstoff","Kohlenstoffdioxid und Wasser","Nur Wasser"],

   ["Wie weist man Sauerstoff nach?","Ein glimmender Holzspan flammt in Sauerstoff auf.","Mit der Glimmspanprobe","Mit Iodlösung","Mit Salzwasser"],
   ["Pflanzen atmen auch nachts. Stimmt das?","Zellatmung läuft immer. Nachts fehlt nur das Licht für die Fotosynthese.","Ja, sie atmen Tag und Nacht","Nein, nie","Nur Tiere atmen"],
   ["Wo nimmt das Blatt das Kohlenstoffdioxid auf?","Durch die Spaltöffnungen, vor allem an der Blattunterseite.","Durch die Spaltöffnungen","Durch die Blüte","Durch die Wurzel"],
   ["Eine Pflanze steht im dunklen Keller. Was passiert?","Ohne Licht gibt es keine Fotosynthese. Die Pflanze verhungert langsam.","Sie vergilbt und stirbt","Sie wächst schneller","Sie braucht nur Dünger"]]),

 BT("b-wirbel","Wirbeltiere im Vergleich","Fische, Amphibien, Reptilien, Vögel, Säugetiere",[
  ["Die fünf Klassen",`<div class="tbl-wrap"><table class="tbl"><tr><th>Klasse</th><th>Haut</th><th>Atmung</th><th>Fortpflanzung</th></tr><tr><td>Fische</td><td>Schuppen</td><td>Kiemen</td><td>Laich im Wasser</td></tr><tr><td>Amphibien</td><td>nackt, feucht</td><td>Larve: Kiemen, später Lunge und Haut</td><td>Laich, Metamorphose</td></tr><tr><td>Reptilien</td><td>Hornschuppen</td><td>Lunge</td><td>Eier mit Lederhülle an Land</td></tr><tr><td>Vögel</td><td>Federn</td><td>Lunge mit Luftsäcken</td><td>Eier mit Kalkschale, Brutpflege</td></tr><tr><td>Säugetiere</td><td>Haare, Fell</td><td>Lunge</td><td>lebende Junge, Milch</td></tr></table></div>`],
  ["Wechselwarm und gleichwarm",`<p><b>Wechselwarme</b> Tiere (Fische, Amphibien, Reptilien) haben eine Körpertemperatur, die von der Umgebung abhängt. Eine Eidechse sonnt sich, um warm zu werden. Im Winter erstarren sie.</p><p><b>Gleichwarme</b> Tiere (Vögel, Säugetiere) halten ihre Temperatur konstant, brauchen dafür aber viel Nahrung.</p><p class="warn">Ein <b>Wal</b> ist ein Säugetier, kein Fisch: Er atmet mit Lungen, bekommt lebende Junge und säugt sie. Die <b>Fledermaus</b> ist auch ein Säugetier.</p>`]],
  [["Welche Tiere sind gleichwarm?","Vögel und Säugetiere halten ihre Körpertemperatur konstant.","Vögel und Säugetiere","Fische und Amphibien","Reptilien und Fische"],
   ["Warum ist ein Wal ein Säugetier?","Er atmet Luft mit Lungen, bringt lebende Junge zur Welt und säugt sie.","Lungen, lebende Junge, Milch","Er lebt im Wasser","Er ist groß"],

 BT("b-wald","Ökosystem Wald","Stockwerke, Boden und Kreislauf",[
  ["Die Stockwerke",`<p>Vom Boden nach oben: <b>Moosschicht</b>, <b>Krautschicht</b> (Gräser, Farne, Blumen), <b>Strauchschicht</b> und <b>Baumschicht</b> (Kronendach). Das Licht nimmt nach unten stark ab. Wo wenig Licht ankommt, wachsen Schattenpflanzen.</p><p><b>Frühblüher</b> wie Buschwindröschen nutzen das Licht im Frühjahr, bevor die Bäume ihr Laub ausgetrieben haben. Danach ziehen sie ein.</p><p>Laubbäume (Buche, Eiche) werfen im Herbst die Blätter ab, Nadelbäume (Fichte, Kiefer) tragen Nadeln das ganze Jahr.</p>`],
  ["Boden und Kreislauf",`<p>Das Falllaub wird von <b>Zersetzern</b> verarbeitet: Regenwürmer, Asseln, Springschwänze, Pilze und Bakterien. Es entsteht <b>Humus</b> mit Mineralstoffen für die Bäume.</p><p>Der Wald speichert Wasser, filtert Luft, bindet Kohlenstoffdioxid, liefert Holz und ist Erholungsraum. Reine <b>Fichtenforste</b> sind anfällig: Gleichartige, flach wurzelnde Bäume leiden unter Sturm, Trockenheit und Borkenkäfer. Mischwälder sind stabiler.</p>`]],

   ["Warum blühen Buschwindröschen früh im Jahr?","Im Frühjahr fällt noch Licht durch das unbelaubte Kronendach.","Es ist noch hell im Wald","Sie brauchen Frost","Sie brauchen keine Blätter"],
   ["Wer zersetzt das Falllaub?","Zersetzer wie Regenwürmer, Asseln und Pilze.","Regenwürmer, Asseln, Pilze","Rehe","Spechte"],
   ["Was entsteht aus zersetztem Laub?","Humus ist nährstoffreicher Boden.","Humus","Sand","Kalk"],
   ["Welcher Baum ist ein Nadelbaum?","Die Fichte trägt Nadeln.","Fichte","Buche","Eiche"],
   ["Warum sind reine Fichtenwälder anfällig?","Gleichartige Bäume mit flachen Wurzeln werden von Sturm, Trockenheit und Borkenkäfer leichter geschädigt.","Sturm, Trockenheit, Borkenkäfer","Fichten brauchen kein Licht","Fichten brauchen kein Wasser"],

 BT("b-sinne","Sinnesorgane: Auge und Ohr","Vom Reiz zur Wahrnehmung",[
  ["Reiz, Rezeptor, Gehirn",`<p>Sinneszellen (<b>Rezeptoren</b>) nehmen einen <b>Reiz</b> auf, Nerven leiten ihn als elektrisches Signal zum Gehirn, dort entsteht die <b>Wahrnehmung</b>. Neben Sehen, Hören, Riechen, Schmecken und Tasten gibt es Temperatur-, Schmerz- und Gleichgewichtssinn.</p>`],
  ["Das Auge",`<p>Licht fällt durch Hornhaut, Pupille und Linse und erzeugt auf der <b>Netzhaut</b> ein Bild. Es steht auf dem Kopf; das Gehirn dreht es um. <b>Stäbchen</b> sehen hell und dunkel (auch bei wenig Licht), <b>Zapfen</b> sehen Farben. Beim Nahsehen wölbt sich die Linse stärker.</p>`,"diagramm",{ks:["auge"]}],
  ["Die Pupille als Blende",`<p>Die Pupille passt sich dem Licht an, wie die Blende einer Kamera.</p>`,"pupille"],
  ["Das Ohr",`<p>Der Schall gelangt so zu den Sinneszellen:</p><ol class="rules"><li>Ohrmuschel fängt den Schall, der Gehörgang leitet ihn.</li><li>Das <b>Trommelfell</b> schwingt mit.</li><li>Die drei <b>Gehörknöchelchen</b> (Hammer, Amboss, Steigbügel) verstärken die Schwingung.</li><li>In der flüssigkeitsgefüllten <b>Schnecke</b> reizen sie die Hörsinneszellen.</li><li>Der <b>Hörnerv</b> leitet die Signale zum Gehirn.</li></ol><p>Im Innenohr sitzen auch die <b>Bogengänge</b> für den Gleichgewichtssinn.</p><p class="warn">Dauerhafter Lärm zerstört Hörsinneszellen. Sie wachsen nicht nach.</p>`]],

   ["Was ändert die Linse beim Nahsehen?","Die Linse wölbt sich stärker und bricht das Licht kräftiger.","Sie wölbt sich stärker","Die Pupille wird größer","Die Netzhaut wandert"],

 BT("b-verdau","Ernährung und Verdauung","Nährstoffe und der Weg der Nahrung",[
  ["Die Nährstoffe",`<div class="tbl-wrap"><table class="tbl"><tr><th>Nährstoff</th><th>Aufgabe</th><th>Energie</th></tr><tr><td>Kohlenhydrate (Stärke, Zucker)</td><td>Hauptenergiequelle</td><td>17 kJ/g</td></tr><tr><td>Fette</td><td>Energiespeicher, Zellbaustoff</td><td>39 kJ/g</td></tr><tr><td>Eiweiße</td><td>Baustoff für Muskeln, Haut, Zellen</td><td>17 kJ/g</td></tr></table></div><p>Dazu kommen <b>Vitamine</b>, <b>Mineralstoffe</b> (Calcium für Knochen, Eisen fürs Blut), <b>Wasser</b> und <b>Ballaststoffe</b> (unverdauliche Pflanzenfasern, die die Verdauung anregen).</p>`],

  [["Welcher Nährstoff liefert pro Gramm die meiste Energie?","Fett hat mit etwa 39 kJ pro Gramm mehr als doppelt so viel wie Kohlenhydrate oder Eiweiß.","Fett","Eiweiß","Kohlenhydrate"],

   ["Wo beginnt die Stärkeverdauung?","Schon im Mund spaltet der Speichel Stärke.","Im Mund","Im Magen","Im Dickdarm"],
   ["Wo werden die meisten Nährstoffe ins Blut aufgenommen?","Im Dünndarm über die Darmzotten.","Im Dünndarm","Im Magen","Im Dickdarm"],
   ["Was entzieht der Dickdarm dem Speisebrei?","Er dickt den Rest durch Wasserentzug ein.","Wasser","Eiweiß","Fett"],
   ["Welche Aufgabe hat die Galle?","Sie hilft, Fette zu zerlegen und aufzunehmen.","Fettverdauung unterstützen","Speichel bilden","Stärke spalten"],
   ["Wie wird der Bissen durch die Speiseröhre transportiert?","Wellenförmige Muskelbewegungen schieben ihn auch im Liegen.","Durch Muskelwellen","Durch Schwerkraft allein","Durch Luftdruck"],

 BT("b-skelett","Skelett und Muskeln","Stützen, Schützen, Bewegen",[
  ["Das Skelett",`<p>Ein Erwachsener hat etwa <b>206 Knochen</b>. Das Skelett <b>stützt</b>, <b>schützt</b> (Schädel das Gehirn, Brustkorb Herz und Lunge), ist Ansatz für Muskeln, <b>bildet Blut</b> (rotes Knochenmark) und speichert Mineralstoffe. Die Wirbelsäule hat 7 Hals-, 12 Brust- und 5 Lendenwirbel und ist doppelt-S-förmig, das federt Stöße ab.</p>`],
  ["Gelenke",`<ul class="rules"><li><b>Kugelgelenk:</b> Schulter, Hüfte, in alle Richtungen beweglich.</li><li><b>Scharniergelenk:</b> Ellbogen, Knie, nur Beugen und Strecken.</li><li><b>Sattelgelenk:</b> Daumen.</li></ul><p>Im Gelenk überzieht <b>Knorpel</b> die Enden, <b>Gelenkschmiere</b> verringert Reibung, die <b>Gelenkkapsel</b> schließt alles ein, <b>Bänder</b> halten die Knochen zusammen.</p>`],

  [["Wie viele Knochen hat ein Erwachsener etwa?","Es sind etwa 206 Knochen.","Etwa 206","Etwa 50","Etwa 500"],
   ["Welches Gelenk ist ein Kugelgelenk?","Schulter und Hüfte sind Kugelgelenke.","Schulter","Knie","Ellbogen"],
   ["Was verbindet Muskeln mit Knochen?","Sehnen sind straffe, zugfeste Stränge.","Sehnen","Bänder","Knorpel"],
   ["Was verbindet Knochen mit Knochen im Gelenk?","Bänder halten das Gelenk zusammen.","Bänder","Sehnen","Muskeln"],

   ["Welcher Muskel zieht sich beim Beugen des Arms zusammen?","Der Bizeps beugt, der Trizeps streckt.","Der Bizeps","Der Trizeps","Beide gleich stark"],

    const w=[[...cs].reverse().map(ac).join("–"),[cs[1],cs[0],cs[2]].map(ac).join("–"),[ac(oth[0]),ac(cs[1]),ac(cs[2])].join("–"),[ac(cs[0]),ac(cs[1]),ac(oth[1])].join("–")];

  hw(){const q=pick([.1,.2,.3,.4,.5,.6]),q2=Math.round(q*q*100);
    return{q:`Ein rezessives Merkmal (aa) tritt in einer Population im Hardy-Weinberg-Gleichgewicht bei ${q2} % der Individuen auf. Wie viel Prozent sind heterozygot (Aa)?${unit("%")}`,kind:"num",ans:R(Math.round(2*(1-q)*q*100)),sol:`q² = ${fmt(q*q)} → q = ${fmt(q)}, p = 1 ${MINUS} q = ${fmt(Math.round((1-q)*10)/10)}. Heterozygote: 2 · p · q = 2 · ${fmt(Math.round((1-q)*10)/10)} · ${fmt(q)} = <b>${Math.round(2*(1-q)*q*100)} %</b>.`}},

  atpbil(){const n=ri(2,9);if(Math.random()<.5)return{q:`Hefezellen vergären ${n} Moleküle Glucose (Gärung, 2 ATP pro Glucose). Wie viel ATP entsteht?${unit("ATP")}`,kind:"num",ans:R(2*n),sol:`${n} · 2 = <b>${2*n} ATP</b>.`};
    return{q:`Bei der Zellatmung entstehen aus einem Glucose-Molekül etwa 30 ATP. Wie viel ATP bringen ${n} Glucose-Moleküle?${unit("ATP")}`,kind:"num",ans:R(30*n),sol:`${n} · 30 = <b>${30*n} ATP</b>. Die Gärung brächte nur ${2*n}.`}},
  nerv(){const [v,s,t]=pick([[100,1,10],[100,1.5,15],[100,2,20],[50,1,20],[50,.5,10],[10,.5,50],[10,1,100],[1,.02,20]]);

});

  ["Aufbau der DNA",`<p>Ein <b>Nukleotid</b> besteht aus Phosphat, dem Zucker <b>Desoxyribose</b> und einer Base (A, T, G oder C). Zwei Stränge bilden die <b>Doppelhelix</b> (Watson und Crick 1953, mit Röntgenbildern von Rosalind Franklin). Die Basen paaren sich komplementär: <b>A–T</b> (2 Wasserstoffbrücken) und <b>G–C</b> (3). Daraus folgt die Regel von Chargaff: A = T und G = C.</p>`,"diagramm",{ks:["dna"]}],
  ["Replikation",`<p>Die Replikation ist <b>semikonservativ</b> (Meselson und Stahl 1958): Jede neue DNA enthält einen alten und einen neuen Strang.</p><ol class="rules"><li><b>Helicase</b> öffnet die Doppelhelix an der Replikationsgabel.</li><li><b>Primase</b> setzt kurze RNA-Starter (Primer).</li><li><b>DNA-Polymerase</b> baut den neuen Strang nur in <b>5′→3′-Richtung</b>. Der <b>Leitstrang</b> wird durchgehend gebaut, der <b>Folgestrang</b> in Stücken (<b>Okazaki-Fragmente</b>).</li><li><b>Ligase</b> verbindet die Fragmente.</li></ol>`],

 BT("b12-protein","Proteinbiosynthese","Von der DNA zum Protein",[
  ["Transkription",`<p>Im <b>Zellkern</b> wird ein Gen in <b>mRNA</b> umgeschrieben. Die <b>RNA-Polymerase</b> liest den <b>codogenen Strang</b> (Matrize) und baut komplementär die RNA, in der <b>Uracil (U)</b> an die Stelle von Thymin tritt. Bei Eukaryoten wird die mRNA noch bearbeitet: <b>Spleißen</b> entfernt die Introns, die Exons werden verbunden, dazu kommen Kappe und Poly-A-Schwanz.</p><p class="eq">DNA 3′-TAC GGG-5′ → mRNA 5′-AUG CCC-3′</p>`],
  ["Translation",`<p>Am <b>Ribosom</b> im Zellplasma wird die mRNA in ein Protein übersetzt. Je drei Basen bilden ein <b>Codon</b>, das für eine Aminosäure steht. Die <b>tRNA</b> trägt eine Aminosäure und hat das passende <b>Anticodon</b>. Das Ribosom verknüpft die Aminosäuren zur Kette.</p><ul class="rules"><li><b>Start:</b> AUG (Methionin)</li><li><b>Stopp:</b> UAA, UAG, UGA</li><li>Der Code ist <b>degeneriert</b> (mehrere Codons je Aminosäure), <b>kommafrei</b> und fast <b>universell</b>.</li></ul>`],
  ["Mutationen im Code",`<ul class="rules"><li><b>Stille Mutation:</b> neues Codon, gleiche Aminosäure.</li><li><b>Missense:</b> andere Aminosäure (Sichelzellanämie: ein Basenaustausch).</li><li><b>Nonsense:</b> Stoppcodon entsteht, das Protein ist verkürzt.</li><li><b>Rasterschub:</b> Einbau oder Verlust von Basen, die nicht durch 3 teilbar sind, ändert alle folgenden Codons.</li></ul>`]],

  ["Das lac-Operon",`<p>Jacob und Monod beschrieben bei <i>E. coli</i>, wie Bakterien Enzyme nur bei Bedarf bilden. Das <b>Regulatorgen</b> codiert einen <b>Repressor</b>. Er bindet am <b>Operator</b> und blockiert die RNA-Polymerase am <b>Promotor</b>. Laktose (Induktor) bindet den Repressor, er löst sich, die <b>Strukturgene</b> werden abgelesen: <b>Substratinduktion</b>.</p>`,"lacop"],
  ["Endproduktrepression und Eukaryoten",`<p>Beim <b>trp-Operon</b> ist es umgekehrt: Das Endprodukt Tryptophan aktiviert den Repressor und schaltet die Synthese ab (<b>Endproduktrepression</b>).</p><p>Bei Eukaryoten steuern <b>Transkriptionsfaktoren</b> an <b>Enhancern</b> die Genaktivität. <b>Epigenetik:</b> <b>DNA-Methylierung</b> und Histonmodifikation schalten Gene ab oder an, ohne die Sequenz zu ändern. So haben alle Körperzellen dasselbe Erbgut, aber unterschiedliche aktive Gene: <b>Differenzierung</b>.</p>`]],
  [["Was bindet der Repressor im lac-Operon?","Er bindet am Operator und blockiert die RNA-Polymerase.","Den Operator","Den Promotor","Laktose dauerhaft"],
   ["Wann werden die lac-Strukturgene abgelesen?","Laktose bindet den Repressor, der sich vom Operator löst.","Wenn Laktose vorhanden ist","Wenn Laktose fehlt","Immer"],
   ["Warum ist das System sinnvoll?","Enzyme werden nur bei Bedarf gebildet, das spart Energie und Material.","Enzyme nur bei Bedarf","Enzyme immer","Kein Vorteil"],
   ["Was ist ein Induktor?","Ein Stoff, der den Repressor inaktiviert und so die Genaktivität anschaltet.","Schaltet die Genaktivität an","Ein Enzym","Ein Promotor"],
   ["Was ist die Aufgabe des Regulatorgens?","Es codiert den Repressor.","Es codiert den Repressor","Es codiert Laktose","Es ist der Promotor"],
   ["Muskel- und Nervenzelle haben dasselbe Erbgut und sind doch verschieden. Warum?","Unterschiedliche Gene sind aktiv (Genregulation, Differenzierung).","Unterschiedliche Genaktivität","Unterschiedliche DNA","Unterschiedliche Chromosomenzahl"],
   ["Was sind Transkriptionsfaktoren?","Proteine, die an DNA binden und die Transkription fördern oder hemmen.","Proteine, die die Genaktivität steuern","Enzyme der Replikation","Teile des Ribosoms"],
   ["Was bedeutet Epigenetik?","Veränderte Genaktivität ohne Änderung der DNA-Sequenz.","Genaktivität ohne Sequenzänderung","Mutation der Sequenz","Änderung der Chromosomenzahl"],
   ["Wie wirkt DNA-Methylierung meist?","Methylgruppen an der DNA schalten Gene oft ab.","Sie schaltet Gene oft ab","Sie schaltet Gene an","Sie repliziert die DNA"]]),

 BT("b12-ap","Ruhepotenzial und Aktionspotenzial","Elektrik der Nervenzelle",[
  ["Das Ruhepotenzial",`<p>An der Membran einer ruhenden Nervenzelle liegt eine Spannung von etwa <b>−70 mV</b> (innen negativ). Ursachen: <b>K⁺-Ionen</b> strömen über offene Kaliumkanäle aus (Konzentrationsgefälle), große organische <b>Anionen</b> bleiben innen, und die <b>Natrium-Kalium-Pumpe</b> transportiert unter ATP-Verbrauch <b>3 Na⁺ hinaus und 2 K⁺ hinein</b>.</p>`],
  ["Das Aktionspotenzial",`<p>Ein überschwelliger Reiz löst ein <b>Aktionspotenzial</b> aus. Es gilt das <b>Alles-oder-Nichts-Gesetz</b>: Die Größe hängt nicht von der Reizstärke ab, nur die Frequenz. Gehe die Phasen durch:</p>`,"ap"],
  ["Erregungsleitung",`<ul class="rules"><li><b>Kontinuierlich</b> bei marklosen Axonen: Das AP wandert Stück für Stück, langsam (etwa 1 m/s).</li><li><b>Saltatorisch</b> bei markhaltigen Axonen: Die Myelinscheide isoliert, nur an den <b>Ranvier-Schnürringen</b> entstehen APs. Es springt von Ring zu Ring, bis etwa 100 m/s, und spart Energie.</li></ul><p>Die <b>Refraktärzeit</b> sorgt dafür, dass die Erregung nur in eine Richtung läuft.</p>`]],
  [["Wie hoch ist das Ruhepotenzial etwa?","Innen etwa 70 mV negativer als außen.","−70 mV","+30 mV","0 mV"],
   ["Wodurch entsteht das Ruhepotenzial hauptsächlich?","K⁺ strömt über offene Kanäle aus, organische Anionen bleiben innen.","K⁺-Ausstrom","Na⁺-Einstrom","Cl⁻-Ausstrom"],
   ["Was macht die Natrium-Kalium-Pumpe?","Unter ATP-Verbrauch: 3 Na⁺ hinaus, 2 K⁺ hinein.","3 Na⁺ raus, 2 K⁺ rein","3 K⁺ raus, 2 Na⁺ rein","Sie leitet Wasser"],
   ["Was passiert bei der Depolarisation?","Spannungsgesteuerte Na⁺-Kanäle öffnen, Na⁺ strömt ein.","Na⁺ strömt ein","K⁺ strömt ein","Ca²⁺ strömt aus"],
   ["Was besagt das Alles-oder-Nichts-Gesetz?","Wird der Schwellenwert erreicht, läuft das AP immer gleich ab.","AP gleich groß oder gar keins","Stärkerer Reiz, größeres AP","Das AP wird immer kleiner"],
   ["Was bewirkt die Refraktärzeit?","Kein neues AP ist auslösbar, die Erregung läuft nur vorwärts.","Erregung läuft nur in eine Richtung","Das AP wird verstärkt","Die Pumpe stoppt"],
   ["Was ist saltatorische Erregungsleitung?","Das AP springt bei markhaltigen Axonen von Schnürring zu Schnürring.","Sprünge von Schnürring zu Schnürring","Leitung durch Blut","Leitung durch Zufall"],
   ["Warum leiten markhaltige Axone schneller?","Die Myelinscheide isoliert, APs entstehen nur an den Schnürringen.","Isolation und Sprünge","Dickere Kerne","Mehr Wasser"],
   ["Was geschieht bei der Repolarisation?","Na⁺-Kanäle inaktivieren, K⁺-Kanäle öffnen, K⁺ strömt aus.","K⁺ strömt aus","Na⁺ strömt ein","Die Pumpe stoppt"]],["b12-ap","nerv"]),

 BT("b12-syn","Synapse und Muskelkontraktion","Signalübertragung und Bewegung",[
  ["Die chemische Synapse",`<p>Gehe die Teile durch. Ablauf: AP erreicht das Endknöpfchen → Ca²⁺-Kanäle öffnen → <b>Ca²⁺ strömt ein</b> → Vesikel verschmelzen mit der Membran → <b>Transmitter</b> (Acetylcholin) gelangt in den Spalt → bindet an Rezeptoren → Na⁺-Kanäle öffnen → <b>EPSP</b>. Danach wird der Transmitter abgebaut (<b>Acetylcholinesterase</b>) oder wieder aufgenommen.</p>`,"diagramm",{ks:["synapse"]}],
  ["Hemmung, Summation, Gifte",`<ul class="rules"><li><b>Hemmende Synapse:</b> Transmitter (GABA) öffnet Cl⁻-Kanäle, es entsteht ein <b>IPSP</b> (Hyperpolarisation).</li><li><b>Summation:</b> <b>zeitlich</b> (EPSPs schnell hintereinander) und <b>räumlich</b> (mehrere Synapsen gleichzeitig) addieren sich bis zum Schwellenwert.</li><li><b>Curare</b> blockiert die ACh-Rezeptoren: Lähmung.</li><li><b>Botulinumtoxin</b> verhindert die Transmitterfreisetzung: Lähmung.</li><li><b>Nervengase</b> hemmen die Acetylcholinesterase: Dauererregung, Krämpfe.</li></ul>`],
  ["Muskelkontraktion",`<p>Ein Muskel besteht aus Fasern mit Myofibrillen, gegliedert in <b>Sarkomere</b>. Dicke <b>Myosinfilamente</b> und dünne <b>Aktinfilamente</b> gleiten ineinander (<b>Gleitfilamenttheorie</b>), das Sarkomer verkürzt sich.</p><ol class="rules"><li>Ein AP lässt Ca²⁺ aus dem sarkoplasmatischen Retikulum frei.</li><li>Ca²⁺ gibt am Aktin die Bindestellen frei (Troponin, Tropomyosin).</li><li>Das Myosinköpfchen bindet und macht den <b>Kraftschlag</b>.</li><li><b>ATP</b> löst das Köpfchen wieder ab und spannt es neu. Ohne ATP bleiben die Köpfchen gebunden: <b>Totenstarre</b>.</li></ol>`]],
  [["Welcher Ionenstrom löst die Transmitterfreisetzung aus?","Ca²⁺ strömt ins Endknöpfchen, Vesikel verschmelzen mit der Membran.","Ca²⁺-Einstrom","Na⁺-Ausstrom","K⁺-Einstrom"],
   ["Wie heißt der Überträgerstoff an der motorischen Endplatte?","Acetylcholin überträgt das Signal auf den Muskel.","Acetylcholin","Insulin","Adrenalin"],
   ["Welches Enzym baut Acetylcholin im Spalt ab?","Die Acetylcholinesterase spaltet es.","Acetylcholinesterase","Amylase","Katalase"],
   ["Was bewirkt Curare?","Es blockiert die ACh-Rezeptoren: Der Muskel bekommt kein Signal.","Blockiert die ACh-Rezeptoren","Hemmt den Abbau von ACh","Bildet mehr Transmitter"],
   ["Nervengase hemmen die Acetylcholinesterase. Folge?","ACh bleibt im Spalt: Dauererregung und Krämpfe.","Dauererregung","Lähmung durch fehlendes ACh","Keine Wirkung"],
   ["Was ist ein IPSP?","Ein hemmendes Potenzial, oft durch Cl⁻-Einstrom.","Hemmendes postsynaptisches Potenzial","Erregendes Potenzial","Aktionspotenzial"],
   ["Was ist zeitliche Summation?","Schnell aufeinanderfolgende EPSPs addieren sich.","EPSPs addieren sich in kurzer Folge","Räumlich verteilte Signale","Ein AP summiert sich"],
   ["Was gleitet bei der Kontraktion ineinander?","Aktin- und Myosinfilamente, das Sarkomer verkürzt sich.","Aktin und Myosin","Haut und Knochen","Sehne und Blut"],
   ["Wozu braucht der Muskel ATP?","ATP löst die Myosinköpfchen vom Aktin. Ohne ATP: Totenstarre.","Lösen und Spannen der Myosinköpfchen","Nur für Wärme","Zur Bildung von Ca²⁺"]]),

 BT("b12-atp","Zellatmung im Detail","Von der Glucose zum ATP",[
  ["Überblick",`<p class="eq">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O (+ etwa 30 ATP)</p><ol class="rules"><li><b>Glykolyse</b> (Cytoplasma): Glucose → 2 Pyruvat, netto <b>2 ATP</b> und 2 NADH, ohne Sauerstoff.</li><li><b>Oxidative Decarboxylierung</b> (Matrix): Pyruvat → Acetyl-CoA + <b>CO₂</b> + NADH.</li><li><b>Citratzyklus</b> (Matrix): Acetyl-CoA wird abgebaut, <b>CO₂</b>, NADH, FADH₂ und etwas ATP entstehen.</li><li><b>Atmungskette</b> (innere Membran): NADH und FADH₂ geben Elektronen ab, Protonen werden in den Intermembranraum gepumpt. Die <b>ATP-Synthase</b> nutzt den Rückfluss und bildet den Großteil des ATP. <b>Sauerstoff</b> ist der Endakzeptor, es entsteht Wasser.</li></ol>`],
  ["Das Mitochondrium",`<p>Tippe die Teile an.</p>`,"diagramm",{ks:["mito"]}],
  ["Gärung",`<p>Ohne Sauerstoff geht nur die Glykolyse weiter, das NADH muss regeneriert werden.</p><ul class="rules"><li><b>Alkoholische Gärung</b> (Hefe): Pyruvat → Ethanol + CO₂ (Bier, Brot, Wein).</li><li><b>Milchsäuregärung</b> (Milchsäurebakterien, auch Muskel bei O₂-Mangel): Pyruvat → Laktat (Joghurt, Sauerkraut).</li></ul><p>Ausbeute nur <b>2 ATP</b> pro Glucose, gegenüber etwa 30 bei der Atmung.</p>`]],
  [["Wo läuft die Glykolyse ab?","Im Cytoplasma, ohne Sauerstoff.","Im Cytoplasma","In der Matrix","An der inneren Membran"],
   ["Wo läuft der Citratzyklus ab?","In der Matrix der Mitochondrien.","In der Matrix","Im Zellkern","Im Cytoplasma"],
   ["Wo sitzt die Atmungskette?","An der inneren Mitochondrienmembran.","Innere Membran","Äußere Membran","Matrix"],
   ["Welche Rolle hat Sauerstoff in der Atmungskette?","Er nimmt als Endakzeptor Elektronen und Protonen auf, es entsteht Wasser.","Endakzeptor, es entsteht Wasser","Er liefert Energie","Er wird zu CO₂"],
   ["Welches Enzym bildet die meisten ATP?","Die ATP-Synthase nutzt den Protonengradienten.","ATP-Synthase","Amylase","Helicase"],
   ["Was entsteht bei der alkoholischen Gärung?","Hefen bilden Ethanol und CO₂.","Ethanol und CO₂","Milchsäure","Wasser und CO₂"],
   ["Wie viel ATP bringt die Glykolyse netto pro Glucose?","Netto 2 ATP.","2","30","0"],
   ["Was passiert bei Sauerstoffmangel im Muskel?","Milchsäuregärung: Pyruvat wird zu Laktat, NADH wird regeneriert.","Milchsäuregärung","Alkoholische Gärung","Zellatmung läuft schneller"],
   ["Wo entsteht das CO₂ der Zellatmung?","Bei der oxidativen Decarboxylierung und im Citratzyklus.","Decarboxylierung und Citratzyklus","In der Atmungskette","In der Glykolyse"]],["b12-atp","atpbil"]),

 BT("b12-foto","Fotosynthese im Detail","Lichtreaktion und Calvin-Zyklus",[
  ["Der Chloroplast",`<p>Der Chloroplast hat zwei Hüllmembranen. Innen liegen <b>Thylakoide</b>, gestapelt zu <b>Grana</b>, umgeben vom <b>Stroma</b>.</p>`,"diagramm",{ks:["chloro"]}],
  ["Lichtreaktion (Thylakoidmembran)",`<ol class="rules"><li>Chlorophyll in den <b>Photosystemen</b> II und I absorbiert Licht, Elektronen werden angeregt.</li><li><b>Photolyse:</b> Wasser wird gespalten in <b>O₂</b>, H⁺ und Elektronen. Der Sauerstoff stammt aus dem <b>Wasser</b>, nicht aus dem CO₂.</li><li>Elektronentransportkette pumpt H⁺ in den Thylakoidraum. Die <b>ATP-Synthase</b> bildet <b>ATP</b>.</li><li>Am Photosystem I entsteht <b>NADPH</b>.</li></ol><p>Chlorophyll absorbiert vor allem <b>blaues und rotes</b> Licht, Grün wird zurückgeworfen.</p>`],
  ["Calvin-Zyklus (Stroma)",`<ol class="rules"><li><b>Fixierung:</b> <b>RuBisCO</b> bindet CO₂ an Ribulose-1,5-bisphosphat (RuBP).</li><li><b>Reduktion:</b> Mit ATP und NADPH entsteht Glycerinaldehyd-3-phosphat (G3P).</li><li><b>Regeneration:</b> Aus G3P wird RuBP neu gebildet (ATP). Ein Teil des G3P wird zu Glucose.</li></ol><p>Er läuft nur mit den Produkten der Lichtreaktion, daher bei Nacht nicht lange. <b>C₄-Pflanzen</b> (Mais) und <b>CAM-Pflanzen</b> (Kakteen) haben Anpassungen an Hitze und Trockenheit.</p>`]],
  [["Wo läuft die Lichtreaktion ab?","An den Thylakoidmembranen der Grana.","Thylakoidmembran","Stroma","Zellkern"],
   ["Wo läuft der Calvin-Zyklus ab?","Im Stroma des Chloroplasten.","Im Stroma","Im Thylakoid","In der Vakuole"],
   ["Woher stammt der freigesetzte Sauerstoff?","Aus der Photolyse des Wassers.","Aus Wasser","Aus CO₂","Aus Glucose"],
   ["Was liefert die Lichtreaktion dem Calvin-Zyklus?","ATP und NADPH.","ATP und NADPH","Glucose","CO₂"],
   ["Welches Enzym fixiert CO₂?","RuBisCO bindet CO₂ an RuBP.","RuBisCO","ATP-Synthase","Helicase"],
   ["Welche Lichtfarben absorbiert Chlorophyll vor allem?","Blau und Rot. Grün wird zurückgeworfen.","Blau und Rot","Grün","Gelb"],
   ["Was ist die Photolyse?","Spaltung von Wasser durch Lichtenergie in O₂, Protonen und Elektronen.","Wasserspaltung durch Licht","Spaltung von CO₂","Spaltung von Glucose"],
   ["Wie entsteht der Protonengradient der Lichtreaktion?","Der Elektronentransport pumpt H⁺ in den Thylakoidraum, die ATP-Synthase nutzt den Rückstrom.","Protonen werden in den Thylakoidraum gepumpt","Protonen kommen aus Glucose","Es gibt keinen Gradienten"],
   ["Wozu dient der Calvin-Zyklus?","Er baut mit ATP und NADPH aus CO₂ Zucker auf.","Zuckeraufbau aus CO₂","Wasserspaltung","Sauerstoffbildung"]]),

 BT("b12-pop","Populationsökologie","Faktoren, Wachstum, Beziehungen",[
  ["Umweltfaktoren und Toleranz",`<p><b>Abiotische</b> Faktoren (Licht, Temperatur, Wasser, pH) und <b>biotische</b> (Konkurrenz, Fressfeinde, Parasiten) wirken auf Lebewesen. Die <b>Toleranzkurve</b> zeigt: Zwischen <b>Minimum</b> und <b>Maximum</b> ist Leben möglich, im <b>Optimum</b> am besten, am Rand im <b>Pessimum</b> gerade noch. Der Toleranzbereich ist die <b>ökologische Potenz</b>.</p>`],
  ["Populationswachstum",`<p>Ohne Grenzen wächst eine Population <b>exponentiell</b> (J-Kurve). Real bremsen Nahrung, Platz und Krankheiten: <b>logistisches Wachstum</b> (S-Kurve) nähert sich der <b>Kapazität K</b>. <b>Dichteabhängig</b> wirken Konkurrenz, Krankheiten, Räuber. <b>Dichteunabhängig</b> wirken Frost, Dürre. <b>r-Strategen</b> (Mäuse): viele Nachkommen, wenig Pflege. <b>K-Strategen</b> (Elefanten): wenige Nachkommen, viel Pflege.</p>`,"logistisch"],
  ["Beziehungen zwischen Arten",`<ul class="rules"><li><b>Räuber-Beute:</b> Die Zahlen schwanken periodisch, die Räuberkurve folgt der Beutekurve phasenverschoben (Lotka-Volterra).</li><li><b>Konkurrenzausschlussprinzip:</b> Arten mit gleicher <b>ökologischer Nische</b> können nicht dauerhaft koexistieren.</li><li><b>Symbiose:</b> Vorteil für beide (Knöllchenbakterien, Flechten).</li><li><b>Parasitismus:</b> Vorteil für einen, Schaden für den Wirt.</li></ul>`]],
  [["Was beschreibt die Toleranzkurve?","Wie das Gedeihen vom Umweltfaktor abhängt.","Abhängigkeit vom Umweltfaktor","Die Zahl der Nachkommen","Die Nahrungskette"],
   ["Was ist die Kapazitätsgrenze K?","Die höchste Individuenzahl, die die Umwelt dauerhaft trägt.","Maximal tragbare Individuenzahl","Anfangsgröße","Wachstumsrate"],
   ["Welche Kurve zeigt logistisches Wachstum?","Erst fast exponentiell, dann flacher bis K (S-Form).","S-förmig","Immer steiler","Gerade"],
   ["Welcher Faktor ist dichteabhängig?","Konkurrenz und Krankheiten nehmen mit der Dichte zu.","Nahrungskonkurrenz","Frost","Dürre"],
   ["Was sagt das Konkurrenzausschlussprinzip?","Zwei Arten mit gleicher Nische können dauerhaft nicht nebeneinander bestehen.","Gleiche Nische: eine Art verdrängt die andere","Arten ergänzen sich","Es gibt keine Konkurrenz"],
   ["Wie schwanken Räuber und Beute?","Periodisch und phasenverschoben: Die Räuber folgen der Beute.","Periodisch, Räuber folgen der Beute","Parallel","Gar nicht"],
   ["Was kennzeichnet r-Strategen?","Viele Nachkommen, kurze Lebensdauer, wenig Brutpflege.","Viele Nachkommen, wenig Pflege","Wenige Nachkommen, viel Pflege","Lange Lebensdauer"],
   ["Was ist Symbiose?","Zusammenleben mit Vorteil für beide.","Vorteil für beide","Vorteil für einen, Schaden für den anderen","Keine Beziehung"],
   ["Was ist die ökologische Nische?","Gesamtheit der Ansprüche und die Rolle einer Art im Ökosystem.","Ansprüche und Rolle einer Art","Der Wohnort","Ein Stück Boden"]],["b12-pop","wachs"]),

 BT("b12-art","Artbildung","Isolation, Gendrift, Hardy-Weinberg",[
  ["Was ist eine Art?",`<p>Nach dem biologischen Artbegriff bilden Individuen eine Art, die sich untereinander fortpflanzen und <b>fruchtbare Nachkommen</b> haben. Pferd und Esel paaren sich, das Maultier ist aber unfruchtbar: zwei Arten.</p><p>Der <b>Genpool</b> ist die Gesamtheit aller Allele einer Population.</p>`],
  ["Wie entstehen Arten?",`<ul class="rules"><li><b>Allopatrische Artbildung:</b> Eine räumliche Barriere (Gebirge, Meer) trennt Populationen. Sie entwickeln sich getrennt (Mutation, Selektion, <b>Gendrift</b>) und werden fortpflanzungsmäßig isoliert.</li><li><b>Sympatrische Artbildung:</b> ohne räumliche Trennung, zum Beispiel durch ökologische Spezialisierung oder Polyploidie bei Pflanzen.</li><li><b>Gründereffekt:</b> Wenige Individuen besiedeln ein Gebiet, ihr Genpool ist zufällig.</li><li><b>Flaschenhals:</b> Die Population schrumpft stark, viele Allele gehen verloren.</li><li><b>Adaptive Radiation:</b> Aus einer Stammart entstehen schnell viele Arten (Darwinfinken, Buntbarsche).</li></ul>`],
  ["Selektionsformen und Hardy-Weinberg",`<ul class="rules"><li><b>Stabilisierend:</b> Extreme werden benachteiligt.</li><li><b>Transformierend:</b> Ein Extrem wird begünstigt, der Mittelwert verschiebt sich.</li><li><b>Aufspaltend (disruptiv):</b> Beide Extreme werden begünstigt, kann zur Artbildung führen.</li></ul><p class="eq">p + q = 1 und p² + 2pq + q² = 1</p><p>p, q: Häufigkeiten der Allele A, a. p² = AA, 2pq = Aa, q² = aa. Das <b>Hardy-Weinberg-Gleichgewicht</b> gilt nur ohne Mutation, Selektion, Migration, Gendrift und bei Zufallspaarung. Es dient als Vergleichsmodell: Weicht eine Population ab, wirkt Evolution.</p>`]],
  [["Wie definiert man eine biologische Art?","Individuen, die sich fortpflanzen und fruchtbare Nachkommen haben.","Fruchtbare Nachkommen untereinander","Gleiches Aussehen","Gleicher Lebensraum"],
   ["Warum bilden Pferd und Esel keine Art?","Das Maultier ist unfruchtbar.","Das Maultier ist unfruchtbar","Sie sehen verschieden aus","Sie leben getrennt"],
   ["Was ist allopatrische Artbildung?","Räumliche Trennung isoliert Populationen.","Artbildung durch räumliche Trennung","Ohne räumliche Trennung","Durch Zufall im selben Gebiet"],
   ["Was ist der Gründereffekt?","Wenige Individuen besiedeln ein Gebiet, der Genpool ist zufällig klein.","Kleiner Genpool durch wenige Gründer","Mehr Mutationen","Starke Selektion"],
   ["Was ist Gendrift?","Zufällige Änderung der Allelhäufigkeiten, besonders in kleinen Populationen.","Zufällige Allelhäufigkeitsänderung","Gezielte Mutation","Wanderung"],
   ["Was bedeutet adaptive Radiation?","Aus einer Stammart entstehen schnell viele Arten in verschiedenen Nischen.","Viele Arten aus einer Stammart","Aussterben vieler Arten","Rückbildung von Organen"],
   ["Welche Selektion begünstigt beide Extreme?","Aufspaltende (disruptive) Selektion kann zu Artbildung führen.","Aufspaltende Selektion","Stabilisierende Selektion","Transformierende Selektion"],
   ["Was bedeutet Hardy-Weinberg-Gleichgewicht?","Allel- und Genotyphäufigkeiten bleiben konstant, wenn keine Evolutionsfaktoren wirken.","Konstante Häufigkeiten ohne Evolution","Dauernde Veränderung","Aussterben"],
   ["Die Gleichung p² + 2pq + q² = 1 beschreibt …","p² = AA, 2pq = Aa, q² = aa.","Die Genotyphäufigkeiten","Die Allelzahl","Die Mutationsrate"]],["b12-art","hw"]),

 BT("b12-immun","Immunbiologie: Antikörper und Impfung","Spezifische Abwehr im Detail",[
  ["Humorale und zelluläre Abwehr",`<ul class="rules"><li><b>Antigenpräsentation:</b> Fresszellen (Makrophagen, dendritische Zellen) zeigen Bruchstücke des Erregers auf ihrer Oberfläche (MHC).</li><li><b>T-Helferzellen</b> erkennen das und koordinieren die Abwehr.</li><li><b>Humoral:</b> <b>B-Zellen</b> werden aktiviert und vermehren sich zu <b>Plasmazellen</b>, die <b>Antikörper</b> ins Blut abgeben.</li><li><b>Zellulär:</b> <b>Cytotoxische T-Zellen</b> töten infizierte Körperzellen.</li><li><b>Gedächtniszellen</b> bleiben zurück.</li></ul>`],
  ["Antikörper und klonale Selektion",`<p>Ein <b>Antikörper</b> ist Y-förmig mit zwei variablen <b>Antigenbindestellen</b>. Jede B-Zelle trägt einen anderen Rezeptor. Trifft ein Antigen auf eine passende B-Zelle, wird nur diese vermehrt: <b>klonale Selektion</b>.</p><p><b>Primärantwort</b> beim ersten Kontakt: langsam, schwach. <b>Sekundärantwort</b> mit Gedächtniszellen: schnell und stark. Das ist die Grundlage der Impfung.</p>`],

Object.assign(KT,{
 "b12-dna":`<p>Mit Gummibärchen oder Perlen in 4 Farben eine DNA bauen und den Gegenstrang legen. Erdbeer-DNA aus Spülmittel, Salz und Spiritus sichtbar machen. <b>Typischer Fehler:</b> A mit G oder T mit C paaren, oder RNA und DNA vermischen.</p>`,
 "b12-protein":`<p>Eine Codetabelle als Geheimschrift nutzen: mRNA-Karten, Kind „übersetzt“ in Aminosäuren. <b>Typischer Fehler:</b> Transkription und Translation verwechseln, oder die Matrize nicht mit der mRNA gleichsetzen: Sie ist komplementär.</p>`,
 "b12-regul":`<p>Ein Lichtschalter-Bild: Der Repressor ist ein Riegel, der Induktor zieht ihn weg. <b>Typischer Fehler:</b> Der Induktor bindet am Operator. Er bindet den Repressor.</p>`,
 "b12-ap":`<p>Wasserhahn- und Schleusenbild: Ionenkanäle als Tore, die Pumpe als Eimer. Spannung zeichnen und beschriften lassen. <b>Typischer Fehler:</b> Ruhepotenzial als Zustand „ohne Ionenbewegung“. Es ist ein Fließgleichgewicht.</p>`,
 "b12-syn":`<p>Dominosteine als Erregungsleitung, ein Briefkasten als Synapse. Rudern oder Liegestütz: Muskelfasern ziehen, ATP wird verbraucht. <b>Typischer Fehler:</b> Das AP „springt“ über den Spalt. Es wird chemisch übertragen.</p>`,
 "b12-atp":`<p>Wo die Energie herkommt: Brot lange kauen, Sauerteig oder Hefeteig beobachten (Gärung, CO₂). <b>Typischer Fehler:</b> Zellatmung = Atmen. Die Zellatmung ist der Abbau in den Zellen.</p>`,

 "b12-art":`<p>Das Gen-Pool-Spiel: Eine Schale bunter Perlen, zufällig ziehen und neu auffüllen. Die Farbanteile driften. <b>Typischer Fehler:</b> „Arten entstehen, weil sie es brauchen.“ Isolation und Zufall sind die Treiber.</p>`,
