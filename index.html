/* Formeln: ch("Fe2O3") → Fe<sub>2</sub>O<sub>3</sub>, ch("Mg^2+") → Mg<sup>2+</sup> */
const ch=s=>String(s).replace(/\^(\d*[+−-])/g,(_,c)=>`<sup>${c.replace("-",MINUS)}</sup>`).replace(/([A-Za-z\)\]])(\d+)/g,"$1<sub>$2</sub>");
/* [Z, Symbol, Name, Atommasse, Hauptgruppe (0 = Nebengruppe), Periode, EN, Massenzahl häufigstes Isotop, Metall?] */
const ELS=[[1,"H","Wasserstoff",1.008,1,1,2.2,1,0],[2,"He","Helium",4.0,8,1,null,4,0],[3,"Li","Lithium",6.9,1,2,1.0,7,1],[4,"Be","Beryllium",9.0,2,2,1.6,9,1],[5,"B","Bor",10.8,3,2,2.0,11,0],[6,"C","Kohlenstoff",12.0,4,2,2.6,12,0],[7,"N","Stickstoff",14.0,5,2,3.0,14,0],[8,"O","Sauerstoff",16.0,6,2,3.4,16,0],[9,"F","Fluor",19.0,7,2,4.0,19,0],[10,"Ne","Neon",20.2,8,2,null,20,0],
  [11,"Na","Natrium",23.0,1,3,.9,23,1],[12,"Mg","Magnesium",24.3,2,3,1.3,24,1],[13,"Al","Aluminium",27.0,3,3,1.6,27,1],[14,"Si","Silicium",28.1,4,3,1.9,28,0],[15,"P","Phosphor",31.0,5,3,2.2,31,0],[16,"S","Schwefel",32.1,6,3,2.6,32,0],[17,"Cl","Chlor",35.5,7,3,3.2,35,0],[18,"Ar","Argon",39.9,8,3,null,40,0],[19,"K","Kalium",39.1,1,4,.8,39,1],[20,"Ca","Calcium",40.1,2,4,1.0,40,1],[35,"Br","Brom",79.9,7,4,3.0,79,0]];
const EL=Object.fromEntries(ELS.map(e=>[e[1],{z:e[0],sym:e[1],name:e[2],m:e[3],g:e[4],p:e[5],en:e[6],A:e[7],metal:!!e[8]}]));
const shellsOf=z=>{const caps=[2,8,8,18],r=[];let left=z;for(const c of caps){if(left<=0)break;const k=Math.min(c,left);r.push(k);left-=k}return r};
const GRP={1:"Alkalimetalle",2:"Erdalkalimetalle",3:"Borgruppe",4:"Kohlenstoffgruppe",5:"Stickstoffgruppe",6:"Chalkogene (Sauerstoffgruppe)",7:"Halogene",8:"Edelgase"};
const MM={H:1,C:12,N:14,O:16,Na:23,Mg:24,Al:27,S:32,Cl:35.5,K:39,Ca:40,Fe:56,Cu:63.5};
function atomsOf(f){const out={},re=/([A-Z][a-z]?)(\d*)|\(([^)]+)\)(\d+)/g;let m;
  while((m=re.exec(f))){if(m[1]){out[m[1]]=(out[m[1]]||0)+(+m[2]||1)}else{const inner=atomsOf(m[3]);for(const k in inner)out[k]=(out[k]||0)+inner[k]*(+m[4])}}return out}
const molMass=f=>{const a=atomsOf(f);return Object.entries(a).reduce((s,[k,n])=>s+MM[k]*n,0)};
const cvar=(n,el=document.documentElement)=>{try{return getComputedStyle(el).getPropertyValue(n).trim()||"#888"}catch(e){return"#888"}};

/* ---------- Chemie: Zahlenaufgaben ---------- */
Object.assign(G,{
  c_atom(){const e=EL[pick(Object.keys(EL).filter(k=>EL[k].z<=20))],t=ri(0,3);
    if(t===0)return{q:`Wie viele <b>Protonen</b> hat ein ${e.name}-Atom (${e.sym})?`,kind:"num",ans:R(e.z),sol:`Die Ordnungszahl im Periodensystem ist die Protonenzahl: ${e.sym} steht an Platz ${e.z}, also <b>${e.z} Protonen</b>. Ein neutrales Atom hat genauso viele Elektronen.`};
    if(t===1)return{q:`Ein ${e.name}-Atom hat die Massenzahl ${e.A}. Wie viele <b>Neutronen</b> hat es?`,kind:"num",ans:R(e.A-e.z),sol:`Neutronen = Massenzahl ${MINUS} Protonen = ${e.A} ${MINUS} ${e.z} = <b>${e.A-e.z}</b>. Die Massenzahl zählt alle Teilchen im Kern.`};
    if(t===2){const sh=shellsOf(e.z);return{q:`Wie viele Elektronen hat ${e.name} (${e.sym}) auf der <b>äußersten Schale</b>?`,kind:"num",ans:R(sh[sh.length-1]),sol:`${e.z} Elektronen verteilen sich auf die Schalen: ${sh.join(", ")}. Außen sind <b>${sh[sh.length-1]}</b>.${e.g?` Das passt zur ${e.g}. Hauptgruppe: Die Gruppennummer ist die Zahl der Außenelektronen${e.g===8&&e.z===2?" (Ausnahme Helium: 2)":""}.`:""}`}}
    const sh=shellsOf(e.z);return{q:`Wie viele <b>Elektronenschalen</b> hat ein ${e.name}-Atom (${e.sym})?`,kind:"num",ans:R(sh.length),sol:`${e.sym} steht in der ${e.p}. Periode (Zeile). Die Periode ist die Zahl der Schalen: <b>${sh.length}</b> (${sh.join(", ")}).`}},
  c_ion(){const e=EL[pick(["Li","Na","K","Mg","Ca","Al","O","S","F","Cl","N","Br"])],c=e.g<=3?e.g:e.g-8;
    return{q:`Welche <b>Ladung</b> hat das Ion, das ${e.name} (${e.sym}) bildet?<p class="muted small">Als Zahl mit Vorzeichen, z. B. +2 oder ${MINUS}1.</p>`,kind:"num",ans:R(c),
      sol:`${e.sym} hat ${e.g} Außenelektron${e.g>1?"en":""}. ${c>0?`Als Metall gibt es ${c} ab, so ist die Schale darunter voll. Ion: <b>${ch(e.sym+"^"+(c>1?c:"")+"+")}</b>.`:`Als Nichtmetall nimmt es ${-c} auf, bis 8 außen sind (Edelgaskonfiguration). Ion: <b>${ch(e.sym+"^"+(c<-1?-c:"")+"-")}</b>.`}`}},
  c_salz(){const M=pick(["Na","K","Mg","Ca","Al","Li"]),X=pick(["Cl","O","S","F","Br","N"]),m=EL[M],x=EL[X],cm=m.g,cx=8-x.g,L=lcm(cm,cx),a=L/cm,b=L/cx;
    const f=`${M}${a>1?a:""}${X}${b>1?b:""}`,wrong=[`${M}${X}`,`${M}${b>1?b:""}${X}${a>1?a:""}`,`${M}${cm>1?cm:""}${X}${cx>1?cx:""}`,`${M}${a+1}${X}`].filter(w=>w!==f);
    const opts=shuffle([f,...shuffle([...new Set(wrong)]).slice(0,3)]);
    return{q:`Welche Formel hat das Salz aus <b>${m.name}</b> und <b>${x.name}</b>?`,kind:"choice",opts:opts.map(ch),correct:opts.indexOf(f),
      sol:`Ionen: ${ch(M+"^"+(cm>1?cm:"")+"+")} und ${ch(X+"^"+(cx>1?cx:"")+"-")}. Die Ladungen müssen sich aufheben: kgV(${cm}, ${cx}) = ${L}. Also ${a}× ${M} (${a} · ${cm}+ = ${L}+) und ${b}× ${X} (${b} · ${cx}${MINUS} = ${L}${MINUS}): <b>${ch(f)}</b>.`}},
  c_ausgl(){const [L,Rr]=pick(REAKTIONEN),all=[...L,...Rr],i=ri(0,all.length-1),show=(side,off)=>side.map((x,k)=>`${off+k===i?"<b class='blank'>?</b>":x[0]>1?x[0]:""} ${ch(x[1])}`).join(" + ");
    return{q:`Gleiche die Reaktionsgleichung aus. Welche Zahl gehört an die Stelle mit dem Fragezeichen?<div class="eq">${show(L,0)} → ${show(Rr,L.length)}</div>`,kind:"num",ans:R(all[i][0]),
      sol:`Ausgeglichen: ${L.map(x=>(x[0]>1?x[0]+" ":"")+ch(x[1])).join(" + ")} → ${Rr.map(x=>(x[0]>1?x[0]+" ":"")+ch(x[1])).join(" + ")}. Links und rechts muss von jeder Atomsorte gleich viel stehen: ${Object.entries(sideAtoms(L)).map(([k,n])=>`${n} ${k}`).join(", ")}. Nur die Zahlen <b>vor</b> den Formeln dürfen geändert werden, nie die kleinen Zahlen in der Formel.`}},
  c_molmasse(){const f=pick(["H2O","CO2","NaCl","O2","NH3","CH4","H2SO4","CaCO3","NaOH","HCl","C6H12O6","MgO","Fe2O3","C2H5OH","Al2O3","CuSO4"]),a=atomsOf(f),M=molMass(f);
    return{q:`Berechne die molare Masse von <b>${ch(f)}</b>.<p class="muted small">Atommassen: ${Object.keys(a).map(k=>`${k} = ${fmt(MM[k])}`).join(", ")} g/mol</p>${unit("g/mol")}`,kind:"num",ans:R(Math.round(M*10),10),tol:.06,
      sol:`Alle Atome zusammenzählen: ${Object.entries(a).map(([k,n])=>`${n} · ${fmt(MM[k])}`).join(" + ")} = <b>${fmt(M)} g/mol</b>.`}},
  c_mol(){const f=pick(["H2O","CO2","NaCl","O2","CH4","NaOH","CaCO3","MgO"]),M=molMass(f),t=ri(0,2);
    if(t===0){const n=pick([.1,.2,.25,.5,1,2,3]),m=n*M;return{q:`Wie viel Stoffmenge sind <b>${fmt(m)} g</b> ${ch(f)}? (M = ${fmt(M)} g/mol)${unit("mol")}`,kind:"num",ans:R(Math.round(n*1000),1000),tol:.006,sol:`n = m : M = ${fmt(m)} g : ${fmt(M)} g/mol = <b>${fmt(n)} mol</b>.`}}
    if(t===1){const n=pick([.1,.2,.5,1.5,2,4]);return{q:`Welche Masse haben <b>${fmt(n)} mol</b> ${ch(f)}? (M = ${fmt(M)} g/mol)${unit("g")}`,kind:"num",ans:R(Math.round(n*M*10),10),tol:.06,sol:`m = n · M = ${fmt(n)} mol · ${fmt(M)} g/mol = <b>${fmt(n*M)} g</b>.`}}
    const n=pick([.05,.1,.2,.5,1]),V=pick([.25,.5,1,2]);return{q:`${fmt(n)} mol Salz werden zu ${fmt(V)} l Lösung aufgefüllt. Wie groß ist die Konzentration?${unit("mol/l")}`,kind:"num",ans:R(Math.round(n/V*1000),1000),tol:.006,sol:`c = n : V = ${fmt(n)} mol : ${fmt(V)} l = <b>${fmt(n/V)} mol/l</b>.`}},
  c_massenanteil(){const s=pick([5,10,20,25,30,50]),w=pick([45,80,95,100,150,170,200,250]);const t=s+w,p=s/t*100;if(Math.abs(p*10-Math.round(p*10))>1e-9)return G.c_massenanteil();
    return{q:`${s} g Salz werden in ${w} g Wasser gelöst. Wie groß ist der Massenanteil des Salzes?${unit("%")}`,kind:"num",ans:R(Math.round(p*10),10),tol:.06,sol:`Massenanteil = Masse Salz : Masse Lösung = ${s} g : (${s} + ${w}) g = ${s} : ${t} = <b>${fmt(Math.round(p*10)/10)} %</b>. Achtung: durch die ganze Lösung teilen, nicht nur durch das Wasser.`}},
  c_zustand(){const st=pick([["Wasser",0,100],["Ethanol (Alkohol)",-114,78],["Kochsalz",801,1465],["Eisen",1538,2862],["Sauerstoff",-218,-183],["Quecksilber",-39,357],["Butan (Feuerzeuggas)",-138,-1],["Kerzenwachs",60,350],["Zinn",232,2602]]),T=pick([-50,-20,0,20,25,80,150,500,1000]);
    if(T===st[1]||T===st[2])return G.c_zustand();const z=T<st[1]?0:T<st[2]?1:2;
    return{q:`${st[0]} schmilzt bei ${fmt(st[1])} °C und siedet bei ${fmt(st[2])} °C. Welchen Aggregatzustand hat es bei <b>${fmt(T)} °C</b>?`,kind:"choice",opts:["fest","flüssig","gasförmig"],correct:z,
      sol:`Unter der Schmelztemperatur fest, zwischen Schmelz- und Siedetemperatur flüssig, darüber gasförmig. ${fmt(T)} °C liegt ${z===0?`unter ${fmt(st[1])} °C: <b>fest</b>`:z===1?`zwischen ${fmt(st[1])} und ${fmt(st[2])} °C: <b>flüssig</b>`:`über ${fmt(st[2])} °C: <b>gasförmig</b>`}.`}},
  c_ph(){const t=ri(0,3);
    if(t===0){const x=ri(1,13);return{q:`Eine Lösung hat ${term(`c(H₃O⁺) = 10<sup>${MINUS}${x}</sup> mol/l`)}. Welchen pH-Wert hat sie?`,kind:"num",ans:R(x),sol:`pH = ${MINUS}lg c(H₃O⁺). Einfach den Exponenten ohne Minus ablesen: <b>pH ${x}</b>, also ${x<7?"sauer":x>7?"basisch (alkalisch)":"neutral"}.`}}
    if(t===1){const x=ri(1,4);return{q:`Salzsäure (HCl) mit c = ${fmt(10**-x)} mol/l. Welchen pH-Wert hat sie?`,kind:"num",ans:R(x),sol:`HCl ist eine starke Säure und gibt jedes H⁺ ab: c(H₃O⁺) = ${fmt(10**-x)} = 10<sup>${MINUS}${x}</sup> mol/l → <b>pH ${x}</b>.`}}
    if(t===2){const x=ri(1,4);return{q:`Natronlauge (NaOH) mit c = ${fmt(10**-x)} mol/l. Welchen pH-Wert hat sie?`,kind:"num",ans:R(14-x),sol:`c(OH⁻) = 10<sup>${MINUS}${x}</sup> → pOH = ${x}. Es gilt pH + pOH = 14, also pH = 14 ${MINUS} ${x} = <b>${14-x}</b>.`}}
    const p=ri(1,5),k=ri(1,3);return{q:`Eine Säure mit pH ${p} wird mit Wasser auf das ${fmt(10**k)}-fache Volumen verdünnt. Welchen pH-Wert hat sie danach (starke Säure)?`,kind:"num",ans:R(Math.min(7,p+k)),sol:`Zehnmal verdünnen erhöht den pH um 1. ${fmt(10**k)}-fach = ${k}-mal zehnfach: ${p} + ${k} = <b>${Math.min(7,p+k)}</b>.${p+k>7?" Durch Verdünnen wird eine Säure aber nie basisch, sie nähert sich nur pH 7.":""}`}},
  c_titration(){const Vs=pick([10,20,25,50]),cs=pick([.1,.2,.5]),Vb=pick([10,12.5,20,25,40]),cb=cs*Vs/Vb;if(Math.abs(cb*1000-Math.round(cb*1000))>1e-6)return G.c_titration();
    return{q:`${Vs} ml Salzsäure (c = ${fmt(cs)} mol/l) werden mit Natronlauge neutralisiert. Bis zum Farbumschlag braucht man ${fmt(Vb)} ml Lauge. Welche Konzentration hat die Natronlauge?${unit("mol/l")}`,kind:"num",ans:R(Math.round(cb*1000),1000),tol:.006,
      sol:`Am Neutralpunkt gilt n(HCl) = n(NaOH), also c₁ · V₁ = c₂ · V₂. c(NaOH) = ${fmt(cs)} · ${Vs} : ${fmt(Vb)} = <b>${fmt(cb)} mol/l</b>.`}},
  c_oxzahl(){const [f,el,v,how]=pick([["SO2","S",4,"O zählt −2, zwei O: −4. Gesamt 0, also S = +4"],["H2SO4","S",6,"H +1 (zweimal: +2), O −2 (viermal: −8). +2 + S − 8 = 0 → S = +6"],["CO2","C",4,"zwei O: −4, also C = +4"],["CH4","C",-4,"vier H: +4, also C = −4"],["NH3","N",-3,"drei H: +3, also N = −3"],["HNO3","N",5,"H +1, drei O −6: +1 + N − 6 = 0 → N = +5"],["Fe2O3","Fe",3,"drei O: −6, auf zwei Fe verteilt: je +3"],["FeO","Fe",2,"ein O: −2, also Fe = +2"],["HCl","Cl",-1,"H +1, also Cl = −1"],["Cl2","Cl",0,"Elemente haben immer die Oxidationszahl 0"],["MnO4^-","Mn",7,"vier O: −8, Gesamtladung −1: Mn − 8 = −1 → Mn = +7"],["H2O2","O",-1,"zwei H: +2, auf zwei O verteilt: je −1 (Ausnahme Peroxid)"],["CuO","Cu",2,"ein O: −2, also Cu = +2"],["Na","Na",0,"reines Element: 0"]]);
    return{q:`Welche <b>Oxidationszahl</b> hat ${el} in ${ch(f)}?<p class="muted small">Als Zahl mit Vorzeichen, z. B. +4 oder ${MINUS}2.</p>`,kind:"num",ans:R(v),sol:`Regeln: Element = 0, H meist +1, O meist ${MINUS}2, Summe = Ladung des Teilchens. Hier: ${how.replace(/-/g,MINUS)}. Ergebnis: <b>${v>0?"+":""}${fmt(v)}</b>.`}},
  c_alkan(){const n=ri(1,10),nm=ALK[n-1],t=ri(0,3);
    if(t===0)return{q:`Wie viele <b>Wasserstoff-Atome</b> hat ein ${nm}-Molekül?`,kind:"num",ans:R(2*n+2),sol:`${nm} hat ${n} C-Atom${n>1?"e":""}. Alkane: C<sub>n</sub>H<sub>2n+2</sub> → 2 · ${n} + 2 = <b>${2*n+2}</b>. Formel: ${ch(`C${n>1?n:""}H${2*n+2}`)}.`};
    if(t===1){const o=shuffle([nm,...shuffle(ALK.filter(x=>x!==nm)).slice(0,3)]);return{q:`Wie heißt das Alkan ${ch(`C${n>1?n:""}H${2*n+2}`)}?`,kind:"choice",opts:o,correct:o.indexOf(nm),sol:`${n} C-Atome: <b>${nm}</b>. Merkspruch für 1 bis 4: <b>M</b>ama <b>E</b>sst <b>P</b>udding <b>B</b>ei Oma (Meth-, Eth-, Prop-, But-). Ab 5 griechische Zahlwörter: Pent-, Hex-, Hept-, Oct-, Non-, Dec-.`}}
    if(t===2){const a=ALK[n-1].replace(/an$/,"anol");return{q:`Wie viele <b>Kohlenstoff-Atome</b> hat ${a}?`,kind:"num",ans:R(n),sol:`Der Wortstamm verrät die Kettenlänge: ${a.replace(/anol$/,"")}- = ${n}. Die Endung <b>-ol</b> steht für die Hydroxygruppe (−OH): ein Alkohol.`}}
    const a=ALK[n-1].replace(/an$/,"ansäure");return{q:`Wie viele <b>Kohlenstoff-Atome</b> hat ${a}${n===1?" (Ameisensäure)":n===2?" (Essigsäure)":""}?`,kind:"num",ans:R(n),sol:`${a.replace(/ansäure$/,"")}- = ${n} C-Atome, das C der Carboxygruppe (−COOH) zählt mit.`}},
  c_mwg(){const A=pick([.1,.2,.5,1]),B=pick([.1,.2,.5,1]),C=pick([.2,.4,.5,1,2]),D=pick([.2,.4,.5,1]),K=C*D/(A*B);
    return{q:`Für A + B ⇌ C + D misst man im Gleichgewicht: c(A) = ${fmt(A)}, c(B) = ${fmt(B)}, c(C) = ${fmt(C)}, c(D) = ${fmt(D)} (alles mol/l). Wie groß ist K?`,kind:"num",ans:R(Math.round(K*1000),1000),tol:Math.max(.006,K*.002),
      sol:`Massenwirkungsgesetz: K = (c(C) · c(D)) : (c(A) · c(B)) = (${fmt(C)} · ${fmt(D)}) : (${fmt(A)} · ${fmt(B)}) = <b>${fmt(Math.round(K*1000)/1000)}</b>. ${K>1?"K > 1: Im Gleichgewicht überwiegen die Produkte.":K<1?"K < 1: Die Ausgangsstoffe überwiegen.":"K = 1: ausgeglichen."}`}},
  c_rgt(){const d=pick([10,20,30,40]);return{q:`Faustregel (RGT-Regel): 10 °C mehr verdoppeln die Reaktionsgeschwindigkeit. Wie viel schneller läuft eine Reaktion, wenn man um ${d} °C erwärmt?${unit("fach")}`,kind:"num",ans:R(2**(d/10)),sol:`${d/10}-mal verdoppeln: 2<sup>${d/10}</sup> = <b>${2**(d/10)}</b>-fach. Darum hält der Kühlschrank Lebensmittel länger frisch.`}},
  c_puffer(){const pk=pick([[4.76,"Essigsäure/Acetat"],[6.35,"Kohlensäure/<wbr>Hydrogen&shy;carbonat"],[7.2,"Dihydrogen&shy;phosphat/<wbr>Hydrogen&shy;phosphat"],[9.25,"Ammonium/Ammoniak"]]),r=pick([[1,1],[10,1],[1,10]]),ph=pk[0]+Math.log10(r[0]/r[1]);
    return{q:`Ein Puffer aus ${pk[1]} (pKs = ${fmt(pk[0])}) enthält Säure und Base im Verhältnis c(HA) : c(A⁻) = ${r[1]} : ${r[0]}. Welchen pH-Wert hat er?`,kind:"num",ans:R(Math.round(ph*100),100),tol:.006,
      sol:`Henderson-Hasselbalch: pH = pKs + lg(c(A⁻) : c(HA)) = ${fmt(pk[0])} + lg(${r[0]} : ${r[1]}) = ${fmt(pk[0])} ${r[0]>r[1]?"+ 1":r[0]<r[1]?MINUS+" 1":"+ 0"} = <b>${fmt(Math.round(ph*100)/100)}</b>. Bei gleichen Mengen ist pH = pKs.`}},
  c_spannung(){const M=Object.keys(POT),[a,b]=shuffle(M).slice(0,2),E=Math.abs(POT[a][0]-POT[b][0]),an=POT[a][0]<POT[b][0]?a:b,ka=an===a?b:a;
    return{q:`Ein galvanisches Element aus einer ${POT[a][1]}- und einer ${POT[b][1]}-Halbzelle (Standardbedingungen). Welche Spannung liefert es?<p class="muted small">E°: ${a} = ${fmt(POT[a][0])} V, ${b} = ${fmt(POT[b][0])} V</p>${unit("V")}`,kind:"num",ans:R(Math.round(E*100),100),tol:.006,
      sol:`U = E°(Kathode) ${MINUS} E°(Anode). Das unedlere Metall (${POT[an][1]}, kleineres E°) ist die Anode und wird oxidiert. U = ${fmt(POT[ka][0])} ${MINUS} ${P(POT[an][0])} = <b>${fmt(Math.round(E*100)/100)} V</b>.`}},
});

/* Teilchenmodell: Wasser bei verschiedenen Temperaturen */
WIDGETS.teilchen=function(el){const w=wid("tm");
  el.innerHTML=`<div class="wg"><div class="wg-vis"><canvas id="${w}-c" width="300" height="200" style="width:100%;max-width:300px;border-radius:8px;border:1px solid var(--line);background:var(--surface)" role="img" aria-label="Wasserteilchen im Teilchenmodell"></canvas></div><div class="wg-ctl">${slider(w,"Temperatur",-40,140,20,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const cv=el.querySelector("#"+w+"-c"),cx=cv.getContext("2d"),Sl=el.querySelector("#"+w),N=36,P=[];
  for(let i=0;i<N;i++){const gx=i%6,gy=Math.floor(i/6);P.push({hx:90+gx*24,hy:62+gy*22,x:90+gx*24,y:62+gy*22,vx:Math.random()-.5,vy:Math.random()-.5})}
  const txt=()=>{const T=+Sl.value;el.querySelector("#"+w+"-v").textContent=T+" °C";
    el.querySelector("#"+w+"-t").innerHTML=T<0?"<b>Fest (Eis):</b> Die Teilchen sitzen auf festen Plätzen und zittern nur. Sie halten sich gegenseitig fest.":T<100?"<b>Flüssig:</b> Die Teilchen sind noch dicht beieinander, können aber aneinander vorbeigleiten. Darum fließt Wasser.":"<b>Gasförmig (Wasserdampf):</b> Die Teilchen fliegen schnell und weit voneinander entfernt durch den ganzen Raum."};
  txt();Sl.oninput=txt;
  const still=reduceMotion();let last=0;
  const frame=t=>{if(!cv.isConnected)return;const T=+Sl.value,state=T<0?0:T<100?1:2,sp=.4+Math.max(0,T+40)/45;
    const ac=cvar("--accent"),ink=cvar("--ink");cx.clearRect(0,0,300,200);
    P.forEach(p=>{if(state===0){p.x+=(p.hx-p.x)*.2+(Math.random()-.5)*sp*.6;p.y+=(p.hy-p.y)*.2+(Math.random()-.5)*sp*.6}
      else{p.vx+=(Math.random()-.5)*.3*sp;p.vy+=(Math.random()-.5)*.3*sp+(state===1?.12:0);const lim=state===1?1.2*sp:2.2*sp,m=Math.hypot(p.vx,p.vy);if(m>lim){p.vx*=lim/m;p.vy*=lim/m}
        p.x+=p.vx;p.y+=p.vy;const top=state===1?110:8;if(p.x<8||p.x>292){p.vx*=-1;p.x=Math.max(8,Math.min(292,p.x))}if(p.y<top){p.vy=Math.abs(p.vy);p.y=top}if(p.y>192){p.vy=-Math.abs(p.vy);p.y=192}}
      if(state===1){for(const q of P){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<15&&d>0){p.x-=dx/d*.6;p.y-=dy/d*.6}}}
      cx.beginPath();cx.arc(p.x,p.y,7,0,7);cx.fillStyle=ac;cx.fill();cx.strokeStyle=ink;cx.lineWidth=1;cx.stroke()});
    
    if(!still)requestAnimationFrame(frame)};
  requestAnimationFrame(frame);if(still)Sl.addEventListener("input",()=>{for(let i=0;i<60;i++)frame(0)})};

    el.querySelector("#"+w+"-t").innerHTML=`<b style="font-size:1.15rem">${e.name} (${e.sym})</b><br>Ordnungszahl ${e.z}: <b>${e.z} Protonen</b>, ${e.z} Elektronen, ${e.A-e.z} Neutronen (Massenzahl ${e.A})<br>Schalen: ${sh.join(" · ")} → <b>${sh[sh.length-1]} Außenelektron${sh[sh.length-1]>1?"en":""}</b> (gelb)<br>${e.p}. Periode, ${e.g}. Hauptgruppe: ${GRP[e.g]}<br>${e.metal?"Metall":e.g===8?"Edelgas":"Nichtmetall"}${e.en?`, Elektronegativität ${fmt(e.en)}`:""}`};

  const draw=()=>{const m=EL[M],x=EL[X],cm=m.g,cx=8-x.g,L=lcm(cm,cx),a=L/cm,b=L/cx;

    for(let i=0;i<b;i++){s+=atom(40+k*70,50,X,step?8:x.g,"var(--accent)",step?(cx>1?cx:"")+MINUS:"");if(step)for(let j=0;j<cx;j++){const an=(x.g+j)/8*2*Math.PI-Math.PI/2;s+=`<circle cx="${40+k*70+26*Math.cos(an)}" cy="${50+26*Math.sin(an)}" r="4.5" fill="var(--signal)" stroke="var(--ink)" stroke-width=".7"/>`}k++}

      :`${m.name} hat ${cm} Außenelektron${cm>1?"en":""} (gelb), ${x.name} hat ${x.g} (grün) und braucht noch ${cx} bis 8. Damit es aufgeht, braucht man ${a}× ${M} und ${b}× ${X}.`;

WIDGETS.ausgleichen=function(el){const w=wid("au");let ri_=0,k=[];

  const draw=()=>{const [L,Rr]=REAKTIONEN[ri_],all=[...L,...Rr],nL=L.length;
    const part=(x,i)=>`<span class="aus-t"><span class="stp"><button type="button" data-i="${i}" data-d="1" aria-label="mehr">+</button><b>${k[i]}</b><button type="button" data-i="${i}" data-d="-1" aria-label="weniger">${MINUS}</button></span>${ch(x[1])}</span>`;
    el.querySelector("#"+w+"-e").innerHTML=all.slice(0,nL).map((x,i)=>part(x,i)).join(" + ")+" → "+all.slice(nL).map((x,i)=>part(x,i+nL)).join(" + ");
    const sa=(from,to)=>{const o={};for(let i=from;i<to;i++){const a=atomsOf(all[i][1]);for(const e in a)o[e]=(o[e]||0)+a[e]*k[i]}return o};
    const l=sa(0,nL),r=sa(nL,all.length),els=[...new Set([...Object.keys(l),...Object.keys(r)])];
    const ok=els.every(e=>l[e]===r[e]);
    el.querySelector("#"+w+"-tb").innerHTML=`<table class="tbl"><tr><th>Atom</th>${els.map(e=>`<th>${e}</th>`).join("")}</tr><tr><td>links</td>${els.map(e=>`<td>${l[e]||0}</td>`).join("")}</tr><tr><td>rechts</td>${els.map(e=>`<td style="color:${l[e]===r[e]?"var(--ok)":"var(--err)"};font-weight:700">${r[e]||0}</td>`).join("")}</tr></table>`;
    const g=k.reduce((a,b)=>gcd(a,b));
    el.querySelector("#"+w+"-t").innerHTML=ok?(g>1?`Ausgeglichen, aber alle Zahlen lassen sich noch durch ${g} teilen. Nimm die kleinsten Zahlen.`:`<b style="color:var(--ok)">Ausgeglichen!</b> Von jeder Atomsorte stehen links und rechts gleich viele.`):`Ändere die großen Zahlen vor den Formeln, bis in der Tabelle unten überall Grün steht. Tipp: Fang mit dem Atom an, das in den wenigsten Stoffen vorkommt, Sauerstoff oder Wasserstoff zuletzt.`;

  el.querySelector("#"+w+"-n").onclick=()=>{ri_=(ri_+1)%REAKTIONEN.length;set()};
  el.querySelector("#"+w+"-l").onclick=()=>{const [L,Rr]=REAKTIONEN[ri_];k=[...L,...Rr].map(x=>x[0]);draw()};set()};

WIDGETS.phskala=function(el){const w=wid("ph");
  const ITEMS=[[1,"Magensaft"],[2.5,"Zitronensaft"],[3,"Cola"],[4.5,"Tomate"],[5.5,"Haut"],[7,"reines Wasser"],[7.4,"Blut"],[8.3,"Meerwasser"],[9,"Seife"],[11.5,"Ammoniak-Reiniger"],[13,"Abflussreiniger"]];

    s+=`<path d="M${X(p)},30 l-7,-10 h14 z" fill="var(--ink)"/><rect x="${X(p)-2}" y="30" width="4" height="34" fill="var(--ink)"/>`;

/* Chemisches Gleichgewicht: A ⇌ B */
WIDGETS.gleichgewicht=function(el){const w=wid("gg");let A=100,B=0,hist=[];
  el.innerHTML=`<div class="wg"><div class="wg-vis wide" id="${w}-o"></div><div class="wg-ctl">${slider(w,"Temperatur (verschiebt K)",1,5,3,1)}</div><div class="row"><button class="btn small" type="button" data-a="addA">A zugeben</button><button class="btn small" type="button" data-a="remB">B entfernen</button><button class="btn ghost small" type="button" data-a="reset">Neu starten</button></div><p class="wg-out" id="${w}-t"></p></div>`;
  const Sl=el.querySelector("#"+w),K=()=>[.25,.5,1,2,4][+Sl.value-1];
  const run=n=>{for(let i=0;i<n;i++){const kh=.04,kr=kh/K(),d=kh*A-kr*B;A-=d;B+=d;hist.push([A,B]);if(hist.length>160)hist.shift()}};
  const draw=()=>{const pl=plot({xmin:0,xmax:160,ymin:0,ymax:Math.max(110,...hist.map(h=>h[0]+h[1]))*1.02,w:300,h:170,step:20,labels:false});
    const pA=hist.map((h,i)=>`${i?"L":"M"}${pl.X(i).toFixed(1)},${pl.Y(h[0]).toFixed(1)}`).join(""),pB=hist.map((h,i)=>`${i?"L":"M"}${pl.X(i).toFixed(1)},${pl.Y(h[1]).toFixed(1)}`).join("");
    el.querySelector("#"+w+"-o").innerHTML=pl.wrap(`<path d="${pA}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="${pB}" fill="none" stroke="var(--s-chemie)" stroke-width="2.5"/>`);
    el.querySelector("#"+w+"-v").textContent=`K = ${fmt(K())}`;
    el.querySelector("#"+w+"-t").innerHTML=`<span style="color:var(--accent);font-weight:700">A: ${fmt(Math.round(A))}</span> &nbsp; <span style="color:var(--s-chemie);font-weight:700">B: ${fmt(Math.round(B))}</span> &nbsp; B : A = ${fmt(Math.round(B/Math.max(A,.01)*100)/100)}<br>Die Hinreaktion (A → B) und die Rückreaktion (B → A) laufen ständig. Im <b>Gleichgewicht</b> sind beide gleich schnell, die Mengen ändern sich nicht mehr. Wird A zugegeben oder B entfernt, weicht das System aus und bildet neues B (<b>Prinzip von Le Chatelier</b>).`};
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==="addA")A+=50;if(a==="remB")B*=.4;if(a==="reset"){A=100;B=0;hist=[]}run(a==="reset"?1:0);draw()});
  Sl.oninput=draw;run(1);draw();
  const still=reduceMotion();const tick=()=>{if(!el.isConnected)return;run(still?40:1);draw();if(!still)setTimeout(tick,60)};if(still){run(150);draw()}else setTimeout(tick,60)};

  const cv=el.querySelector("#"+w+"-c"),cx=cv.getContext("2d"),Tt=el.querySelector("#"+w+"t"),Nn=el.querySelector("#"+w+"n"),Kk=el.querySelector("#"+w+"k");let P=[],hits=[],products=0,t0=performance.now();

    P.forEach(p=>{p.x+=Math.cos(p.a)*sp;p.y+=Math.sin(p.a)*sp;if(p.x<8||p.x>292)p.a=Math.PI-p.a;if(p.y<8||p.y>172)p.a=-p.a;p.x=Math.max(8,Math.min(292,p.x));p.y=Math.max(8,Math.min(172,p.y))});
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const p=P[i],q=P[j];if(p.done||q.done||p.t===q.t)continue;if(Math.hypot(p.x-q.x,p.y-q.y)<14){const e=Math.random()*T/3;
      if(e>Ea){p.done=q.done=true;products++;hits.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2,ok:1,life:20})}else{hits.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2,ok:0,life:10});const tmp=p.a;p.a=q.a;q.a=tmp}}}

    const sec=Math.max(1,(performance.now()-t0)/1000);

 BT("c-stoffe","Stoffe und ihre Eigenschaften","Woran man Stoffe erkennt",[
  ["Alles ist aus Stoffen",`<p>Chemie ist die Lehre von den <b>Stoffen</b> und wie sie sich verwandeln. Ein Stoff ist das Material, aus dem etwas besteht: Ein Löffel ist ein Gegenstand, <b>Edelstahl</b> ist sein Stoff. Ein Plastiklöffel hat dieselbe Form, aber einen anderen Stoff.</p><p>Stoffe erkennt man an ihren <b>Eigenschaften</b>, wie ein Detektiv an Spuren:</p><ul class="rules"><li>Farbe, Geruch, Glanz (nur riechen durch Zufächeln!)</li><li>Härte, Verformbarkeit</li><li>Löslichkeit in Wasser</li><li>elektrische Leitfähigkeit, Wärmeleitfähigkeit</li><li>Dichte (schwimmt oder sinkt)</li><li><b>Schmelz- und Siedetemperatur</b>: der Fingerabdruck eines Stoffes</li></ul>`],
  ["Die drei Aggregatzustände",`<p>Jeder Stoff kann <b>fest</b>, <b>flüssig</b> oder <b>gasförmig</b> sein. Das hängt von der Temperatur ab. Im <b>Teilchenmodell</b> stellt man sich vor: Alles besteht aus winzigen Teilchen, die sich bewegen. Je wärmer, desto schneller.</p>`,"teilchen"],
  ["Übergänge haben Namen",`<table class="tbl"><tr><th>von → nach</th><th>Name</th></tr><tr><td>fest → flüssig</td><td>schmelzen</td></tr><tr><td>flüssig → fest</td><td>erstarren</td></tr><tr><td>flüssig → gasförmig</td><td>verdampfen (sieden)</td></tr><tr><td>gasförmig → flüssig</td><td>kondensieren</td></tr><tr><td>fest → gasförmig</td><td>sublimieren</td></tr><tr><td>gasförmig → fest</td><td>resublimieren</td></tr></table><p class="tip">Beim Schmelzen und Sieden ändert sich nur die Anordnung der Teilchen, <b>nicht der Stoff</b>. Eis, Wasser und Dampf sind alles Wasser. Das ist noch keine chemische Reaktion.</p>`]],
  [["Was ist ein Stoff?","Der Stoff ist das Material, nicht der Gegenstand. Ein Glas und eine Flasche können aus demselben Stoff sein.","Das Material, aus dem ein Gegenstand besteht","Ein Gegenstand mit bestimmter Form","Alles, was flüssig ist"],
   ["Welche Eigenschaft ist am besten geeignet, einen Stoff eindeutig zu bestimmen?","Farbe oder Form haben viele Stoffe gemeinsam. Schmelz- und Siedetemperatur sind für jeden Reinstoff typisch.","Schmelz- und Siedetemperatur","Die Farbe","Die Form","Das Gewicht"],
   ["Wie nennt man den Übergang von gasförmig zu flüssig?","Wasserdampf kondensiert zum Beispiel an einem kalten Badezimmerspiegel.","Kondensieren","Verdampfen","Erstarren","Sublimieren"],
   ["Was passiert im Teilchenmodell beim Erwärmen?","Wärme ist Bewegungsenergie der Teilchen. Die Teilchen selbst werden nicht größer.","Die Teilchen bewegen sich schneller","Die Teilchen werden größer","Es entstehen neue Teilchen","Die Teilchen werden schwerer"],
   ["Wie riecht man in der Chemie sicher an einem Stoff?","Nie direkt die Nase drüber halten. Mit der Hand die Luft zufächeln.","Mit der Hand vorsichtig Luft zufächeln","Tief einatmen direkt über dem Glas","Gar nicht, Chemiker riechen nie","Mit der Zunge prüfen"],
   ["Warum leiten Metalle elektrischen Strom?","In Metallen gibt es frei bewegliche Elektronen. Sie wandern durch den Draht.","Sie haben frei bewegliche Elektronen","Sie sind schwer","Sie glänzen","Sie sind kalt"],
   ["Trockeneis (festes CO₂) wird direkt zu Gas, ohne flüssig zu werden. Wie heißt das?","Direkt von fest nach gasförmig heißt sublimieren. Auch Schnee kann in trockener, kalter Luft sublimieren.","Sublimieren","Schmelzen","Kondensieren","Verdunsten"]],["c_zustand"]),

 BT("c-gemische","Reinstoffe und Gemische","Lösung, Suspension, Emulsion, Legierung",[
  ["Rein oder gemischt?",`<p>Ein <b>Reinstoff</b> besteht nur aus einer Sorte Teilchen: destilliertes Wasser, reines Gold, Zucker. Er hat feste Eigenschaften, etwa eine genaue Siedetemperatur.</p><p>Ein <b>Gemisch</b> besteht aus mehreren Stoffen, die nur vermischt, aber nicht verbunden sind. Fast alles im Alltag ist ein Gemisch: Luft, Leitungswasser, Milch, Beton.</p><p>Man unterscheidet:</p><ul class="rules"><li><b>homogen</b> (einheitlich): Man sieht die Bestandteile auch mit Lupe nicht. Beispiel: Salzwasser.</li><li><b>heterogen</b> (uneinheitlich): Man sieht die Bestandteile. Beispiel: Müsli, Orangensaft mit Fruchtfleisch.</li></ul>`],
  ["Die Gemischarten",`<table class="tbl"><tr><th>Name</th><th>Was mit was?</th><th>Beispiel</th></tr><tr><td>Lösung</td><td>fest oder gasförmig in flüssig, unsichtbar</td><td>Salzwasser, Sprudel</td></tr><tr><td>Suspension</td><td>fest in flüssig, sichtbar</td><td>Schlammwasser, O-Saft</td></tr><tr><td>Emulsion</td><td>flüssig in flüssig</td><td>Milch, Mayonnaise</td></tr><tr><td>Legierung</td><td>Metall in Metall</td><td>Messing, Bronze, Stahl</td></tr><tr><td>Gemenge</td><td>fest in fest</td><td>Sand, Müsli</td></tr><tr><td>Rauch</td><td>fest in gasförmig</td><td>Ruß in Luft</td></tr><tr><td>Nebel</td><td>flüssig in gasförmig</td><td>Wolken, Deospray</td></tr><tr><td>Schaum</td><td>gasförmig in flüssig</td><td>Seifenschaum, Sahne</td></tr></table>`],
  ["Konzentration",`<p>Wie viel gelöst ist, gibt man oft als <b>Massenanteil</b> an: Masse des gelösten Stoffes durch Masse der ganzen Lösung.</p><p class="eq">10 g Salz + 90 g Wasser = 100 g Lösung → 10 %</p><p class="warn">Durch die ganze Lösung teilen, nicht nur durch das Wasser!</p>`]],
  [["Ist Leitungswasser ein Reinstoff?","Leitungswasser enthält gelöste Mineralstoffe (Kalk, Salze). Es ist eine homogene Lösung. Nur destilliertes Wasser ist ein Reinstoff.","Nein, ein Gemisch (Lösung)","Ja, ein Reinstoff","Nein, eine Suspension"],
   ["Milch ist eine …","Milch enthält feine Fetttröpfchen in Wasser: flüssig in flüssig.","Emulsion","Lösung","Legierung","Suspension"],
   ["Wie nennt man ein Gemisch aus zwei Metallen?","Messing ist Kupfer + Zink, Bronze ist Kupfer + Zinn.","Legierung","Emulsion","Gemenge","Lösung"],
   ["Sand in Wasser umgerührt ist eine …","Die Sandkörner sind sichtbar und setzen sich ab: fest in flüssig, heterogen.","Suspension","Lösung","Emulsion","Schaum"],
   ["Was bedeutet homogen?","Homogen heißt einheitlich: Man kann die Bestandteile auch mit dem Mikroskop nicht unterscheiden.","Man sieht die Bestandteile nicht","Man sieht die Bestandteile","Der Stoff ist rein","Der Stoff ist flüssig"],
   ["Mayonnaise ist eine Emulsion aus …","Öl und Eigelb-Wasser werden zu feinen Tröpfchen verrührt. Das Lecithin im Eigelb hält sie zusammen (Emulgator).","Öl und Wasser (Eigelb)","Salz und Wasser","Luft und Wasser","Zucker und Öl"],
   ["Woran erkennt man einen Reinstoff im Labor?","Ein Reinstoff hat eine genaue Siedetemperatur. Gemische sieden über einen Temperaturbereich.","An einer genauen Siede- und Schmelztemperatur","An der Farbe","Daran, dass er flüssig ist","Daran, dass er nicht riecht"]],["c_massenanteil"]),

 BT("c-trennen","Trennverfahren","Filtrieren, Destillieren, Chromatografie",[
  ["Jedes Gemisch hat seinen Trick",`<p>Gemische trennt man, indem man einen <b>Unterschied</b> zwischen den Stoffen ausnutzt:</p><table class="tbl"><tr><th>Verfahren</th><th>Ausgenutzt wird …</th><th>Beispiel</th></tr><tr><td>Sieben</td><td>Korngröße</td><td>Kies und Sand</td></tr><tr><td>Sedimentieren, Dekantieren</td><td>Dichte (absetzen, abgießen)</td><td>Schlammwasser stehen lassen</td></tr><tr><td>Filtrieren</td><td>Teilchengröße</td><td>Kaffeefilter</td></tr><tr><td>Eindampfen</td><td>Siedetemperatur</td><td>Salz aus Meerwasser</td></tr><tr><td>Destillieren</td><td>verschiedene Siedetemperaturen</td><td>Schnaps brennen, Erdöl</td></tr><tr><td>Magnettrennung</td><td>Magnetismus</td><td>Eisen aus Schrott</td></tr><tr><td>Extrahieren</td><td>Löslichkeit</td><td>Tee, Kaffee kochen</td></tr><tr><td>Chromatografie</td><td>unterschiedlich schnelles Wandern</td><td>Filzstift-Farben</td></tr></table>`],
  ["Destillation genauer",`<p>Ein Gemisch aus Wasser (siedet bei 100 °C) und Alkohol (78 °C) wird erhitzt. Bei etwa 78 °C verdampft vor allem der Alkohol. Der Dampf wird im <b>Kühler</b> wieder flüssig und tropft in ein anderes Gefäß. So reichert man den Stoff mit der niedrigeren Siedetemperatur an.</p><p class="tip">Kläranlagen kombinieren viele Verfahren: Rechen (sieben), Sandfang (sedimentieren), Belebungsbecken (Bakterien), Nachklärbecken.</p>`]],
  [["Wie trennt man Salz aus Salzwasser?","Das Wasser verdampft, das Salz bleibt zurück. Filtern geht nicht, das gelöste Salz passt durch jeden Filter.","Eindampfen","Filtrieren","Sieben","Magnettrennung"],
   ["Welchen Unterschied nutzt die Destillation?","Der Stoff mit der niedrigeren Siedetemperatur verdampft zuerst.","Unterschiedliche Siedetemperaturen","Unterschiedliche Farben","Unterschiedliche Magnetkraft","Unterschiedliche Korngröße"],
   ["Kaffee kochen ist eine …","Heißes Wasser löst Geschmacksstoffe aus dem Kaffeepulver: Extraktion. Der Filter trennt danach das Pulver ab: Filtration.","Extraktion (und Filtration)","Destillation","Chromatografie","Sublimation"],
   ["Mit welchem Verfahren findet man heraus, aus welchen Farbstoffen eine schwarze Filzstiftfarbe besteht?","Auf Filterpapier mit Wasser wandern die Farbstoffe verschieden schnell: Chromatografie.","Chromatografie","Filtrieren","Eindampfen","Sieben"],
   ["Warum kann ein Filter Sand aus Wasser holen, aber kein gelöstes Salz?","Gelöste Teilchen sind so winzig, dass sie durch die Poren des Filters passen.","Gelöste Teilchen sind viel kleiner als die Poren","Salz ist schwerer als Sand","Salz ist flüssig","Der Filter ist magnetisch"],
   ["Was passiert beim Sedimentieren?","Schwerere Teilchen sinken durch die Schwerkraft nach unten und setzen sich ab.","Feste Teilchen setzen sich unten ab","Die Flüssigkeit verdampft","Der Stoff wird magnetisch","Die Farben trennen sich"]]),

 BT("c-reaktion","Die chemische Reaktion","Neue Stoffe und Energie",[
  ["Woran man eine Reaktion erkennt",`<p>Bei einer <b>chemischen Reaktion</b> entstehen <b>neue Stoffe</b> mit neuen Eigenschaften. Das ist der Unterschied zum Schmelzen oder Lösen, wo der Stoff derselbe bleibt.</p><p>Kennzeichen:</p><ul class="rules"><li><b>Stoffumwandlung:</b> neue Farbe, neuer Geruch, Gas entsteht, Feststoff fällt aus</li><li><b>Energieumwandlung:</b> Wärme oder Licht wird frei oder aufgenommen</li></ul><p>Beispiele: Eisen rostet, Holz verbrennt, Brot wird gebacken, Milch wird sauer, Brausepulver sprudelt.</p>`],
  ["Exotherm und endotherm",`<ul class="rules"><li><b>Exotherm:</b> Energie wird frei, es wird warm. Verbrennung, Wärmepads, Handwärmer.</li><li><b>Endotherm:</b> Energie wird aufgenommen, es wird kalt oder man muss ständig heizen. Kühlpack beim Sport, Brot backen, Fotosynthese.</li></ul><p>Fast jede Reaktion braucht am Anfang einen kleinen Schubs: die <b>Aktivierungsenergie</b>. Ein Streichholz muss man anreiben, Holz anzünden. Danach läuft eine exotherme Reaktion von selbst weiter.</p>`],
  ["Erhalt der Masse",`<p>Bei einer Reaktion geht keine Masse verloren und keine kommt dazu. Die Atome werden nur <b>neu sortiert</b>, wie Legosteine zu einem neuen Modell.</p><p class="eq">Wortgleichung: Kohlenstoff + Sauerstoff → Kohlenstoffdioxid</p><p>Links stehen die <b>Ausgangsstoffe</b> (Edukte), rechts die <b>Reaktionsprodukte</b>. Der Pfeil heißt „reagiert zu“.</p>`]],
  [["Welcher Vorgang ist eine chemische Reaktion?","Beim Rosten entsteht ein neuer Stoff (Eisenoxid). Schmelzen, Lösen und Zerkleinern ändern den Stoff nicht.","Eisen rostet","Eis schmilzt","Zucker löst sich in Tee","Holz wird zersägt"],
   ["Ein Kühlpack wird beim Knicken kalt. Die Reaktion ist …","Es wird Wärme aus der Umgebung aufgenommen: endotherm.","endotherm","exotherm","keine Reaktion","neutral"],
   ["Was ist die Aktivierungsenergie?","Der Anstoß, den eine Reaktion zum Starten braucht, zum Beispiel die Flamme beim Anzünden.","Die Energie, die eine Reaktion zum Starten braucht","Die Energie, die am Ende frei wird","Die Masse der Produkte","Die Temperatur von Eis"],
   ["Papier verbrennt. Die Asche wiegt weniger als das Papier. Ist Masse verloren gegangen?","Nein. Ein großer Teil ist als Gas entwichen (CO₂ und Wasserdampf). In einem geschlossenen Gefäß bleibt die Masse gleich.","Nein, sie ist als Gas entwichen","Ja, Masse wird verbrannt","Ja, Feuer vernichtet Atome","Nein, die Asche ist schwerer"],
   ["Wie heißen die Stoffe links vom Reaktionspfeil?","Edukte oder Ausgangsstoffe. Rechts stehen die Produkte.","Ausgangsstoffe (Edukte)","Produkte","Katalysatoren","Gemische"],
   ["Woran erkennt man beim Brausepulver, dass eine Reaktion läuft?","Es entsteht ein Gas (CO₂): Das Sprudeln zeigt einen neuen Stoff.","Es bildet sich ein Gas","Das Pulver wird nass","Das Glas wird voll","Es wird süß"]]),

 BT("c-verbrennung","Verbrennung und Sauerstoff","Oxidation, Luft, Brandschutz",[
  ["Was beim Brennen passiert",`<p>Verbrennen ist eine Reaktion mit <b>Sauerstoff</b>. Allgemein heißt eine Reaktion mit Sauerstoff <b>Oxidation</b>, das Produkt ist ein <b>Oxid</b>.</p><p class="eq">Magnesium + Sauerstoff → Magnesiumoxid<br>Kohlenstoff + Sauerstoff → Kohlenstoffdioxid</p><p>Auch Rosten ist eine (langsame) Oxidation. Und in deinen Zellen „verbrennst“ du Zucker mit Sauerstoff, ganz ohne Flamme: die Zellatmung.</p><p><b>Luft</b> besteht zu etwa 78 % aus Stickstoff, 21 % Sauerstoff, 1 % Argon und nur 0,04 % CO₂.</p>`],
  ["Das Verbrennungsdreieck",`<p>Feuer braucht drei Dinge gleichzeitig:</p><ol class="rules"><li><b>Brennstoff</b></li><li><b>Sauerstoff</b></li><li><b>Zündtemperatur</b> (Wärme)</li></ol><p>Löschen heißt, eins davon wegzunehmen:</p><ul class="rules"><li>Wasser <b>kühlt</b> unter die Zündtemperatur.</li><li>Löschdecke oder Deckel <b>ersticken</b> (kein Sauerstoff).</li><li>Brennbares entfernen, zum Beispiel eine Schneise im Wald.</li></ul><p class="warn">Brennendes Fett nie mit Wasser löschen! Das Wasser verdampft schlagartig und reißt brennendes Fett mit: eine Stichflamme. Deckel drauf.</p>`]],
  [["Was ist eine Oxidation?","Oxidation heißt im einfachen Sinn: Reaktion eines Stoffes mit Sauerstoff.","Eine Reaktion mit Sauerstoff","Das Schmelzen eines Metalls","Das Lösen in Wasser","Eine Reaktion mit Stickstoff"],
   ["Wie viel Sauerstoff ist in der Luft?","Rund ein Fünftel: 21 %. Den größten Teil macht Stickstoff mit 78 % aus.","Etwa 21 %","Etwa 78 %","Etwa 50 %","Etwa 1 %"],
   ["Warum löscht eine Decke ein Feuer?","Sie schneidet den Sauerstoff ab: Das Feuer erstickt.","Sie schneidet den Sauerstoff ab","Sie kühlt das Feuer","Sie ist nass","Sie verbrennt selbst"],
   ["Warum darf man Fettbrand nicht mit Wasser löschen?","Wasser sinkt ins heiße Fett, verdampft explosionsartig und schleudert brennendes Fett hoch.","Das Wasser verdampft schlagartig und es gibt eine Stichflamme","Wasser ist brennbar","Fett löst sich in Wasser","Es passiert nichts, es ist nur verboten"],
   ["Was entsteht, wenn Kohlenstoff vollständig verbrennt?","C + O₂ → CO₂: Kohlenstoffdioxid. Bei Sauerstoffmangel entsteht das giftige Kohlenstoffmonoxid (CO).","Kohlenstoffdioxid","Wasser","Stickstoff","Sauerstoff"],
   ["Welche drei Dinge braucht ein Feuer?","Brennstoff, Sauerstoff und ausreichende Temperatur. Fehlt eins, geht es aus.","Brennstoff, Sauerstoff, Zündtemperatur","Holz, Papier, Benzin","Wasser, Luft, Licht","Sauerstoff, Stickstoff, CO₂"],
   ["Rosten ist …","Eisen reagiert langsam mit Sauerstoff (und Wasser) zu Eisenoxid: eine langsame Oxidation.","eine langsame Oxidation","ein Schmelzvorgang","eine Lösung","keine chemische Reaktion"]]),

 BT("c-atom","Atombau","Kern, Hülle, Schalenmodell",[
  ["Was in einem Atom steckt",`<p>Alle Stoffe bestehen aus <b>Atomen</b>. Ein Atom ist unvorstellbar klein: Hundert Millionen nebeneinander ergeben etwa 1 cm.</p><ul class="rules"><li>Im <b>Kern</b> sitzen <b>Protonen</b> (positiv, +) und <b>Neutronen</b> (ohne Ladung).</li><li>Um den Kern schwirren <b>Elektronen</b> (negativ, ${MINUS}) in der <b>Hülle</b>.</li></ul><p>Ein Atom hat genauso viele Elektronen wie Protonen, darum ist es nach außen neutral.</p><p>Die Zahl der Protonen bestimmt, welches <b>Element</b> es ist. 6 Protonen: immer Kohlenstoff. 8 Protonen: immer Sauerstoff. Diese Zahl heißt <b>Ordnungszahl</b>.</p>`],
  ["Das Schalenmodell",`<p>Die Elektronen verteilen sich auf <b>Schalen</b>. In die erste passen 2, in die zweite 8, in die dritte (für den Anfang) auch 8.</p><p>Am wichtigsten sind die <b>Außenelektronen</b> (Valenzelektronen) auf der äußersten Schale: Sie bestimmen, wie ein Atom reagiert. Tippe ein Element an:</p>`,"pse",{start:"Na"}],
  ["Massenzahl und Isotope",`<p>Die <b>Massenzahl</b> zählt alle Teilchen im Kern: Protonen + Neutronen. Natrium hat die Massenzahl 23, also 11 Protonen und 12 Neutronen.</p><p>Atome eines Elements können verschieden viele Neutronen haben: <b>Isotope</b>. Kohlenstoff-12 und Kohlenstoff-14 sind beide Kohlenstoff. C-14 ist radioaktiv und wird für die Altersbestimmung genutzt.</p>`]],
  [["Welche Ladung hat ein Elektron?","Elektronen sind negativ, Protonen positiv, Neutronen neutral.","negativ","positiv","keine","mal so, mal so"],
   ["Was bestimmt, welches Element ein Atom ist?","Die Protonenzahl (Ordnungszahl). Ändert sie sich, ist es ein anderes Element.","Die Zahl der Protonen","Die Zahl der Neutronen","Die Größe","Die Farbe"],
   ["Wo befinden sich die Neutronen?","Protonen und Neutronen bilden zusammen den Atomkern.","Im Atomkern","In der Atomhülle","Auf der äußersten Schale","Zwischen den Atomen"],
   ["Wie viele Elektronen passen auf die erste Schale?","Die innerste Schale fasst nur 2 Elektronen.","2","8","18","1"],
   ["Was sind Isotope?","Gleiches Element (gleiche Protonenzahl), aber unterschiedlich viele Neutronen.","Atome eines Elements mit verschieden vielen Neutronen","Atome mit verschieden vielen Protonen","Geladene Atome","Moleküle aus zwei Atomen"],
   ["Warum ist ein Atom nach außen neutral?","Es hat genauso viele negative Elektronen wie positive Protonen.","Gleich viele Protonen und Elektronen","Weil Neutronen neutral sind","Weil der Kern neutral ist","Atome sind immer positiv"]],["c_atom"]),

 BT("c-pse","Das Periodensystem","Gruppen, Perioden, Metalle und Nichtmetalle",[
  ["Eine geniale Tabelle",`<p>Das <b>Periodensystem der Elemente</b> (PSE) ordnet alle Elemente nach ihrer Ordnungszahl. Es ist so gebaut, dass man aus dem Platz eines Elements seinen Aufbau ablesen kann:</p><ul class="rules"><li><b>Periode</b> (Zeile) = Anzahl der Elektronenschalen</li><li><b>Hauptgruppe</b> (Spalte I bis VIII) = Anzahl der Außenelektronen</li></ul><p>Elemente einer Gruppe haben gleich viele Außenelektronen und verhalten sich darum ähnlich, wie Geschwister.</p>`,"pse",{start:"Cl"}],
  ["Die wichtigsten Gruppen",`<table class="tbl"><tr><th>Gruppe</th><th>Name</th><th>Typisch</th></tr><tr><td>I</td><td>Alkalimetalle</td><td>weich, reagieren heftig mit Wasser (Na, K)</td></tr><tr><td>II</td><td>Erdalkalimetalle</td><td>Mg, Ca: in Knochen und Kalk</td></tr><tr><td>VII</td><td>Halogene</td><td>„Salzbildner“: F, Cl, Br. Giftig, sehr reaktiv</td></tr><tr><td>VIII</td><td>Edelgase</td><td>He, Ne, Ar: reagieren fast nie, weil ihre Schale voll ist</td></tr></table><p>Links und in der Mitte stehen <b>Metalle</b> (glänzen, leiten Strom), rechts oben die <b>Nichtmetalle</b>.</p><p class="tip">Die Edelgase sind das Vorbild aller anderen Atome: 8 Außenelektronen (<b>Oktettregel</b>). Andere Atome geben Elektronen ab, nehmen welche auf oder teilen sie, um auch auf 8 zu kommen.</p>`]],
  [["Was gibt die Periode (Zeile) an?","Die Periodennummer ist die Anzahl der besetzten Elektronenschalen.","Die Anzahl der Schalen","Die Anzahl der Außenelektronen","Die Masse","Die Anzahl der Neutronen"],
   ["Was haben Elemente einer Hauptgruppe gemeinsam?","Gleiche Zahl an Außenelektronen, darum ähnliche chemische Eigenschaften.","Gleich viele Außenelektronen","Gleich viele Schalen","Gleiche Masse","Gleiche Farbe"],
   ["Warum reagieren Edelgase kaum?","Ihre äußerste Schale ist voll besetzt (8, bei Helium 2). Sie haben keinen Grund, Elektronen abzugeben oder aufzunehmen.","Ihre Außenschale ist voll","Sie sind zu schwer","Sie sind flüssig","Sie haben keine Elektronen"],
   ["Zu welcher Gruppe gehört Chlor?","Chlor steht in der VII. Hauptgruppe: Halogene.","Halogene","Alkalimetalle","Edelgase","Erdalkalimetalle"],
   ["Natrium und Kalium reagieren beide heftig mit Wasser. Warum ähneln sie sich?","Beide stehen in der I. Hauptgruppe und haben ein Außenelektron, das sie leicht abgeben.","Beide haben 1 Außenelektron","Beide haben gleich viele Protonen","Beide sind Gase","Zufall"],
   ["Was besagt die Oktettregel?","Atome streben 8 Außenelektronen an, die Edelgaskonfiguration.","Atome streben 8 Außenelektronen an","Jedes Atom hat 8 Protonen","Es gibt 8 Hauptgruppen","Ein Molekül hat 8 Atome"]],["c_atom"]),

 BT("c-ionen","Ionen und Salze","Ionenbindung, Salzformeln",[
  ["Atome werden zu Ionen",`<p>Um auf 8 Außenelektronen zu kommen, <b>geben Metalle Elektronen ab</b> und <b>Nichtmetalle nehmen welche auf</b>. Dadurch werden sie elektrisch geladen: <b>Ionen</b>.</p><ul class="rules"><li>Natrium gibt 1 Elektron ab → ${ch("Na^+")} (positiv, Kation)</li><li>Chlor nimmt 1 Elektron auf → ${ch("Cl^-")} (negativ, Anion)</li></ul><p>Plus und Minus ziehen sich an. Diese Anziehung ist die <b>Ionenbindung</b>. Milliarden Ionen ordnen sich zu einem festen <b>Ionengitter</b>: einem Salzkristall.</p>`,"ionen"],
  ["Salzformeln aufstellen",`<p>Ein Salz ist nach außen immer neutral: Die Ladungen müssen sich aufheben.</p><ol class="rules"><li>Ladungen bestimmen: Hauptgruppe I → 1+, II → 2+, III → 3+. Nichtmetalle: 8 minus Gruppennummer, also VII → 1${MINUS}, VI → 2${MINUS}, V → 3${MINUS}.</li><li>So viele Ionen nehmen, dass Plus und Minus gleich groß sind.</li></ol><p class="eq">Mg²⁺ und Cl⁻ → MgCl₂ (2+ und 2 · 1${MINUS})<br>Al³⁺ und O²⁻ → Al₂O₃ (2 · 3+ = 6+ und 3 · 2${MINUS} = 6${MINUS})</p><p>Salze sind hart und spröde, haben hohe Schmelztemperaturen und leiten Strom, wenn sie geschmolzen oder gelöst sind (die Ionen können dann wandern).</p>`]],
  [["Wie wird ein Natrium-Atom zum Ion?","Natrium gibt sein einziges Außenelektron ab und wird Na⁺.","Es gibt ein Elektron ab","Es nimmt ein Elektron auf","Es gibt ein Proton ab","Es teilt ein Elektron"],
   ["Ein Ion mit mehr Elektronen als Protonen ist …","Mehr negative Elektronen als positive Protonen: insgesamt negativ, ein Anion.","negativ geladen (Anion)","positiv geladen (Kation)","neutral","ein Edelgas"],
   ["Was hält ein Salzkristall zusammen?","Die elektrische Anziehung zwischen positiven und negativen Ionen.","Anziehung zwischen Plus- und Minus-Ionen","Gemeinsame Elektronenpaare","Klebstoff","Die Schwerkraft"],
   ["Wann leitet Kochsalz elektrischen Strom?","Im festen Kristall sitzen die Ionen fest. Gelöst oder geschmolzen können sie wandern.","Gelöst in Wasser oder geschmolzen","Als fester Kristall","Nie","Nur wenn es nass und kalt ist"],
   ["Warum gehen Salzkristalle beim Hämmern kaputt statt sich zu verbiegen?","Verschiebt man das Gitter, stehen plötzlich gleiche Ladungen nebeneinander und stoßen sich ab.","Gleiche Ladungen geraten nebeneinander und stoßen sich ab","Salz ist zu weich","Salz ist ein Metall","Weil Wasser fehlt"]],["c_ion","c_salz"]),

 BT("c-gleichung","Reaktionsgleichungen","Formeln lesen, Gleichungen ausgleichen",[
  ["Formeln lesen",`<p>Eine Formel sagt, welche Atome in einem Teilchen stecken. Die <b>kleine Zahl unten</b> gilt für das Atom direkt davor:</p><ul class="rules"><li>${ch("H2O")}: 2 Wasserstoff-Atome, 1 Sauerstoff-Atom</li><li>${ch("CO2")}: 1 Kohlenstoff, 2 Sauerstoff</li><li>${ch("O2")}: Sauerstoff kommt als Paar vor. Auch H₂, N₂, Cl₂ sind Paare.</li></ul><p>Eine <b>große Zahl davor</b> zählt ganze Teilchen: <b>3 ${ch("H2O")}</b> sind drei Wassermoleküle, zusammen 6 H und 3 O.</p>`],
  ["Ausgleichen: links = rechts",`<p>Atome gehen nie verloren. Darum muss links und rechts vom Pfeil von jeder Sorte gleich viel stehen. Du darfst <b>nur die großen Zahlen davor</b> ändern, nie die kleinen in der Formel, sonst wäre es ein anderer Stoff.</p><p class="eq">H₂ + O₂ → H₂O &nbsp; (links 2 O, rechts 1 O: falsch)<br>H₂ + O₂ → <b>2</b> H₂O &nbsp; (jetzt 4 H rechts, nur 2 links)<br><b>2</b> H₂ + O₂ → <b>2</b> H₂O &nbsp; ✓</p><p>Probier es selbst. Ändere die Zahlen, bis die Tabelle grün wird:</p>`,"ausgleichen"]],
  [["Wie viele Atome sind in einem Molekül H₂SO₄?","2 H + 1 S + 4 O = 7 Atome.","7","3","6","8"],
   ["Was bedeutet die 3 in „3 H₂O“?","Die große Zahl zählt ganze Moleküle: drei Wassermoleküle.","Drei Wassermoleküle","Drei Wasserstoff-Atome","Drei Sauerstoff-Atome","Das Wasser ist 3 °C warm"],
   ["Beim Ausgleichen darf man …","Nur die Koeffizienten (großen Zahlen davor) ändern. Die Indizes legen den Stoff fest.","nur die großen Zahlen vor den Formeln ändern","die kleinen Zahlen in den Formeln ändern","Atome weglassen","neue Stoffe dazuschreiben"],
   ["Warum schreibt man Sauerstoff als O₂?","Sauerstoff kommt in der Luft nicht als einzelnes Atom, sondern als Molekül aus zwei Atomen vor.","Er kommt als Molekül aus zwei Atomen vor","Weil es zwei Sorten Sauerstoff gibt","Das ist nur eine Abkürzung","Wegen der Masse"],
   ["Wie viele Sauerstoff-Atome stehen in „2 CO₂“?","2 Moleküle mit je 2 O: 4.","4","2","3","1"]],["c_ausgl"]),
];

const CH910=[
 BT("c-ebind","Elektronenpaarbindung und Moleküle","Atome teilen Elektronen",[
  ["Teilen statt abgeben",`<p>Wenn zwei <b>Nichtmetalle</b> reagieren, kann keins dem anderen Elektronen wegnehmen. Sie <b>teilen</b> sich stattdessen Elektronen: Ein gemeinsames <b>Elektronenpaar</b> gehört beiden. So kommen beide auf 8 (Wasserstoff auf 2).</p><p>So entstehen <b>Moleküle</b>: H₂, O₂, H₂O, CO₂, CH₄. Diese Bindung heißt <b>Elektronenpaarbindung</b> (kovalente Bindung, Atombindung).</p><ul class="rules"><li>H hat 1 Außenelektron → 1 Bindung</li><li>O hat 6 → braucht 2 → 2 Bindungen</li><li>N hat 5 → 3 Bindungen</li><li>C hat 4 → 4 Bindungen</li></ul>`],
  ["Die Lewis-Schreibweise",`<p>In der <b>Valenzstrichformel</b> steht jeder Strich für ein Elektronenpaar. Striche zwischen Atomen sind Bindungen, Striche an einem Atom allein sind <b>freie Elektronenpaare</b>.</p><p class="eq">H–O–H (Wasser, O hat zusätzlich 2 freie Paare)<br>O=C=O (Kohlenstoffdioxid mit zwei Doppelbindungen)<br>N≡N (Stickstoff mit Dreifachbindung)</p><p class="tip">Kontrolle: Zähle um jedes Atom die Striche als je 2 Elektronen. Es müssen 8 sein (bei H: 2).</p>`]],
  [["Zwischen welchen Atomen entsteht eine Elektronenpaarbindung?","Nichtmetalle teilen Elektronen. Metall und Nichtmetall bilden dagegen Ionen.","Zwischen Nichtmetall-Atomen","Zwischen Metall und Nichtmetall","Nur zwischen Metallen","Zwischen Edelgasen"],
   ["Wie viele Bindungen bildet ein Kohlenstoff-Atom normalerweise?","C hat 4 Außenelektronen und braucht 4 weitere: 4 Bindungen.","4","2","1","8"],
   ["Wofür steht ein Strich in der Valenzstrichformel?","Für ein Elektronenpaar, also 2 Elektronen.","Für ein Elektronenpaar","Für ein Elektron","Für ein Proton","Für ein Atom"],
   ["Welche Bindung hat das N₂-Molekül?","Jedes N braucht 3 Elektronen dazu: Sie teilen 3 Paare, eine Dreifachbindung.","Dreifachbindung","Einfachbindung","Doppelbindung","Ionenbindung"],
   ["Warum bildet Sauerstoff zwei Bindungen?","O hat 6 Außenelektronen, ihm fehlen 2 bis zum Oktett.","Ihm fehlen 2 Elektronen bis zur 8","Er hat 2 Schalen","Er ist ein Gas","Er hat 2 Protonen"],
   ["Was ist ein Molekül?","Ein Teilchen aus mehreren Atomen, die durch Elektronenpaarbindungen zusammenhalten.","Atome, die durch gemeinsame Elektronenpaare verbunden sind","Ein geladenes Atom","Ein Salzkristall","Ein Gemisch"]],["c_atom"]),

 BT("c-polar","Polarität und Wasserstoffbrücken","Warum Wasser so besonders ist",[
  ["Ungleiches Teilen",`<p>Nicht jedes Atom zieht gleich stark an den gemeinsamen Elektronen. Das Maß dafür ist die <b>Elektronegativität</b> (EN). Fluor zieht am stärksten (4,0), Sauerstoff stark (3,4), Wasserstoff schwach (2,2).</p><p>Ist die Differenz groß, liegt das Elektronenpaar näher beim stärkeren Atom. Es bekommt eine negative <b>Teilladung</b> (δ${MINUS}), das andere eine positive (δ+): eine <b>polare</b> Bindung.</p>`,"en"],
  ["Wasser: ein Dipol",`<p>Das Wassermolekül ist <b>gewinkelt</b> (wie ein Bumerang). Der Sauerstoff ist leicht negativ, die beiden H leicht positiv. Das ganze Molekül hat also eine Minus- und eine Plus-Seite: ein <b>Dipol</b>.</p><p>Das δ+-H eines Moleküls wird vom δ${MINUS}-O eines Nachbarn angezogen: eine <b>Wasserstoffbrücke</b>. Sie ist schwächer als eine echte Bindung, aber es gibt Milliarden davon. Folgen:</p><ul class="rules"><li>Wasser siedet erst bei 100 °C, obwohl es so ein kleines Molekül ist.</li><li>Oberflächenspannung: Wasserläufer laufen übers Wasser.</li><li>Eis ist leichter als Wasser und schwimmt oben. Darum frieren Seen von oben zu, und die Fische überleben unten.</li></ul><p class="tip">Regel fürs Lösen: <b>Gleiches löst sich in Gleichem.</b> Polare Stoffe (Salz, Zucker) lösen sich in Wasser, unpolare (Fett, Öl) in unpolaren Stoffen (Benzin).</p>`]],
  [["Was gibt die Elektronegativität an?","Wie stark ein Atom in einer Bindung die gemeinsamen Elektronen zu sich zieht.","Wie stark ein Atom Bindungselektronen anzieht","Wie viele Elektronen ein Atom hat","Wie schwer ein Atom ist","Wie gut ein Stoff leitet"],
   ["Warum ist Wasser ein Dipol?","Polare O–H-Bindungen und die gewinkelte Form: Die Ladungsschwerpunkte fallen nicht zusammen.","Polare Bindungen und gewinkelte Form","Weil es flüssig ist","Weil es zwei H-Atome hat","Weil es Ionen enthält"],
   ["Warum löst sich Öl nicht in Wasser?","Öl ist unpolar, Wasser polar. Gleiches löst sich in Gleichem.","Öl ist unpolar, Wasser polar","Öl ist schwerer","Öl ist ein Salz","Wasser ist zu kalt"],
   ["Was ist eine Wasserstoffbrücke?","Anziehung zwischen einem δ+-H-Atom und einem freien Elektronenpaar eines stark elektronegativen Atoms (O, N, F) im Nachbarmolekül.","Anziehung zwischen Molekülen über H-Atome","Eine Bindung zwischen zwei H-Atomen","Ein Molekül aus Wasserstoff","Eine Ionenbindung"],
   ["Warum schwimmt Eis auf Wasser?","Im Eis halten Wasserstoffbrücken die Moleküle in einem lockeren Gitter mit viel Platz. Eis hat eine geringere Dichte.","Eis hat durch die Wasserstoffbrücken eine geringere Dichte","Eis enthält Luft","Eis ist ein anderer Stoff","Eis ist wärmer"],
   ["Welche Bindung liegt in einem H₂-Molekül vor?","Zwei gleiche Atome, ΔEN = 0: unpolare Elektronenpaarbindung.","Unpolare Elektronenpaarbindung","Polare Elektronenpaarbindung","Ionenbindung","Wasserstoffbrücke"]]),

 BT("c-saeuren","Säuren und Basen","H⁺-Spender und H⁺-Fänger",[
  ["Was eine Säure ist",`<p>Eine <b>Säure</b> ist ein Stoff, der in Wasser <b>H⁺-Ionen (Protonen) abgibt</b>. Das H⁺ springt auf ein Wassermolekül, es entsteht das <b>Oxonium-Ion</b> H₃O⁺. Das macht die Lösung sauer.</p><p class="eq">HCl + H₂O → H₃O⁺ + Cl⁻</p><table class="tbl"><tr><th>Säure</th><th>Formel</th><th>Vorkommen</th></tr><tr><td>Salzsäure</td><td>HCl</td><td>Magensaft</td></tr><tr><td>Schwefelsäure</td><td>H₂SO₄</td><td>Autobatterie</td></tr><tr><td>Kohlensäure</td><td>H₂CO₃</td><td>Sprudel</td></tr><tr><td>Essigsäure</td><td>CH₃COOH</td><td>Essig</td></tr><tr><td>Citronensäure</td><td>C₆H₈O₇</td><td>Zitrone, Entkalker</td></tr></table>`],
  ["Was eine Base (Lauge) ist",`<p>Eine <b>Base</b> nimmt H⁺ auf. In Wasser entstehen dabei <b>Hydroxid-Ionen</b> OH⁻. Eine wässrige Lösung einer Base heißt <b>Lauge</b> (alkalisch).</p><p class="eq">NaOH → Na⁺ + OH⁻ (Natronlauge)<br>NH₃ + H₂O → NH₄⁺ + OH⁻ (Ammoniak)</p><p>Laugen fühlen sich seifig an, weil sie die Fette der Haut angreifen. Abflussreiniger ist eine starke Lauge.</p><p class="warn">Säuren und Laugen ätzen. Schutzbrille! Beim Verdünnen immer <b>erst das Wasser, dann die Säure</b>: „Erst das Wasser, dann die Säure, sonst geschieht das Ungeheure.“</p>`]],
  [["Was gibt eine Säure in Wasser ab?","Säuren sind Protonendonatoren: Sie geben H⁺ ab.","H⁺-Ionen (Protonen)","OH⁻-Ionen","Elektronen","Sauerstoff"],
   ["Welches Ion macht eine Lauge alkalisch?","Hydroxid-Ionen OH⁻ sind typisch für Laugen.","OH⁻ (Hydroxid)","H₃O⁺ (Oxonium)","Cl⁻ (Chlorid)","Na⁺ (Natrium)"],
   ["Welche Säure ist im Magensaft?","Der Magen bildet Salzsäure (HCl). Sie tötet Keime und hilft bei der Verdauung von Eiweiß.","Salzsäure","Schwefelsäure","Essigsäure","Kohlensäure"],
   ["Wie verdünnt man eine konzentrierte Säure richtig?","Säure langsam ins Wasser geben. Umgekehrt kann sich das wenige Wasser schlagartig erhitzen und spritzen.","Säure ins Wasser geben","Wasser in die Säure geben","Beides gleichzeitig","Gar nicht, das ist verboten"],
   ["Warum fühlt sich Lauge auf der Haut seifig an?","Die Lauge greift die Fette und Eiweiße der Haut an und verseift sie. Sofort abspülen!","Sie greift die Hautfette an","Sie ist ölig","Sie enthält Seife","Sie ist warm"],
   ["Was ist das Oxonium-Ion?","Ein Wassermolekül, das ein zusätzliches H⁺ aufgenommen hat: H₃O⁺.","H₃O⁺","OH⁻","H₂O","H₂"]]),

 BT("c-ph","Der pH-Wert","Wie sauer ist es?",[
  ["Die Skala von 0 bis 14",`<p>Der <b>pH-Wert</b> sagt, wie sauer oder alkalisch eine Lösung ist:</p><ul class="rules"><li>unter 7: <b>sauer</b></li><li>genau 7: <b>neutral</b> (reines Wasser)</li><li>über 7: <b>alkalisch</b> (basisch)</li></ul><p>Wichtig: Jede Stufe ist ein <b>Faktor 10</b>. pH 3 ist zehnmal saurer als pH 4 und hundertmal saurer als pH 5.</p>`,"phskala"],
  ["Was dahintersteckt",`<p>Der pH-Wert ist der negative Exponent der H₃O⁺-Konzentration:</p><p class="eq">c(H₃O⁺) = 10⁻³ mol/l → pH 3</p><p>Für Laugen gibt es entsprechend den pOH-Wert. Immer gilt: <b>pH + pOH = 14</b>. Eine Natronlauge mit c(OH⁻) = 0,01 mol/l hat pOH 2 und pH 12.</p><p>Messen kann man den pH mit <b>Indikatoren</b>: Farbstoffe, die je nach pH die Farbe ändern. Universalindikator geht von Rot (sauer) über Grün (neutral) bis Violett (alkalisch). Rotkohlsaft ist ein Indikator aus der Küche!</p>`]],
  [["Ist eine Lösung mit pH 9 sauer oder alkalisch?","Über 7 ist alkalisch (basisch).","alkalisch","sauer","neutral"],
   ["Um welchen Faktor ist pH 2 saurer als pH 4?","Zwei Stufen, jede ist ein Faktor 10: 10 · 10 = 100.","100-mal","2-mal","20-mal","10-mal"],
   ["Welchen pH-Wert hat reines Wasser bei 25 °C?","Reines Wasser ist neutral: pH 7.","7","0","14","1"],
   ["Welche Farbe zeigt Universalindikator in Essig?","Essig ist sauer, Universalindikator wird rot bis orange.","rot","grün","blau","farblos"],
   ["Was ist ein Indikator?","Ein Farbstoff, dessen Farbe vom pH-Wert abhängt.","Ein Farbstoff, der je nach pH die Farbe ändert","Ein Messgerät für Temperatur","Eine starke Säure","Ein Katalysator"],
   ["Welchen pH hat unsere Haut ungefähr?","Die Haut ist leicht sauer (um 5,5). Dieser Säureschutzmantel hält Keime fern.","etwa 5,5","etwa 7","etwa 9","etwa 2"]],["c_ph"]),

 BT("c-neutral","Neutralisation","Säure + Lauge → Salz + Wasser",[
  ["Säure und Lauge heben sich auf",`<p>Gibt man Säure und Lauge zusammen, reagieren die H₃O⁺- und OH⁻-Ionen zu Wasser:</p><p class="eq">H₃O⁺ + OH⁻ → 2 H₂O</p><p>Die übrigen Ionen bleiben als <b>Salz</b> in der Lösung:</p><p class="eq">Salzsäure + Natronlauge → Kochsalz + Wasser<br>HCl + NaOH → NaCl + H₂O</p><p>Dabei wird es warm: Die Neutralisation ist <b>exotherm</b>.</p><p class="tip">Im Alltag: Bei Sodbrennen neutralisieren Magentabletten die Magensäure. Kalk im Garten macht saure Böden weniger sauer.</p>`],
  ["Titration: Konzentration messen",`<p>Bei einer <b>Titration</b> gibt man so lange Lauge bekannter Konzentration zu einer Säure, bis der Indikator umschlägt (Neutralpunkt). Dann gilt:</p><p class="eq">c(Säure) · V(Säure) = c(Lauge) · V(Lauge)</p><p>(für einprotonige Säuren wie HCl). Probier aus, wie der pH-Wert sich ändert:</p>`,"titration"]],
  [["Was entsteht bei der Neutralisation von Salzsäure mit Natronlauge?","HCl + NaOH → NaCl + H₂O: Kochsalz und Wasser.","Kochsalz und Wasser","Wasserstoff und Sauerstoff","Chlor und Natrium","Nur Wasser"],
   ["Welche Ionen reagieren bei jeder Neutralisation zu Wasser?","H₃O⁺ aus der Säure und OH⁻ aus der Lauge.","H₃O⁺ und OH⁻","Na⁺ und Cl⁻","H⁺ und Cl⁻","Na⁺ und OH⁻"],
   ["Warum hilft eine Magentablette bei Sodbrennen?","Sie enthält eine schwache Base, die überschüssige Magensäure neutralisiert.","Sie neutralisiert Magensäure","Sie verdünnt das Blut","Sie kühlt den Magen","Sie bildet Säure"],
   ["Was zeigt der Farbumschlag bei einer Titration?","Der Indikator wechselt die Farbe am Neutralpunkt: Säure und Lauge sind gerade gleich viel.","Dass Säure und Lauge gleich viel sind","Dass es kocht","Dass die Säure verdampft ist","Dass ein Fehler passiert ist"],
   ["Ist die Neutralisation exotherm oder endotherm?","Es wird Wärme frei: exotherm.","exotherm","endotherm","weder noch"]],["c_titration"]),

 BT("c-redox","Redoxreaktionen","Elektronen abgeben und aufnehmen",[
  ["Oxidation und Reduktion",`<p>Früher hieß Oxidation „Reaktion mit Sauerstoff“. Heute fasst man es allgemeiner: Es geht um <b>Elektronen</b>.</p><ul class="rules"><li><b>Oxidation:</b> Elektronen werden <b>abgegeben</b>.</li><li><b>Reduktion:</b> Elektronen werden <b>aufgenommen</b>.</li></ul><p>Beides passiert immer gleichzeitig: Was einer abgibt, muss ein anderer aufnehmen. Darum heißt es <b>Redoxreaktion</b>.</p><p class="eq">Oxidation: Mg → Mg²⁺ + 2 e⁻<br>Reduktion: O + 2 e⁻ → O²⁻<br>Gesamt: 2 Mg + O₂ → 2 MgO</p><p class="tip">Merksatz: <b>OIL RIG</b>: Oxidation Is Loss, Reduction Is Gain (of electrons).</p>`],
  ["Oxidationszahlen",`<p>Um zu sehen, wer oxidiert und wer reduziert wird, gibt man jedem Atom eine <b>Oxidationszahl</b>, eine gedachte Ladung:</p><ol class="rules"><li>Elemente (Fe, O₂, Cl₂): 0</li><li>Ionen: ihre Ladung (Na⁺: +1)</li><li>H meist +1, O meist ${MINUS}2</li><li>Die Summe ergibt die Gesamtladung des Teilchens (bei Molekülen 0).</li></ol><p>Steigt die Oxidationszahl, wurde das Atom oxidiert. Sinkt sie, wurde es reduziert.</p><p class="tip">Alltag: Im Hochofen wird Eisenoxid mit Kohlenstoff zu Eisen <b>reduziert</b>. Batterien und Akkus sind Redoxreaktionen, bei denen der Elektronenstrom durch ein Kabel fließt.</p>`]],
  [["Was passiert bei einer Oxidation?","Ein Teilchen gibt Elektronen ab.","Elektronen werden abgegeben","Elektronen werden aufgenommen","Protonen werden abgegeben","Es wird immer warm"],
   ["Warum laufen Oxidation und Reduktion immer gemeinsam ab?","Elektronen können nicht einfach verschwinden. Wer sie abgibt, braucht einen Partner, der sie aufnimmt.","Abgegebene Elektronen müssen jemand aufnehmen","Das ist Zufall","Weil Sauerstoff dabei ist","Das stimmt nicht"],
   ["Welche Oxidationszahl haben Atome in einem reinen Element?","Elemente haben immer 0.","0","+1","−1","Das hängt vom Element ab"],
   ["Eisenoxid wird im Hochofen zu Eisen. Das Eisen wird dabei …","Die Oxidationszahl von Fe sinkt von +3 auf 0: Es nimmt Elektronen auf, wird reduziert.","reduziert","oxidiert","neutralisiert","verdampft"],
   ["Was bedeutet „OIL RIG“?","Oxidation Is Loss (Abgabe), Reduction Is Gain (Aufnahme) von Elektronen.","Oxidation: Abgabe, Reduktion: Aufnahme von Elektronen","Öl und Rigg","Oxidation mit Öl","Reduktion ist Verlust"]],["c_oxzahl"]),

 BT("c-mol","Stoffmenge und Mol","Teilchen zählen über die Masse",[
  ["Das Mol: ein Dutzend für Atome",`<p>Atome sind zu klein, um sie einzeln zu zählen. Darum zählt man in Paketen: <b>1 mol</b> sind 6,022 · 10²³ Teilchen (Avogadro-Zahl). Wie ein Dutzend 12 Stück sind, nur unvorstellbar viel mehr.</p><p>Der Trick: Die <b>molare Masse</b> M steht praktisch im Periodensystem. 1 mol Kohlenstoff wiegt 12 g, 1 mol Sauerstoff-Atome 16 g. Für Moleküle addiert man:</p><p class="eq">M(H₂O) = 2 · 1 + 16 = 18 g/mol</p><p>18 g Wasser (ein Schnapsglas) enthalten also 6 · 10²³ Moleküle.</p>`],
  ["Die drei Formeln",`<table class="tbl"><tr><th>Größe</th><th>Formel</th><th>Einheit</th></tr><tr><td>Stoffmenge</td><td>n = m : M</td><td>mol</td></tr><tr><td>Masse</td><td>m = n · M</td><td>g</td></tr><tr><td>Konzentration</td><td>c = n : V</td><td>mol/l</td></tr></table><p>Beispiel: Wie viel mol sind 88 g CO₂? M(CO₂) = 12 + 2 · 16 = 44 g/mol. n = 88 : 44 = 2 mol.</p><p class="tip">Reaktionsgleichungen gelten auch in mol: 2 H₂ + O₂ → 2 H₂O heißt 2 mol Wasserstoff + 1 mol Sauerstoff ergeben 2 mol Wasser. Damit kann man ausrechnen, wie viel Gramm man braucht.</p>`]],
  [["Wie viele Teilchen sind 1 mol?","Die Avogadro-Zahl: rund 6 · 10²³.","etwa 6 · 10²³","1000","12","100"],
   ["Welche Masse hat 1 mol Kohlenstoff-Atome?","Die Atommasse von C ist 12, also 12 g/mol.","12 g","1 g","6 g","24 g"],
   ["Wie berechnet man die Stoffmenge aus der Masse?","n = m : M (Masse durch molare Masse).","n = m : M","n = m · M","n = M : m","n = m + M"],
   ["Was bedeutet c = 1 mol/l?","In einem Liter Lösung ist 1 mol des Stoffes gelöst.","1 mol Stoff pro Liter Lösung","1 Liter pro mol","1 Gramm pro Liter","1 Teilchen pro Liter"],
   ["Wie lautet M(O₂)?","2 Sauerstoff-Atome mit je 16: 32 g/mol.","32 g/mol","16 g/mol","8 g/mol","64 g/mol"]],["c_molmasse","c_mol"]),

 BT("c-alkane","Alkane und Alkohole","Kohlenstoffketten",[
  ["Organische Chemie",`<p>Die <b>organische Chemie</b> ist die Chemie des Kohlenstoffs. Kohlenstoff kann vier Bindungen eingehen und lange Ketten bilden. Darum gibt es Millionen organische Stoffe: Erdöl, Kunststoffe, Zucker, Fette, Eiweiße, DNA.</p><p>Die einfachsten sind die <b>Alkane</b>: Ketten nur aus C und H mit Einfachbindungen. Allgemeine Formel <b>C<sub>n</sub>H<sub>2n+2</sub></b>.</p><table class="tbl"><tr><th>C</th><th>Name</th><th>Alltag</th></tr><tr><td>1</td><td>Methan</td><td>Erdgas</td></tr><tr><td>2</td><td>Ethan</td><td></td></tr><tr><td>3</td><td>Propan</td><td>Campinggas</td></tr><tr><td>4</td><td>Butan</td><td>Feuerzeug</td></tr><tr><td>5–8</td><td>Pentan bis Octan</td><td>Benzin</td></tr></table><p class="tip">Merkspruch für 1 bis 4: <b>M</b>ama <b>E</b>sst <b>P</b>udding <b>B</b>ei Oma.</p>`,"molekuel"],
  ["Alkohole",`<p>Ersetzt man ein H durch eine <b>Hydroxygruppe (−OH)</b>, entsteht ein <b>Alkohol</b>. Endung: <b>-ol</b>. Ethanol (C₂H₅OH) ist der Trinkalkohol, Methanol ist giftig (macht blind).</p><p>Die OH-Gruppe ist polar und bildet Wasserstoffbrücken: Kurze Alkohole mischen sich mit Wasser und sieden viel höher als die Alkane gleicher Länge. Lange Ketten werden wieder unpolar (fettartig).</p><p>Ethanol entsteht durch <b>alkoholische Gärung</b>: Hefe wandelt Zucker in Ethanol und CO₂ um. So entstehen Bier, Wein und das Loch im Brot.</p>`]],
  [["Woraus bestehen Alkane?","Nur aus Kohlenstoff und Wasserstoff, mit Einfachbindungen.","Nur aus C und H","Aus C, H und O","Aus Salzen","Aus Metallen"],
   ["Welcher Stoff ist im Erdgas hauptsächlich enthalten?","Erdgas besteht vor allem aus Methan, CH₄.","Methan","Butan","Ethanol","Octan"],
   ["Woran erkennt man einen Alkohol?","An der Hydroxygruppe −OH und der Endung -ol.","An der OH-Gruppe und der Endung -ol","An einer Doppelbindung","An der Endung -an","Am Geruch"],
   ["Warum siedet Ethanol (78 °C) viel höher als Ethan (−89 °C)?","Die OH-Gruppen bilden Wasserstoffbrücken zwischen den Molekülen.","Wegen der Wasserstoffbrücken der OH-Gruppe","Weil Ethanol schwerer ist","Weil Ethanol flüssig ist","Weil Ethan ein Gas ist"],
   ["Was entsteht bei der alkoholischen Gärung?","Hefe wandelt Zucker in Ethanol und Kohlenstoffdioxid um.","Ethanol und Kohlenstoffdioxid","Methan und Wasser","Essig und Sauerstoff","Zucker und Wasser"],
   ["Wie lautet die allgemeine Formel der Alkane?","CₙH₂ₙ₊₂: Für n = 3 (Propan) also C₃H₈.","CₙH₂ₙ₊₂","CₙH₂ₙ","CₙHₙ","CₙH₂ₙ₋₂"]],["c_alkan"]),

 BT("c-ester","Carbonsäuren und Ester","Essig, Fruchtaroma, Fette",[
  ["Carbonsäuren",`<p><b>Carbonsäuren</b> haben am Kettenende eine <b>Carboxygruppe (−COOH)</b>. Ihr H kann als H⁺ abgegeben werden: Sie sind Säuren, aber schwache.</p><ul class="rules"><li>Methansäure (Ameisensäure): Ameisen, Brennnesseln</li><li>Ethansäure (<b>Essigsäure</b>): Essig</li><li>Butansäure (Buttersäure): ranzige Butter, Schweiß</li><li>lange Ketten (Fettsäuren): Bausteine der Fette</li></ul><p>Essigsäure entsteht, wenn Bakterien Ethanol mit Sauerstoff oxidieren. Darum wird offener Wein sauer.</p>`],
  ["Ester: Alkohol + Säure",`<p>Carbonsäure und Alkohol reagieren unter Abspaltung von Wasser zu einem <b>Ester</b>:</p><p class="eq">Säure + Alkohol ⇌ Ester + Wasser</p><p>Kurze Ester riechen fruchtig: Ethansäureethylester (Nagellackentferner, Klebstoff), Butansäureethylester (Ananas), Pentylacetat (Banane). Viele Fruchtaromen in Süßigkeiten sind Ester.</p><p><b>Fette</b> sind Ester aus Glycerin (ein Alkohol mit drei OH-Gruppen) und drei Fettsäuren. Kocht man Fett mit Lauge, entsteht <b>Seife</b> (Verseifung).</p>`]],
  [["Welche funktionelle Gruppe haben Carbonsäuren?","Die Carboxygruppe −COOH.","−COOH","−OH","−NH₂","C=C"],
   ["Warum wird offener Wein mit der Zeit sauer?","Bakterien oxidieren Ethanol mit Luftsauerstoff zu Essigsäure.","Ethanol wird zu Essigsäure oxidiert","Der Zucker kristallisiert","Das Wasser verdunstet","Es entsteht Salzsäure"],
   ["Woraus entsteht ein Ester?","Aus einer Carbonsäure und einem Alkohol, dabei wird Wasser abgespalten.","Carbonsäure und Alkohol","Alkan und Wasser","Salz und Säure","Zwei Alkanen"],
   ["Wonach riechen viele kurze Ester?","Fruchtig, zum Beispiel nach Banane, Ananas oder Apfel.","Fruchtig","Faulig","Gar nicht","Nach Chlor"],
   ["Was sind Fette chemisch?","Ester aus Glycerin und drei Fettsäuren.","Ester aus Glycerin und Fettsäuren","Salze","Alkane","Zucker"],
   ["Was entsteht, wenn man Fett mit Natronlauge kocht?","Verseifung: Es entstehen Seife und Glycerin.","Seife","Benzin","Essig","Zucker"]],["c_alkan"]),
];
