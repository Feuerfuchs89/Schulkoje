const BAND4={key:"4",title:"Klasse 4",topics:[
  {id:"m4-zahlen",title:"Zahlen bis 1 Million",sub:"Stellenwerte, runden",gens:["stellenwert","runden"],steps:[
    {title:"Die Stellenwerttafel",body:`<p>Jede Ziffer bekommt ihren Wert durch ihren <b>Platz</b>. In 345.208 ist die 3 nicht drei, sondern dreihunderttausend.</p><table class="tbl"><tr><th>HT</th><th>ZT</th><th>T</th><th>H</th><th>Z</th><th>E</th></tr><tr><td>3</td><td>4</td><td>5</td><td>2</td><td>0</td><td>8</td></tr></table><p>Gelesen wird in Dreierpäckchen: <b>dreihundertfünfundvierzigtausend</b> zweihundertacht. Der Punkt (oder ein kleiner Abstand) nach den Tausendern hilft beim Lesen.</p><p>Die 0 bei den Zehnern ist wichtig: Sie hält den Platz frei. Ohne sie wäre es 34.528.</p>`},
    {title:"Runden",body:`<p>Runden heißt: die nächste „glatte“ Zahl finden. Entscheidend ist <b>nur die Ziffer rechts</b> von der Stelle, auf die gerundet wird. 0 bis 4: abrunden, 5 bis 9: aufrunden.</p>`,w:"runden"}]},
  {id:"m4-einmaleins",title:"Einmaleins und Kopfrechnen",sub:"Reihen, Umkehraufgaben, Nullen",gens:["einmaleins"],steps:[
    {title:"Das Einmaleins sitzt oder es fehlt",body:`<p>Alles Schriftliche in Klasse 4 baut auf dem kleinen Einmaleins auf. Wer bei 7 · 8 überlegen muss, verliert bei jeder schriftlichen Aufgabe den Faden.</p><ul class="rules"><li><b>Kernaufgaben</b>: · 1, · 2, · 5, · 10. Daraus lässt sich der Rest ableiten.</li><li><b>Nachbaraufgaben</b>: 6 · 8 = 5 · 8 + 8 = 48.</li><li><b>Tauschaufgaben</b>: 3 · 7 = 7 · 3.</li><li><b>Umkehraufgaben</b>: 56 : 7 = 8, weil 8 · 7 = 56.</li></ul>`},
    {title:"Mit Nullen rechnen",body:`<p>40 · 300: erst 4 · 3 = 12, dann alle Nullen anhängen, hier drei Stück: 12.000.</p><p>Beim Teilen genauso: 2400 : 6 = 24 Hunderter : 6 = 4 Hunderter = 400.</p><p><b>Teilen mit Rest</b>: 29 : 4 = 7 Rest 1, weil 7 · 4 = 28 und noch 1 übrig bleibt. Der Rest muss immer kleiner sein als die Zahl, durch die geteilt wird.</p>`}]},
  {id:"m4-schrplus",title:"Schriftlich plus und minus",sub:"Übertrag, Entbündeln, Ergänzen",gens:["schrAdd","schrSub"],steps:[
    {title:"Schriftlich addieren",body:`<p>Stellengerecht untereinanderschreiben und <b>von rechts</b> anfangen. Ergibt eine Stelle 10 oder mehr, schreibst du die Einerziffer hin und nimmst den Rest als kleinen <b>Übertrag</b> zur nächsten Stelle mit.</p>`,w:"schriftlich",wo:{op:"add"}},
    {title:"Schriftlich subtrahieren: zwei Verfahren",body:`<p>Hier gibt es zwei Wege, und Schulen nutzen unterschiedliche:</p><ul class="rules"><li><b>Abziehen mit Entbündeln:</b> „7 minus 9 geht nicht, also hole ich mir einen Zehner.“ Die obere Zahl wird verändert.</li><li><b>Ergänzen mit Übertrag:</b> „9 plus wie viel ist 17?“ Der Übertrag kommt unten zur nächsten Ziffer. So haben es viele Eltern gelernt.</li></ul><p>Beide führen zum selben Ergebnis. Probier beide aus und stell oben auf „Minus“:</p>`,w:"schriftlich",wo:{op:"sub"}}]},
  {id:"m4-schrmal",title:"Schriftlich mal und geteilt",sub:"Mit einstelliger Zahl",gens:["schrMul","schrDiv"],steps:[
    {title:"Schriftlich multiplizieren",body:`<p>Jede Ziffer der großen Zahl wird mit dem einstelligen Faktor malgenommen, von rechts nach links. Was über 9 hinausgeht, „merkst“ du dir und addierst es bei der nächsten Stelle.</p><p>Das Ergebnis schreibt man in vielen Schulen so, dass es unter der letzten Ziffer endet.</p>`,w:"schriftlich",wo:{op:"mul"}},
    {title:"Schriftlich dividieren",body:`<p>Hier geht es <b>von links</b> los, als Einziges der vier Verfahren. Der Ablauf wiederholt sich immer:</p><ol class="rules"><li>Wie oft passt der Teiler hinein? Ergebnis hinter das = schreiben.</li><li>Malnehmen und darunterschreiben.</li><li>Abziehen.</li><li>Nächste Ziffer herunterholen.</li></ol><p>Passt der Teiler gar nicht hinein, kommt eine <b>0</b> ins Ergebnis. Die wird gern vergessen.</p>`,w:"schriftlich",wo:{op:"div"}}]},
  {id:"m4-groessen",title:"Größen und Einheiten",sub:"Länge, Gewicht, Zeit, Geld",gens:["groessen"],steps:[
    {title:"Die Umrechnungszahlen",body:`<table class="tbl"><tr><th>Größe</th><th>Umrechnung</th></tr><tr><td>Länge</td><td>1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm</td></tr><tr><td>Gewicht</td><td>1 t = 1000 kg, 1 kg = 1000 g</td></tr><tr><td>Volumen</td><td>1 l = 1000 ml</td></tr><tr><td>Geld</td><td>1 € = 100 ct</td></tr><tr><td>Zeit</td><td>1 h = 60 min, 1 min = 60 s, 1 Tag = 24 h</td></tr></table><p>Zeit fällt aus der Reihe: Hier ist es 60 statt 10, 100 oder 1000. Darum geht das Umrechnen mit dem Komma bei Zeit nicht.</p>`},
    {title:"Die Kommaschreibweise",body:`<p>Das Komma trennt zwei Einheiten. Hinter dem Komma stehen so viele Stellen, wie die Umrechnungszahl Nullen hat:</p><ul class="rules"><li>3,45 € = 3 € 45 ct (100 → zwei Stellen)</li><li>2,5 kg = 2,500 kg = 2 kg 500 g (1000 → drei Stellen)</li><li>1,07 m = 1 m 7 cm</li></ul><p class="warn">Typischer Fehler: 2,5 kg = 2 kg 5 g. Die Stellen hinter dem Komma immer auffüllen.</p>`}]},
  {id:"m4-zeit",title:"Uhrzeit und Zeitspannen",sub:"Wie lange dauert es?",gens:["zeitspanne"],steps:[
    {title:"Rechnen über die volle Stunde",body:`<p>Zeitspannen rechnet man am sichersten in Etappen: <b>erst bis zur vollen Stunde, dann volle Stunden, dann den Rest.</b></p><p>16:45 bis 18:10: bis 17:00 sind es 15 min, bis 18:00 noch eine Stunde, dann 10 min. Zusammen 1 h 25 min = 85 min.</p>`,w:"uhr"}]},
  {id:"m4-geo",title:"Formen und Körper",sub:"Symmetrie, Ecken, Kanten, Flächen",gens:["formen"],steps:[
    {title:"Symmetrie",body:`<p>Eine Figur ist <b>achsensymmetrisch</b>, wenn man sie so falten kann, dass beide Hälften genau aufeinanderliegen. Die Faltlinie ist die <b>Symmetrieachse</b>.</p><ul class="rules"><li>Quadrat: 4 Achsen</li><li>Rechteck: 2 (nicht die Diagonalen!)</li><li>gleichseitiges Dreieck: 3</li><li>Kreis: unendlich viele</li><li>Parallelogramm: keine</li></ul><p class="tip">Zum Prüfen: Papier ausschneiden und falten. Oder einen Spiegel auf die Linie stellen.</p>`},
    {title:"Körper",body:`<p>Körper sind dreidimensional. Man beschreibt sie durch <b>Ecken</b>, <b>Kanten</b> (wo zwei Flächen zusammenstoßen) und <b>Flächen</b>.</p><table class="tbl"><tr><th>Körper</th><th>Ecken</th><th>Kanten</th><th>Flächen</th></tr><tr><td>Würfel</td><td>8</td><td>12</td><td>6</td></tr><tr><td>Quader</td><td>8</td><td>12</td><td>6</td></tr><tr><td>Pyramide (quadratisch)</td><td>5</td><td>8</td><td>5</td></tr><tr><td>Zylinder</td><td>0</td><td>2</td><td>3</td></tr></table><p>Ein <b>Würfelnetz</b> ist der aufgeklappte Würfel. Es gibt genau 11 verschiedene.</p>`}]},
]};
SUBJECTS[0].bands.unshift(BAND4);
SUBJECTS[1].bands.unshift({key:"3-4",title:"Klasse 3–4 · Sachunterricht",planned:["Pflanzen: Keimen und Wachsen","Tiere im Jahreslauf","Der Igel und der Winterschlaf","Unser Körper: Knochen und Muskeln","Zähne und Zahnpflege","Gesunde Ernährung","Lebensraum Wiese","Lebensraum Teich"]});
SUBJECTS[3].bands.unshift({key:"3-4",title:"Klasse 3–4 · Sachunterricht",planned:["Schwimmen und Sinken","Magnete","Der einfache Stromkreis","Licht und Schatten","Schall: Wie wir hören","Wetter und Wasserkreislauf","Feuer: Was es zum Brennen braucht","Luft ist nicht nichts"]});
SUBJECTS[2].bands.unshift({key:"3-4",title:"Klasse 3–4 · Sachunterricht",planned:["Stoffe lösen sich in Wasser","Wasser: fest, flüssig, gasförmig","Feuer, Kerze und Verbrennung","Mülltrennung und Recycling"]});

/* ---------- Für den Küchentisch: so lernen Kinder es heute, typische Kinderfehler ---------- */
const KT={
  "m4-zahlen":`<p>Kinder legen große Zahlen heute oft mit <b>Rechengeld oder Stellenwertkarten</b>. Ein Zettel mit HT, ZT, T, H, Z, E als Spalten hilft enorm.</p><p><b>Typischer Fehler:</b> „zweitausendfünf“ wird als 20005 geschrieben, weil das Kind schreibt, was es hört. Die Tafel zeigt, dass Hunderter und Zehner Nullen brauchen: 2005.</p><p><b>Prüffrage:</b> „Welche Zahl kommt nach 9.999?“</p>`,
  "m4-einmaleins":`<p>Heute wird das Einmaleins nicht mehr nur auswendig gelernt, sondern über <b>Kernaufgaben</b> abgeleitet. Wenn dein Kind bei 7 · 8 sagt „5 · 8 ist 40, plus 2 · 8“, ist das kein Umweg, sondern genau so gewollt.</p><p><b>Üben mit wenig Aufwand:</b> beim Autofahren oder Zähneputzen 5 Aufgaben. Täglich kurz bringt mehr als selten lange.</p><p><b>Typischer Fehler:</b> Beim Teilen mit Rest ist der Rest größer als der Teiler (29 : 4 = 6 Rest 5). Dann passt noch einmal mehr hinein.</p>`,
  "m4-schrplus":`<p><b>Frag zuerst nach dem Verfahren der Schule!</b> Ob abgezogen oder ergänzt wird, steht im Mathebuch oder Arbeitsheft. Wenn du ein anderes Verfahren zeigst als die Lehrerin, verwirrt das mehr, als es hilft. In der Animation oben kannst du beides umschalten.</p><p>Auch die Sprechweise ist festgelegt. Beim Abziehen etwa: „7 minus 9 geht nicht. Ich entbündle einen Zehner. 17 minus 9 ist 8.“</p><p><b>Typische Fehler:</b> Übertrag vergessen. Und beim Minus die kleinere von der größeren Ziffer abziehen, egal ob oben oder unten (7 − 9 → 2). Hier hilft: „Oben minus unten, immer.“</p>`,
  "m4-schrmal":`<p>Bevor schriftlich gerechnet wird, lassen viele Lehrkräfte <b>überschlagen</b>: 4378 · 6 ist ungefähr 4000 · 6 = 24.000. So merkt das Kind selbst, ob 2.628 oder 26.268 plausibel ist.</p><p><b>Typischer Fehler beim Teilen:</b> die 0 im Ergebnis vergessen (8124 : 4 = 231 statt 2031). Abhilfe: Vorher sagen lassen, wie viele Stellen das Ergebnis hat.</p><p><b>Probe</b> ist Pflicht und gibt Sicherheit: Beim Teilen wird mit Malnehmen kontrolliert.</p>`,
  "m4-groessen":`<p>Kinder lernen Größen über <b>Stützpunktvorstellungen</b>: Wie lang ist 1 m (ein großer Schritt)? Was wiegt 1 kg (eine Packung Zucker)? Wie lange dauert 1 Minute? Das kannst du im Alltag wunderbar mitmachen: beim Einkaufen Gewichte schätzen, mit dem Zollstock Dinge messen.</p><p><b>Typischer Fehler:</b> 1,5 h = 1 h 50 min. Bei der Zeit funktioniert das Komma nicht wie bei Metern. 1,5 h sind 1 h 30 min.</p>`,
  "m4-zeit":`<p>Viele Kinder in Klasse 4 lesen die analoge Uhr noch unsicher. Eine echte Uhr zum Drehen (Lernuhr) hilft mehr als jedes Arbeitsblatt.</p><p>Zeitspannen werden in der Schule oft mit einem <b>Zeitstrahl</b> gerechnet: Sprünge bis zur vollen Stunde, dann weiter. Lass dein Kind die Sprünge aufmalen.</p><p><b>Typischer Fehler:</b> 16:45 bis 18:10 wird als 18,10 ${MINUS} 16,45 = 1,65 gerechnet. Uhrzeiten sind keine Kommazahlen.</p>`,
  "m4-geo":`<p>Geometrie lernen Kinder über das <b>Tun</b>: falten, schneiden, mit Spiegeln prüfen, Würfelnetze aus Papier basteln und zusammenkleben. Das bleibt viel besser hängen als Zeichnungen.</p><p><b>Typischer Fehler:</b> Beim Rechteck werden die Diagonalen für Symmetrieachsen gehalten. Einfach falten lassen, dann sieht das Kind es selbst.</p>`,
  "m-regeln":`<p>„Punkt vor Strich“ kennen die Kinder ab Klasse 3 bis 5. Gut ist, die Aufgabe vorher mit Bögen zu markieren: Was wird zuerst gerechnet?</p><p><b>Typischer Fehler:</b> stur von links nach rechts rechnen, wie man liest. Frag: „Was ist stärker, mal oder plus?“</p>`,
  "m-teiler":`<p>Teilbarkeit wird oft spielerisch geübt, etwa mit dem Spiel „Primzahlen-Jagd“ auf der Hundertertafel. Die Teilbarkeitsregeln für 3 und 9 (Quersumme) wirken auf Kinder wie Zaubertricks, das kann man nutzen.</p><p><b>Typischer Fehler:</b> ggT und kgV verwechseln. Merkhilfe: Der <b>Teiler</b> ist klein (teilt die Zahl), das <b>Vielfache</b> ist groß.</p>`,
  "m-bruch1":`<p>Brüche werden heute lange <b>handelnd</b> eingeführt: Pizza, Schokolade, Papierstreifen falten. Bevor das Rechnen kommt, soll das Kind sehen: ${F(1,4)} ist kleiner als ${F(1,3)}, obwohl 4 größer ist als 3.</p><p><b>Typischer Fehler:</b> „Je größer der Nenner, desto größer der Bruch.“ Frage zum Prüfen: „Möchtest du lieber ein Drittel oder ein Achtel von der Pizza?“</p>`,
  "m-bruch2":`<p>Mit Bruchstreifen (Papierstreifen in Halbe, Drittel, Viertel, Sechstel teilen) sieht ein Kind sofort, warum man Drittel und Viertel nicht direkt addieren kann.</p><p><b>Typischer Fehler:</b> ${F(1,2)} + ${F(1,3)} = ${F(2,5)}. Prüffrage: „Ist ${F(2,5)} mehr oder weniger als ${F(1,2)}?“ Weniger! Das kann also nicht stimmen, wenn man noch etwas dazutut.</p>`,
  "m-bruch3":`<p>Beim Teilen durch Brüche hilft die Frage: <b>„Wie oft passt das hinein?“</b> Wie oft passt ein halber Liter in 3 Liter? 6-mal. Also 3 : ${F(1,2)} = 6.</p><p><b>Typischer Fehler:</b> Beim Teilen den falschen Bruch umdrehen. Merksatz: „Den Teiler drehen, dann mal.“</p>`,
  "m-dezimal":`<p>Geld ist der beste Einstieg in Kommazahlen: 2,50 € kennt jedes Kind. Auch Messbänder mit Millimetern helfen.</p><p><b>Typischer Fehler:</b> „0,25 ist größer als 0,3, weil 25 größer ist als 3.“ Mit Geld klärt sich das sofort: 25 Cent oder 30 Cent?</p>`,
  "m-flaeche":`<p>Kinder legen Flächen mit Einheitsquadraten aus (Kärtchen, Fliesen zählen im Bad). So wird klar, warum man Länge mal Breite rechnet.</p><p><b>Typischer Fehler:</b> Fläche und Umfang verwechseln. Umfang ist „der Zaun drumherum“, Fläche „der Rasen drinnen“.</p>`,
  "m-winkel":`<p>Beim Geodreieck messen Kinder oft an der falschen Skala ab (innen statt außen). Tipp: vorher schätzen lassen, ob der Winkel spitz oder stumpf ist. Dann passt nur eine der beiden Zahlen.</p><p>Im Alltag üben: Winkel an Türen, Uhrzeigern, Scheren entdecken.</p>`,
  "m-negativ":`<p>Das Thermometer ist das beste Werkzeug. „Es ist ${MINUS}3 °C und wird 5 Grad wärmer“ versteht jedes Kind.</p><p><b>Typischer Fehler:</b> ${MINUS}8 sei größer als ${MINUS}3. Frag: „Wo ist es kälter?“</p>`,
  "m-prozent":`<p>Prozent begegnet Kindern bei Rabatten und beim Akkustand. Gute Anker: 50 % = die Hälfte, 25 % = ein Viertel, 10 % = ein Zehntel.</p><p><b>Typischer Fehler:</b> Nach 20 % Rabatt und dann 20 % Aufschlag ist der Preis nicht wieder der alte. Spannende Knobelfrage für ältere Kinder!</p>`,
  "m-dreisatz":`<p>In der Schule wird der Dreisatz oft als <b>Tabelle mit Pfeilen</b> geschrieben (: 3, · 5 auf beiden Seiten). Schau, welche Schreibweise im Heft steht, und nutze dieselbe.</p><p><b>Typischer Fehler:</b> Bei antiproportionalen Aufgaben genauso rechnen wie bei proportionalen. Immer erst fragen: „Mehr Leute, mehr oder weniger Zeit?“</p>`,
  "m-terme":`<p>Hilfreich ist eine Geschichte zum Term: x ist die Anzahl der Kekse in einer Dose. „3x + 2“ sind drei Dosen und zwei lose Kekse.</p><p><b>Typischer Fehler:</b> 3x + 2 = 5x. Mit der Keks-Geschichte merkt das Kind: Zwei lose Kekse sind keine zwei Dosen.</p>`,
  "m-gleichung":`<p>Die Waage ist auch in der Schule das Standardbild. Viele Lehrkräfte bestehen auf der <b>Strichschreibweise</b> (| ${MINUS} 3) hinter jeder Zeile. Lass sie dein Kind konsequent nutzen.</p><p><b>Typischer Fehler:</b> nur auf einer Seite rechnen. Frage: „Bleibt die Waage dann noch gerade?“</p>`,
};
/* ---------- Aufgaben-Generatoren Klasse 4 ---------- */
const SHAPES={
  Quadrat:{pts:"20,20 100,20 100,100 20,100",ax:4,e:4},
  Rechteck:{pts:"10,30 110,30 110,90 10,90",ax:2,e:4},
  "gleichseitiges Dreieck":{pts:"60,14 110,100 10,100",ax:3,e:3},
  Raute:{pts:"60,10 105,60 60,110 15,60",ax:2,e:4},
  Parallelogramm:{pts:"35,30 112,30 85,92 8,92",ax:0,e:4},
  "gleichschenkliges Trapez":{pts:"35,30 85,30 110,92 10,92",ax:1,e:4},
  Drachenviereck:{pts:"60,10 95,45 60,112 25,45",ax:1,e:4}};
const shapeSVG=n=>`<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="${n}"><polygon points="${SHAPES[n].pts}" fill="var(--accent)" fill-opacity=".25" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></svg>`;
const BODIES={Würfel:[8,12,6],Quader:[8,12,6],"Pyramide mit quadratischer Grundfläche":[5,8,5],"Dreiecksprisma":[6,9,5]};
const STELLEN=["E","Z","H","T","ZT","HT"];
Object.assign(G,{
  stellenwert(){const n=ri(10000,999999),D=digitsR(n),t=ri(0,2);
    if(t===0){const k=ri(1,Math.min(5,D.length-1));
      return{q:`Welche Ziffer steht in <b>${fmt(n)}</b> an der <b>${PLACE1[k]}stelle</b>?`,kind:"num",ans:R(D[k]),
        sol:`Von rechts zählen: Einer, Zehner, Hunderter, Tausender, Zehntausender, Hunderttausender. An der ${PLACE1[k]}stelle steht die <b>${D[k]}</b>.`}}
    if(t===1){const parts=D.map((d,k)=>`${d} ${STELLEN[k]}`).reverse().join(" &nbsp; ");
      return{q:`Schreibe als Zahl: <span class="term">${parts}</span><p class="muted small">HT = Hunderttausender, ZT = Zehntausender, T = Tausender, H = Hunderter, Z = Zehner, E = Einer</p>`,kind:"num",ans:R(n),
        sol:`Die Ziffern einfach in die Stellenwerttafel von links (HT) nach rechts (E) eintragen: <b>${fmt(n)}</b>. Steht an einer Stelle nichts, schreibst du eine 0.`}}
    const k=ri(1,Math.min(5,D.length-1)),v=D[k]*10**k;if(!D[k])return G.stellenwert();
    return{q:`Wie viel ist die Ziffer <b>${D[k]}</b> in <b>${fmt(n)}</b> wert (an der ${PLACE1[k]}stelle)?`,kind:"num",ans:R(v),
      sol:`Die ${D[k]} steht bei den ${PLACE[k]}n, ist also ${D[k]} · ${fmt(10**k)} = <b>${fmt(v)}</b> wert.`}},

  runden(){const n=ri(1000,999999),k=pick([1,2,3]),p=10**k,r=Math.round(n/p)*p,nd=digitsR(n)[k-1];
    const nm=["Zehner","Hunderter","Tausender"][k-1];
    return{q:`Runde <b>${fmt(n)}</b> auf <b>${nm}</b>.`,kind:"num",ans:R(r),
      sol:`Schau auf die Ziffer rechts neben der ${nm}stelle: Das ist die ${nd}. ${nd>=5?"5 bis 9: aufrunden":"0 bis 4: abrunden"}. Ergebnis: <b>${fmt(r)}</b>.`}},

  einmaleins(){const t=ri(0,4),a=ri(2,10),b=ri(2,10);
    if(t===0)return{q:`Berechne: ${term(`${a} · ${b}`)}`,kind:"num",ans:R(a*b),sol:`${a} · ${b} = ${a*b}. Trick: ${b} · ${a} ist dasselbe (Tauschaufgabe).${a===9||b===9?` Bei der 9er-Reihe: ${a===9?b:a} · 10 ${MINUS} ${a===9?b:a} = ${a*b}.`:""}`};
    if(t===1)return{q:`Berechne: ${term(`${a*b} : ${a}`)}`,kind:"num",ans:R(b),sol:`Umkehraufgabe: Was mal ${a} ergibt ${a*b}? ${b} · ${a} = ${a*b}, also ${b}.`};
    if(t===2){const x=a*10,y=b*pick([10,100]);return{q:`Berechne: ${term(`${fmt(x)} · ${fmt(y)}`)}`,kind:"num",ans:R(x*y),sol:`Erst ohne Nullen: ${a} · ${b} = ${a*b}. Dann alle Nullen hinten anhängen: ${fmt(x*y)}.`}}
    if(t===3){const y=a*b*100;return{q:`Berechne: ${term(`${fmt(y)} : ${a}`)}`,kind:"num",ans:R(y/a),sol:`${a*b} : ${a} = ${b}, also ${a*b} Hunderter : ${a} = ${b} Hunderter = ${fmt(y/a)}.`}}
    const q=ri(2,9),d=ri(3,9),r=ri(1,d-1),n=q*d+r;
    return{q:`Berechne mit Rest: ${term(`${n} : ${d}`)}<p class="muted small">Gib nur das Ergebnis vor dem Rest ein.</p>`,kind:"num",ans:R(q),sol:`${q} · ${d} = ${q*d}, bis ${n} fehlen noch ${r}. Also ${n} : ${d} = ${q} Rest ${r}.`}},

  schrAdd(){const a=ri(100,9999),b=ri(100,9999),bd=buildAdd(a,b);
    return{q:`Rechne schriftlich: ${term(`${fmt(a)} + ${fmt(b)}`)}`,kind:"num",ans:R(bd.res),sol:schriftSol(bd)}},
  schrSub(){let a,b;do{a=ri(1000,9999);b=ri(100,a-1)}while(a-b<100||!digitsR(a).some((d,k)=>d<(digitsR(b)[k]||0)));
    const bd=buildSub(a,b,(typeof S!=="undefined"&&S.subMode)||"ab");
    return{q:`Rechne schriftlich: ${term(`${fmt(a)} ${MINUS} ${fmt(b)}`)}`,kind:"num",ans:R(bd.res),sol:schriftSol(bd)}},
  schrMul(){const a=ri(102,9999),d=ri(3,9),bd=buildMul(a,d);
    return{q:`Rechne schriftlich: ${term(`${fmt(a)} · ${d}`)}`,kind:"num",ans:R(bd.res),sol:schriftSol(bd)}},
  schrDiv(){const d=ri(2,9),q=ri(105,1999),a=q*d;if(a>9999)return G.schrDiv();const bd=buildDiv(a,d);
    return{q:`Rechne schriftlich: ${term(`${fmt(a)} : ${d}`)}`,kind:"num",ans:R(bd.res),sol:schriftSol(bd)}},

  groessen(){const t=ri(0,7);let q,a,sol,u;

    return{q:`Löse ${term(`(x ${a<0?"+":MINUS} ${Math.abs(a)})(x ${b<0?"+":MINUS} ${Math.abs(b)}) = 0`)}.<p class="muted small">Gib die <b>kleinere</b> Lösung ein.</p>`,kind:"num",ans:R(lo),sol:`Satz vom Nullprodukt: Ein Produkt ist 0, wenn ein Faktor 0 ist. x ${a<0?"+":MINUS} ${Math.abs(a)} = 0 → x = ${fmt(a)}, oder x ${b<0?"+":MINUS} ${Math.abs(b)} = 0 → x = ${fmt(b)}. Die kleinere: <b>${fmt(lo)}</b>. Kein Ausmultiplizieren nötig!`}},

  pythagoras(){const T=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41]]),k=T[2]>20?1:ri(1,3),[a,b,c]=T.map(v=>v*k),t=ri(0,2);
    if(t===0)return{q:`Ein rechtwinkliges Dreieck hat die Katheten a = ${a} cm und b = ${b} cm. Wie lang ist die Hypotenuse c?<div class="vis">${rtSVG({a:`a=${a}`,b:`b=${b}`,c:"c=?"})}</div>${unit("cm")}`,kind:"num",ans:R(c),sol:`a² + b² = c²: ${a*a} + ${b*b} = ${c*c}. c = √${c*c} = <b>${c} cm</b>.`};
    if(t===1)return{q:`Die Hypotenuse ist c = ${c} cm, eine Kathete a = ${a} cm. Wie lang ist die andere Kathete b?<div class="vis">${rtSVG({a:`a=${a}`,b:"b=?",c:`c=${c}`})}</div>${unit("cm")}`,kind:"num",ans:R(b),sol:`Umstellen: b² = c² ${MINUS} a² = ${c*c} ${MINUS} ${a*a} = ${b*b}. b = √${b*b} = <b>${b} cm</b>. Die Hypotenuse ist immer die längste Seite, gegenüber vom rechten Winkel.`};
    const h=ri(3,8),d=ri(1,3)+.5,L=Math.sqrt(h*h+d*d);
    return{q:`Eine Leiter lehnt an einer Hauswand. Sie erreicht eine Höhe von ${h} m, ihr Fuß steht ${fmt(d)} m von der Wand entfernt. Wie lang ist die Leiter? Runde auf eine Nachkommastelle.${unit("m")}`,kind:"num",ans:R1(L),tol:.051,
      sol:`Wand, Boden und Leiter bilden ein rechtwinkliges Dreieck. Die Leiter ist die Hypotenuse: L = √(${h}² + ${fmt(d)}²) = √${fmt(h*h+d*d)} ≈ <b>${fmt(r1(L))} m</b>.`}},

  kreis(){const t=ri(0,4),r=ri(2,12),h=ri(3,15);let q,v,sol;
    switch(t){
      case 0:v=2*Math.PI*r;q=`Ein Kreis hat den Radius r = ${r} cm. Wie groß ist sein <b>Umfang</b>?`;sol=`U = 2 · π · r = 2 · π · ${r} ≈ <b>${fmt(r1(v))} cm</b>.`;break;
      case 1:v=Math.PI*r*r;q=`Ein Kreis hat den Radius r = ${r} cm. Wie groß ist seine <b>Fläche</b>?`;sol=`A = π · r² = π · ${r*r} ≈ <b>${fmt(r1(v))} cm²</b>. Erst r², dann mal π.`;break;
      case 2:v=Math.PI*r*r*h;q=`Ein Zylinder (Dose) hat r = ${r} cm und h = ${h} cm. Wie groß ist sein <b>Volumen</b>?`;sol=`V = Grundfläche · Höhe = π · r² · h = π · ${r*r} · ${h} ≈ <b>${fmt(r1(v))} cm³</b>.`;break;
      case 3:v=4/3*Math.PI*r**3;q=`Eine Kugel hat den Radius r = ${r} cm. Wie groß ist ihr <b>Volumen</b>?`;sol=`V = 4/3 · π · r³ = 4/3 · π · ${r**3} ≈ <b>${fmt(r1(v))} cm³</b>.`;break;
      default:v=Math.PI*r*r*h/3;q=`Ein Kegel hat r = ${r} cm und h = ${h} cm. Wie groß ist sein <b>Volumen</b>?`;sol=`V = 1/3 · π · r² · h = 1/3 · π · ${r*r} · ${h} ≈ <b>${fmt(r1(v))} cm³</b>. Ein Kegel ist genau ein Drittel vom Zylinder mit gleicher Grundfläche und Höhe.`}
    return{q:q+`<p class="muted small">Rechne mit der π-Taste und runde auf eine Nachkommastelle.</p>`,kind:"num",ans:R1(v),tol:tolOf(v),sol}},

  trig(){const t=ri(0,3),al=ri(15,75),c=ri(5,20),rad=al*Math.PI/180,A=c*Math.sin(rad),B=c*Math.cos(rad);
    if(t===0)return{q:`Im rechtwinkligen Dreieck ist α = ${al}° und die Hypotenuse c = ${c} cm. Wie lang ist die <b>Gegenkathete</b> a? Runde auf eine Nachkommastelle.<div class="vis">${rtSVG({a:"a=?",c:`c=${c}`},{alpha:`${al}°`})}</div>`,kind:"num",ans:R1(A),tol:.051,sol:`sin α = Gegenkathete : Hypotenuse → a = c · sin α = ${c} · sin ${al}° ≈ <b>${fmt(r1(A))} cm</b>. Taschenrechner auf DEG (Grad) stellen!`};
    if(t===1)return{q:`Im rechtwinkligen Dreieck ist α = ${al}° und die Hypotenuse c = ${c} cm. Wie lang ist die <b>Ankathete</b> b? Runde auf eine Nachkommastelle.<div class="vis">${rtSVG({b:"b=?",c:`c=${c}`},{alpha:`${al}°`})}</div>`,kind:"num",ans:R1(B),tol:.051,sol:`cos α = Ankathete : Hypotenuse → b = c · cos α = ${c} · cos ${al}° ≈ <b>${fmt(r1(B))} cm</b>.`};
    if(t===2){const b=ri(3,15),a=b*Math.tan(rad);return{q:`α = ${al}°, die Ankathete b = ${b} cm. Wie lang ist die Gegenkathete a? Runde auf eine Nachkommastelle.<div class="vis">${rtSVG({a:"a=?",b:`b=${b}`},{alpha:`${al}°`})}</div>`,kind:"num",ans:R1(a),tol:.051,sol:`tan α = Gegenkathete : Ankathete → a = b · tan α = ${b} · tan ${al}° ≈ <b>${fmt(r1(a))} cm</b>.`}}
    const a=ri(3,12),cc=a+ri(2,10),ang=Math.asin(a/cc)*180/Math.PI;
    return{q:`Gegenkathete a = ${a} cm, Hypotenuse c = ${cc} cm. Wie groß ist der Winkel α? Runde auf ganze Grad.<div class="vis">${rtSVG({a:`a=${a}`,c:`c=${cc}`},{alpha:"α=?"})}</div>${unit("Grad")}`,kind:"num",ans:R(Math.round(ang)),tol:.6,sol:`sin α = ${a} : ${cc} ≈ ${fmt(Math.round(a/cc*1000)/1000)}. Mit der Umkehrfunktion (sin⁻¹, meist SHIFT + sin): α ≈ <b>${Math.round(ang)}°</b>.`}},

  wkeit(){const t=ri(0,4);
    if(t===0){const c=pick([["eine gerade Zahl",[2,4,6]],["eine Zahl größer als 4",[5,6]],["eine 6",[6]],["eine Primzahl",[2,3,5]],["höchstens eine 2",[1,2]]]);const r=R(c[1].length,6);
      return{q:`Du würfelst einmal mit einem normalen Würfel. Wie groß ist die Wahrscheinlichkeit für <b>${c[0]}</b>?<p class="muted small">Als Bruch (z. B. 1/3) oder Dezimalzahl.</p>`,kind:"frac",ans:r,tol:.005,sol:`Günstige Ergebnisse: ${c[1].join(", ")} (${c[1].length} Stück). Mögliche: 6. P = ${F(c[1].length,6)}${r.d!==6?` = ${FR(r)}`:""}.`}}
    const rot=ri(2,7),bl=ri(2,7),n=rot+bl;
    if(t===1)return{q:`In einer Tüte sind ${rot} rote und ${bl} blaue Kugeln. Du ziehst blind eine. Wie wahrscheinlich ist <b>rot</b>?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(rot,n),tol:.005,sol:`P(rot) = rote : alle = ${F(rot,n)}${gcd(rot,n)>1?` = ${FR(R(rot,n))}`:""}.`};
    if(t===2){const r=R(rot*rot,n*n);return{q:`${rot} rote und ${bl} blaue Kugeln. Du ziehst zweimal <b>mit Zurücklegen</b>. Wie wahrscheinlich ist <b>zweimal rot</b>?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:r,tol:.002,sol:`Pfadregel im Baumdiagramm: Wahrscheinlichkeiten entlang eines Pfades malnehmen. ${F(rot,n)} · ${F(rot,n)} = ${F(rot*rot,n*n)}${r.d!==n*n?` = ${FR(r)}`:""}.`}}
    if(t===3){const r=R(rot*(rot-1),n*(n-1));return{q:`${rot} rote und ${bl} blaue Kugeln. Du ziehst zweimal <b>ohne Zurücklegen</b>. Wie wahrscheinlich ist <b>zweimal rot</b>?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:r,tol:.002,sol:`Ohne Zurücklegen ändert sich der zweite Zug: Es sind nur noch ${rot-1} rote von ${n-1} Kugeln da. ${F(rot,n)} · ${F(rot-1,n-1)} = ${F(rot*(rot-1),n*(n-1))}${r.d!==n*(n-1)?` = ${FR(r)}`:""}.`}}
    const k=ri(2,3),r=R(6**k-5**k,6**k);
    return{q:`Du würfelst ${k}-mal. Wie wahrscheinlich ist <b>mindestens eine 6</b>?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:r,tol:.002,sol:`Trick Gegenereignis: „mindestens eine 6“ ist das Gegenteil von „keine einzige 6“. P(keine 6) = (${F(5,6)})<sup>${k}</sup> = ${F(5**k,6**k)}. Also P = 1 ${MINUS} ${F(5**k,6**k)} = ${FR(r)} ≈ ${fmt(Math.round(r.n/r.d*1000)/1000)}.`}},

  expo(){const t=ri(0,3);
    if(t===0){const K=pick([500,1000,2000,2500,5000]),p=pick([1,1.5,2,2.5,3,4]),n=ri(2,10),v=K*(1+p/100)**n;
      return{q:`${fmt(K)} € werden mit ${fmt(p)} % Zinseszins angelegt. Wie viel Geld ist es nach ${n} Jahren? Runde auf ganze Euro.${unit("€")}`,kind:"num",ans:R(Math.round(v)),tol:.6,sol:`Wachstumsfaktor q = 1 + ${fmt(p)}/100 = ${fmt(1+p/100)}. K<sub>${n}</sub> = ${fmt(K)} · ${fmt(1+p/100)}<sup>${n}</sup> ≈ <b>${fmt(Math.round(v))} €</b>. Jedes Jahr gibt es Zinsen auf die Zinsen.`}}
    if(t===1){const N=pick([800,1600,3200,6400]),T=pick([2,3,5,8,10]),k=ri(1,4);
      return{q:`Ein Stoff hat eine Halbwertszeit von ${T} Stunden. Am Anfang sind ${fmt(N)} mg da. Wie viel ist nach ${k*T} Stunden übrig?${unit("mg")}`,kind:"num",ans:R(N,2**k),sol:`${k*T} h sind ${k} Halbwertszeiten. Jedes Mal halbiert: ${fmt(N)} · (1/2)<sup>${k}</sup> = ${fmt(N)} : ${2**k} = <b>${fmt(N/2**k)} mg</b>.`}}
    if(t===2){const p=pick([-30,-20,-15,-5,3,5,8,12,25,50]);return{q:`Eine Größe ${p>0?"wächst":"nimmt ab"} jedes Jahr um ${Math.abs(p)} %. Wie groß ist der Wachstumsfaktor q?<p class="muted small">Als Dezimalzahl, z. B. 1,07.</p>`,kind:"num",ans:R(100+p,100),sol:`q = 1 ${p>0?"+":MINUS} ${Math.abs(p)}/100 = <b>${fmt(1+p/100)}</b>. ${p<0?"Bei Abnahme ist q kleiner als 1.":"Bei Wachstum ist q größer als 1."}`}}
    const N=pick([10,50,100,200]),T=pick([20,30,60]),k=ri(2,6);
    return{q:`Bakterien verdoppeln sich alle ${T} Minuten. Am Anfang sind es ${N}. Wie viele sind es nach ${k*T} Minuten?`,kind:"num",ans:R(N*2**k),sol:`${k*T} min sind ${k} Verdopplungen: ${N} · 2<sup>${k}</sup> = ${N} · ${2**k} = <b>${fmt(N*2**k)}</b>. Lineares Wachstum würde nur ${N} + ${k} · ${N} = ${N*(k+1)} ergeben.`}},
});
const GEN_NAMES_810={linfkt:"Lineare Funktionen",lgs:"Gleichungssysteme",binom:"Binomische Formeln",potenzen:"Potenzen und Wurzeln",qfkt:"Parabeln",qgl:"Quadratische Gleichungen",pythagoras:"Pythagoras",kreis:"Kreis und Körper",trig:"Sinus, Kosinus, Tangens",wkeit:"Wahrscheinlichkeit",expo:"Exponentielles Wachstum"};

WIDGETS.gerade=function(el){const w=wid("ge");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"m","Steigung m",-3,3,1,.5)}${slider(w+"b","y-Achsenabschnitt b",-5,5,-2,1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const M=el.querySelector("#"+w+"m"),B=el.querySelector("#"+w+"b");
  const draw=()=>{const m=+M.value,b=+B.value;el.querySelector("#"+w+"m-v").textContent=fmt(m);el.querySelector("#"+w+"b-v").textContent=fmt(b);
    const p=plot({w:280,h:280}),x0=1,tri=m?`<path d="M${p.X(x0)},${p.Y(m*x0+b)} L${p.X(x0+1)},${p.Y(m*x0+b)} L${p.X(x0+1)},${p.Y(m*(x0+1)+b)}" fill="var(--signal)" fill-opacity=".25" stroke="var(--signal)" stroke-width="2"/><text x="${(p.X(x0)+p.X(x0+1))/2}" y="${p.Y(m*x0+b)+(m>0?14:-6)}" text-anchor="middle" font-size="11" font-family="var(--f-mono)" fill="var(--ink)">1</text><text x="${p.X(x0+1)+6}" y="${(p.Y(m*x0+b)+p.Y(m*(x0+1)+b))/2+4}" font-size="11" font-family="var(--f-mono)" fill="var(--ink)">${fmt(m)}</text>`:"";
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(p.curve(x=>m*x+b)+tri+p.dot(0,b)+(m?p.dot(-b/m,0,"var(--accent)",4):""));
    el.querySelector("#"+w+"-t").innerHTML=`${term(`f(x) = ${lin([[m,"x"],[b,""]])}`)}<br>Gelb: Steigungsdreieck (1 nach rechts, ${fmt(m)} ${m>=0?"hoch":"runter"}). ${m?`Nullstelle bei x = ${fmt(Math.round(-b/m*100)/100)}.`:"Bei m = 0 verläuft die Gerade waagerecht."}`};
  M.oninput=B.oninput=draw;draw()};

WIDGETS.lgs=function(el){const w=wid("lg");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"a","Gerade I: Steigung",-3,3,1,.5)}${slider(w+"b","Gerade I: Achsenabschnitt",-5,5,-1)}${slider(w+"c","Gerade II: Steigung",-3,3,-.5,.5)}${slider(w+"d","Gerade II: Achsenabschnitt",-5,5,2)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const ids=["a","b","c","d"].map(k=>el.querySelector("#"+w+k));
  const draw=()=>{const [m1,b1,m2,b2]=ids.map(i=>+i.value);ids.forEach((i,k)=>el.querySelector("#"+i.id+"-v").textContent=fmt(+i.value));
    const p=plot({w:280,h:280});let extra="",txt="";
    if(m1!==m2){const x=(b2-b1)/(m1-m2),y=m1*x+b1;extra=p.dot(x,y);txt=`Schnittpunkt S(${fmt(Math.round(x*100)/100)} | ${fmt(Math.round(y*100)/100)}): <b>genau eine Lösung</b>. Dort erfüllen x und y beide Gleichungen.`}
    else txt=b1===b2?"Die Geraden liegen aufeinander: <b>unendlich viele Lösungen</b>.":"Die Geraden sind parallel: <b>keine Lösung</b>.";
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(p.curve(x=>m1*x+b1)+p.curve(x=>m2*x+b2,"var(--s-chemie)")+extra);
    el.querySelector("#"+w+"-t").innerHTML=`<span style="color:var(--accent)">I: y = ${lin([[m1,"x"],[b1,""]])}</span> &nbsp; <span style="color:var(--s-chemie)">II: y = ${lin([[m2,"x"],[b2,""]])}</span><br>${txt}`};
  ids.forEach(i=>i.oninput=draw);draw()};

WIDGETS.binom=function(el){const w=wid("bi");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"a","a",2,8,5)}${slider(w+"b","b",1,5,2)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const A=el.querySelector("#"+w+"a"),B=el.querySelector("#"+w+"b");
  const draw=()=>{const a=+A.value,b=+B.value,u=200/(a+b),s=a*u,t=b*u;el.querySelector("#"+w+"a-v").textContent=a;el.querySelector("#"+w+"b-v").textContent=b;
    const R_=(x,y,ww,hh,c,l)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="${c}" fill-opacity=".35" stroke="var(--ink)" stroke-width="1.5"/><text x="${x+ww/2}" y="${y+hh/2+5}" text-anchor="middle" font-size="${Math.min(15,Math.max(10,Math.min(ww,hh)/3))}" font-weight="700" font-family="var(--f-mono)" fill="var(--ink)">${l}</text>`;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="-24 -24 230 230" width="230" role="img" aria-label="Quadrat mit Seite a plus b">${R_(0,0,s,s,"var(--accent)","a²")}${R_(s,0,t,s,"var(--signal)","ab")}${R_(0,s,s,t,"var(--signal)","ab")}${R_(s,s,t,t,"var(--s-chemie)","b²")}<text x="${s/2}" y="-8" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--muted)">a</text><text x="${s+t/2}" y="-8" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--muted)">b</text><text x="-12" y="${s/2}" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--muted)">a</text><text x="-12" y="${s+t/2+4}" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--muted)">b</text></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`(${a} + ${b})² = ${(a+b)**2}. Das große Quadrat besteht aus <b>vier</b> Teilen: ${a}² + 2 · ${a} · ${b} + ${b}² = ${a*a} + ${2*a*b} + ${b*b} = ${(a+b)**2}.<br><span class="muted small">Wer nur a² + b² = ${a*a+b*b} rechnet, vergisst die beiden gelben Rechtecke.</span>`};
  A.oninput=B.oninput=draw;draw()};

WIDGETS.parabel=function(el){const w=wid("pa");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"a","Streckung a",-3,3,1,.25)}${slider(w+"d","Verschiebung nach rechts d",-4,4,1,.5)}${slider(w+"e","Verschiebung nach oben e",-5,5,-3,.5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const ids=["a","d","e"].map(k=>el.querySelector("#"+w+k));
  const draw=()=>{const [a,d,e]=ids.map(i=>+i.value);ids.forEach(i=>el.querySelector("#"+i.id+"-v").textContent=fmt(+i.value));
    const p=plot({w:280,h:280,ymin:-7,ymax:7,xmin:-7,xmax:7});let roots="",rt="";
    if(a){const D=-e/a;if(D>0){const r=Math.sqrt(D);roots=p.dot(d-r,0,"var(--accent)",4)+p.dot(d+r,0,"var(--accent)",4);rt=`Nullstellen bei x ≈ ${fmt(Math.round((d-r)*100)/100)} und x ≈ ${fmt(Math.round((d+r)*100)/100)}.`}else if(D===0)rt="Genau eine Nullstelle (Scheitel auf der x-Achse).";else rt="Keine Nullstellen: Die Parabel erreicht die x-Achse nicht.";}
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(p.curve(x=>x*x,"var(--muted)",1.5,"5 4")+p.curve(x=>a*(x-d)**2+e)+roots+p.dot(d,e));
    el.querySelector("#"+w+"-t").innerHTML=`${term(`f(x) = ${fmt(a)}(x ${d<0?"+":MINUS} ${fmt(Math.abs(d))})² ${e<0?MINUS:"+"} ${fmt(Math.abs(e))}`)}<br>Scheitel S(${fmt(d)} | ${fmt(e)}). ${a>0?"Nach oben geöffnet.":a<0?"Nach unten geöffnet.":"a = 0: keine Parabel mehr, sondern eine Gerade."} ${Math.abs(a)>1?"Gestreckt (schmaler).":Math.abs(a)<1&&a?"Gestaucht (breiter).":""} ${rt}<br><span class="muted small">Gestrichelt: Normalparabel y = x².</span>`};
  ids.forEach(i=>i.oninput=draw);draw()};

WIDGETS.pythagoras=function(el){const w=wid("py");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"a","Kathete a",1,6,3)}${slider(w+"b","Kathete b",1,6,4)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const A=el.querySelector("#"+w+"a"),B=el.querySelector("#"+w+"b");
  const draw=()=>{const a=+A.value,b=+B.value,c=Math.hypot(a,b);el.querySelector("#"+w+"a-v").textContent=a;el.querySelector("#"+w+"b-v").textContent=b;
    const u=150/(a+b+c*.9),O=[0,0],P1=[b*u,0],P2=[0,-a*u];
    const sq=(p,q,col,l)=>{const dx=q[0]-p[0],dy=q[1]-p[1],r=[p,q,[q[0]+dy,q[1]-dx],[p[0]+dy,p[1]-dx]];const cx=(r[0][0]+r[2][0])/2,cy=(r[0][1]+r[2][1])/2;
      return `<polygon points="${r.map(x=>x.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${col}" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.4"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--f-mono)" fill="var(--ink)">${l}</text>`};
    const body=sq(P1,O,"var(--signal)",`b²=${b*b}`)+sq(O,P2,"var(--s-chemie)",`a²=${a*a}`)+sq(P2,P1,"var(--accent)",`c²=${fmt(Math.round(c*c*100)/100)}`)+`<polygon points="${O} ${P1} ${P2}" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M0,-10 L10,-10 L10,0" fill="none" stroke="var(--ink)"/>`;
    const xs=[-a*u-4,b*u+(a+b)*u+4],ys=[-a*u-b*u-10,b*u+6];
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="${-a*u-10} ${-a*u-b*u-12} ${(a+b)*u+a*u+20} ${(a+b)*u+b*u+24}" width="100%" style="max-width:300px" role="img" aria-label="Quadrate über den Seiten">${body}</svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`a² + b² = c²: ${a*a} + ${b*b} = ${a*a+b*b}. Die beiden kleinen Quadrate haben zusammen genau so viel Fläche wie das große. c = √${a*a+b*b} ≈ <b>${fmt(Math.round(c*100)/100)}</b>.`};
  A.oninput=B.oninput=draw;draw()};

WIDGETS.kreiszahl=function(el){const w=wid("kz");
  el.innerHTML=`<div class="wg"><div class="wg-vis wide" id="${w}-o"></div><div class="wg-ctl">${slider(w,"Anzahl der Tortenstücke",4,48,8,2)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Sl=el.querySelector("#"+w);
  const draw=()=>{const n=+Sl.value,r=48,ang=2*Math.PI/n,arc=r*ang;el.querySelector("#"+w+"-v").textContent=n;
    let s="",cx=60,cy=60;for(let i=0;i<n;i++){const a0=i*ang-Math.PI/2,a1=a0+ang;s+=`<path d="M${cx},${cy} L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 0 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} Z" fill="${i%2?"var(--accent)":"var(--signal)"}" fill-opacity=".55" stroke="var(--ink)" stroke-width=".6"/>`}
    const ox=130,base=110,half=r*Math.sin(ang/2);let t="";
    for(let i=0;i<n;i++){const up=i%2===0,x=ox+i*half;
      const tip=up?[x+half,base-r*Math.cos(ang/2)]:[x+half,base];
      const p1=up?[x,base]:[x,base-r*Math.cos(ang/2)],p2=up?[x+2*half,base]:[x+2*half,base-r*Math.cos(ang/2)];
      t+=`<polygon points="${p1} ${p2} ${tip}" fill="${i%2?"var(--accent)":"var(--signal)"}" fill-opacity=".55" stroke="var(--ink)" stroke-width=".6"/>`}
    const W=ox+(n+1)*half+10;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 ${Math.max(W,300)} 130" width="100%" style="max-width:520px" role="img" aria-label="Kreis in Stücke geschnitten und umgelegt">${s}${t}<text x="${ox+n*half/2}" y="126" text-anchor="middle" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">≈ halber Umfang = π · r</text><text x="${ox-6}" y="${base-r/2}" text-anchor="end" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">r</text></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`Je mehr Stücke, desto mehr sieht die umgelegte Torte aus wie ein <b>Rechteck</b>: Es ist π · r breit (halber Umfang) und r hoch. Fläche: π · r · r = <b>π · r²</b>.`};
  Sl.oninput=draw;draw()};

WIDGETS.einheitskreis=function(el){const w=wid("ek");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w,"Winkel α",0,90,30,1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Sl=el.querySelector("#"+w);
  const draw=()=>{const a=+Sl.value,rad=a*Math.PI/180,s=Math.sin(rad),c=Math.cos(rad),R0=200,ox=30,oy=230;el.querySelector("#"+w+"-v").textContent=a+"°";
    const px=ox+R0*c,py=oy-R0*s;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 260 250" width="260" role="img" aria-label="Viertelkreis mit Radius 1"><path d="M${ox+R0},${oy} A${R0},${R0} 0 0 0 ${ox},${oy-R0}" fill="none" stroke="var(--line)" stroke-width="2"/><line x1="${ox}" y1="${oy}" x2="${ox+R0+10}" y2="${oy}" stroke="var(--ink)"/><line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy-R0-10}" stroke="var(--ink)"/>
      <line x1="${ox}" y1="${oy}" x2="${px}" y2="${py}" stroke="var(--ink)" stroke-width="2.5"/><line x1="${px}" y1="${py}" x2="${px}" y2="${oy}" stroke="var(--s-chemie)" stroke-width="4"/><line x1="${ox}" y1="${oy}" x2="${px}" y2="${oy}" stroke="var(--accent)" stroke-width="4"/>
      <path d="M${ox+30},${oy} A30,30 0 0 0 ${ox+30*c},${oy-30*s}" fill="none" stroke="var(--signal)" stroke-width="2"/><circle cx="${px}" cy="${py}" r="5" fill="var(--signal)" stroke="var(--ink)"/>
      <text x="${(ox+px)/2-6}" y="${(oy+py)/2-6}" font-size="12" font-family="var(--f-mono)" fill="var(--ink)">1</text></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`Im Kreis mit Radius 1 ist die <span style="color:var(--s-chemie);font-weight:700">Höhe = sin α = ${fmt(Math.round(s*1000)/1000)}</span> und die <span style="color:var(--accent);font-weight:700">Breite = cos α = ${fmt(Math.round(c*1000)/1000)}</span>. ${a<90?`tan α = sin : cos = ${fmt(Math.round(s/c*1000)/1000)}.`:"tan 90° gibt es nicht (Teilen durch 0)."}<br><span class="muted small">Bei einem größeren Dreieck mit gleichem Winkel wird alles nur vergrößert, die Verhältnisse bleiben gleich.</span>`};
  Sl.oninput=draw;draw()};

WIDGETS.wuerfeln=function(el){const w=wid("wu");let cnt=[0,0,0,0,0,0];
  el.innerHTML=`<div class="wg"><div class="wg-vis wide" id="${w}-o"></div><div class="row"><button class="btn small" type="button" data-n="10">10× würfeln</button><button class="btn small" type="button" data-n="100">100×</button><button class="btn small" type="button" data-n="1000">1000×</button><button class="btn ghost small" type="button" data-n="0">Neu</button></div><p class="wg-out" id="${w}-t"></p></div>`;
  const draw=()=>{const N=cnt.reduce((a,b)=>a+b,0),H=150,Wb=40;let s="";
    const yT=v=>H-v/(1/3)*H;
    cnt.forEach((c,i)=>{const f=N?c/N:0;s+=`<rect x="${20+i*(Wb+10)}" y="${yT(Math.min(f,1/3))}" width="${Wb}" height="${H-yT(Math.min(f,1/3))}" fill="var(--accent)" rx="3"/><text x="${20+i*(Wb+10)+Wb/2}" y="${H+16}" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--ink)">${i+1}</text><text x="${20+i*(Wb+10)+Wb/2}" y="${H-6}" text-anchor="middle" font-size="10" font-weight="600" font-family="var(--f-mono)" fill="var(--accent-ink)">${N&&f>.06?Math.round(f*100)+"%":""}</text>`});
    s+=`<line x1="10" y1="${yT(1/6)}" x2="330" y2="${yT(1/6)}" stroke="var(--signal)" stroke-width="2" stroke-dasharray="6 4"/><text x="330" y="${yT(1/3)+12}" text-anchor="end" font-size="10" font-family="var(--f-mono)" fill="var(--ink)">1/6 ≈ 16,7 %</text>`;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 340 175" width="100%" style="max-width:340px" role="img" aria-label="Häufigkeiten beim Würfeln">${s}</svg>`;
    el.querySelector("#"+w+"-t").innerHTML=N?`${fmt(N)}-mal gewürfelt. Je öfter du würfelst, desto näher liegen alle Balken an der gelben Linie. Das ist das <b>Gesetz der großen Zahlen</b>.`:"Würfle ein paar Mal und schau, wie sich die Häufigkeiten entwickeln."};
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(!n)cnt=[0,0,0,0,0,0];for(let i=0;i<n;i++)cnt[Math.floor(Math.random()*6)]++;draw()});draw()};

WIDGETS.wachstum=function(el){const w=wid("wa");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"p","Wachstum pro Jahr (%)",-30,30,10,1)}${slider(w+"n","Jahre",5,40,20,1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Pp=el.querySelector("#"+w+"p"),Nn=el.querySelector("#"+w+"n");
  const draw=()=>{const p=+Pp.value,n=+Nn.value,K=100,q=1+p/100,lin_=x=>K+K*p/100*x,ex=x=>K*q**x;el.querySelector("#"+w+"p-v").textContent=(p>0?"+":"")+p+" %";el.querySelector("#"+w+"n-v").textContent=n;
    const ymax=Math.max(200,ex(n)*1.1,lin_(n)*1.1),st=Math.pow(10,Math.floor(Math.log10(ymax/4)));
    const pl=plot({xmin:-1,xmax:n+1,ymin:-ymax*.05,ymax,w:300,h:220,step:Math.max(st,1)>=ymax/2?ymax/4:st,labels:false});
    el.querySelector("#"+w+"-o").innerHTML=pl.wrap(pl.curve(lin_,"var(--muted)",2,"6 4")+pl.curve(ex)+pl.dot(n,ex(n)));
    el.querySelector("#"+w+"-t").innerHTML=`Start 100. Nach ${n} Jahren <b style="color:var(--accent)">exponentiell</b>: 100 · ${fmt(q)}<sup>${n}</sup> ≈ <b>${fmt(Math.round(ex(n)))}</b>. Gestrichelt <b>linear</b> (jedes Jahr gleich viel dazu): ${fmt(Math.round(lin_(n)))}.${p>0?` Verdopplungszeit ≈ ${fmt(Math.round(Math.log(2)/Math.log(q)*10)/10)} Jahre.`:p<0?` Halbwertszeit ≈ ${fmt(Math.round(Math.log(.5)/Math.log(q)*10)/10)} Jahre.`:""}`};
  Pp.oninput=Nn.oninput=draw;draw()};

WIDGETS.zehnerpotenz=function(el){const w=wid("zp");
  const PFX={"-9":"Nano (n)","-6":"Mikro (µ)","-3":"Milli (m)","-2":"Zenti (c)","-1":"Dezi (d)","0":"–","2":"Hekto (h)","3":"Kilo (k)","6":"Mega (M)","9":"Giga (G)"};
  const EX={"-9":"Größe eines Virus in m: etwa 10<sup>−7</sup>","-6":"Dicke eines Haares: etwa 70 µm","-3":"1 mm","-2":"1 cm","0":"1 m","3":"1 km","6":"1 Megawatt (ein Windrad hat 3 MW)","9":"Arbeitsspeicher: Gigabyte"};
  el.innerHTML=`<div class="wg"><div class="wg-ctl">${slider(w,"Exponent n",-9,9,3,1)}</div><p class="wg-eqline" id="${w}-e"></p><p class="wg-out" id="${w}-t"></p></div>`;
  const Sl=el.querySelector("#"+w);
  const draw=()=>{const n=+Sl.value;el.querySelector("#"+w+"-v").textContent=n;
    const dec=n>=0?fmt(10**n):"0,"+"0".repeat(-n-1)+"1";
    el.querySelector("#"+w+"-e").innerHTML=`10<sup>${n<0?MINUS+(-n):n}</sup> = <b class="term">${dec}</b>`;
    el.querySelector("#"+w+"-t").innerHTML=`${n>=0?`Eine 1 mit ${n} Nullen.`:`Kommazahl: die 1 steht an der ${-n}. Stelle hinter dem Komma. Das ist 1 : ${fmt(10**-n)}.`}${PFX[n]?` Vorsilbe: <b>${PFX[n]}</b>.`:""}${EX[n]?` Beispiel: ${EX[n]}.`:""}`};
  Sl.oninput=draw;draw()};
/* ---------- Mathe Klasse 8–10 ---------- */
const BAND810={key:"8-10",title:"Klasse 8–10",topics:[
  {id:"m-linfkt",title:"Lineare Funktionen",sub:"Steigung, Achsenabschnitt, Nullstelle",gens:["linfkt"],steps:[
    {title:"Was eine Funktion ist",body:`<p>Eine <b>Funktion</b> ordnet jedem x genau ein y zu, wie ein Automat: Zahl rein, Zahl raus. Bei <b>linearen</b> Funktionen ist der Graph eine Gerade.</p><p class="eq">f(x) = m · x + b</p><p><b>b</b> ist der <b>y-Achsenabschnitt</b>: Dort schneidet die Gerade die y-Achse (bei x = 0). <b>m</b> ist die <b>Steigung</b>: Wie viel geht es nach oben, wenn man 1 nach rechts geht?</p><p>Beispiel: Ein Kajak kostet 5 € Grundgebühr und 8 € pro Stunde. f(x) = 8x + 5. Nach 3 h: f(3) = 29 €.</p>`,w:"gerade"},
    {title:"Steigung berechnen und Nullstelle",body:`<p>Aus zwei Punkten P(x₁ | y₁) und Q(x₂ | y₂):</p><p class="eq">m = (y₂ ${MINUS} y₁) : (x₂ ${MINUS} x₁)</p><p>„Höhenunterschied durch Breitenunterschied.“ Positives m: Die Gerade steigt. Negatives m: Sie fällt.</p><p>Die <b>Nullstelle</b> ist der Punkt, an dem die Gerade die x-Achse schneidet. Dort ist f(x) = 0. Also die Gleichung mx + b = 0 lösen.</p>`}]},
  {id:"m-lgs",title:"Lineare Gleichungssysteme",sub:"Zwei Gleichungen, zwei Unbekannte",gens:["lgs"],steps:[
    {title:"Zwei Geraden, ein Schnittpunkt",body:`<p>Ein Gleichungssystem hat zwei Gleichungen mit zwei Unbekannten (x und y). Jede Gleichung ist eine Gerade. Die Lösung ist der <b>Schnittpunkt</b>, denn nur dort passen beide.</p><p>Beispiel: 3 Kaffee und 2 Kuchen kosten 13 €, 1 Kaffee und 2 Kuchen 7 €. Welcher Preis gehört zu welchem?</p>`,w:"lgs"},
    {title:"Drei Lösungsverfahren",body:`<ul class="rules"><li><b>Gleichsetzungsverfahren:</b> Beide Gleichungen nach y auflösen und gleichsetzen.</li><li><b>Einsetzungsverfahren:</b> Eine Gleichung nach einer Variablen auflösen und in die andere einsetzen.</li><li><b>Additionsverfahren:</b> Gleichungen so mit Zahlen malnehmen, dass beim Addieren oder Subtrahieren eine Variable verschwindet.</li></ul><p class="eq">I: 3k + 2u = 13<br>II: k + 2u = 7<br>I ${MINUS} II: 2k = 6 → k = 3, dann u = 2</p><p>Der Kaffee kostet 3 €, der Kuchen 2 €. Probe in beiden Gleichungen machen!</p>`}]},
  {id:"m-binom",title:"Binomische Formeln",sub:"Ausmultiplizieren und faktorisieren",gens:["binom"],steps:[
    {title:"Die drei Formeln",body:`<p class="eq">1. (a + b)² = a² + 2ab + b²<br>2. (a ${MINUS} b)² = a² ${MINUS} 2ab + b²<br>3. (a + b)(a ${MINUS} b) = a² ${MINUS} b²</p><p>Sie sind Abkürzungen fürs Ausmultiplizieren. Warum das Mittelglied 2ab da ist, zeigt das Bild:</p>`,w:"binom"},
    {title:"Rückwärts: faktorisieren",body:`<p>Oft muss man die Formel rückwärts erkennen: x² + 10x + 25. Ist 25 eine Quadratzahl (5²)? Ist das Mittelglied 2 · x · 5 = 10x? Ja, also (x + 5)².</p><p>x² ${MINUS} 49 = (x + 7)(x ${MINUS} 7), wegen der 3. Formel.</p><p class="tip">Kopfrechentrick: 49² = (50 ${MINUS} 1)² = 2500 ${MINUS} 100 + 1 = 2401.</p>`}]},
  {id:"m-potenz",title:"Potenzen und Wurzeln",sub:"Potenzgesetze, wissenschaftliche Schreibweise",gens:["potenzen"],steps:[
    {title:"Potenzen",body:`<p>Eine <b>Potenz</b> ist eine Abkürzung für wiederholtes Malnehmen: 2<sup>5</sup> = 2 · 2 · 2 · 2 · 2 = 32. Die 2 ist die <b>Basis</b>, die 5 der <b>Exponent</b>.</p><ul class="rules"><li>a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup></li><li>a<sup>m</sup> : a<sup>n</sup> = a<sup>m${MINUS}n</sup></li><li>(a<sup>m</sup>)<sup>n</sup> = a<sup>m·n</sup></li><li>a<sup>0</sup> = 1 und a<sup>${MINUS}n</sup> = 1 : a<sup>n</sup></li></ul><p>Die <b>Quadratwurzel</b> √a ist die Umkehrung von hoch 2: √81 = 9, weil 9² = 81.</p>`},
    {title:"Zehnerpotenzen",body:`<p>In Naturwissenschaften sind Zahlen oft riesig oder winzig. Die <b>wissenschaftliche Schreibweise</b> spart Nullen: 380.000 km = 3,8 · 10<sup>5</sup> km (Entfernung zum Mond). Eine Zelle ist etwa 0,00001 m = 1 · 10<sup>${MINUS}5</sup> m groß.</p>`,w:"zehnerpotenz"}]},
  {id:"m-qfkt",title:"Quadratische Funktionen",sub:"Parabeln und Scheitelpunkt",gens:["qfkt"],steps:[
    {title:"Die Parabel",body:`<p>Der Graph von f(x) = x² ist die <b>Normalparabel</b>, eine U-Form mit dem tiefsten Punkt bei (0 | 0). Diesen Punkt nennt man <b>Scheitelpunkt</b>.</p><p>In der <b>Scheitelpunktform</b> f(x) = a(x ${MINUS} d)² + e liest man alles direkt ab:</p><ul class="rules"><li>d: Verschiebung nach rechts (Achtung, Minus in der Klammer!)</li><li>e: Verschiebung nach oben</li><li>a: Streckung; ist a negativ, ist die Parabel nach unten geöffnet.</li></ul>`,w:"parabel"},
    {title:"Von der Normalform zum Scheitel",body:`<p>Die <b>Normalform</b> f(x) = x² + px + q verrät den Scheitel nicht direkt. Mit der <b>quadratischen Ergänzung</b> kommt man hin:</p><p class="eq">x² ${MINUS} 6x + 5<br>= (x² ${MINUS} 6x + 9) ${MINUS} 9 + 5<br>= (x ${MINUS} 3)² ${MINUS} 4 → S(3 | ${MINUS}4)</p><p>Man ergänzt (p/2)², damit eine binomische Formel entsteht, und zieht es gleich wieder ab. Abkürzung: Der Scheitel liegt immer bei x = ${MINUS}p/2.</p><p class="tip">Parabeln gibt es überall: Wurfbahnen, Wasserstrahlen, Brückenbögen.</p>`}]},
  {id:"m-qgl",title:"Quadratische Gleichungen",sub:"p-q-Formel, Nullprodukt",gens:["qgl"],steps:[
    {title:"Die p-q-Formel",body:`<p>Jede Gleichung der Form x² + px + q = 0 löst man mit der <b>p-q-Formel</b>:</p><p class="eq">x₁,₂ = ${MINUS}p/2 ± √((p/2)² ${MINUS} q)</p><p>Was unter der Wurzel steht (die <b>Diskriminante</b>), entscheidet:</p><ul class="rules"><li>positiv: zwei Lösungen</li><li>null: eine Lösung</li><li>negativ: keine Lösung (die Parabel schneidet die x-Achse nicht)</li></ul><p>Steht vor x² eine Zahl, zuerst die ganze Gleichung durch sie teilen.</p>`},
    {title:"Abkürzungen",body:`<ul class="rules"><li><b>Ohne x-Glied:</b> x² = 49 → x = 7 oder x = ${MINUS}7. Die negative Lösung nicht vergessen!</li><li><b>Ohne Zahl:</b> x² ${MINUS} 5x = 0 → x(x ${MINUS} 5) = 0 → x = 0 oder x = 5. Ausklammern.</li><li><b>Satz vom Nullprodukt:</b> (x ${MINUS} 2)(x + 3) = 0 → x = 2 oder x = ${MINUS}3. Ein Produkt ist null, wenn ein Faktor null ist.</li></ul><p class="tip">Probe nach Vieta: Die beiden Lösungen ergeben zusammen ${MINUS}p und malgenommen q.</p>`}]},
  {id:"m-pyth",title:"Satz des Pythagoras",sub:"Seiten im rechtwinkligen Dreieck",gens:["pythagoras"],steps:[
    {title:"a² + b² = c²",body:`<p>In jedem <b>rechtwinkligen</b> Dreieck gilt: Die beiden kurzen Seiten (<b>Katheten</b> a und b) im Quadrat ergeben zusammen das Quadrat der langen Seite (<b>Hypotenuse</b> c). Die Hypotenuse liegt immer gegenüber vom rechten Winkel.</p>`,w:"pythagoras"},
    {title:"Anwenden",body:`<p>Gesucht ist die Hypotenuse: c = √(a² + b²). Gesucht ist eine Kathete: a = √(c² ${MINUS} b²).</p><p>Beispiel: Ein Bootssteg-Geländer soll diagonal verstrebt werden. Pfosten 1,2 m hoch, 1,6 m Abstand. Strebe: √(1,44 + 2,56) = √4 = 2 m.</p><p class="tip">Zimmermanns-Trick: Ein Seil mit Knoten im Abstand 3, 4 und 5 ergibt ein exaktes rechtwinkliges Dreieck. So wurden schon im alten Ägypten rechte Winkel abgesteckt.</p>`}]},
  {id:"m-kreis",title:"Kreis und Körper",sub:"π, Zylinder, Kegel, Kugel",gens:["kreis"],steps:[
    {title:"Die Kreiszahl π",body:`<p>Bei jedem Kreis ist der Umfang etwas mehr als dreimal so lang wie der Durchmesser, genau <b>π ≈ 3,14159</b>-mal.</p><p class="eq">Umfang U = 2 · π · r = π · d<br>Fläche A = π · r²</p><p>Warum die Fläche π · r² ist, zeigt die zerschnittene Torte:</p>`,w:"kreiszahl"},
    {title:"Körper",body:`<table class="tbl"><tr><th>Körper</th><th>Volumen</th></tr><tr><td>Quader</td><td>a · b · c</td></tr><tr><td>Zylinder</td><td>π · r² · h</td></tr><tr><td>Kegel</td><td>⅓ · π · r² · h</td></tr><tr><td>Pyramide</td><td>⅓ · Grundfläche · h</td></tr><tr><td>Kugel</td><td>⁴⁄₃ · π · r³</td></tr></table><p>Prismen und Zylinder: Grundfläche mal Höhe. Spitze Körper (Kegel, Pyramide): ein Drittel davon.</p><p class="tip">Beim Volumen springen Einheiten um 1000: 1 dm³ = 1000 cm³ = 1 Liter.</p>`}]},
  {id:"m-trig",title:"Trigonometrie",sub:"Sinus, Kosinus, Tangens",gens:["trig"],steps:[
    {title:"Seitenverhältnisse",body:`<p>Im rechtwinkligen Dreieck gehören zu jedem Winkel α feste Seitenverhältnisse. Die Seiten heißen von α aus gesehen:</p><ul class="rules"><li><b>Gegenkathete:</b> liegt gegenüber von α</li><li><b>Ankathete:</b> liegt an α an</li><li><b>Hypotenuse:</b> die lange Seite</li></ul><p class="eq">sin α = Gegenkathete : Hypotenuse<br>cos α = Ankathete : Hypotenuse<br>tan α = Gegenkathete : Ankathete</p><p class="tip">Merksatz: <b>GAGA HühnerHof AG</b>: sin = G/H, cos = A/H, tan = G/A.</p>`},
    {title:"Am Einheitskreis",body:`<p>Im Kreis mit Radius 1 sind sin und cos einfach Höhe und Breite des Dreiecks. Drehe den Winkel:</p>`,w:"einheitskreis"},
    {title:"Winkel berechnen",body:`<p>Kennst du zwei Seiten, bekommst du den Winkel mit der <b>Umkehrfunktion</b> (sin⁻¹, cos⁻¹, tan⁻¹, oft SHIFT + sin auf dem Taschenrechner).</p><p>Beispiel: Eine Slipanlage steigt auf 10 m Länge um 1,5 m. sin α = 1,5 : 10 = 0,15 → α ≈ 8,6°.</p><p class="warn">Der Taschenrechner muss auf <b>DEG</b> (Grad) stehen, nicht auf RAD. Sonst kommen völlig falsche Werte heraus.</p>`}]},
  {id:"m-wkeit",title:"Wahrscheinlichkeit",sub:"Laplace, Baumdiagramm, Gegenereignis",gens:["wkeit"],steps:[
    {title:"Günstige durch mögliche",body:`<p>Sind alle Ergebnisse gleich wahrscheinlich (fairer Würfel, gut gemischte Karten), gilt die <b>Laplace-Regel</b>:</p><p class="eq">P = Anzahl günstiger Ergebnisse : Anzahl aller Ergebnisse</p><p>P liegt immer zwischen 0 (unmöglich) und 1 (sicher). Eine 6 würfeln: P = ${F(1,6)} ≈ 16,7 %.</p><p>Ob das stimmt, zeigt der Versuch:</p>`,w:"wuerfeln"},
    {title:"Mehrstufige Versuche",body:`<p>Für zwei oder mehr Schritte zeichnet man ein <b>Baumdiagramm</b>.</p><ul class="rules"><li><b>Pfadregel:</b> Entlang eines Pfades malnehmen.</li><li><b>Summenregel:</b> Mehrere passende Pfade addieren.</li><li><b>Mit oder ohne Zurücklegen?</b> Ohne Zurücklegen ändern sich die Zahlen im zweiten Schritt.</li></ul><p><b>Gegenereignis:</b> „Mindestens einmal“ rechnet man am einfachsten über 1 ${MINUS} P(keinmal).</p>`}]},
  {id:"m-expo",title:"Exponentielles Wachstum",sub:"Zinseszins, Halbwertszeit",gens:["expo"],steps:[
    {title:"Linear oder exponentiell?",body:`<p><b>Linear:</b> Jedes Jahr kommt <b>gleich viel</b> dazu (+ 10 €).<br><b>Exponentiell:</b> Jedes Jahr wird mit <b>dem gleichen Faktor</b> malgenommen (+ 10 %, also · 1,1).</p><p class="eq">N(t) = N₀ · q<sup>t</sup></p><p>N₀ ist der Startwert, q der Wachstumsfaktor. Bei p % Wachstum ist q = 1 + p/100, bei Abnahme q = 1 ${MINUS} p/100.</p>`,w:"wachstum"},
    {title:"Beispiele aus dem Leben",body:`<ul class="rules"><li><b>Zinseszins:</b> 1000 € bei 3 % über 10 Jahre: 1000 · 1,03<sup>10</sup> ≈ 1344 €.</li><li><b>Bakterien:</b> Verdopplung alle 20 Minuten. Nach 3 Stunden sind es 2<sup>9</sup> = 512-mal so viele.</li><li><b>Medikamente:</b> Halbwertszeit 4 h. Nach 12 h ist noch ⅛ im Blut.</li><li><b>Radioaktivität:</b> Gleiches Prinzip, oft über Jahrtausende.</li></ul>`}]},
]};

Object.assign(KT,{
  "m-linfkt":`<p>Lineare Funktionen werden fast immer mit <b>Wertetabelle</b> und Zeichnung eingeführt. Lass dein Kind eine Tabelle für den Handytarif oder das Taschengeld anlegen, dann die Punkte zeichnen: Sie liegen auf einer Geraden.</p><p><b>Typischer Fehler:</b> Beim Steigungsdreieck die Kästchen falsch herum zählen (erst hoch, dann rechts). Merksatz: „Erst nach rechts gehen, dann hoch oder runter.“</p><p><b>Prüffrage:</b> „Was bedeutet die Steigung hier im Alltag?“ (z. B. Euro pro Stunde)</p>`,
  "m-lgs":`<p>Schulen lassen meist alle drei Verfahren lernen. In Arbeiten wird oft vorgegeben, welches zu nutzen ist. Schau ins Heft, welches gerade dran ist.</p><p>Gut zum Üben sind <b>Rätsel</b>: „Ich bin 30 Jahre älter als mein Kind, zusammen sind wir 44.“</p><p><b>Typischer Fehler:</b> Nur x ausrechnen und y vergessen. Oder beim Malnehmen einer Gleichung eine Seite vergessen.</p>`,
  "m-binom":`<p>Die binomischen Formeln werden in Klasse 8 einfach auswendig gelernt. Das Flächenbild (Quadrat mit vier Teilen) hilft vielen Kindern beim Verstehen, das kannst du auf Papier nachbauen.</p><p><b>Typischer Fehler, absoluter Klassiker:</b> (a + b)² = a² + b². Gegenprobe mit Zahlen: (3 + 2)² = 25, aber 9 + 4 = 13.</p>`,
  "m-potenz":`<p>Hier wird der Taschenrechner wichtig. <b>Welches Modell die Schule vorschreibt</b>, steht auf der Materialliste. Lern du die Tasten mit, dann kannst du bei den Hausaufgaben helfen (x², √, x<sup>y</sup>, ×10<sup>x</sup> bzw. EXP).</p><p><b>Typischer Fehler:</b> 2<sup>3</sup> = 6 (Exponent mit der Basis malgenommen). Ausschreiben hilft: 2 · 2 · 2.</p>`,
  "m-qfkt":`<p>Parabeln werden oft mit einer <b>Parabelschablone</b> gezeichnet und mit Programmen wie GeoGebra untersucht. GeoGebra ist kostenlos, und ihr könnt damit zusammen Regler ausprobieren, wie in der Animation hier.</p><p><b>Typischer Fehler:</b> Bei (x ${MINUS} 3)² wird der Scheitel bei ${MINUS}3 gesucht. Prüffrage: „Für welches x wird die Klammer null?“</p>`,
  "m-qgl":`<p>Manche Schulen lehren statt der p-q-Formel die <b>abc-Formel</b> (Mitternachtsformel) für ax² + bx + c = 0. Beide liefern das Gleiche. Schau ins Heft, welche benutzt wird.</p><p><b>Typische Fehler:</b> Die Gleichung nicht vorher auf „= 0“ bringen. Vorzeichenfehler bei ${MINUS}p/2. Die zweite Lösung vergessen.</p>`,
  "m-pyth":`<p>Pythagoras lässt sich zu Hause schön nachweisen: Quadrate aus Karopapier über die Seiten eines 3-4-5-Dreiecks legen und Kästchen zählen.</p><p><b>Typischer Fehler:</b> Die Formel stur als a² + b² = c² anwenden, auch wenn eine Kathete gesucht ist. Erst fragen: „Welche Seite liegt gegenüber vom rechten Winkel?“</p>`,
  "m-kreis":`<p>π kann man selbst messen: Mit einer Schnur den Umfang von Dosen, Tellern und Eimern messen und durch den Durchmesser teilen. Es kommt immer etwa 3,1 heraus. Das beeindruckt Kinder.</p><p><b>Typischer Fehler:</b> Radius und Durchmesser verwechseln. Und π · r² als (π · r)² rechnen.</p>`,
  "m-trig":`<p>Trigonometrie lässt sich draußen anwenden: Mit einem Handy-Neigungsmesser den Winkel zur Baumspitze messen, die Entfernung abschreiten, und mit tan die Höhe berechnen.</p><p><b>Typische Fehler:</b> Taschenrechner steht auf RAD. Gegen- und Ankathete verwechseln, weil sie vom Winkel abhängen. Immer erst den Winkel markieren und die Seiten von dort aus benennen.</p>`,
  "m-wkeit":`<p>Wahrscheinlichkeit lernen Kinder am besten mit <b>echten Versuchen</b>: 50-mal eine Münze werfen, Strichliste führen. Danach kommt die Theorie.</p><p><b>Typischer Fehler:</b> „Jetzt kam fünfmal Kopf, also kommt bestimmt Zahl.“ Die Münze hat kein Gedächtnis.</p>`,
  "m-expo":`<p>Gutes Gesprächsthema: Die Geschichte vom Schachbrett und den Reiskörnern (1, 2, 4, 8 … auf 64 Feldern). Oder: Was wird aus 100 € Sparguthaben in 40 Jahren?</p><p><b>Typischer Fehler:</b> 10 % Wachstum über 3 Jahre = 30 %. In Wirklichkeit 1,1³ = 1,331, also 33,1 %.</p>`,
});

const pw=c=>{let s="";c.forEach(([k,e])=>{if(!k)return;const a=Math.abs(k);s+=sg(k,!s)+((a===1&&e!==0)?"":fmt(a))+(e===0?"":"x"+(e===1?"":`<sup>${e}</sup>`))});return s||"0"};
const vs=v=>`(${v.map(fmt).join(" | ")})`, dot3=(u,v)=>u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
const nCk=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const QUAD=[[1,2,2,3],[2,3,6,7],[2,6,9,11],[4,4,7,9],[1,4,8,9],[6,6,7,11]];
const lin3=v=>{let r="";v.forEach((x,i)=>{const a=Math.abs(x);r+=(i?(x<0?" "+MINUS+" ":" + "):(x<0?MINUS:""))+(a===1?"":a)+"x"+"₁₂₃"[i]});return r};
const nv=()=>{const q=pick(QUAD);return{v:shuffle(q.slice(0,3)).map(x=>x*pick([-1,1])),L:q[3]}};
Object.assign(G,{
  ableit(){const t=ri(0,3);

      return{q:`Gegeben: ${term(`f(x) = ${pw([[a,n],[b,1]])}`)}. Berechne die Steigung bei x = ${fmt(k)}, also ${term(`f′(${fmt(k)})`)}.`,kind:"num",ans:R(v),sol:`Potenzregel: aus x<sup>n</sup> wird n · x<sup>n${MINUS}1</sup>. f′(x) = ${pw([[n*a,n-1],[b,0]])}. Einsetzen: f′(${fmt(k)}) = <b>${fmt(v)}</b>.`}}
    if(t===1){const a=pick([1,2,3,-1,-2]),x0=ri(-4,4),b=-2*a*x0,c=ri(-5,5);
      return{q:`Wo hat ${term(`f(x) = ${pw([[a,2],[b,1],[c,0]])}`)} eine waagerechte Tangente? Gib den x-Wert ein.`,kind:"num",ans:R(x0),sol:`Waagerecht heißt Steigung 0: f′(x) = ${pw([[2*a,1],[b,0]])} = 0 → x = <b>${fmt(x0)}</b>.`}}
    if(t===2){const n=ri(2,5),a=ri(2,6),ok=pw([[n*a,n-1]]),o=shuffle([ok,pw([[a,n-1]]),pw([[n*a,n]]),pw([[a*(n+1),n+1]])]);
      return{q:`Wie lautet die Ableitung von ${term(`f(x) = ${pw([[a,n]])}`)}?`,kind:"choice",opts:o.map(term),correct:o.indexOf(ok),sol:`Exponent nach vorn, Exponent um 1 kleiner: ${n} · ${a} = ${n*a}, also f′(x) = ${term(ok)}.`}}
    const a=ri(1,4),k=ri(2,6);
    return{q:`Ein Boot beschleunigt: Nach t Sekunden hat es ${term(`s(t) = ${a}t²`)} Meter zurückgelegt. Wie schnell ist es nach ${k} s?${unit("m/s")}`,kind:"num",ans:R(2*a*k),sol:`Die Geschwindigkeit ist die Ableitung des Weges: s′(t) = ${2*a}t. s′(${k}) = <b>${2*a*k} m/s</b>.`}},
  kurve(){const a=ri(1,3),f=pw([[1,3],[-3*a*a,1]]),t=ri(0,3);
    if(t===0)return{q:`Bestimme den x-Wert des <b>Hochpunkts</b> von ${term(`f(x) = ${f}`)}.`,kind:"num",ans:R(-a),sol:`f′(x) = 3x² ${MINUS} ${3*a*a} = 0 → x = ±${a}. f″(x) = 6x. f″(${MINUS}${a}) = ${MINUS}${6*a} &lt; 0: Hochpunkt bei x = <b>${MINUS}${a}</b>.`};
    if(t===1)return{q:`Wie groß ist der y-Wert des <b>Tiefpunkts</b> von ${term(`f(x) = ${f}`)}?`,kind:"num",ans:R(-2*a**3),sol:`f′(x) = 3x² ${MINUS} ${3*a*a} = 0 → x = ±${a}. f″(${a}) = ${6*a} &gt; 0: Tiefpunkt bei x = ${a}. f(${a}) = ${a**3} ${MINUS} ${3*a**3} = <b>${fmt(-2*a**3)}</b>.`};
    if(t===2){const k=pick([-3,-2,-1,1,2,3]),c=ri(-4,4);
      return{q:`Wo liegt die <b>Wendestelle</b> von ${term(`f(x) = ${pw([[1,3],[3*k,2],[c,0]])}`)}? Gib den x-Wert ein.`,kind:"num",ans:R(-k),sol:`f′(x) = 3x² + ${fmt(6*k)}x, f″(x) = 6x + ${fmt(6*k)}. Wendestelle: f″(x) = 0 → x = <b>${fmt(-k)}</b>.`}}
    const s=pick([-1,1]);

  integral(){const t=ri(0,3),k=ri(1,4);

    if(t===1){const a=pick([3,6,-3]),b=ri(-4,4),v=a*k**3/3+b*k;return{q:`Berechne ${term(`∫<sub>0</sub><sup>${k}</sup> (${pw([[a,2],[b,0]])}) dx`)}.`,kind:"num",ans:R(v),sol:`F(x) = ${a/3}x³ ${b<0?MINUS:"+"} ${Math.abs(b)}x. F(${k}) ${MINUS} F(0) = <b>${fmt(v)}</b>.`}}
    if(t===2){const n=ri(1,4),c=ri(1,4),a=(n+1)*c,ok=pw([[c,n+1]])+" + C",o=shuffle([ok,pw([[a*n,n-1]])+" + C",pw([[a,n+1]])+" + C",pw([[c,n]])+" + C"]);
      return{q:`Welche Funktion ist eine <b>Stammfunktion</b> von ${term(`f(x) = ${pw([[a,n]])}`)}?`,kind:"choice",opts:o.map(term),correct:o.indexOf(ok),sol:`Aufleiten: Exponent um 1 erhöhen und durch den neuen Exponenten teilen. ${a} : ${n+1} = ${c}. Ableiten zur Probe ergibt wieder ${pw([[a,n]])}.`}}
    const m=ri(2,4);

  efkt(){const t=ri(0,3);

    if(t===2){const c=pick([2,3,5,7,10,20]),v=Math.log(c);return{q:`Löse ${term(`e<sup>x</sup> = ${c}`)}. Runde auf zwei Nachkommastellen.`,kind:"num",ans:R(Math.round(v*100),100),tol:.006,sol:`Auf beiden Seiten ln anwenden: x = ln ${c} ≈ <b>${fmt(Math.round(v*100)/100)}</b>.`}}
    const k=pick([.05,.1,.2,.25]);

  trigf(){const t=ri(0,2);

    if(t===1){const b=pick([2,3,4,5,6,8,9,10]);return{q:`Wie lang ist die Periode von ${term(`f(x) = sin(${b}x)`)} in Grad?${unit("Grad")}`,kind:"num",ans:R(360,b),sol:`Die Periode ist 360° : b = 360° : ${b} = <b>${360/b}°</b>. Je größer b, desto schneller schwingt die Kurve.`}}
    const c=pick([[30,1,2],[150,1,2],[210,-1,2],[270,-1,1],[90,1,1],[180,0,1]]);
    return{q:`Wie groß ist ${term(`sin ${c[0]}°`)}?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(c[1],c[2]),tol:.003,sol:`Am Einheitskreis ist sin die Höhe des Punktes: sin ${c[0]}° = <b>${FR(R(c[1],c[2]))}</b>.`}},
  vektor(){const t=ri(0,3);
    if(t===0){const {v,L}=nv(),A=[ri(-3,3),ri(-3,3),ri(-3,3)],B=A.map((a,i)=>a+v[i]);
      return{q:`Gegeben sind ${term(`A(${A.map(fmt).join(" | ")})`)} und ${term(`B(${B.map(fmt).join(" | ")})`)}. Wie lang ist die Strecke AB?`,kind:"num",ans:R(L),sol:`AB = B ${MINUS} A = ${vs(v)}. |AB| = √(${v.map(x=>x*x).join(" + ")}) = √${L*L} = <b>${L}</b>.`}}

    if(t===2){const p=pick([-4,-3,-2,-1,1,2,3,4]),q=pick([-4,-3,-2,-1,1,2,3,4]),r=ri(1,4),s=pick([0,0,2,-3]),u=[p,q,r],w=[q,-p,s];
      return{q:`Stehen ${term(`u = ${vs(u)}`)} und ${term(`v = ${vs(w)}`)} <b>senkrecht</b> aufeinander?`,kind:"choice",opts:["Ja","Nein"],correct:s===0?0:1,sol:`Senkrecht, wenn das Skalarprodukt 0 ist: ${u.map((x,i)=>`${P(x)} · ${P(w[i])}`).join(" + ")} = ${fmt(dot3(u,w))}. ${s===0?"Das ist 0: ja.":"Nicht 0: nein."}`}}
    const A=[ri(-3,3),ri(-3,3),ri(-3,3)],u=[pick([1,2,-1,-2]),ri(-2,2),ri(-2,2)],k=ri(-2,3),yes=Math.random()<.5,Pt=A.map((a,i)=>a+k*u[i]+(!yes&&i===1?pick([-1,1]):0));
    return{q:`Liegt ${term(`P(${Pt.map(fmt).join(" | ")})`)} auf der Geraden ${term(`g: x = ${vs(A)} + t · ${vs(u)}`)}?`,kind:"choice",opts:["Ja","Nein"],correct:yes?0:1,sol:`Erste Zeile: ${fmt(Pt[0])} = ${fmt(A[0])} + t · ${P(u[0])} → t = ${fmt(k)}. Dieses t in die anderen Zeilen einsetzen: ${vs(A.map((a,i)=>a+k*u[i]))}. ${yes?"Das ist P: ja.":"Das ist nicht P: nein."}`}},
  ebene(){const t=ri(0,3),a=ri(1,3),b=ri(-3,3),c=ri(-3,3),P3=[ri(-3,3),ri(-3,3),ri(-3,3)],val=a*P3[0]+b*P3[1]+c*P3[2],eq=(d)=>term(`E: ${pw([[a,1]]).replace(/x/,"x₁")}${b?` ${b<0?MINUS:"+"} ${Math.abs(b)===1?"":Math.abs(b)}x₂`:""}${c?` ${c<0?MINUS:"+"} ${Math.abs(c)===1?"":Math.abs(c)}x₃`:""} = ${typeof d==="number"?fmt(d):d}`);
