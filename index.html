/* ---------- Kapitel 10: Labornetzteil ---------- */
Object.assign(G,{
  el10a(){ /* leicht: Leistung */
    const U=pick([5,9,12]),I=pick([.1,.2,.5,1]);
    return{q:`Das Labornetzteil zeigt ${U} V und ${fmt(I)} A an. Welche Leistung gibt es ab?${unit("W")}`,kind:"num",ans:R(U*Math.round(I*10),10),sol:`P = U · I = ${U} V · ${fmt(I)} A = <b>${fmt(U*I)} W</b>.`}},
  el10b(){ /* mittel: CV oder CC, Strom */
    const r=loopf(()=>{const U=pick([5,10,12]),Rr=pick([10,20,25,40,50,100]),Il=pick([.1,.2,.5,1]),I0=U/Rr;return {U,Rr,Il,I0}});
    const I=Math.min(r.I0,r.Il),lim=r.I0>r.Il;
    return{q:`Ein Labornetzteil ist auf ${r.U} V und eine Strombegrenzung von ${fmt(r.Il)} A eingestellt. Es wird ein Widerstand von ${fmt(r.Rr)} Ω angeschlossen. Welcher Strom fließt?${unit("A")}`,kind:"num",ans:R(Math.round(I*1000),1000),
      sol:`Ohne Begrenzung: I = ${r.U} V : ${fmt(r.Rr)} Ω = ${fmt(r.I0)} A. ${lim?`Das ist mehr als ${fmt(r.Il)} A, die Strombegrenzung greift (CC): Es fließen <b>${fmt(I)} A</b>.`:`Das ist nicht mehr als ${fmt(r.Il)} A, das Netzteil bleibt in Spannungsregelung (CV): Es fließen <b>${fmt(I)} A</b>.`}`}},
  el10c(){ /* schwer: Leistung bei Strombegrenzung */
    const r=loopf(()=>{const Rr=pick([10,20,40,50]),Il=pick([.1,.2,.5]),U=12;return U/Rr>Il?{Rr,Il,U}:0}),Ua=r.Il*r.Rr,P=r.Il*r.Il*r.Rr;
    return{q:`Ein Labornetzteil ist auf ${r.U} V und ${fmt(r.Il)} A Strombegrenzung eingestellt. Es hängt an einem Widerstand von ${fmt(r.Rr)} Ω und begrenzt den Strom. Welche Leistung setzt der Widerstand um?${unit("W")}`,kind:"num",ans:R(Math.round(P*10000),10000),
      sol:`Begrenzt: I = ${fmt(r.Il)} A. Die Spannung bricht auf U = R · I = ${fmt(r.Rr)} Ω · ${fmt(r.Il)} A = ${fmt(Ua)} V ein. P = U · I = ${fmt(Ua)} V · ${fmt(r.Il)} A = <b>${fmt(P)} W</b>.`}},
  el10q(){return pick([
    ()=>ELC("Was zeigt die Anzeige CC am Labornetzteil?","Die Strombegrenzung greift",["Der Ausgang ist abgeschaltet","Die Spannung ist zu hoch"],"CC heißt <b>Constant Current</b>: Das Netzteil hält den Strom konstant und senkt dafür die Spannung."),
    ()=>ELC("Wofür ist die grün-gelbe Buchse (GND) am Netzteil da?","Sie ist der Anschluss zum Schutzleiter am Gehäuse, nicht der Minuspol",["Sie ist der Pluspol","Sie ist der zweite Minuspol"],"Sie verbindet das Gehäuse mit dem <b>Schutzleiter</b>. Plus und Minus sind die farbigen Buchsen (rot und schwarz)."),
    ()=>ELC("Was ist beim Verkabeln am Netzteil richtig?","Erst Ausgang aus, dann verkabeln, dann einschalten",["Verkabeln bei voller Spannung","Erst einschalten, dann Kabel stecken"],"So vermeidest du Funken und Kurzschlüsse beim Stecken.")])()}
});

EL_TOPICS.push(T("p-el10","Arbeiten mit dem Labornetzteil","Spannung und Strombegrenzung einstellen",["el10a","el10b","el10c","el10q"],[
 ["Lernziel und Idee",`<p class="tip">Lernziel: Du kannst ein Labornetzteil sicher bedienen: Spannung und Strombegrenzung einstellen, Plus und Minus richtig anschließen.</p><p>Ein <b>Labornetzteil</b> liefert eine einstellbare Gleichspannung. Es wandelt die 230 V der Steckdose im Gehäuse in kleine Spannung um, so dass du an den Buchsen gefahrlos arbeiten kannst, solange du dich an die Regeln hältst.</p>`],

 ["Merkkasten",`<p class="eq">P = U · I</p><ul class="rules"><li>Rot Plus, schwarz Minus, GND ist Schutzleiter.</li><li>CV: Spannung fest. CC: Strom fest.</li><li>Nie mehr als 12 V einstellen.</li><li>Gehäuse nie öffnen: Dort liegen 230 V.</li></ul>`],

Object.assign(KT,{"p-el11":`<p><b>Experiment: Die Lötspitze verzinnen (nur mit Erwachsenen).</b> Material: Lötstation oder Lötkolben mit Ablage und Schwamm oder Messingwolle, Lötzinn mit Flussmittelseele, Schutzbrille, Fenster geöffnet.</p><ol class="rules"><li>Ein Erwachsener steckt die Station ein und stellt etwa 350 °C ein (je nach Lot).</li><li>Wenn die Station heiß ist, reinige die Spitze an Schwamm oder Messingwolle.</li><li>Halte das Lötzinn kurz an die Spitze. Es schmilzt und überzieht die Spitze glänzend: sie ist verzinnt.</li><li>Lege den Kolben zurück in die Ablage. Station vom Erwachsenen ausschalten und ausstecken lassen.</li></ol><p class="warn">Spitze und Station sind sehr heiß. Schutzbrille tragen, lüften, Hände waschen. Unter 14 Jahren nur mit Aufsicht eines Erwachsenen.</p><p><b>Typischer Fehler:</b> Den Kolben auf den Tisch oder auf das Kabel legen.</p>`});

  "Was ist die Batterie im Stromkreis?|Die Stromquelle|Der Schalter|Der Verbraucher|Die Batterie liefert den Strom.",
  "Was ist die Lampe im Stromkreis?|Der Verbraucher|Die Quelle|Der Schalter|Die Lampe nutzt die Energie und leuchtet.",
  "Woraus ist der Draht in einem Kabel?|Aus Metall, zum Beispiel Kupfer|Aus Plastik|Aus Holz|Metall leitet den Strom gut.",
  "Wozu ist die Plastikhülle um das Kabel?|Sie schützt, denn Plastik leitet keinen Strom|Sie macht das Kabel schwerer|Sie macht mehr Strom|Plastik ist ein Isolator, so bekommst du keinen Stromschlag.",
  "Welches Gerät braucht einen Stromkreis?|Eine Taschenlampe|Ein Bleistift|Ein Lineal|In der Taschenlampe sind Batterie, Schalter und Lampe im Kreis verbunden.",
  "Die Lampe leuchtet nicht. Was prüfst du zuerst?|Ob der Stromkreis geschlossen ist|Ob es draußen regnet|Ob die Lampe schwer ist|Oft ist irgendwo ein Kabel lose oder der Schalter offen."],
 "p34-licht":["Welche dieser Dinge ist eine Lichtquelle?|Eine Kerzenflamme|Der Mond|Ein Spiegel|Eine Lichtquelle leuchtet selbst. Der Mond und der Spiegel werfen nur Licht zurück.",
  "Wie breitet sich Licht aus?|Geradeaus|In Kurven|Im Zickzack|Licht breitet sich geradlinig aus.",
  "Wann entsteht ein Schatten?|Wenn ein undurchsichtiger Gegenstand im Licht steht|Wenn es dunkel ist|Wenn die Lampe ausgeht|Der Gegenstand hält das Licht auf, dahinter ist Schatten.",
  "Welcher Gegenstand wirft kaum einen Schatten?|Eine klare Glasscheibe|Ein Buch|Ein Ball|Glas lässt das Licht fast ganz durch.",
  "Wann sind Schatten besonders kurz?|Mittags|Morgens|Abends|Mittags steht die Sonne hoch, dann sind die Schatten kurz.",
  "Du rückst die Lampe näher an den Gegenstand. Wie wird der Schatten?|Größer|Kleiner|Gleich|Je näher die Lampe, desto größer der Schatten an der Wand.",
  "Was ist ein Schatten?|Eine Stelle, an die kein Licht kommt|Ein Stück Farbe|Ein Teil des Gegenstands|Der Schatten ist dort, wo das Licht aufgehalten wird.",
  "Die Sonne steht links von dir. Wohin zeigt dein Schatten?|Nach rechts|Nach links|Nach oben|Der Schatten liegt immer auf der Seite, die von der Lichtquelle wegzeigt.",
  "Was brauchst du für ein Schattenspiel?|Eine Lampe, einen Gegenstand und eine Wand|Nur eine Lampe|Nur eine Wand|Mit Licht, Gegenstand und Wand siehst du den Schatten.",
  "Warum hast du nachts keinen Sonnenschatten?|Die Sonne scheint dann auf die andere Seite der Erde|Die Sonne wird ausgeschaltet|Der Schatten schläft|Nachts zeigt unsere Seite der Erde von der Sonne weg."],
 "p34-schall":["Was schwingt bei einer Gitarre?|Die Saite|Der Gurt|Der Koffer|Die Saite schwingt und bringt die Luft zum Schwingen.",
  "Womit nimmst du Schall wahr?|Mit den Ohren|Mit den Augen|Mit der Nase|Das Ohr fängt die Schwingungen der Luft auf.",
  "Was braucht Schall, um sich auszubreiten?|Luft oder einen anderen Stoff|Nur Licht|Nichts|Im leeren Raum gibt es keinen Schall.",
  "Was schwingt, wenn du sprichst?|Deine Stimmbänder|Deine Zähne|Deine Haare|Die Stimmbänder im Hals schwingen und erzeugen den Ton.",
  "Bei einem Gewitter: Was nimmst du zuerst wahr?|Den Blitz|Den Donner|Beides gleichzeitig|Licht ist viel schneller als Schall. Du siehst den Blitz zuerst.",
  "Was ist ein Echo?|Schall, der von einer Wand zurückkommt|Ein sehr lauter Ton|Ein leiser Ton|Der Schall wird zurückgeworfen, du hörst ihn noch einmal.",
  "Was fängt im Ohr die Schwingungen zuerst auf?|Das Trommelfell|Die Ohrmuschel hinten|Der Ohrring|Das Trommelfell ist eine dünne Haut im Ohr, die mitschwingt.",
  "Kann sich Schall durch Wasser ausbreiten?|Ja|Nein|Nur bei Regen|Schall breitet sich auch in Wasser und festen Stoffen aus.",
  "Du lässt ein Lineal über die Tischkante schwingen. Was hörst du?|Einen Ton, weil es schwingt|Nichts, weil es ruhig ist|Einen Ton nur im Weltraum|Schwingungen erzeugen Schall.",
  "Warum hörst du jemanden hinter einer Wand?|Schall geht auch durch feste Stoffe|Die Wand leuchtet|Der Schall ist unsichtbar|Die Wand schwingt mit und gibt den Schall weiter, nur leiser."],
 "p34-wetter":["Woraus bestehen Wolken?|Aus winzigen Wassertröpfchen|Aus Staub|Aus Rauch|In Wolken sind ganz kleine Wassertröpfchen.",
  "Was erwärmt das Wasser im Wasserkreislauf?|Die Sonne|Der Mond|Der Wind|Die Sonne erwärmt das Wasser, es verdunstet.",
  "Wie nennt man es, wenn Wasser zu Wasserdampf wird?|Verdunsten|Gefrieren|Schmelzen|Beim Verdunsten steigt das Wasser unsichtbar auf.",
  "Was fällt im Winter aus Wolken, wenn es sehr kalt ist?|Schnee|Sand|Steine|Bei Kälte gefrieren die Tröpfchen zu Schneeflocken.",
  "Wo sammelt sich Regenwasser am Ende?|In Bächen, Flüssen und im Meer|In den Wolken|Im Weltraum|Das Wasser fließt zu Bächen, Flüssen und ins Meer. Dann beginnt der Kreislauf von vorn.",
  "Warum sind Pfützen nach einigen Stunden weg?|Das Wasser verdunstet|Es wird zu Stein|Es wird zu Schnee|Die Sonne und der Wind lassen das Wasser verdunsten.",
  "Was passiert in der Höhe mit dem Wasserdampf?|Er kühlt ab und bildet Wolken|Er wird zu Staub|Er fliegt ins All|Beim Abkühlen werden aus Dampf winzige Tröpfchen.",
  "Womit misst man die Lufttemperatur?|Mit einem Thermometer|Mit einer Waage|Mit einem Lineal|Das Thermometer zeigt die Temperatur an.",
  "Was zeigt ein Wetterbericht?|Wie das Wetter wird|Wie spät es ist|Wie schwer die Luft ist|Der Wetterbericht sagt Sonne, Regen, Wind und Temperaturen voraus.",
  "Welche Form von Wasser fällt als Eisklumpen aus Gewitterwolken?|Hagel|Nebel|Tau|Hagel besteht aus Eiskörnern, die in der Wolke wachsen."],
 "p34-brennen":["Was braucht Feuer zum Brennen?|Brennstoff, Sauerstoff und Wärme|Nur Holz|Wasser und Licht|Fehlt eins davon, geht das Feuer aus.",
  "Was machst du, wenn es brennt?|Ruhe bewahren, rausgehen, Hilfe holen|Mich verstecken|Allein löschen|Raus aus dem Haus und die 112 anrufen.",
  "Womit darfst du nicht spielen?|Mit Streichhölzern und Feuerzeugen|Mit Bauklötzen|Mit Knete|Feuer ist gefährlich. Streichhölzer sind kein Spielzeug.",
  "Warum erlischt eine Kerze unter einem Glas?|Der Sauerstoff wird verbraucht|Das Glas ist zu kalt|Die Kerze wird zu schwer|Ohne Sauerstoff kann Feuer nicht brennen.",
  "Was ist ein Brennstoff?|Holz, Kohle oder Wachs|Wasser|Stein|Brennstoffe sind Stoffe, die brennen können.",
  "Wie bewegst du dich bei Rauch am besten?|Nah am Boden|Aufrecht|Gar nicht, ich bleibe stehen|Am Boden ist die Luft besser, der Rauch steigt nach oben.",
  "Wozu ist ein Rauchmelder da?|Er warnt früh vor Rauch|Er löscht Feuer|Er macht Rauch|Der Rauchmelder piept laut, damit man früh gewarnt wird.",
  "Welchen Weg nimmst du bei einem Brand im Haus?|Die Treppe, nicht den Aufzug|Den Aufzug|Das Fenster im 3. Stock|Im Aufzug kannst du stecken bleiben. Nimm die Treppe.",
  "Was fehlt dem Feuer, wenn du eine Löschdecke darauflegst?|Der Sauerstoff|Der Brennstoff|Die Wärme|Die Decke hält die Luft vom Feuer fern.",
  "Wo sammelt ihr euch draußen bei einem Feueralarm?|Am Sammelplatz vor dem Gebäude|Im Keller|Im Treppenhaus|Am Sammelplatz kann man sehen, ob alle in Sicherheit sind."],
 "p34-luft":["Was bewegt sich, wenn der Wind weht?|Die Luft|Das Licht|Die Erde|Wind ist bewegte Luft.",
  "Nimmt Luft Platz weg?|Ja, darum kommt kein Wasser ins Glas|Nein|Nur manchmal|Im Glas ist Luft, die das Wasser fernhält.",
  "Womit ist ein Luftballon gefüllt?|Mit Luft|Mit Licht|Mit nichts|Beim Aufblasen kommt Luft hinein.",
  "Was ist in einem Fahrradreifen?|Luft|Wasser|Sand|Die Luft im Reifen drückt nach außen und federt.",
  "Was brauchst du zum Atmen?|Luft|Wasser|Sand|Die Luft enthält Sauerstoff, den wir einatmen.",
  "Wie kannst du Luft spüren?|Als Wind auf der Haut|Gar nicht|Nur nachts|Wenn Luft sich bewegt, spürst du Wind.",
  "Warum kann ein Segelboot fahren?|Der Wind drückt in das Segel|Das Wasser zieht es|Die Sonne schiebt es|Bewegte Luft hat Kraft und schiebt das Boot.",
  "Du pustest durch einen Strohhalm ins Wasser. Was siehst du?|Luftblasen|Feuer|Licht|Die Luft steigt in Blasen nach oben.",
  "Du drückst ein Glas mit der Öffnung nach unten ins Wasser. Was passiert?|Das Wasser steigt kaum hinein|Das Glas füllt sich ganz|Das Glas schwimmt weg|Die Luft im Glas lässt das Wasser nicht hinein.",
  "Was passiert, wenn du die Luft aus dem Ballon lässt?|Er wird schlaff und kleiner|Er wird größer|Er leuchtet|Ohne Luft fehlt dem Ballon die Füllung."],
 "p-licht":["Was ist ein Kernschatten?|Der Bereich, in den gar kein Licht der Lampe fällt|Der Bereich mit etwas weniger Licht|Der Bereich direkt an der Lampe|Im Kernschatten ist die Lichtquelle von keiner Stelle aus zu sehen.",
  "Wann entsteht ein Halbschatten?|Wenn die Lichtquelle größer ist|Wenn die Lampe ausgeht|Wenn der Körper durchsichtig ist|Von einer ausgedehnten Lampe sieht man hinter dem Körper teilweise noch einen Teil der Lampe.",
  "Wie breitet sich Licht in Luft aus?|Geradlinig|In Kurven|Im Kreis|Licht breitet sich in gleichen Stoffen geradlinig aus.",
  "Was steht bei einer Sonnenfinsternis zwischen Sonne und Erde?|Der Mond|Die Erde|Ein anderer Stern|Der Mond wirft seinen Schatten auf die Erde.",
  "Was steht bei einer Mondfinsternis zwischen Sonne und Mond?|Die Erde|Der Mars|Eine Wolke|Der Mond läuft durch den Schatten der Erde.",
  "Wie schnell ist Licht ungefähr in Luft?|300.000 km/s|300 km/s|3.000 km/s|Licht legt in einer Sekunde etwa 300.000 km zurück.",
  "Die Lampe rückt näher an den Körper. Was passiert mit dem Schatten an der Wand?|Er wird größer|Er wird kleiner|Er bleibt gleich|Die Lichtstrahlen fächern sich weiter auf, der Schatten wächst.",
  "Welcher Körper ist keine Lichtquelle?|Der Mond|Die Sonne|Eine Kerze|Der Mond wirft nur Sonnenlicht zurück, er leuchtet nicht selbst.",
  "Was ist ein Lichtjahr?|Die Strecke, die Licht in einem Jahr zurücklegt|Die Zeit, die Licht für 1 km braucht|Ein Jahr ohne Sonne|Ein Lichtjahr ist eine Länge, nicht eine Zeit.",
  "Was ist ein Schatten?|Eine Stelle, an die kein Licht kommt|Ein Teil des Gegenstands|Ein Stück Farbe|Der Körper hält Licht auf, dahinter fehlt es.",
  "Bei Gewitter siehst du erst den Blitz und hörst später den Donner. Warum?|Licht ist viel schneller als Schall|Der Donner ist leiser|Der Blitz kommt von weiter weg|Licht braucht für 1 km winzige Bruchteile einer Sekunde, Schall etwa 3 Sekunden.",
  "Welcher Körper wirft einen Schatten?|Ein undurchsichtiger Körper|Eine klare Glasscheibe|Luft|Nur Körper, die Licht nicht durchlassen, werfen einen deutlichen Schatten."],
 "p-spiegel":["Wie groß ist das Spiegelbild im ebenen Spiegel?|Genauso groß wie der Gegenstand|Halb so groß|Doppelt so groß|Ein ebener Spiegel zeigt das Bild in Originalgröße.",
  "Was ist das Lot?|Die Senkrechte auf der Spiegelfläche|Die Spiegelfläche selbst|Der einfallende Strahl|Winkel misst man immer zum Lot.",
  "Es gilt: Einfallswinkel gleich …|Reflexionswinkel|Brechungswinkel|Spiegelwinkel|Das Reflexionsgesetz sagt: Einfallswinkel = Reflexionswinkel.",
  "Warum sehen wir einen Tisch aus jeder Richtung?|Die raue Oberfläche streut das Licht in alle Richtungen|Er leuchtet selbst|Er spiegelt wie ein Spiegel|An rauen Flächen gibt es diffuse Reflexion.",
  "Wo scheint das Spiegelbild zu sein?|Hinter dem Spiegel|Auf dem Spiegel|Vor dem Spiegel|Das Bild liegt so weit hinter dem Spiegel, wie der Gegenstand davor steht.",
  "Wie viele Spiegel hat ein einfaches Periskop?|Zwei|Einen|Keinen|Zwei Spiegel lenken das Licht um die Ecke.",
  "Was passiert mit dem Winkel, wenn der Spiegel das Licht zurückwirft?|Einfalls- und Reflexionswinkel sind gleich groß|Der Reflexionswinkel ist doppelt so groß|Der Reflexionswinkel ist immer 90°|So lautet das Reflexionsgesetz.",
  "Welche Fläche reflektiert Licht gerichtet?|Eine glatte, polierte Fläche|Ein Blatt Papier|Eine Wolldecke|Nur glatte Flächen werfen das Licht in eine bestimmte Richtung.",
  "Ein Strahl fällt senkrecht auf den Spiegel (entlang des Lots). Was passiert?|Er wird in sich selbst zurückgeworfen|Er geht durch|Er wird um 90° abgelenkt|Der Einfallswinkel ist 0°, also auch der Reflexionswinkel.",
  "Warum sind Rückspiegel am Auto nützlich?|Man sieht damit den Verkehr hinter dem Auto|Sie machen das Auto schneller|Sie leuchten selbst|Das Licht von hinten wird in die Augen des Fahrers gespiegelt."],
 "p-linse":["Was bewirkt eine Sammellinse?|Sie bündelt Licht im Brennpunkt|Sie streut Licht auseinander|Sie verschluckt Licht|Parallele Strahlen laufen im Brennpunkt zusammen.",
  "Welche Linse korrigiert Weitsichtigkeit?|Sammellinse|Zerstreulinse|Planglas|Beim weitsichtigen Auge muss das Licht zusätzlich gebündelt werden.",
  "In welcher Einheit misst man die Brechkraft?|Dioptrie (dpt)|Meter|Watt|Die Brechkraft D = 1 : f hat die Einheit Dioptrie.",
  "Je kürzer die Brennweite, desto …|größer die Brechkraft|kleiner die Brechkraft|gleich die Brechkraft|D = 1 : f. Kleines f ergibt großes D.",
  "Wie sieht eine Sammellinse im Querschnitt aus?|In der Mitte dicker als am Rand|Am Rand dicker als in der Mitte|Überall gleich dick|Sammellinsen sind in der Mitte dick, Zerstreulinsen am Rand.",
  "Wo entsteht im Auge das Bild?|Auf der Netzhaut|Auf der Pupille|Auf der Hornhaut|Die Linse bündelt das Licht auf der Netzhaut, dort sitzen die Sinneszellen.",
  "Welches Bild entsteht auf der Netzhaut?|Ein umgekehrtes, verkleinertes Bild|Ein aufrechtes, vergrößertes Bild|Gar keines|Das Gehirn dreht das Bild wieder um.",
  "Wie stellt das Auge auf nah und fern scharf?|Die Linse ändert ihre Form|Das Auge bewegt sich vor und zurück|Die Pupille wird zur Linse|Die Augenlinse wird dicker oder dünner und verändert die Brennweite.",
  "Was regelt, wie viel Licht ins Auge fällt?|Die Pupille|Die Netzhaut|Das Augenlid allein|Die Pupille wird bei Helligkeit klein und im Dunkeln groß.",
  "Welche Linse streut paralleles Licht auseinander?|Zerstreulinse|Sammellinse|Lupe|Zerstreulinsen sind am Rand dicker und lassen Strahlen auseinanderlaufen."],
 "p-magnet":["Wie verlaufen die Feldlinien außerhalb eines Stabmagneten?|Vom Nordpol zum Südpol|Vom Südpol zum Nordpol|Im Kreis um den Nordpol|Die Feldlinien laufen außen von Nord nach Süd.",
  "Welche Stoffe sind besonders stark magnetisierbar?|Eisen, Nickel und Kobalt|Kupfer und Gold|Holz und Glas|Diese drei Metalle nennt man ferromagnetisch.",
  "Wie macht man ein Magnetfeld sichtbar?|Mit Eisenfeilspänen|Mit Wasser|Mit einem Lineal|Die Späne richten sich entlang der Feldlinien aus.",
  "Wo ist die Magnetkraft eines Stabmagneten am stärksten?|An den Polen|In der Mitte|Überall gleich|An den Enden, den Polen, ist das Feld am dichtesten.",
  "Die Feldlinien liegen dicht beieinander. Was bedeutet das?|Das Feld ist dort stark|Das Feld ist dort schwach|Es gibt dort kein Feld|Je dichter die Linien, desto stärker das Feld.",
  "Der Nordpol der Kompassnadel zeigt nach Norden. Was ist dort in der Erde?|Ein magnetischer Südpol|Ein magnetischer Nordpol|Ein Eisenberg|Ungleiche Pole ziehen sich an, deshalb liegt in der Nordrichtung ein magnetischer Südpol.",
  "Wie kann man einen Magneten schwächen?|Durch Erhitzen oder starke Schläge|Durch Abkühlen|Durch Anleuchten|Hitze und Erschütterung bringen die Elementarmagnete durcheinander.",
  "Was passiert mit einem Kompass neben einem Magneten?|Die Nadel wird abgelenkt|Nichts|Sie dreht sich ständig|Das Magnetfeld des Magneten überlagert das der Erde.",
  "Warum wird ein Nagel am Magneten selbst magnetisch?|Seine Elementarmagnete richten sich aus|Er wird heiß|Er bekommt eine Ladung|Im Eisen sind winzige Magnete, die der Magnet ausrichtet.",
  "Kann ein Magnet Kunststoff anziehen?|Nein|Ja|Nur große Magnete|Kunststoff ist nicht magnetisierbar."],
 "p-stromkreis":["Was gehört zu einem Stromkreis?|Quelle, Verbraucher und geschlossene Leitung|Nur eine Batterie|Nur ein Kabel|Ohne alle drei Teile fließt kein Strom.",
  "Wie ist die Hausinstallation geschaltet?|Parallel|In Reihe|Gar nicht|Jedes Gerät hat seinen eigenen Weg und ist unabhängig.",
  "Wie ist der Strom in einer Reihenschaltung?|Überall gleich groß|Teilt sich auf|Wird kleiner|Es gibt nur einen Weg, also fließt überall derselbe Strom.",
  "Was passiert in einer Reihenschaltung, wenn ein Bauteil ausfällt?|Alle gehen aus|Die anderen leuchten heller|Nichts|Der Kreis ist unterbrochen.",
  "Wo wird ein Schalter eingebaut?|In Reihe zum Verbraucher|Parallel zur Batterie|Neben der Lampe|Er muss den einen Weg öffnen oder schließen.",
  "Warum leuchtet die Lampe trotz Batterie nicht?|Der Stromkreis ist offen|Die Batterie ist zu groß|Das Kabel ist zu lang|Fehlt irgendwo der Kontakt, fließt kein Strom.",
  "Was ist ein Kurzschluss?|Plus und Minus sind ohne Verbraucher verbunden|Eine sehr kurze Leitung|Ein zu langer Schalter|Der Strom ist dann sehr groß, die Leitungen werden heiß.",
  "Wozu dient eine Sicherung?|Sie schützt vor zu viel Strom|Sie macht mehr Strom|Sie speichert Strom|Bei zu viel Strom schmilzt sie und öffnet den Kreis.",
  "Drei gleiche Lampen in Reihe an einer Batterie. Wie hell leuchten sie im Vergleich zu einer Lampe?|Dunkler|Heller|Gleich hell|Die Spannung teilt sich auf drei Lampen auf.",
  "In welche Richtung fließt der Strom nach der technischen Stromrichtung?|Von Plus nach Minus|Von Minus nach Plus|Gar nicht|So hat man es festgelegt, die Elektronen laufen in Wirklichkeit andersherum.",
  "Wird der Strom im Lämpchen verbraucht?|Nein, die Stromstärke bleibt gleich, Energie wird abgegeben|Ja, der Strom wird weniger|Ja, er verschwindet|Der Strom fließt weiter, das Lämpchen gibt Energie als Licht und Wärme ab."],
 "p-leiter":["Wozu hat ein Kabel eine Kunststoffhülle?|Sie isoliert und schützt vor Stromschlag|Sie macht den Strom stärker|Sie leitet den Strom|Kunststoff leitet nicht, das Kupfer innen schon.",
  "Warum nie mit nassen Händen an eine Steckdose?|Wasser leitet den Strom|Wasser isoliert|Hände rutschen ab|Leitungswasser enthält gelöste Stoffe und leitet.",
  "Welche Ladungsträger gibt es in Metallen?|Frei bewegliche Elektronen|Ionen|Protonen|In Metallen bewegen sich Elektronen.",
  "Welche Ladungsträger gibt es in Salzwasser?|Ionen|Elektronen allein|Keine|Salz zerfällt im Wasser in geladene Ionen.",
  "Welches Material ist ein guter Leiter?|Kupfer|Glas|Gummi|Kupfer wird deshalb für Kabel verwendet.",
  "Wovon ist der Griff einer Zange für Elektriker?|Von Kunststoff oder Gummi|Von Metall|Von Graphit|Isolatoren schützen die Hand vor Strom.",
  "Leitet destilliertes Wasser gut?|Kaum, es hat fast keine Ionen|Ja, so gut wie Salzwasser|Besser als Metall|Reines Wasser enthält nur sehr wenige Ladungsträger.",
  "Ist Luft ein Leiter oder ein Isolator?|Ein Isolator|Ein Leiter|Ein Halbleiter|Normale Luft hat keine frei beweglichen Ladungsträger.",
  "Welche Aussage stimmt?|Kupfer leitet besser als Eisen|Alle Metalle leiten gleich gut|Eisen leitet besser als Kupfer|Metalle leiten unterschiedlich gut, Kupfer und Silber sehr gut.",
  "Leitet die Mine eines Bleistifts?|Ja, denn Graphit ist ein Leiter|Nein, sie ist aus Holz|Nur bei Regen|Die Mine besteht aus Graphit, und Graphit leitet.",
  "Warum sind Stromleitungen innen Metall und außen Kunststoff?|Innen soll Strom fließen, außen soll er nicht entweichen|Aus Kostengründen|Damit sie schöner aussehen|Leiter innen, Isolator außen."],
 "p-waerme":["Bei wie viel °C gefriert Wasser?|0 °C|4 °C|100 °C|Der Gefrierpunkt von Wasser liegt bei 0 °C.",
  "Bei wie viel °C siedet Wasser (normaler Luftdruck)?|100 °C|50 °C|273 °C|Der Siedepunkt liegt bei 100 °C.",
  "Warum gibt es an Brücken Dehnungsfugen?|Der Stahl dehnt sich bei Wärme aus|Damit Wasser abläuft|Damit sie schöner aussieht|Die Fugen lassen Platz, wenn sich das Material ausdehnt.",
  "Bei welcher Temperatur ist Wasser am dichtesten?|Bei 4 °C|Bei 0 °C|Bei 100 °C|Wasser hat bei 4 °C seine größte Dichte, darum friert ein See von oben zu.",
  "Was ist 0 K?|Der absolute Nullpunkt, −273 °C|Der Gefrierpunkt von Wasser|Der Siedepunkt von Wasser|Bei 0 K ruht die Teilchenbewegung.",
  "Wie dehnen sich die meisten Stoffe bei Erwärmung aus?|Sie werden größer|Sie werden kleiner|Sie bleiben gleich|Die Teilchen bewegen sich stärker und brauchen mehr Platz.",
  "Welche Skala nutzen Physiker?|Kelvin|Fahrenheit|Kilogramm|Die Kelvin-Skala beginnt am absoluten Nullpunkt.",
  "Was ändert sich bei 1 K mehr: Temperatur in K oder in °C?|Beides ändert sich gleich stark|Nur K|Nur °C|Eine Stufe in Kelvin ist genauso groß wie eine Stufe in Celsius.",
  "Was passiert beim Erwärmen mit der Teilchenbewegung?|Sie wird schneller|Sie wird langsamer|Sie hört auf|Wärme bedeutet stärkere Bewegung der Teilchen.",
  "Warum platzen zugeschraubte Flaschen mit Wasser im Gefrierfach?|Eis braucht mehr Platz als Wasser|Eis ist schwerer|Das Wasser verdunstet|Beim Gefrieren dehnt sich Wasser aus."],
 "p-dichte":["Welcher Stoff schwimmt auf Wasser?|Holz mit Dichte 0,6 g/cm³|Eisen mit Dichte 7,9 g/cm³|Aluminium mit Dichte 2,7 g/cm³|Eine kleinere Dichte als Wasser (1 g/cm³) heißt schwimmen.",
  "Wie viel wiegt 1 Liter Wasser ungefähr?|1 kg|10 kg|100 g|1 Liter sind 1000 cm³, mit 1 g/cm³ also 1000 g = 1 kg.",
  "Warum schwimmt ein Schiff aus Stahl?|Mit der Luft im Rumpf ist es insgesamt weniger dicht als Wasser|Stahl ist leichter als Wasser|Es hat kein Gewicht|Der Rumpf verdrängt viel Wasser.",

const NM=(q,u,ans,sol)=>({q:q+unit(u),kind:"num",ans,sol});
const ELNUM={
 "p-v":()=>{const k=ri(0,2);
  if(k===0){const v=pick([60,80,90,120]),t=pick([1.5,2,2.5,3]);return NM(`Ein Zug fährt ${fmt(t)} h lang mit ${fmt(v)} km/h. Welche Strecke legt er zurück?`,"km",R(Math.round(v*t*10),10),`s = v · t = ${fmt(v)} km/h · ${fmt(t)} h = <b>${fmt(v*t)} km</b>.`)}
  if(k===1){const v=pick([4,5,8,10]),s=pick([400,800,1000]);return NM(`Eine Läuferin läuft mit ${fmt(v)} m/s. Wie lange braucht sie für ${fmt(s)} m?`,"s",R(s,v),`t = s : v = ${fmt(s)} m : ${fmt(v)} m/s = <b>${fmt(s/v)} s</b>.`)}
  const r=loopf(()=>{const v1=pick([40,60,80,100]),v2=pick([60,100,120]),t1=pick([1,2]),t2=pick([1,2]),a=(v1*t1+v2*t2)/(t1+t2);return Number.isInteger(a)?{v1,v2,t1,t2,a}:0});
  return NM(`Ein Auto fährt ${r.t1} h mit ${r.v1} km/h und danach ${r.t2} h mit ${r.v2} km/h. Wie groß ist die Durchschnittsgeschwindigkeit?`,"km/h",R(r.a),`Gesamtweg: ${r.v1} · ${r.t1} + ${r.v2} · ${r.t2} = ${fmt(r.v1*r.t1+r.v2*r.t2)} km. Gesamtzeit: ${r.t1+r.t2} h. v = <b>${fmt(r.a)} km/h</b>.`)},
 "p-kraft":()=>{const k=ri(0,3);

  if(k===2){const m=pick([10,20,50]);return NM(`Ein Körper hat ${m} kg. Wie groß ist seine Gewichtskraft auf dem Mond (g = 1,6 N/kg)?`,"N",R(Math.round(16*m),10),`F = m · g = ${m} kg · 1,6 N/kg = <b>${fmt(1.6*m)} N</b>.`)}

 "p-hebel":()=>{const k=ri(0,2);

   return NM(`Ein Hebel ist im Gleichgewicht. Links wirkt ${r.F1} N im Abstand ${r.l1} cm vom Drehpunkt, rechts wirken ${r.F2} N. Wie groß ist der Abstand rechts?`,"cm",R(r.l2),`F₁ · l₁ = F₂ · l₂, also l₂ = ${r.F1} · ${r.l1} : ${r.F2} = <b>${fmt(r.l2)} cm</b>.`)}

  if(k===1){const p=pick([50,80,120,200]);return NM(`In einem See wirkt in der Tiefe ein zusätzlicher Schweredruck von ${p} kPa. Wie tief ist das? (10 kPa pro Meter)`,"m",R(p,10),`h = ${p} kPa : 10 kPa/m = <b>${fmt(p/10)} m</b>.`)}

   return NM(`Ein Motor mit ${r.p} W Leistung verrichtet ${fmt(r.w)} J Arbeit. Wie lange dauert das?`,"s",R(r.w,r.p),`t = W : P = ${fmt(r.w)} J : ${r.p} W = <b>${fmt(r.w/r.p)} s</b>.`)}

function calcEval(src,deg){

    atan:x=>{const r=Math.atan(x);return deg?r*180/Math.PI:r},

    bad("Unvollständig")}

function calcCopyText(v){const a=Math.abs(v);if(a!==0&&(a>=1e12||a<1e-9))return null;return String(Number(v.toPrecision(10))).replace(".",",")}

function rhRechner(opener,getField){
  let expr="",res=null,deg=true,fresh=false;
  const el=h(`<div class="tr-ov"><div class="tr-box" role="dialog" aria-modal="true" aria-label="Taschenrechner">
    <div class="tr-head"><div class="tr-top"><b>Taschenrechner</b><button type="button" class="btn ghost small" data-a="close">Schließen</button></div>
    <div class="tr-disp"><div class="tr-ex" aria-label="Eingabe"></div><div class="tr-res" role="status" aria-live="polite">0</div></div>
    <div class="tr-bar"><button type="button" class="btn ghost small" data-a="sci" aria-pressed="false">Wissenschaftlich</button><button type="button" class="btn ghost small" data-a="deg" aria-pressed="true" hidden>Grad (DEG)</button><button type="button" class="btn small" data-a="use" hidden>In Antwort übernehmen</button></div></div>
    <div class="tr-keys tr-sci" aria-label="Wissenschaftliche Tasten"></div>
    <div class="tr-keys tr-main" aria-label="Zifferntasten"></div></div></div>`);
  const box=el.querySelector(".tr-box"),exE=el.querySelector(".tr-ex"),resE=el.querySelector(".tr-res"),sci=el.querySelector(".tr-sci"),main=el.querySelector(".tr-main");
  const AR={"÷":"geteilt","×":"mal","−":"minus","+":"plus",",":"Komma","⌫":"Eine Stelle löschen","C":"Alles löschen","=":"gleich","(":"Klammer auf",")":"Klammer zu","%":"Prozent","x²":"Quadrat","√":"Wurzel","xʸ":"Hoch","±":"Vorzeichen wechseln","1/x":"Kehrwert","Ans":"letztes Ergebnis","π":"Pi","n!":"Fakultät","e":"Eulersche Zahl","eˣ":"e hoch","10ˣ":"10 hoch","x³":"hoch 3"};
  const mk=(host,list)=>list.forEach(([t,k,c])=>{const b=h(`<button type="button" class="${c||""}" data-k="${k}">${t}</button>`);if(AR[t])b.setAttribute("aria-label",AR[t]);host.append(b)});
  mk(sci,[["x²","sq","fn"],["√","sqrt","fn"],["xʸ","^","fn"],["π","π","fn"],["sin","sin(","fn"],["cos","cos(","fn"],["tan","tan(","fn"],["n!","!","fn"],["sin⁻¹","asin(","fn"],["cos⁻¹","acos(","fn"],["tan⁻¹","atan(","fn"],["1/x","inv","fn"],["ln","ln(","fn"],["log","log(","fn"],["±","neg","fn"],["Ans","ans","fn"],["e","e","fn"],["eˣ","e^(","fn"],["10ˣ","10^(","fn"],["x³","^3","fn"]]);
  mk(main,[["C","C","op"],["⌫","bs","op"],["(","(","op"],[")",")","op"],["7","7"],["8","8"],["9","9"],["÷","÷","op"],["4","4"],["5","5"],["6","6"],["×","×","op"],["1","1"],["2","2"],["3","3"],["−","−","op"],["0","0"],[",",",",""],["%","%","op"],["+","+","op"]]);
  main.append(h(`<button type="button" class="eq" data-k="eq" style="grid-column:1/-1" aria-label="gleich">=</button>`));
  const close=rhModal(el,opener),useB=el.querySelector('[data-a="use"]'),degB=el.querySelector('[data-a="deg"]'),sciB=el.querySelector('[data-a="sci"]');
  const update=(final)=>{exE.textContent=expr||"";exE.scrollLeft=exE.scrollWidth;
    resE.classList.remove("err");let txt="0",ok=false;
    if(final){const r=calcEval(expr,deg);if(r.ok){res=r.v;txt=calcShow(r.v);ok=true}else{resE.classList.add("err");txt=r.msg;res=null}}
    else if(expr){const r=calcEval(expr,deg);if(r.ok){txt=calcShow(r.v);ok=true;res=r.v}else{txt=res!==null&&fresh?calcShow(res):"…";res=null}}
    resE.textContent=txt;const f=getField&&getField();const can=ok&&f&&!f.readOnly&&calcCopyText(res)!==null;useB.hidden=!can};
  const ins=s=>{if(fresh){if(/^[0-9,πA-Za-z(√]/.test(s)&&!/^[+−×÷^%!]/.test(s))expr="";fresh=false}expr+=s;update(false)};
  const act=k=>{
    if(k==="C"){expr="";res=null;fresh=false;resE.classList.remove("err");update(false);resE.textContent="0";return}
    if(k==="bs"){expr=expr.replace(/(sin|cos|tan|asin|acos|atan|ln|log)\($|.$/u,"");fresh=false;update(false);if(!expr)resE.textContent="0";return}
    if(k==="eq"){if(!expr)return;update(true);if(res!==null){fresh=true}return}
    if(k==="sq"){ins("^2");return}
    if(k==="sqrt"){ins("√(");return}
    if(k==="inv"){expr="1÷("+(expr||"")+")";fresh=false;update(false);return}
    if(k==="neg"){expr=expr?"−("+expr+")":"−";fresh=false;update(false);return}
    if(k==="ans"){if(res!==null||fresh){const t=calcCopyText(res??0);if(t!==null)ins(t)}return}
    if(/^[+−×÷^%!]$/.test(k)&&fresh&&res!==null){const t=calcCopyText(res);expr=t!==null?t:"";fresh=false}
    ins(k)};
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.k!==undefined)act(b.dataset.k);
    else if(b.dataset.a==="close")close();
    else if(b.dataset.a==="sci"){const on=sci.classList.toggle("on");sciB.setAttribute("aria-pressed",on);degB.hidden=!on;try{S.calcSci=on;save()}catch(x){}}
    else if(b.dataset.a==="deg"){deg=!deg;degB.textContent=deg?"Grad (DEG)":"Bogenmaß (RAD)";degB.setAttribute("aria-pressed",deg);update(false)}
    else if(b.dataset.a==="use"){const f=getField&&getField();const t=calcCopyText(res);if(f&&t!==null){f.value=t;f.dispatchEvent(new Event("input",{bubbles:true}));close();try{f.focus({preventScroll:true})}catch(x){}}}});
  const keyH=e=>{if(!document.body.contains(el))return;const k=e.key;if(e.ctrlKey||e.metaKey||e.altKey)return;
    const M={"*":"×","/":"÷","-":"−",".":",","+":"+","(":"(",")":")","^":"^","%":"%","!":"!"};
    if(/^[0-9]$/.test(k)||k===","){e.preventDefault();act(k)}else if(M[k]){e.preventDefault();act(M[k])}
    else if(k==="Enter"||k==="="){e.preventDefault();act("eq")}else if(k==="Backspace"){e.preventDefault();act("bs")}else if(k==="Delete"){e.preventDefault();act("C")}};
  document.addEventListener("keydown",keyH,true);
  const obs=new MutationObserver(()=>{if(!document.body.contains(el)){document.removeEventListener("keydown",keyH,true);obs.disconnect()}});obs.observe(document.body,{childList:true});
  if(S.calcSci){sci.classList.add("on");sciB.setAttribute("aria-pressed","true");degB.hidden=false}
  update(false);el.querySelector('[data-k="7"]').focus({preventScroll:true});return el}

function rhTools(c,inp,ex,s,o){
  const kind=ex.kind,numeric=kind==="num"||kind==="frac"||kind==="grid",hasDigits=kind==="choice"&&/\d/.test(plain(ex.q));
  if(!numeric&&!hasDigits)return;
  const blattOn=S.blatt!==false;
  const mode=S.calc||"auto";
  let grade=null;const bt=o.stop&&o.stop.band&&o.stop.band.title;
  if(bt){const m=/Klasse\s*(\d+)/.exec(bt);if(m)grade=+m[1]}
  else{const m=/^g:k(\d)_/.exec(s.skill||"");if(m)grade=+m[1]}
  const calcOn=mode==="immer"||(mode==="auto"&&!o.kids&&(grade===null||grade>=5));
  if(!blattOn&&!calcOn)return;
  const row=h(`<div class="rh-row"></div>`);
  if(blattOn){const b=h(`<button type="button" class="btn ghost small">${RH_ICON_BLATT}<span>Rechenblatt</span></button>`);b.setAttribute("aria-haspopup","dialog");b.onclick=()=>rhBlatt(s,b);row.append(b)}
  if(calcOn){const b=h(`<button type="button" class="btn ghost small">${RH_ICON_CALC}<span>Taschenrechner</span></button>`);b.setAttribute("aria-haspopup","dialog");b.onclick=()=>rhRechner(b,numeric&&kind!=="grid"?o.getField:null);row.append(b)}
  c.insertBefore(row,inp)}

function runSession({title,steps,stop=null,mode="lesson"}){
  const root=openOverlay();let i=0,right=0,total=0,xpGain=0,combo=0,best=0,ft=0,fr=0,autoT=null;
  const draw=()=>{root.innerHTML="";root.scrollTop=0;
    const w=h(`<div class="wrap"><div class="lbar"><button class="x" type="button" aria-label="Sitzung beenden">×</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${i}"><i style="width:${i/steps.length*100}%"></i></div><span class="eyebrow">${i+1}/${steps.length}</span></div><div class="stack" id="sb"></div></div>`);
    root.append(w);$(".x",w).onclick=closeOverlay;const sb=$("#sb",w);
    if(i>=steps.length){finish(sb);return}
    const s=steps[i];if(s.t==="info")drawInfo(sb,s);else if(s.t==="intro")drawIntro(sb,s);else drawEx(sb,s);
    if(combo>=3)$(".lbar",w).insertBefore(h(`<span class="combo" title="Richtige Antworten in Folge">▲ ${combo}</span>`),$(".lbar .eyebrow",w))};
  const next=()=>{clearTimeout(autoT);i++;draw()};
  function drawIntro(sb,s){const st=S.stars[stop.key]||0;
    sb.append(h(`<div class="card karo stack" style="align-items:center;text-align:center;padding-block:24px"><span class="eyebrow">${esc(stop.band.title)} · Runde</span><h2 style="font-size:1.5rem">${esc(title)}</h2>${starRow(st,true)}<p class="muted">${st===3?"Alles drin. Hältst du die drei Sterne?":st?"Schaffst du mehr Sterne?":"5 Aufgaben, los geht's."}</p></div>`));
    const row=h(`<div class="row end"><button class="btn ghost" type="button">Erklärung ansehen</button><button class="btn" type="button">Los geht's</button></div>`);sb.append(row);
    const [ex,go]=row.querySelectorAll("button");go.onclick=next;setTimeout(()=>{try{go.focus({preventScroll:true})}catch(e){}},30);
    ex.onclick=()=>{steps.splice(i+1,0,...s.info);next()}}

  function drawInfo(sb,s){
    const c=h(`<div class="card stack ${s.kt?"kt":""}"><span class="eyebrow">${s.kt?"Für den Küchentisch · "+esc(title):esc(title)}</span><h2>${s.title}</h2><div class="body">${s.html||s.body}</div><div class="wslot"></div><div class="mentorbox" hidden><div class="ans"></div></div></div>`);
    sb.append(c);if(s.w&&WIDGETS[s.w])WIDGETS[s.w]($(".wslot",c),s.wo||{});
    const nextIsEx=steps[i+1]&&steps[i+1].t==="ex"&&(i===0||steps[i-1].t==="info");
    const row=h(`<div class="row end"><button class="btn ghost small" type="button">Anders erklären</button><button class="btn ghost small" type="button">Erklär's einem Kind</button><button class="btn" type="button">${nextIsEx?"Zu den Aufgaben":"Weiter"}</button></div>`);
    sb.append(row);const [ask,kid,go]=row.querySelectorAll("button");go.onclick=next;
    const grade=stop?stop.band.title.replace(/ ·.*/,""):"";
    kid.onclick=()=>{kid.disabled=true;const mb=h(`<div class="card mentorbox kt"><span class="eyebrow">So erklärst du es deinem Kind</span><div class="ans"></div></div>`);sb.insertBefore(mb,row);
      streamInto($(".ans",mb),`${SYS()}\n\nIch möchte meinem Kind (${grade||"Schulkind"}) dieses Thema erklären: ${title}.\nInhalt: ${plain(s.html||s.body)}\n\nGib mir:\n- einen Einstieg mit etwas zum Anfassen oder aus dem Alltag, das es zu Hause gibt\n- 2 bis 3 Sätze, wie ich es in Kindersprache erkläre\n- den häufigsten Kinderfehler und wie ich darauf reagiere, ohne zu entmutigen\n- eine Prüffrage, an der ich merke, ob es verstanden wurde\nHöchstens 200 Wörter.`,{})};
    ask.onclick=()=>{ask.disabled=true;const mb=$(".mentorbox",c);mb.hidden=false;
      streamInto($(".ans",mb),`${SYS()}\n\nErkläre den folgenden Lerninhalt noch einmal mit anderen Worten und einem neuen, konkreten Beispiel. Thema: ${title}.\n\nLerninhalt: ${plain(s.html||s.body)}`)}}

  function drawEx(sb,s){const ex=s.ex;let sel=null,checked=false,special=null,pairsMiss=0;
    const kids=!!(stop&&stop.topic&&stop.topic.kids)||/^g:k\d_/.test(s.skill||"");
    const c=h(`<div class="card stack ${kids?"kids":""}"><div class="eyerow"><span class="eyebrow">${mode==="train"?"Training · "+esc(skillName(s.skill)):"Aufgabe"}</span>${canSpeak()?`<button type="button" class="say" aria-label="Aufgabe vorlesen" title="Vorlesen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a3.5 3.5 0 0 1 0 6M18.5 6.5a7 7 0 0 1 0 11"/></svg></button>`:""}</div><div class="q">${ex.q}</div><div class="inp"></div><div class="fb" aria-live="polite"></div></div>`);
    sb.append(c);const sayB=$(".say",c);if(sayB)sayB.onclick=()=>speak(ex.q+(ex.kind==="choice"?" . "+ex.opts.map(plain).join(" , oder , "):""));
    if(kids&&S.vorlesen&&canSpeak())setTimeout(()=>speak(ex.q),250);const inp=$(".inp",c),fb=$(".fb",c);
    const row=h(`<div class="row end"><button class="btn" type="button" disabled>Prüfen</button></div>`);sb.append(row);const btn=$("button",row);
    let field=null;
    if(ex.kind==="choice"){const short=ex.opts.every(o=>plain(o).length<14);
      const box=h(`<div class="opts ${short?"inline":""}" role="group"></div>`);
      ex.opts.forEach((o,k)=>{const b=h(`<button class="opt" type="button" aria-pressed="false">${o}</button>`);
        b.onclick=()=>{if(checked)return;sel=k;box.querySelectorAll(".opt").forEach((x,j)=>x.setAttribute("aria-pressed",j===k));btn.disabled=false};box.append(b)});
      inp.append(box)}
    else if(ex.kind==="line"){special=lineInput(ex,()=>{if(!checked)btn.disabled=false});inp.append(special)}
    else if(ex.kind==="order"){special=orderInput(ex,seq=>{if(!checked)btn.disabled=seq.length!==ex.items.length});inp.append(special)}
    else if(ex.kind==="grid"){special=gridInput(ex,ok=>{if(!checked)btn.disabled=!ok});inp.append(special);setTimeout(()=>{try{special.focus({preventScroll:true})}catch(e){}},50)}
    else if(ex.kind==="pairs"){special=pairsInput(ex,m=>{pairsMiss=m;btn.disabled=false;btn.click()});special.value=()=>pairsMiss;inp.append(special);row.hidden=true}
    else{const id="ans"+i;inp.append(h(`<div class="stack" style="gap:8px"><label class="muted small" for="${id}">Deine Antwort${ex.kind==="frac"?" (Bruch als 3/4)":""}</label><div class="answer"><input id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${ex.kind==="frac"?"text":"decimal"}"></div><div class="keys">${["/",MINUS,","].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join("")}</div></div>`));
      field=$("input",inp);field.oninput=()=>{btn.disabled=!field.value.trim()};
      field.onkeydown=e=>{if(e.key==="Enter"&&!btn.disabled){e.preventDefault();btn.click()}};
      inp.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(checked)return;const k=b.dataset.k,p=field.selectionStart??field.value.length;field.value=field.value.slice(0,p)+k+field.value.slice(field.selectionEnd??p);field.focus();field.setSelectionRange(p+1,p+1);btn.disabled=false});
      setTimeout(()=>{try{field.focus({preventScroll:true})}catch(e){}},50)}
    rhTools(c,inp,ex,s,{kids,stop,mode,getField:()=>field});
    btn.onclick=()=>{
      if(checked){next();return}
      const res=checkAnswer(ex,ex.kind==="choice"?sel:special?special.value():field.value);
      if(res.invalid){fb.innerHTML=`<p class="feedback info">${esc(res.note||"Das kann ich nicht lesen. Erlaubt sind ganze Zahlen (12, −3), Kommazahlen (2,5) und Brüche (3/4).")}</p>`;return}
      checked=true;total++;countTask();updateSkill(s.skill,res.ok);row.hidden=false;
      if(!s.retry){ft++;if(res.ok)fr++}
      combo=res.ok?combo+1:0;best=Math.max(best,combo);
      if(res.ok){right++;const g=(s.retry?5:10)+(combo>=3?2:0);xpGain+=g;addXP(g)}else save();
      if(ex.kind==="choice")inp.querySelectorAll(".opt").forEach((x,j)=>{if(j===ex.correct)x.classList.add("right");else if(j===sel)x.classList.add("wrong")});
      else if(special)special.lock(res.ok);
      else{field.readOnly=true;field.classList.add(res.ok?"right":"wrong")}
      if(kids&&S.vorlesen&&canSpeak())speak(res.ok?pick(["Richtig!","Super!","Toll gemacht!"]):"Nicht ganz. Schau mal, wie es geht.");
      fb.innerHTML=res.ok?`<div class="feedback ok stack" style="gap:6px"><b>${pick(["Richtig!","Genau!","Stark!","Sitzt!","Super!"])}${combo>=3?` <span class="combo">▲ ${combo} in Folge · +2 XP</span>`:""}</b>${ex.sol?`<details class="sol"><summary>Lösungsweg ansehen</summary><div>${ex.sol}</div></details>`:""}</div>`
        :`<div class="feedback bad stack" style="gap:6px"><b>${res.note?esc(res.note):"Nicht ganz."} Richtig ist: ${answerText(ex)}</b><div>${ex.sol}</div>${s.retry?"":`<span class="muted small">Eine ähnliche Aufgabe kommt gleich noch einmal.</span>`}</div>`;
      if(!res.ok&&!s.retry)steps.push(s.gen?Object.assign(genEx(s.gen),{retry:true}):Object.assign({},s,{retry:true,ex:Object.assign({},ex)}));
      btn.textContent="Weiter";
      if(!res.ok){const ask=h(`<button class="btn ghost small" type="button">Mentor fragen</button>`);row.prepend(ask);
        ask.onclick=()=>{ask.disabled=true;const mb=h(`<div class="card mentorbox"><span class="eyebrow">Mentor</span><div class="ans"></div></div>`);sb.insertBefore(mb,row);
          const mine=ex.kind==="choice"?plain(ex.opts[sel]):ex.kind==="order"?special.value().map(k=>plain(ex.items[k])).join(" < "):ex.kind==="line"?String(special.value()):ex.kind==="pairs"?`${pairsMiss} Fehlversuche beim Zuordnen`:ex.kind==="grid"?ex.order.map(k=>special.value()[k]||"_").join(""):field.value;
          streamInto($(".ans",mb),`${SYS()}\n\nIch habe diese Aufgabe falsch gelöst.\nAufgabe: ${plain(ex.q)}\nMeine Antwort: ${mine}\nRichtige Antwort: ${plain(answerText(ex))}\nLösungsweg der App: ${plain(ex.sol)}\n\nErkläre mir einfach und anders als der Lösungsweg, wo mein Denkfehler vermutlich liegt und wie ich es beim nächsten Mal richtig mache.`)}}
      if(steps.length)$(".prog",root).setAttribute("aria-valuemax",steps.length);$(".lbar .eyebrow",root).textContent=`${i+1}/${steps.length}`;
      if(res.ok&&S.auto!==false){c.classList.add("pulse");const bar=h(`<i class="autobar"></i>`);btn.append(bar);autoT=setTimeout(next,1400);
        const stopAuto=()=>{clearTimeout(autoT);bar.remove()};c.addEventListener("click",stopAuto,{once:true});const d=$("details",fb);if(d)d.addEventListener("toggle",stopAuto,{once:true})}};
  }

  function finish(sb){clearTimeout(autoT);
    const rate=ft?fr/ft:1,pass=rate>=.6,stars=!ft?0:rate>=1?3:rate>=.8?2:rate>=.6?1:0;
    let newBest=false;if(stop&&!stop.planned&&ft&&mode!=="train"){if(stars>(S.stars[stop.key]||0)){S.stars[stop.key]=stars;newBest=true}}
    if(stop&&pass&&!S.done[stop.key]){S.done[stop.key]=true;xpGain+=25;addXP(25)}
    save();
    const msg=mode==="train"?"Training geschafft.":pass?"Lektion abgeschlossen.":"Fast. Für den Haken brauchst du 60 % beim ersten Versuch.";
    const c=h(`<div class="card karo stack ${stars===3?"party":""}" style="align-items:center;text-align:center;padding-block:28px"><span class="eyebrow">${esc(title)}</span>${ft&&mode!=="train"?starRow(stars,true):""}<h2 style="font-size:1.6rem">${stars===3&&mode!=="train"?"Perfekt!":msg}</h2>${newBest&&S.stars[stop.key]>0?`<p><b>Neuer Bestwert für dieses Thema.</b></p>`:""}${best>=3?`<p class="muted small">Längste Serie: ▲ ${best}</p>`:""}<p class="muted">${ft?`${fr} von ${ft} Aufgaben auf Anhieb richtig`:"Alles gelesen"} · <b style="color:var(--ink)">+${xpGain} XP</b></p><p class="muted small">Heute: ${S.day.d===today()?S.day.n:0} von ${S.goal} Aufgaben</p></div>`);
    sb.append(c);
    const row=h(`<div class="row end"></div>`);
    if(stop&&stop.planned){const re=h(`<button class="btn ghost small" type="button">Lektion neu erstellen</button>`);re.onclick=()=>{delete KI[stop.key];saveKI();openPlanned(stop)};row.append(re)}
    if(mode==="train"){const again=h(`<button class="btn ghost" type="button">Noch eine Runde</button>`);again.onclick=startTraining;row.append(again)}
    else if(stop&&!stop.planned){const again=h(`<button class="btn ghost" type="button">Noch eine Runde</button>`);again.onclick=()=>runSession({title:stop.title,steps:exList(stop.topic.gens,5),stop,mode:"lesson"});row.append(again)}
    const done=h(`<button class="btn" type="button">Fertig</button>`);done.onclick=closeOverlay;row.append(done);sb.append(row)}
  draw()}

(()=>{

"m-bruch2":["Rechenweg: Brüche addieren",FZ([["a/b + c/d","zwei Brüche mit verschiedenen Nennern b und d"],["Hauptnenner","kleinste Zahl, in der beide Nenner stecken"]],["2/3 + 3/4","Hauptnenner: kleinstes gemeinsames Vielfaches von 3 und 4 ist 12.","Erweitern: 2/3 = 8/12 (mal 4) und 3/4 = 9/12 (mal 3).","Nur die Zähler addieren, der Nenner bleibt: 8/12 + 9/12 = 17/12.","Umwandeln: 17/12 = <b>1 5/12</b>."],`<p>Gleiche Nenner: Zähler addieren, Nenner bleibt. Verschiedene Nenner: erst gleichnamig machen.</p>`)],
"m-bruch3":["Rechenweg: Brüche mal und geteilt",FZ([["a/b · c/d","= (a · c) / (b · d): Zähler mal Zähler, Nenner mal Nenner"],["a/b : c/d","= a/b · d/c: mit dem <b>Kehrwert</b> malnehmen (Zähler und Nenner tauschen)"]],["3/5 : 2/3","Teilen heißt mit dem Kehrwert malnehmen: 2/3 wird zu 3/2.","3/5 · 3/2 = (3 · 3) / (5 · 2) = 9/10.","Ergebnis: <b>9/10</b>. Tipp: Vor dem Malnehmen über Kreuz kürzen, das hält die Zahlen klein."])],
"m-flaeche":["Formelzeichen und Rechenweg",FZ([["A","Flächeninhalt (cm², m²)"],["U","Umfang, Länge des Randes (cm, m)"],["a, b","Seitenlängen des Rechtecks"],["g","Grundseite des Dreiecks"],["h","Höhe, steht senkrecht auf g"]],["Beet mit a = 8 m und b = 5 m, dazu ein Dreieck mit g = 6 cm und h = 4 cm.","Rechteck-Fläche: A = a · b = 8 · 5 = <b>40 m²</b>.","Rechteck-Umfang: U = 2 · (a + b) = 2 · 13 = <b>26 m</b>.","Dreieck: A = g · h : 2 = 6 · 4 : 2 = <b>12 cm²</b>."])],
"m-volumen":["Formelzeichen und Rechenweg",FZ([["V","Volumen (cm³, dm³, m³)"],["O","Oberfläche, Summe aller Seitenflächen (cm², m²)"],["a, b, c","Länge, Breite, Höhe des Quaders"]],["Quader mit a = 5 cm, b = 4 cm, c = 3 cm.","V = a · b · c = 5 · 4 · 3 = <b>60 cm³</b>.","O = 2 · (a·b + a·c + b·c) = 2 · (20 + 15 + 12) = 2 · 47 = <b>94 cm²</b>.","In Litern: 1000 cm³ = 1 l, also sind 60 cm³ gleich 0,06 l."])],
"m-winkel":["Formelzeichen und Rechenweg",FZ([["α, β, γ","griechische Buchstaben Alpha, Beta, Gamma: Namen für Winkel"],["°","Grad: ein voller Kreis hat 360°"],["α + β + γ = 180°","Winkelsumme im Dreieck"],["Nebenwinkel","ergänzen sich auf 180°"]],["Dreieck mit α = 50° und β = 65°. Wie groß ist γ?","Winkelsumme: α + β + γ = 180°.","50° + 65° = 115°.","γ = 180° − 115° = <b>65°</b>."])],
"m-prozent":["Formelzeichen und Rechenweg",FZ([["G","Grundwert: das Ganze, entspricht 100 %"],["p","Prozentsatz (in %)"],["W","Prozentwert: der Anteil, in €, kg …"]],["Drei Aufgaben, jeweils mit der passenden Formel:","<b>W gesucht:</b> G = 240 €, p = 15 %. W = G · p : 100 = 240 · 15 : 100 = <b>36 €</b>.","<b>p gesucht:</b> G = 120 €, W = 18 €. p = W : G · 100 = 18 : 120 · 100 = <b>15 %</b>.","<b>G gesucht:</b> W = 45 €, p = 30 %. G = W : p · 100 = 45 : 30 · 100 = <b>150 €</b>."])],
"m-zins":["Formelzeichen und Rechenweg",FZ([["K","Kapital: das angelegte oder geliehene Geld"],["p","Zinssatz in % pro Jahr"],["t","Zeit (in Jahren)"],["Z","Zinsen: der Ertrag oder die Kosten, in €"]],["2000 € zu 3 % für 9 Monate.","Zinsen für ein ganzes Jahr: Z = K · p : 100 = 2000 · 3 : 100 = 60 €.","9 Monate sind 9/12 eines Jahres: 60 € · 9 : 12 = <b>45 €</b>.","Kurz in einer Formel: Z = K · p : 100 · t."])],
"m-daten":["Formelzeichen und Rechenweg",FZ([["x₁, x₂ … xₙ","die einzelnen Werte"],["n","Anzahl der Werte"],["x̄","sprich „x quer“: Mittelwert = (x₁ + x₂ + … + xₙ) : n"]],["Noten: 3, 5, 5, 8, 9.","n = 5 Werte, Summe 3 + 5 + 5 + 8 + 9 = 30.","Mittelwert: x̄ = 30 : 5 = <b>6</b>.","Median (mittlerer Wert der geordneten Liste): <b>5</b>. Modalwert (häufigster Wert): <b>5</b>.","Spannweite: 9 − 3 = <b>6</b>."])],
"m-gleichung":["Rechenweg: Gleichung lösen",FZ([["x","die Unbekannte, gesucht ist ihr Wert"],["=","beide Seiten sind gleich schwer, wie bei einer Waage"],["Umformung","auf <b>beiden</b> Seiten dasselbe tun (plus, minus, mal, geteilt)"]],["3x + 5 = 20","Auf beiden Seiten − 5: 3x = 15.","Auf beiden Seiten : 3: x = <b>5</b>.","Probe: 3 · 5 + 5 = 20 ✓."])],

"m-binom":["Formelzeichen und Rechenweg",FZ([["a, b","stehen für beliebige Zahlen oder Terme"],["(a + b)²","= a² + 2ab + b² (1. Formel)"],["(a − b)²","= a² − 2ab + b² (2. Formel)"],["(a + b)(a − b)","= a² − b² (3. Formel)"]],["Rechne 51² im Kopf und löse (x + 3)².","51² = (50 + 1)² = 50² + 2 · 50 · 1 + 1² = 2500 + 100 + 1 = <b>2601</b>.","(x + 3)²: a = x, b = 3. Also x² + 2 · x · 3 + 3² = <b>x² + 6x + 9</b>.","Häufiger Fehler: (a + b)² ist <b>nicht</b> a² + b². Das Doppelprodukt 2ab fehlt dann."])],
"m-potenz":["Formelzeichen und Rechenweg",FZ([["aⁿ","Potenz: a ist die <b>Basis</b>, n der <b>Exponent</b>. a wird n-mal mit sich selbst malgenommen"],["√a","Wurzel: die Zahl, die mit sich selbst malgenommen a ergibt (a heißt Radikand)"],["aᵐ · aⁿ = aᵐ⁺ⁿ","gleiche Basis: Exponenten addieren"],["aᵐ : aⁿ = aᵐ⁻ⁿ","gleiche Basis: Exponenten subtrahieren"],["(aᵐ)ⁿ = aᵐ·ⁿ","Potenz potenzieren: Exponenten multiplizieren"],["a⁰ = 1 und a⁻ⁿ = 1/aⁿ","Sonderfälle"]],["2³ · 2⁴ und √144","Gleiche Basis 2: Exponenten addieren, 2³ · 2⁴ = 2³⁺⁴ = 2⁷ = <b>128</b>.","Wurzel: 12 · 12 = 144, also √144 = <b>12</b>."])],
"m-qfkt":["Formelzeichen und Rechenweg",FZ([["y = a·x² + b·x + c","allgemeine Form der Parabel"],["y = a·(x − d)² + e","Scheitelform"],["S(d | e)","Scheitelpunkt: tiefster bzw. höchster Punkt"],["a","a &gt; 0: nach oben geöffnet; a &lt; 0: nach unten; je größer |a|, desto enger"]],["Scheitelpunkt von y = x² − 6x + 5.","Quadratisch ergänzen: x² − 6x + 9 − 9 + 5 (die halbe 6 ist 3, 3² = 9).","(x − 3)² − 4. Also y = (x − 3)² − 4.","Ablesen: d = 3, e = −4, Scheitelpunkt <b>S(3 | −4)</b>."])],
"m-qgl":["Formelzeichen und Rechenweg",FZ([["x² + p·x + q = 0","Normalform: vor x² steht eine 1"],["p, q","die Zahlen vor x und die Zahl ohne x (mit Vorzeichen!)"],["x₁, x₂","die beiden Lösungen"],["D = (p/2)² − q","Diskriminante, steht unter der Wurzel: D &gt; 0 zwei, D = 0 eine, D &lt; 0 keine Lösung"]],["x² − 6x + 8 = 0 mit der pq-Formel x₁,₂ = −p/2 ± √((p/2)² − q)","p = −6 und q = 8. Also p/2 = −3.","D = (−3)² − 8 = 9 − 8 = 1. Die Wurzel ist √1 = 1.","x = −(−3) ± 1 = 3 ± 1.","Lösungen: <b>x₁ = 4 und x₂ = 2</b>. Probe: 4² − 6 · 4 + 8 = 0 ✓."])],
"m-pyth":["Formelzeichen und Rechenweg",FZ([["a, b","Katheten: die beiden Seiten am rechten Winkel"],["c","Hypotenuse: die längste Seite, liegt dem rechten Winkel gegenüber"],["a² + b² = c²","gilt nur im <b>rechtwinkligen</b> Dreieck"]],["Gesucht sind c und danach eine Kathete.","a = 6 und b = 8: c² = 6² + 8² = 36 + 64 = 100, also c = √100 = <b>10</b>.","Leiter: c = 5 m lang, steht 3 m von der Wand (a = 3 m). Wandhöhe b: b² = c² − a² = 25 − 9 = 16.","b = √16 = <b>4 m</b>."])],
"m-strahlen":["Formelzeichen und Rechenweg",FZ([["1 : n","Maßstab: 1 Längeneinheit auf der Karte sind n in Wirklichkeit"],["k","Streckfaktor: alle Längen werden mit k malgenommen"],["Fläche","wächst mit k²"],["Volumen","wächst mit k³"]],["Karte 1 : 25 000, die Strecke ist 4 cm lang.","In Wirklichkeit: 4 cm · 25 000 = 100 000 cm.","100 000 cm = 1000 m = <b>1 km</b>.","Bei Streckfaktor k = 2 wird die Länge doppelt so groß, die Fläche <b>4-mal</b> (2²) und das Volumen <b>8-mal</b> (2³) so groß."])],
"m-kreis":["Formelzeichen und Rechenweg",FZ([["r","Radius: Abstand vom Mittelpunkt zum Rand"],["d","Durchmesser, d = 2 · r"],["π","Kreiszahl, ungefähr 3,14"],["U","Umfang des Kreises"],["A","Flächeninhalt"],["V, h","Volumen und Höhe des Körpers"]],["Kreis mit r = 5 cm, als Zylinder mit h = 10 cm.","U = 2 · π · r = 2 · π · 5 ≈ <b>31,4 cm</b>.","A = π · r² = π · 25 ≈ <b>78,5 cm²</b>.","Zylinder: V = A · h = 78,5 · 10 ≈ <b>785 cm³</b>."])],

"m-expo":["Formelzeichen und Rechenweg",FZ([["N(t)","Bestand nach der Zeit t"],["N₀","Startwert (t = 0)"],["q","Wachstumsfaktor: Zunahme um p %: q = 1 + p/100, Abnahme: q = 1 − p/100"],["t","Zeit in Schritten (Jahre, Stunden …)"]],["1000 € mit 3 % Zinsen, 10 Jahre.","q = 1 + 3/100 = 1,03; N₀ = 1000.","N(10) = 1000 · 1,03¹⁰ ≈ 1000 · 1,3439 ≈ <b>1344 €</b>.","Bei 20 % Abnahme wäre q = 1 − 0,2 = 0,8."])],
"m-ableit":["Formelzeichen und Rechenweg",FZ([["f(x)","die Funktion, ihr Funktionswert an der Stelle x"],["f′(x)","die Ableitung („f Strich“): sie gibt die Steigung der Kurve an jeder Stelle an"],["(xⁿ)′ = n · xⁿ⁻¹","Potenzregel: Exponent nach vorn, dann um 1 kleiner"],["Faktor und Summe","ein Faktor bleibt stehen, jede Summe wird einzeln abgeleitet, eine Zahl ohne x fällt weg"]],["f(x) = 3x² − 4x + 7, Steigung bei x = 2.","3x² wird zu 3 · 2 · x = 6x. 4x wird zu 4. Die 7 fällt weg.","f′(x) = 6x − 4.","Einsetzen: f′(2) = 6 · 2 − 4 = <b>8</b>. Dort steigt die Kurve mit Steigung 8."])],
"m-kurve":["Formelzeichen und Rechenweg",FZ([["f′(x) = 0","waagerechte Tangente: Kandidat für Hoch- oder Tiefpunkt"],["f″(x)","zweite Ableitung („f zwei Strich“): die Ableitung von f′"],["f″ &lt; 0","Hochpunkt (Kurve ist nach unten gekrümmt)"],["f″ &gt; 0","Tiefpunkt (nach oben gekrümmt)"],["f″(x) = 0","Kandidat für einen Wendepunkt"]],["f(x) = x³ − 3x","f′(x) = 3x² − 3 = 0, also x² = 1 und x = ±1.","f″(x) = 6x.","f″(1) = 6 &gt; 0, also <b>Tiefpunkt T(1 | −2)</b>, denn f(1) = 1 − 3 = −2.","f″(−1) = −6 &lt; 0, also <b>Hochpunkt H(−1 | 2)</b>, denn f(−1) = −1 + 3 = 2."])],
"m-integral":["Formelzeichen und Rechenweg",FZ([["F(x)","Stammfunktion: ihre Ableitung ist f(x)"],["∫ f(x) dx","Integral: Fläche unter der Kurve (dx heißt: es wird nach x integriert)"],["a, b","untere und obere Grenze des Bereichs"],["∫ xⁿ dx","= xⁿ⁺¹ : (n + 1) + C, also Exponent plus 1 und durch den neuen Exponenten teilen"],["∫ₐᵇ f(x) dx","= F(b) − F(a)"]],["Fläche unter f(x) = x² zwischen 0 und 2.","Stammfunktion: F(x) = x³ : 3.","Obere Grenze minus untere: F(2) − F(0) = 8/3 − 0.","Ergebnis: <b>8/3 ≈ 2,67</b> Flächeneinheiten."])],
"m-efkt":["Formelzeichen und Rechenweg",FZ([["e","Eulersche Zahl, ungefähr 2,718"],["ln x","natürlicher Logarithmus: die Zahl, mit der man e potenzieren muss, um x zu erhalten"],["N₀, k, t","Startwert, Wachstumskonstante, Zeit in N(t) = N₀ · e^(k·t)"]],["Zwei Aufgaben mit ln.","eˣ = 5: auf beiden Seiten ln: x = ln 5 ≈ <b>1,61</b>.","Verdopplungszeit bei k = 0,05: 2 = e^(0,05 · t), also 0,05 · t = ln 2.","t = ln 2 : 0,05 ≈ 0,693 : 0,05 ≈ <b>13,9</b> Zeiteinheiten."])],
"m-trigf":["Formelzeichen und Rechenweg",FZ([["α","Winkel in Grad (°)"],["x","Winkel im Bogenmaß (Länge des Bogens am Einheitskreis)"],["π","Kreiszahl; 180° entsprechen π"],["a, b, c","in f(x) = a·sin(b·x) + c: Amplitude, Streckung der Periode (Periode = 2π : b), Verschiebung nach oben"]],["120° umrechnen und f(x) = 3 · sin(2x) + 1 beschreiben.","x = α · π : 180° = 120 · π : 180 = 2π/3 ≈ <b>2,09</b>.","Amplitude a = 3, Periode 2π : 2 = <b>π</b>, Mittellinie y = 1.","Die Werte liegen also zwischen 1 − 3 = −2 und 1 + 3 = 4."])],
"m-vektor":["Formelzeichen und Rechenweg",FZ([["u, v, AB","Vektoren (mit Pfeil geschrieben), z. B. v = (v₁ | v₂ | v₃)"],["|v|","Betrag: die Länge des Vektors"],["u · v","Skalarprodukt, das Ergebnis ist eine Zahl"],["A, t, u","in g: x = A + t·u: Stützvektor, Parameter (beliebige Zahl), Richtungsvektor"]],["A(1 | 2 | 3), B(4 | 6 | 3).","AB = B − A = (4−1 | 6−2 | 3−3) = (3 | 4 | 0).","Länge: |AB| = √(3² + 4² + 0²) = √25 = <b>5</b>.","Senkrecht? u = (1 | 2 | 2), v = (2 | −1 | 0): u · v = 2 − 2 + 0 = <b>0</b>, also stehen sie senkrecht aufeinander."])],
"m-ebene":["Formelzeichen und Rechenweg",FZ([["E","Name der Ebene"],["a, b, c, d","Zahlen der Gleichung a·x₁ + b·x₂ + c·x₃ = d"],["n = (a | b | c)","Normalenvektor, steht senkrecht auf der Ebene"],["P(p₁ | p₂ | p₃)","ein Punkt, dessen Abstand oder Lage man prüft"]],["E: 2x₁ + x₂ − 2x₃ = 4","n = (2 | 1 | −2).","Punktprobe P(1 | 2 | 0): 2 + 2 − 0 = 4 ✓, P liegt in E.","Abstand von Q(3 | 3 | 1): Zähler |6 + 3 − 2 − 4| = 3, Nenner √(4 + 1 + 4) = 3.","Abstand = 3 : 3 = <b>1</b>."])],
"m-binomv":["Formelzeichen und Rechenweg",FZ([["n","Anzahl der Versuche"],["p","Trefferwahrscheinlichkeit bei einem Versuch"],["k","gewünschte Trefferzahl"],["X","die Zufallsgröße „Anzahl der Treffer“"],["C(n,k)","„n über k“: Anzahl der Möglichkeiten, k Treffer auf n Versuche zu verteilen"],["μ, σ","Erwartungswert n·p und Standardabweichung"]],["Münze 4-mal werfen, genau zweimal Kopf: n = 4, p = 0,5, k = 2.","C(4,2) = 6 (Taschenrechner: 4 nCr 2).","P(X = 2) = 6 · 0,5² · 0,5² = 6 · 0,0625 = <b>0,375</b>.","Erwartungswert: μ = 4 · 0,5 = 2 Treffer."])],

/* ----- Schriftlich plus und minus ----- */
{const t=find("m4-schrplus");if(t){
 const add=buildAdd(358,467),subA=buildSub(703,358,"ab"),subE=buildSub(703,358,"erg");
 t.steps.unshift(
 {title:"Warum schriftlich? Die Stellen",body:`<p>Jede Zahl besteht aus <b>Stellen</b>: Einer (E), Zehner (Z), Hunderter (H), Tausender (T) …</p>${tbl(358,467)}<p>Beim schriftlichen Rechnen hat <b>jede Stelle ihre eigene Spalte</b>. Deshalb schreibst du Einer unter Einer, Zehner unter Zehner. So rechnest du nie Äpfel mit Birnen zusammen, sondern immer nur gleiche Sorten.</p><p>Und der Trick dahinter: Du musst nie mehr als <b>einstellige</b> Zahlen im Kopf rechnen. Das Schwere zerlegt das Verfahren für dich in lauter Kleinstschritte.</p>`},
 {title:"Addieren: Schritt für Schritt",body:`<p>Beispiel: ${fmt(358)} + ${fmt(467)}. Du fängst <b>rechts</b> an, bei den Einern. Der Grund: Was in einer Spalte zu viel ist, wandert nach <b>links</b> in die nächste. Also muss die rechte Spalte zuerst fertig sein.</p>${walk(add)}<p><b>Warum der Übertrag?</b> In eine Spalte passt nur eine Ziffer (0 bis 9). 15 Einer sind aber 1 Zehner und 5 Einer. Die 5 bleibt stehen, der Zehner wird <b>klein</b> in die Zehner-Spalte geschrieben und dort mitgezählt.</p>`},
 {title:"Subtrahieren (1): Abziehen mit Entbündeln",body:`<p>Beispiel: ${fmt(703)} ${MINUS} ${fmt(358)}. Auch hier geht es von rechts los. Aber: 3 ${MINUS} 8 geht nicht. Dann <b>holst du dir von der nächsten Stelle</b>. 1 Zehner sind 10 Einer, 1 Hunderter sind 10 Zehner. Das nennt man <b>Entbündeln</b>.</p>${walk(subA)}<p>Steht in der Nachbarspalte eine <b>0</b>, kann man dort nichts holen. Dann holst du eine Stelle weiter und die Null wird zur <b>9</b>, weil sie 10 weitergegeben hat und selbst 9 behält.</p>`},
 {title:"Subtrahieren (2): Ergänzen",body:`<p>Gleiche Aufgabe, anderer Weg: ${fmt(703)} ${MINUS} ${fmt(358)}. Du fragst nicht „wie viel bleibt?“, sondern <b>„unten plus wie viel ergibt oben?“</b>. Reicht es nicht, ergänzt du bis zur nächsten Zehnerzahl und merkst dir unten 1.</p>${walk(subE)}<p><b>Warum geht das?</b> Der Unterschied zweier Zahlen bleibt gleich, wenn du zu beiden dasselbe addierst. Oben kommen 10 Einer dazu, unten dafür 1 Zehner (das ist auch 10). Die Differenz ändert sich nicht, die Rechnung wird aber einfacher.</p>`});
 t.steps.push({title:"Probe und typische Fehler",body:`<p><b>Probe beim Addieren:</b> Ergebnis minus eine Zahl muss die andere ergeben. 825 ${MINUS} 467 = 358 ✓.</p><p><b>Probe beim Subtrahieren:</b> Ergebnis plus die kleine Zahl muss die große ergeben. 345 + 358 = 703 ✓.</p><ul class="rules"><li>Zahlen <b>nicht</b> rechtsbündig untereinander (Einer unter Einer vergessen).</li><li>Übertrag vergessen oder in die falsche Spalte geschrieben.</li><li>Beim Entbündeln den Nachbarn nicht um 1 verkleinert (bei 0: nicht zu 9 gemacht).</li><li>Kleine von großer Ziffer „umgedreht“ abgezogen (3 ${MINUS} 8 = 5 ist falsch).</li></ul>`})}}

/* ----- Schriftlich mal und geteilt ----- */
{const t=find("m4-schrmal");if(t){
 const mul=buildMul(358,4),d1=buildDiv(756,3),d2=buildDiv(624,6),d3=buildDiv(785,4);
 t.steps.unshift(
 {title:"Malnehmen: was dahintersteckt",body:`<p>${fmt(358)} · 4 bedeutet: 4-mal 358. Zerlegt in Stellen:</p><p class="eq">4 · 300 + 4 · 50 + 4 · 8 = 1200 + 200 + 32 = ${fmt(1432)}</p><p>Das schriftliche Verfahren macht genau das, nur Spalte für Spalte von rechts. Der <b>Übertrag</b> ist das Zusammenfassen: 32 sind 3 Zehner und 2 Einer, die 3 Zehner werden bei den Zehnern dazugezählt.</p>${walk(mul)}<p><b>Merke:</b> Erst malnehmen, dann den gemerkten Übertrag <b>dazuzählen</b> (nicht vorher).</p>`},
 {title:"Teilen: Verteilen Stelle für Stelle",body:`<p>Beispiel: ${fmt(756)} : 3. Stell dir vor, du verteilst 7 Hunderter, 5 Zehner und 6 Einer auf 3 Kinder. Von links nach rechts, weil man <b>zuerst die großen Einheiten</b> verteilt:</p><ul class="rules"><li>7 Hunderter auf 3 Kinder: je 2 Hunderter (2 · 3 = 6), <b>1 Hunderter bleibt übrig</b>.</li><li>Der Rest-Hunderter wird in 10 Zehner getauscht und zu den 5 Zehnern gelegt: 15 Zehner. Das ist das <b>Herunterholen</b>.</li><li>15 Zehner auf 3: je 5 Zehner, nichts bleibt.</li><li>6 Einer auf 3: je 2 Einer.</li></ul>${walk(d1)}<p>Jedes Kind bekommt 2 Hunderter, 5 Zehner und 2 Einer: <b>252</b>.</p>`},
 {title:"Teilen: Null im Ergebnis und Rest",body:`<p><b>Eine Null im Ergebnis</b> entsteht, wenn der Teiler gar nicht in den aktuellen Teil passt. Beispiel ${fmt(624)} : 6. Nach der 1 kommt die 2 dran, und 2 : 6 passt 0-mal. Dann schreibst du trotzdem eine <b>0</b> hin und holst die nächste Ziffer.</p>${walk(d2)}<p><b>Mit Rest:</b> Geht die Aufgabe nicht auf, bleibt unten ein Rest, der kleiner als der Teiler ist. ${fmt(785)} : 4:</p>${walk(d3)}<p>Probe: ${d3.res} · 4 + ${d3.rest} = 785 ✓.</p>`});
 t.steps.push({title:"Probe und typische Fehler",body:`<p><b>Probe beim Malnehmen:</b> Ergebnis durch den Faktor teilen. 1432 : 4 = 358 ✓.</p><p><b>Probe beim Teilen:</b> Ergebnis mal Teiler (plus Rest) muss die Ausgangszahl ergeben. 252 · 3 = 756 ✓.</p><ul class="rules"><li>Übertrag vor dem Malnehmen statt danach addiert.</li><li>Beim Teilen die <b>0 im Ergebnis</b> vergessen.</li><li>Nach dem Abziehen eine Ziffer nicht heruntergeholt.</li><li>Rest größer oder gleich dem Teiler. Dann passt er noch einmal hinein.</li></ul>`})}}

/* ----- Brüche: Bilder ----- */
const bar=(z,d,w=250)=>{const h=28,cw=w/d;let r="";for(let i=0;i<d;i++)r+=`<rect x="${i*cw+1}" y="1" width="${cw-2}" height="${h}" rx="3" fill="${i<z?"var(--accent)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1.2"/>`;
  return `<svg viewBox="0 0 ${w+2} ${h+2}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${z} von ${d} Teilen gefüllt">${r}</svg>`};
const bars=l=>`<div style="display:grid;gap:8px;margin:10px 0">${l.map(([z,d,cap])=>`<div style="display:grid;grid-template-columns:4.2em 1fr;align-items:center;gap:10px"><span style="text-align:center">${cap||F(z,d)}</span>${bar(z,d)}</div>`).join("")}</div>`;
const area=(zr,dr,zc,dc)=>{const w=240,h=150,cw=w/dc,ch=h/dr;let r="";
  for(let i=0;i<dr;i++)for(let j=0;j<dc;j++){const a=i<zr,b=j<zc;r+=`<rect x="${j*cw+1}" y="${i*ch+1}" width="${cw-2}" height="${ch-2}" fill="${a&&b?"var(--accent)":a||b?"var(--accent)":"var(--surface)"}" fill-opacity="${a&&b?1:a||b?.28:1}" stroke="var(--ink)" stroke-width="1"/>`}
  return `<svg viewBox="0 0 ${w+2} ${h+2}" width="100%" style="max-width:${w}px;display:block;margin:8px auto" role="img" aria-label="Flächenmodell">${r}</svg>`};

{const t=find("m-bruch1");if(t){
 t.steps.splice(1,0,
 {title:"Bruchstrich heißt „geteilt“",body:`<p>Der Bruchstrich ist ein <b>Geteilt-Zeichen</b>: ${F(3,4)} = 3 : 4 = 0,75.</p><p>Beispiel: 3 Pizzen werden gerecht auf 4 Kinder verteilt. Jedes Kind bekommt 3 : 4 = ${F(3,4)} Pizza. Das ist dasselbe wie: jede Pizza in 4 Stücke schneiden und jedem Kind 3 Stücke geben.</p>${bars([[3,4],[4,4,"1"]])}<p>Ein Bruch mit gleichem Zähler und Nenner ist ein <b>Ganzes</b>: ${F(4,4)} = 1. Und jede ganze Zahl ist ein Bruch: 5 = ${F(5,1)}. Wichtig: Durch <b>0</b> darf der Nenner nie sein.</p>`},
 {title:"Unechte Brüche und gemischte Zahlen",body:`<p>Ist der Zähler größer als der Nenner, ist der Bruch größer als 1. Das ist ein <b>unechter Bruch</b>. Er lässt sich als <b>gemischte Zahl</b> schreiben: ${F(7,4)} = 1 ${F(3,4)}.</p>${bars([[4,4,"1"],[3,4,F(3,4)]])}<p><b>Unecht → gemischt:</b> Zähler durch Nenner teilen. 7 : 4 = 1 Rest 3, also 1 ${F(3,4)}. Das Ergebnis ist die Ganze, der Rest der neue Zähler.</p><p><b>Gemischt → unecht:</b> Ganze mal Nenner plus Zähler. 2 ${F(1,3)}: 2 · 3 + 1 = 7, also ${F(7,3)}.</p>`})}}

{const t=find("m-bruch2");if(t){
 t.steps.splice(1,0,
 {title:"Warum gleiche Nenner nötig sind (Bild)",body:`<p>${F(1,3)} + ${F(1,4)}: Ein Drittel und ein Viertel sind verschieden große Stücke. Erst wenn man <b>beide Stücke in gleich kleine Teile schneidet</b>, kann man zählen. Der kleinste gemeinsame Teil ist ein Zwölftel:</p>${bars([[1,3],[1,4],[4,12],[3,12],[7,12]])}<p>${F(1,3)} sind ${F(4,12)}, ${F(1,4)} sind ${F(3,12)}. Zusammen ${F(7,12)}.</p>`});
 t.steps.push({title:"Hauptnenner finden und gemischte Zahlen",body:`<p><b>Hauptnenner finden:</b> Vielfache des größeren Nenners aufschreiben, bis der kleinere Nenner hineinpasst. ${F(1,6)} + ${F(1,4)}: Vielfache von 6: 6, 12 … 12 ist durch 4 teilbar. Hauptnenner <b>12</b>.</p><p class="eq">${F(1,6)} + ${F(1,4)} = ${F(2,12)} + ${F(3,12)} = ${F(5,12)}</p><p><b>Gemischte Zahlen addieren:</b> Ganze und Brüche getrennt. 2 ${F(1,2)} + 1 ${F(2,3)}:</p><ol class="rules"><li>Ganze: 2 + 1 = 3.</li><li>Brüche: ${F(3,6)} + ${F(4,6)} = ${F(7,6)} = 1 ${F(1,6)}.</li><li>Zusammen: 3 + 1 ${F(1,6)} = <b>4 ${F(1,6)}</b>.</li></ol><p class="tip">Nach dem Rechnen immer prüfen: Lässt sich das Ergebnis noch kürzen? Ist der Zähler größer als der Nenner, in eine gemischte Zahl umwandeln.</p>`})}}

{const t=find("m-bruch3");if(t){
 t.steps.splice(1,0,
 {title:"Malnehmen im Bild: das Flächenmodell",body:`<p>${F(2,3)} · ${F(3,4)}: Das Rechteck wird in 4 Spalten und 3 Zeilen geteilt. Drei von 4 Spalten gehören zu ${F(3,4)}, zwei von 3 Zeilen zu ${F(2,3)}. Die kräftige Fläche, wo beides gilt, ist das Ergebnis:</p>${area(2,3,3,4)}<p>Es sind 6 von 12 Feldern, also ${F(6,12)} = ${F(1,2)}. Genau das sagt die Regel: Zähler mal Zähler (2 · 3 = 6), Nenner mal Nenner (3 · 4 = 12).</p><p><b>Ganze mal Bruch:</b> 4 · ${F(2,3)} = ${F(8,3)} = 2 ${F(2,3)}. Die Ganze wird nur mit dem Zähler malgenommen.</p>`});
 t.steps.push({title:"Teilen: warum der Kehrwert",body:`<p>Die Frage bei ${F(3,4)} : ${F(1,4)} lautet: <b>Wie oft passt ein Viertel in drei Viertel?</b></p>${bars([[3,4],[1,4]])}<p>Dreimal. Mit der Regel: ${F(3,4)} · ${F(4,1)} = ${F(12,4)} = 3 ✓.</p><p><b>Bruch durch ganze Zahl:</b> ${F(3,4)} : 3 heißt „drei Viertel auf 3 Personen verteilen“: Jeder bekommt ${F(1,4)}. Mit Kehrwert: ${F(3,4)} · ${F(1,3)} = ${F(3,12)} = ${F(1,4)} ✓. Das Teilen durch 3 ist dasselbe wie Malnehmen mit ${F(1,3)}.</p><p class="warn">Den Kehrwert nur beim <b>zweiten</b> Bruch bilden, nicht beim ersten.</p>`})}}
})();

function openStop(st){const was=!!S.seen[st.key];S.seen[st.key]=true;save();
  if(st.planned){openPlanned(st);return}
  const t=st.topic,info=[...t.steps.map(s=>Object.assign({t:"info"},s)),...(KT[t.id]?[{t:"info",kt:true,title:"So lernen Kinder das heute",body:KT[t.id]}]:[])];
  if(was){runSession({title:t.title,steps:[{t:"intro",info},...exList(t.gens,5)],stop:st});return}
  const steps=[...t.steps.map(s=>Object.assign({t:"info"},s)),...(KT[t.id]?[{t:"info",kt:true,title:"So lernen Kinder das heute",body:KT[t.id]}]:[]),...exList(t.gens,6)];
  runSession({title:t.title,steps,stop:st})}
function kiSteps(st,L){return[...L.steps.map(s=>({t:"info",kt:/Kinder das heute/i.test(s.title),title:esc(s.title),html:md(s.body)})),...L.quiz.map((q,k)=>kiEx(st.key,q,k))]}

/* KI-Lektion für geplante Themen */
function openPlanned(st){
  if(KI[st.key]){runSession({title:st.title,steps:kiSteps(st,KI[st.key]),stop:st});return}
  const root=openOverlay();root.innerHTML="";
  const w=h(`<div class="wrap"><div class="lbar"><button class="x" type="button" aria-label="Schließen">×</button><h2 style="flex:1;font-size:1.15rem">${esc(st.title)}</h2></div><div class="stack" id="pb"></div></div>`);
  root.append(w);$(".x",w).onclick=closeOverlay;const pb=$("#pb",w);
  pb.append(h(`<div class="card stack"><span class="eyebrow">${esc(st.subj.name)} · ${esc(st.band.title)}</span><p>Für dieses Thema gibt es noch keine fertige Lektion. Der Mentor kann dir jetzt eine schreiben: 3 bis 5 Erklärseiten und 6 Quizfragen. Sie bleibt danach auf diesem Gerät gespeichert, auch für das Training.</p><div class="out"></div></div>`));
  const out=$(".out",pb);
  if(!sampleFn){out.innerHTML=`<p class="notice">${esc(NO_AI_MSG())}</p>`;return}
  const row=h(`<div class="row end"><button class="btn" type="button">Lektion erstellen lassen</button></div>`);pb.append(row);
  $("button",row).onclick=async e=>{e.target.disabled=true;out.innerHTML=`<p class="muted"><span class="spin"></span> Der Mentor schreibt deine Lektion. Das dauert etwa eine halbe Minute.</p>`;
    const prompt=`Du schreibst eine Lektion für die Lern-App „Schulkoje“. Zielgruppe: ein Vater oder eine Mutter, der/die den Schulstoff auffrischt, um später den eigenen Kindern helfen zu können.
Fach: ${st.subj.name==="Bio"?"Biologie":st.subj.name}. Niveau: ${st.band.title} (deutscher Lehrplan). Thema: ${st.title}.
Antworte NUR mit JSON genau in dieser Form:
{"steps":[{"title":"…","body":"…"}],"quiz":[{"q":"…","opts":["…","…","…","…"],"correct":0,"why":"…"}]}
Regeln:
- 3 bis 5 steps. Der LETZTE step heißt "So lernen Kinder das heute" und richtet sich an Eltern: wie das Thema heute in deutschen Schulen (z. B. Sachsen) üblicherweise vermittelt wird, ein Alltagsexperiment oder Gegenstand zum gemeinsamen Ausprobieren, der häufigste Kinderfehler und eine Prüffrage. Jeder body 70 bis 150 Wörter, einfache Sprache, Fachbegriffe beim ersten Auftreten erklären, mindestens ein konkretes Alltagsbeispiel (gern Wassersport, Körper und Bewegung, Garten). Absätze mit Leerzeile trennen, Aufzählungen mit "- " am Zeilenanfang, **fett** für Fachbegriffe. Keine Formeln in LaTeX, Brüche als a/b.
- Genau 6 quiz-Fragen, je 4 Antwortmöglichkeiten, genau eine richtig; "correct" ist der Index der richtigen Antwort, verteile ihn über 0 bis 3. "why" erklärt in 1 bis 2 Sätzen, warum die Antwort stimmt.
- Fachlich korrekt auf Schulniveau. Deutsch.`;
    try{const L=await sampleFn.json(prompt,{modelTier:"default",cache:false});
      const steps=(L&&Array.isArray(L.steps)?L.steps:[]).filter(s=>s&&typeof s.title==="string"&&typeof s.body==="string");
      const quiz=(L&&Array.isArray(L.quiz)?L.quiz:[]).filter(q=>q&&typeof q.q==="string"&&Array.isArray(q.opts)&&q.opts.length>=2&&q.opts.every(o=>typeof o==="string")&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.opts.length);
      if(!steps.length||quiz.length<3)throw{code:"invalid_json"};
      KI[st.key]={steps,quiz,made:today()};saveKI();runSession({title:st.title,steps:kiSteps(st,KI[st.key]),stop:st})}
    catch(err){out.innerHTML=`<p class="feedback bad">${esc(sampleErr(err))}</p>`;e.target.disabled=false;e.target.textContent="Nochmal versuchen"}}}

/* ---------- Lernpfad ---------- */
function ringSVG(p,col="var(--accent)"){const r=30,C=2*Math.PI*r;return `<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C*Math.min(1,p)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 36 36)"/></svg>`}
function renderPath(){const box=$("#tab-path");box.innerHTML="";
  const rk=rankOf(S.xp),dayN=S.day.d===today()?S.day.n:0;
  const span=rk.next?(S.xp-RANKS[rk.i][0])/(rk.next[0]-RANKS[rk.i][0]):1;
  box.append(h(`<div class="card karo rank"><div class="ring">${ringSVG(dayN/S.goal,"var(--signal)")}<b>${dayN}/${S.goal}</b></div><div class="rank-txt"><span class="eyebrow">Dein Rang</span><h2>${rk.name}</h2><div class="track"><i style="width:${(span*100).toFixed(1)}%"></i></div><span class="muted small">${rk.next?`Noch ${rk.next[0]-S.xp} XP bis „${rk.next[1]}“`:"Höchster Rang erreicht"} · Tagesziel ${dayN}/${S.goal} Aufgaben</span></div></div>`));
  const sg=h(`<div class="subjects" role="group" aria-label="Fach wählen"></div>`);
  SUBJECTS.forEach(su=>{const st=subjStats(su);
    const b=h(`<button class="subj" type="button" aria-pressed="${S.subj===su.id}" style="--sc:var(--s-${su.id})">${SUBJ_ICON[su.id]}<span class="nm">${su.name}</span><span class="track"><i style="width:${st.done/st.total*100}%"></i></span><span class="pc">${st.done}/${st.total}</span></button>`);
    b.onclick=()=>{S.subj=su.id;save();renderPath()};sg.append(b)});
  box.append(sg);
  const su=SUBJECTS.find(x=>x.id===S.subj)||SUBJECTS[0];
  if(!su.bands.some(b=>b.topics))box.append(h(`<p class="notice">In ${su.name==="Bio"?"Biologie":su.name} schreibt dir der Mentor jede Lektion auf Wunsch. Fertige Lektionen mit Animationen kommen Paket für Paket dazu.</p>`));
  let nextSet=false;
  su.bands.forEach(b=>{const list=stopsOf(su,b),dn=list.filter(s=>S.done[s.key]).length;
    const sec=h(`<section class="band" style="--sc:var(--s-${su.id})"><div class="band-h"><h3>${esc(b.title)}</h3><span class="tag ${dn===list.length?"ok":""}">${dn}/${list.length}</span></div><div class="route"></div></section>`);
    const route=$(".route",sec);
    list.forEach((st,k)=>{const done=!!S.done[st.key],ready=st.planned&&KI[st.key];let cls="stop",buoy=k+1;
      if(done){cls+=" done";buoy="✓"}else if(!nextSet&&!st.planned){cls+=" next";nextSet=true}
      if(st.planned){cls+=" ki"+(ready?" ready":"");if(!done)buoy="KI"}
      const sub=st.planned?(done?"KI-Lektion · abgeschlossen":ready?"KI-Lektion · bereit":"Lektion vom Mentor erstellen lassen"):st.sub;
      const b2=h(`<button class="${cls}" type="button"><span class="buoy">${buoy}</span><span class="txt"><span class="t">${esc(st.title)}</span><br><span class="s">${esc(sub)}</span></span>${!st.planned&&S.seen[st.key]?starRow(S.stars[st.key]||0):!st.planned&&st.topic.steps.some(x=>x.w)?`<span class="tag">Animation</span>`:""}</button>`);
      b2.onclick=()=>openStop(st);route.append(b2)});
    box.append(sec)})}

/* ---------- Training ---------- */
function trainingPool(){const ids=new Map();
  Object.values(STOPS).forEach(st=>{if(!(S.done[st.key]||S.seen[st.key]))return;
    if(!st.planned)st.topic.gens.forEach(g=>ids.set("g:"+g,{gen:g}));
    else if(KI[st.key]&&S.done[st.key])KI[st.key].quiz.forEach((q,k)=>ids.set(`k:${st.key}:${k}`,{st,q,k}))});
  return ids}
function startTraining(){const pool=trainingPool();if(!pool.size)return;
  const ids=[...pool.keys()],used={},steps=[];
  for(let n=0;n<10;n++){const cand=ids.filter(id=>(used[id]||0)<(ids.length>4?2:4));if(!cand.length)break;
    const wts=cand.map(id=>(100-skillOf(id).s)+15),sum=wts.reduce((a,b)=>a+b,0);let r=Math.random()*sum,pickId=cand[0];
    for(let k=0;k<cand.length;k++){r-=wts[k];if(r<=0){pickId=cand[k];break}}
    used[pickId]=(used[pickId]||0)+1;const it=pool.get(pickId);
    steps.push(it.gen?genEx(it.gen):kiEx(it.st.key,it.q,it.k))}
  runSession({title:"Training",steps,mode:"train"})}
function renderTrain(){const box=$("#tab-train");box.innerHTML="";const pool=trainingPool(),dayN=S.day.d===today()?S.day.n:0;
  const head=h(`<div class="card daily"><div class="ring">${ringSVG(dayN/S.goal,"var(--signal)")}<b>${dayN}/${S.goal}</b></div><div class="daily-txt"><span class="eyebrow">Heute</span><h2>${dayN>=S.goal?"Tagesziel geschafft":"Tagesziel: "+S.goal+" Aufgaben"}</h2><span class="muted small">Gemischte Aufgaben aus allem, was du schon angefangen hast. Was dir schwerfällt, kommt öfter dran.</span></div></div>`);
  box.append(head);box.append(gamesCard());
  if(!pool.size){box.append(h(`<p class="notice">Noch nichts zum Trainieren. Öffne unter „Lernen“ eine Lektion, dann landen ihre Aufgaben automatisch hier.</p>`));return}
  const row=h(`<div class="row"><button class="btn" type="button">Training starten (10 Aufgaben)</button></div>`);$("button",row).onclick=startTraining;box.append(row);
  const ids=[...pool.keys()].sort((a,b)=>skillOf(a).s-skillOf(b).s);
  const card=h(`<div class="card stack"><span class="eyebrow">Im Fokus</span><div class="bars"></div><p class="muted small">Der Balken zeigt, wie sicher du bist. Richtige Antworten füllen ihn, Fehler lassen ihn sinken.</p></div>`);

function backupData(withKey){const data={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);

async function saveBackup(withKey,msg){
