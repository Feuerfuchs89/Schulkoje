    if(t===2){const cc=pick([1,2,4]),m=ri(-5,5);return{q:`Wo schneidet ${term(`E: x₁ + 2x₂ + ${cc}x₃ = ${cc*m}`)} die x₃-Achse? Gib die x₃-Koordinate des Schnittpunkts ein.`,kind:"num",ans:R(m),sol:`Auf der x₃-Achse sind x₁ = x₂ = 0: ${cc}x₃ = ${cc*m} → x₃ = <b>${fmt(m)}</b>.`}}
    const {v,L}=nv(),d=ri(-5,5),Q=[ri(-3,3),ri(-3,3),ri(-3,3)],s=dot3(v,Q)-d;if(!s)return G.ebene();
    return{q:`Wie weit ist ${term(`P(${Q.map(fmt).join(" | ")})`)} von der Ebene ${term(`E: ${lin3(v)} = ${fmt(d)}`)} entfernt?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(Math.abs(s),L),tol:.01,sol:`Normalenvektor n = ${vs(v)}, |n| = ${L}. Abstand = |n · P ${MINUS} d| : |n| = |${fmt(dot3(v,Q))} ${MINUS} ${P(d)}| : ${L} = <b>${FR(R(Math.abs(s),L))}</b>.`}},
  binomv(){const t=ri(0,3);
    if(t===0){const n=ri(3,5),k=ri(0,n);return{q:`Eine faire Münze wird ${n}-mal geworfen. Wie wahrscheinlich ist <b>genau ${k}-mal Zahl</b>?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(nCk(n,k),2**n),tol:.002,sol:`P = C(${n},${k}) · (1/2)<sup>${k}</sup> · (1/2)<sup>${n-k}</sup> = ${nCk(n,k)} : ${2**n} = <b>${FR(R(nCk(n,k),2**n))}</b>.`}}
    if(t===1){const n=pick([20,40,50,60,80,100,200]),p=pick([.1,.2,.25,.3,.5]);return{q:`Eine Bernoulli-Kette hat n = ${n} und p = ${fmt(p)}. Wie groß ist der <b>Erwartungswert</b> μ?`,kind:"num",ans:R(Math.round(n*p*100),100),sol:`μ = n · p = ${n} · ${fmt(p)} = <b>${fmt(n*p)}</b>.`}}
    if(t===2){const c=pick([[100,.2,4],[64,.5,4],[36,.5,3],[225,.2,6],[400,.2,8],[100,.5,5]]);return{q:`Binomialverteilung mit n = ${c[0]} und p = ${fmt(c[1])}. Wie groß ist die <b>Standardabweichung</b> σ?`,kind:"num",ans:R(c[2]),sol:`σ = √(n · p · (1 ${MINUS} p)) = √(${c[0]} · ${fmt(c[1])} · ${fmt(1-c[1])}) = √${c[2]**2} = <b>${c[2]}</b>.`}}
    const n=ri(2,5);return{q:`Eine faire Münze wird ${n}-mal geworfen. Wie wahrscheinlich ist <b>mindestens einmal Zahl</b>?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(2**n-1,2**n),tol:.002,sol:`Gegenereignis „nie Zahl“: (1/2)<sup>${n}</sup> = 1/${2**n}. P = 1 ${MINUS} 1/${2**n} = <b>${F(2**n-1,2**n)}</b>.`}},
  normal(){const t=ri(0,2);
    if(t===0){const k=ri(1,3),v=[68.3,95.4,99.7][k-1];return{q:`Eine Größe ist normalverteilt. Wie viel Prozent der Werte liegen zwischen <b>μ ${MINUS} ${k}σ</b> und <b>μ + ${k}σ</b>?<p class="muted small">Gib eine Zahl ein, auf ganze Prozent gerundet.</p>`,kind:"num",ans:R(Math.round(v)),tol:.6,sol:`Sigma-Regeln: 1σ ≈ 68 %, 2σ ≈ 95 %, 3σ ≈ 99,7 %. Hier: <b>${fmt(v)} %</b>.`}}
    if(t===1){const mu=pick([100,50,170,500]),sg2=pick([4,10,20]),z=pick([-2,-1,-.5,.5,1,1.5,2]),x=mu+z*sg2;return{q:`μ = ${mu}, σ = ${sg2}. Wie groß ist der <b>z-Wert</b> von x = ${fmt(x)}?`,kind:"num",ans:R(z*2,2),sol:`z = (x ${MINUS} μ) : σ = (${fmt(x)} ${MINUS} ${mu}) : ${sg2} = <b>${fmt(z)}</b>. Der Wert liegt ${fmt(Math.abs(z))} Standardabweichungen ${z<0?"unter":"über"} dem Mittelwert.`}}
    const mu=pick([100,50,170]),s2=pick([5,10,15]);return{q:`Normalverteilung mit μ = ${mu} und σ = ${s2}. Etwa 95 % der Werte liegen zwischen ${fmt(mu-2*s2)} und einer oberen Grenze. Wie groß ist sie?`,kind:"num",ans:R(mu+2*s2),sol:`95 % liegen im Bereich μ ± 2σ. Obere Grenze: ${mu} + 2 · ${s2} = <b>${mu+2*s2}</b>.`}}
});
const GEN_NAMES_1112={ableit:"Ableiten",kurve:"Kurvendiskussion",integral:"Integrale",efkt:"e-Funktion und ln",trigf:"Sinus und Bogenmaß",vektor:"Vektoren und Geraden",ebene:"Ebenen",binomv:"Binomialverteilung",normal:"Normalverteilung"};

/* Bausteine Klasse 11–12 */
WIDGETS.tangente=function(el){const w=wid("tg");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"x","Stelle x₀",-3,3,-2,.25)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const X=el.querySelector("#"+w+"x"),f=x=>x**3/4-x,d=x=>.75*x*x-1;
  const draw=()=>{const x0=+X.value,m=d(x0),y0=f(x0),p=plot({xmin:-4,xmax:4,ymin:-4,ymax:4,w:280,h:280});el.querySelector("#"+w+"x-v").textContent=fmt(x0);
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(p.curve(f)+p.curve(x=>y0+m*(x-x0),"var(--signal)",2)+p.dot(x0,y0));
    el.querySelector("#"+w+"-t").innerHTML=`f(x) = x³/4 ${MINUS} x. Tangentensteigung: <b>f′(${fmt(x0)}) = ${fmt(Math.round(m*100)/100)}</b>. ${Math.abs(m)<.35?"Fast waagerecht: Hier liegt ein Hoch- oder Tiefpunkt.":m>0?"Die Kurve steigt.":"Die Kurve fällt."}`};
  X.oninput=draw;draw()};
WIDGETS.integral=function(el){const w=wid("in");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"b","Obere Grenze b",1,6,4,1)}${slider(w+"n","Rechtecke",1,40,4,1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const B=el.querySelector("#"+w+"b"),N=el.querySelector("#"+w+"n"),f=x=>x*x/4;
  const draw=()=>{const b=+B.value,n=+N.value,p=plot({xmin:-.5,xmax:6.5,ymin:-1,ymax:10,w:300,h:240});el.querySelector("#"+w+"b-v").textContent=b;el.querySelector("#"+w+"n-v").textContent=n;
    let r="",s=0;for(let i=1;i<=n;i++){const x1=b*i/n,x0=b*(i-1)/n,h=f(x1);s+=h*b/n;r+=`<rect x="${p.X(x0)}" y="${p.Y(h)}" width="${p.X(x1)-p.X(x0)}" height="${p.Y(0)-p.Y(h)}" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width=".8"/>`}
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(r+p.curve(f));
    el.querySelector("#"+w+"-t").innerHTML=`f(x) = x²/4 von 0 bis ${b}. Rechtecksumme: <b>${fmt(Math.round(s*100)/100)}</b>. Exakt (Integral): b³/12 = <b>${fmt(Math.round(b**3/12*100)/100)}</b>. Mehr Rechtecke, bessere Näherung.`};
  B.oninput=N.oninput=draw;draw()};
WIDGETS.efkt=function(el){const w=wid("ef");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"a","Basis a",1.5,4,2,.1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const A=el.querySelector("#"+w+"a");
  const draw=()=>{const a=+A.value,m=Math.log(a),p=plot({xmin:-2.5,xmax:2.5,ymin:-1,ymax:6,w:280,h:260});el.querySelector("#"+w+"a-v").textContent=fmt(a);
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(p.curve(Math.exp,"var(--muted)",2,"5 4")+p.curve(x=>a**x)+p.curve(x=>1+m*x,"var(--signal)",1.8)+p.dot(0,1));
    el.querySelector("#"+w+"-t").innerHTML=`Blau: a<sup>x</sup>. Gestrichelt: e<sup>x</sup>. Gelb: Tangente bei x = 0 mit Steigung ln ${fmt(a)} = <b>${fmt(Math.round(m*100)/100)}</b>. ${Math.abs(m-1)<.05?"Steigung 1: Das ist die Basis e ≈ 2,72.":m<1?"Steigung kleiner als 1: Basis kleiner als e.":"Steigung größer als 1: Basis größer als e."}`};
  A.oninput=draw;draw()};
WIDGETS.binverteilung=function(el){const w=wid("bv");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"n","Versuche n",4,40,12,1)}${slider(w+"p","Trefferwahrscheinlichkeit p",.1,.9,.5,.05)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const N=el.querySelector("#"+w+"n"),Pp=el.querySelector("#"+w+"p");
  const draw=()=>{const n=+N.value,p=+Pp.value,mu=n*p,sd=Math.sqrt(n*p*(1-p));el.querySelector("#"+w+"n-v").textContent=n;el.querySelector("#"+w+"p-v").textContent=fmt(p);
    const pm=[Math.pow(1-p,n)];for(let k=0;k<n;k++)pm.push(pm[k]*(n-k)/(k+1)*p/(1-p));const mx=Math.max(...pm),bw=300/(n+1);let s="";
    pm.forEach((v,k)=>{const h=v/mx*120;s+=`<rect x="${k*bw+1}" y="${135-h}" width="${bw-2}" height="${h}" fill="${Math.abs(k-mu)<=sd?"var(--accent)":"var(--sunk)"}" stroke="var(--line)"/>`});
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 140" width="100%" style="max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:8px" role="img" aria-label="Säulendiagramm Binomialverteilung">${s}</svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`Säule k = Wahrscheinlichkeit für genau k Treffer. Grün: Bereich μ ± σ. μ = n · p = <b>${fmt(Math.round(mu*100)/100)}</b>, σ = <b>${fmt(Math.round(sd*100)/100)}</b>.`};
  N.oninput=Pp.oninput=draw;draw()};
WIDGETS.glocke=function(el){const w=wid("gl");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"m","Mittelwert μ",-3,3,0,.5)}${slider(w+"s","Standardabweichung σ",.5,2,1,.25)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const M=el.querySelector("#"+w+"m"),S2=el.querySelector("#"+w+"s");
  const draw=()=>{const mu=+M.value,sd=+S2.value,p=plot({xmin:-6,xmax:6,ymin:-.05,ymax:.85,w:300,h:200,step:1}),f=x=>Math.exp(-(((x-mu)/sd)**2)/2)/(sd*Math.sqrt(2*Math.PI));
    el.querySelector("#"+w+"m-v").textContent=fmt(mu);el.querySelector("#"+w+"s-v").textContent=fmt(sd);
    let a=`M${p.X(mu-sd)},${p.Y(0)}`;for(let i=0;i<=40;i++){const x=mu-sd+2*sd*i/40;a+=`L${p.X(x)},${p.Y(f(x))}`}a+=`L${p.X(mu+sd)},${p.Y(0)}Z`;
    el.querySelector("#"+w+"-o").innerHTML=p.wrap(`<path d="${a}" fill="var(--accent)" fill-opacity=".3"/>`+p.curve(f));
    el.querySelector("#"+w+"-t").innerHTML=`Grüne Fläche: μ ± σ = ${fmt(mu-sd)} bis ${fmt(mu+sd)}. Darin liegen immer <b>68,3 %</b> aller Werte. Größeres σ macht die Glocke breiter und flacher, die Gesamtfläche bleibt 1.`};
  M.oninput=S2.oninput=draw;draw()};

const BAND1112={key:"11-12",title:"Klasse 11–12",topics:[
  {id:"m-ableit",title:"Ableitung und Steigung",sub:"Tangente, Potenzregel",gens:["ableit"],steps:[
    {title:"Steigung an einem Punkt",body:`<p>Bei einer Geraden ist die Steigung überall gleich. Bei einer Kurve ändert sie sich von Punkt zu Punkt. Die <b>Ableitung</b> f′(x) gibt die Steigung der Kurve an jeder Stelle an, also die Steigung der <b>Tangente</b>, die die Kurve dort gerade berührt.</p><p>Dahinter steckt die Sekantensteigung, wenn die zwei Punkte immer näher zusammenrücken. Schiebe den Punkt:</p>`,w:"tangente"},
    {title:"Die Ableitungsregeln",body:`<ul class="rules"><li><b>Potenzregel:</b> (x<sup>n</sup>)′ = n · x<sup>n−1</sup></li><li><b>Faktorregel:</b> Zahlen davor bleiben: (3x²)′ = 6x</li><li><b>Summenregel:</b> Glied für Glied ableiten</li><li><b>Konstanten</b> fallen weg: (7)′ = 0, (5x)′ = 5</li></ul><p class="eq">f(x) = 2x³ − 4x + 1<br>f′(x) = 6x² − 4</p><p class="tip">Waagerechte Tangente (Hoch- oder Tiefpunkt): f′(x) = 0 setzen.</p>`}]},
  {id:"m-kurve",title:"Kurvendiskussion",sub:"Nullstellen, Extrema, Wendepunkte",gens:["kurve"],steps:[
    {title:"Das Rezept",body:`<ol class="rules"><li><b>Nullstellen:</b> f(x) = 0</li><li><b>Extrempunkte:</b> f′(x) = 0. Dann f″ prüfen: f″ &lt; 0 Hochpunkt, f″ &gt; 0 Tiefpunkt. y-Wert in f einsetzen.</li><li><b>Wendepunkte:</b> f″(x) = 0 (Kurve wechselt zwischen Links- und Rechtskurve)</li></ol><p class="eq">f(x) = x³ − 3x<br>f′(x) = 3x² − 3 = 0 → x = ±1<br>f″(x) = 6x<br>f″(−1) = −6 → Hochpunkt H(−1 | 2)<br>f″(1) = 6 → Tiefpunkt T(1 | −2)<br>f″(x) = 0 → Wendepunkt W(0 | 0)</p>`},
    {title:"Was f′ und f″ erzählen",body:`<p>Wie beim Auto: f ist der Weg, f′ die <b>Geschwindigkeit</b>, f″ die <b>Beschleunigung</b>. Ist f′ positiv, steigt die Kurve. Ist f″ positiv, wird sie steiler (Linkskurve, wie eine Schale).</p><p class="warn">Aus f′(x) = 0 folgt noch nicht, dass ein Extrempunkt vorliegt (Sattelpunkt bei f(x) = x³). Darum immer f″ prüfen.</p>`}]},
  {id:"m-integral",title:"Integralrechnung",sub:"Fläche, Stammfunktion",gens:["integral"],steps:[
    {title:"Fläche unter der Kurve",body:`<p>Das <b>Integral</b> ∫<sub>a</sub><sup>b</sup> f(x) dx misst die Fläche zwischen Graph und x-Achse. Man nähert sie mit Rechtecken an. Je schmaler die Rechtecke, desto genauer:</p>`,w:"integral"},
    {title:"Stammfunktion und Hauptsatz",body:`<p>Eine <b>Stammfunktion</b> F ist eine Funktion, deren Ableitung f ist. Aufleiten ist die Umkehrung des Ableitens: x<sup>n</sup> wird zu x<sup>n+1</sup> : (n+1).</p><p class="eq">∫<sub>a</sub><sup>b</sup> f(x) dx = F(b) − F(a)<br>∫<sub>0</sub><sup>3</sup> x² dx = [x³/3] = 9 − 0 = 9</p><p class="warn">Flächen unterhalb der x-Achse zählen negativ. Für die echte Fläche zwischen Nullstellen getrennt rechnen und Beträge addieren.</p>`}]},
  {id:"m-efkt",title:"e-Funktion und Logarithmus",sub:"Die Zahl e, ln, Wachstum",gens:["efkt"],steps:[
    {title:"Die Zahl e",body:`<p>Unter allen Exponentialfunktionen a<sup>x</sup> gibt es genau eine, deren Steigung bei x = 0 gleich 1 ist. Ihre Basis ist die <b>Eulersche Zahl e ≈ 2,718</b>. Das Besondere: <b>(e<sup>x</sup>)′ = e<sup>x</sup></b>. Die Kurve hat an jeder Stelle als Steigung ihren eigenen Wert. Stelle die Basis ein:</p>`,w:"efkt"},
    {title:"Der natürliche Logarithmus",body:`<p>ln ist die Umkehrfunktion von e<sup>x</sup>: ln(e<sup>x</sup>) = x und e<sup>ln x</sup> = x. Damit löst man Gleichungen: e<sup>x</sup> = 5 → x = ln 5 ≈ 1,61.</p><ul class="rules"><li>ln(a · b) = ln a + ln b</li><li>ln(a<sup>k</sup>) = k · ln a</li><li>(e<sup>kx</sup>)′ = k · e<sup>kx</sup></li></ul><p>Wachstum: N(t) = N₀ · e<sup>kt</sup>. Verdopplungszeit: t = ln 2 : k.</p>`}]},
  {id:"m-trigf",title:"Sinus und Bogenmaß",sub:"Winkel als Zahl, Schwingungen",gens:["trigf"],steps:[
    {title:"Das Bogenmaß",body:`<p>Ab Klasse 11 misst man Winkel als <b>Länge des Kreisbogens</b> am Einheitskreis. Ein voller Kreis (360°) hat die Länge 2π.</p><p class="eq">x = α · π : 180°<br>30° = π/6, 45° = π/4, 60° = π/3, 90° = π/2, 180° = π</p><p class="warn">Taschenrechner auf RAD stellen, wenn mit Bogenmaß gerechnet wird, sonst auf DEG.</p>`,w:"einheitskreis"},
    {title:"Sinus und Kosinus als Funktionen",body:`<p>Der Graph von sin und cos ist eine Welle mit Periode 2π (360°). Bei f(x) = a · sin(b · x) + c gilt: a ist die <b>Amplitude</b>, die Periode ist 2π : b, c verschiebt nach oben.</p><p class="eq">(sin x)′ = cos x<br>(cos x)′ = −sin x</p><table class="tbl"><tr><th>α</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr><tr><td>sin α</td><td>0</td><td>½</td><td>√2/2</td><td>√3/2</td><td>1</td></tr></table>`}]},
  {id:"m-vektor",title:"Vektoren und Geraden im Raum",sub:"Länge, Skalarprodukt, Geradengleichung",gens:["vektor"],steps:[
    {title:"Rechnen mit Vektoren",body:`<p>Ein <b>Vektor</b> beschreibt eine Verschiebung, z. B. (2 | −1 | 3): 2 nach rechts, 1 zurück, 3 nach oben. Der Vektor von A nach B ist <b>AB = B − A</b>.</p><ul class="rules"><li><b>Länge:</b> |v| = √(x² + y² + z²)</li><li><b>Skalarprodukt:</b> u · v = u₁v₁ + u₂v₂ + u₃v₃</li><li><b>Senkrecht</b> (orthogonal) genau dann, wenn u · v = 0</li></ul>`},
    {title:"Geraden im Raum",body:`<p class="eq">g: x = A + t · u</p><p>A ist der <b>Stützvektor</b> (ein Punkt auf der Geraden), u der <b>Richtungsvektor</b>, t eine beliebige Zahl.</p><ul class="rules"><li><b>Punktprobe:</b> P = A + t · u nach t auflösen. Das t muss in allen drei Zeilen passen.</li><li><b>Parallel</b>, wenn die Richtungsvektoren Vielfache voneinander sind.</li></ul>`}]},
  {id:"m-ebene",title:"Ebenen",sub:"Normalenvektor, Abstand, Lage",gens:["ebene"],steps:[
    {title:"Ebene und Normalenvektor",body:`<p class="eq">E: a·x₁ + b·x₂ + c·x₃ = d</p><p>Der Vektor n = (a | b | c) heißt <b>Normalenvektor</b>: Er steht senkrecht auf der ganzen Ebene.</p><ul class="rules"><li><b>Punktprobe:</b> Koordinaten einsetzen, es muss d herauskommen.</li><li><b>Spurpunkte</b> (Schnitt mit den Achsen): zwei Koordinaten null setzen.</li></ul>`},
    {title:"Abstand und Lage",body:`<p><b>Abstand Punkt–Ebene:</b></p><p class="eq">Abstand = |a·p₁ + b·p₂ + c·p₃ − d| : √(a² + b² + c²)</p><p><b>Gerade und Ebene:</b> Gerade in die Ebenengleichung einsetzen und t ausrechnen. Eine Lösung: Schnittpunkt. Keine Lösung (Widerspruch): parallel. Immer wahr: Gerade liegt in der Ebene.</p>`}]},
  {id:"m-binomv",title:"Binomialverteilung",sub:"Bernoulli-Kette, μ und σ",gens:["binomv"],steps:[
    {title:"Treffer zählen",body:`<p>Ein Versuch mit nur zwei Ausgängen (Treffer / Niete) wird n-mal unabhängig wiederholt, mit gleichem p: eine <b>Bernoulli-Kette</b>. Die Trefferzahl X ist binomialverteilt.</p><p class="eq">P(X = k) = C(n,k) · p<sup>k</sup> · (1−p)<sup>n−k</sup></p><p>C(n,k) („n über k“) zählt, auf wie viele Arten die k Treffer verteilt sein können. Teste die Verteilung:</p>`,w:"binverteilung"},
    {title:"Erwartungswert und Streuung",body:`<p class="eq">μ = n · p<br>σ = √(n · p · (1 − p))</p><p>Beispiel: 5 % Ausschuss, 200 Teile: μ = 10 Ausschussteile, σ ≈ 3,1. „Mindestens ein Treffer“ rechnet man mit dem Gegenereignis: 1 − (1 − p)<sup>n</sup>.</p><p class="tip">Für C(n,k) gibt es am Taschenrechner die Taste nCr.</p>`}]},
  {id:"m-normal",title:"Normalverteilung",sub:"Glockenkurve, Sigma-Regeln",gens:["normal"],steps:[
    {title:"Die Glockenkurve",body:`<p>Bei großem n sieht die Binomialverteilung wie eine Glocke aus. Die <b>Normalverteilung</b> beschreibt solche Größen: Körpergröße, Messfehler, Füllmengen. <b>μ</b> ist die Mitte, <b>σ</b> die Breite. Die Wendepunkte liegen bei μ ± σ, die Gesamtfläche ist 1.</p>`,w:"glocke"},
    {title:"Sigma-Regeln und z-Wert",body:`<table class="tbl"><tr><th>Bereich</th><th>Anteil</th></tr><tr><td>μ ± 1σ</td><td>68,3 %</td></tr><tr><td>μ ± 2σ</td><td>95,4 %</td></tr><tr><td>μ ± 3σ</td><td>99,7 %</td></tr></table><p>Der <b>z-Wert</b> zeigt, wie viele σ ein Wert von μ entfernt ist: z = (x − μ) : σ. Beispiel IQ (μ = 100, σ = 15): 85 bis 115 enthält 68 % aller Menschen. Für andere Bereiche nutzt man Tabelle oder Taschenrechner.</p>`}]}
]};
{const i=SUBJECTS[0].bands.findIndex(b=>b.key==="11-12");SUBJECTS[0].bands[i]=BAND1112}
Object.assign(KT,{
  "m-ableit":`<p>Eingeführt wird die Ableitung heute über <b>Geschwindigkeit</b> und das Heranzoomen an eine Kurve, bis sie wie eine Gerade aussieht. In GeoGebra lässt sich eine Tangente ziehen, wie in der Animation hier.</p><p><b>Typische Fehler:</b> Die Konstante mit ableiten, also (x² + 5)′ = 2x + 5, oder den Exponenten nicht um 1 verkleinern. Prüffrage: „Welche Steigung hat die Zahl 7?“</p>`,
  "m-kurve":`<p>Die Kurvendiskussion ist eine feste Aufgabenart im Abitur. Lehrkräfte geben meist ein Schema vor: Schau ins Heft und nutze genau diese Reihenfolge.</p><p><b>Typische Fehler:</b> Die x-Werte der Extrema nicht in f einsetzen (y-Wert vergessen), oder die Art des Extrempunkts raten statt f″ zu prüfen.</p>`,
  "m-integral":`<p>Lass das Kind zuerst die Fläche mit Karokästchen abschätzen. Danach wirkt der Hauptsatz (F(b) − F(a)) wie ein Zaubertrick, der genau dasselbe liefert.</p><p><b>Typische Fehler:</b> F(a) − F(b) vertauscht, die Konstante C bei unbestimmten Integralen vergessen, und Flächen unter der x-Achse falsch zählen.</p>`,
  "m-efkt":`<p>Wachstumsgeschichten funktionieren gut: Sparbuch, Bakterien, Abbau von Koffein. Das Kind soll erleben, dass „Änderung proportional zum Bestand“ auf e<sup>kt</sup> führt.</p><p><b>Typische Fehler:</b> e<sup>2x</sup> zu 2 · x · e<sup>2x−1</sup> ableiten (Potenzregel falsch angewendet), und ln(a + b) = ln a + ln b. Gegenprobe mit Zahlen: ln(1 + 1) ≠ ln 1 + ln 1.</p>`,
  "m-trigf":`<p>Wichtig ist der <b>Schalter am Taschenrechner</b> (DEG/RAD). Viele Fehler in Arbeiten kommen allein daher. Das Bogenmaß erklärt man gut mit einem Rad, das einmal abrollt: Umfang 2π.</p><p><b>Typischer Fehler:</b> Bei sin(2x) die Periode mit 2π statt π angeben.</p>`,
  "m-vektor":`<p>Vektoren werden meist mit <b>Pfeilen im Würfel</b> und Alltagsbildern erklärt: Flugzeug, Drohne, Kran. Zeichne die Vektoren im Raum als Schachtel auf Papier.</p><p><b>Typische Fehler:</b> AB = A − B (Reihenfolge), beim Skalarprodukt einen Vektor statt einer Zahl als Ergebnis angeben, und bei der Punktprobe nur eine Zeile prüfen.</p>`,
  "m-ebene":`<p>Der Normalenvektor ist der Schlüssel: „Der Pfeil, der aus dem Blatt Papier herauszeigt.“ Ein Blatt oder Buch mit einem senkrechten Stift ist ein gutes Modell.</p><p><b>Typische Fehler:</b> Bei der Punktprobe Vorzeichenfehler, und im Abstand die Betragsstriche oder den Nenner √(a² + b² + c²) vergessen.</p>`,
  "m-binomv":`<p>Üblich sind Versuche mit Münzen, Würfeln und Kontrollen: „Wie viele von 20 Teilen sind defekt?“ Kinder können das mit 20 Würfen selbst nachspielen und Strichlisten führen.</p><p><b>Typische Fehler:</b> Die Bedingungen vergessen (unabhängig, gleiches p), und „mindestens“ mit „genau“ verwechseln. Merkhilfe: Bei „mindestens“ hilft das Gegenereignis.</p>`,
  "m-normal":`<p>Die Normalverteilung kommt in Sachsen meist mit <b>Tabellen oder dem Taschenrechner</b> vor. Die Sigma-Regeln sind die Merkhilfe, mit der man grob abschätzen darf.</p><p><b>Typische Fehler:</b> Die Fläche mit dem Funktionswert der Kurve verwechseln (Wahrscheinlichkeiten sind Flächen, nicht Höhen), und σ mit σ² verwechseln.</p>`
});

  licht(){if(Math.random()<.5){const k=ri(2,9);return{q:`Licht legt in einer Sekunde 300.000 km zurück. Wie weit kommt es in ${k} s?${unit("km")}`,kind:"num",ans:R(300000*k),sol:`${k} · 300.000 km = <b>${fmt(300000*k)} km</b>. Bis zur Sonne braucht Licht etwa 8 Minuten.`}}
    return CH("Eine Lampe wird näher an einen Gegenstand gerückt. Der Schatten an der Wand wird …",["größer","kleiner","gleich groß"],0,"Je näher die Lampe, desto mehr Licht wird abgeschirmt, die Strahlen laufen steiler auseinander: Der Schatten wird <b>größer</b>.")},
  spiegel(){const a=pick([20,30,40,50,60,70]);if(Math.random()<.5)return{q:`Ein Lichtstrahl trifft mit dem Einfallswinkel ${a}° (zum Lot) auf einen Spiegel. Wie groß ist der Reflexionswinkel?${unit("Grad")}`,kind:"num",ans:R(a),sol:`Reflexionsgesetz: Einfallswinkel = Reflexionswinkel = <b>${a}°</b>.`};

  linse(){if(Math.random()<.6){const f=pick([4,5,10,20,25,50]);return{q:`Eine Linse hat die Brennweite f = ${f} cm. Wie groß ist die Brechkraft D = 1/f in Dioptrien?${unit("dpt")}`,kind:"num",ans:R(100,f),tol:.006,sol:`f in Meter: ${fmt(f/100)} m. D = 1 : ${fmt(f/100)} = <b>${fmt(Math.round(10000/f)/100)} dpt</b>.`}}
    return pick([CH("Eine Lupe ist eine …",["Sammellinse","Zerstreulinse"],0,"Eine Lupe bündelt das Licht: <b>Sammellinse</b> (in der Mitte dicker)."),CH("Kurzsichtigkeit korrigiert man mit einer …",["Zerstreulinse","Sammellinse"],0,"Das Auge bündelt zu stark. Die <b>Zerstreulinse</b> (am Rand dicker) streut das Licht vorher etwas auf.")])},
  magnet(){if(Math.random()<.7){const s=Math.random()<.5;return CH(`Zwei Magnete liegen nah beieinander: ${s?"Nordpol an Nordpol":"Nordpol an Südpol"}. Was passiert?`,["Sie ziehen sich an","Sie stoßen sich ab"],s?1:0,`Gleiche Pole stoßen sich ab, ungleiche ziehen sich an. Hier: ${s?"<b>Abstoßung</b>":"<b>Anziehung</b>"}.`)}
    return{q:"Ein Stabmagnet wird in der Mitte durchgebrochen. Wie viele Pole haben die beiden Teile zusammen?",kind:"num",ans:R(4),sol:"Jedes Teil ist wieder ein vollständiger Magnet mit Nord- und Südpol: 2 · 2 = <b>4</b>. Einzelpole gibt es nicht."}},
  stromkreis(){const r=Math.random()<.5;return CH(`Drei Lampen hängen in einer <b>${r?"Reihenschaltung":"Parallelschaltung"}</b>. Eine geht kaputt. Was passiert mit den anderen?`,["Sie gehen auch aus","Sie leuchten weiter"],r?0:1,r?"In Reihe gibt es nur einen Weg. Ist er unterbrochen, fließt kein Strom mehr: <b>alle aus</b>.":"Parallel hat jede Lampe ihren eigenen Weg: Die anderen <b>leuchten weiter</b>. So ist die Hausinstallation geschaltet.")},
  leiter(){const L=["Kupfer","Eisen","Aluminium","Graphit","Salzwasser"],I=["Glas","Gummi","Holz","Kunststoff","Porzellan","Luft"],l=Math.random()<.5,m=pick(l?L:I);
    return CH(`Ist <b>${m}</b> ein elektrischer Leiter oder ein Isolator?`,["Leiter","Isolator"],l?0:1,`${m} ist ${l?"ein <b>Leiter</b>: Es hat frei bewegliche Ladungsträger (Elektronen oder Ionen)":"ein <b>Isolator</b>: Es hat keine frei beweglichen Ladungsträger"}.`)},
  waerme(){if(Math.random()<.5){const c=ri(-20,100);return{q:`Rechne ${c} °C in Kelvin um (Rechne mit 273).${unit("K")}`,kind:"num",ans:R(c+273),sol:`K = °C + 273 = ${c} + 273 = <b>${c+273} K</b>. Der absolute Nullpunkt liegt bei 0 K = ${MINUS}273 °C.`}}
    const k=ri(250,400);return{q:`Rechne ${k} K in °C um (Rechne mit 273).${unit("°C")}`,kind:"num",ans:R(k-273),sol:`°C = K ${MINUS} 273 = ${k} ${MINUS} 273 = <b>${fmt(k-273)} °C</b>.`}},
  dichte(){const t=ri(0,2);

    if(t===1){const V=pick([10,20,50,100]),p=pick([2.7,7.9,8.9]);return{q:`Aluminium-ähnlicher Stoff: Dichte ${fmt(p)} g/cm³, Volumen ${V} cm³. Wie groß ist die Masse?${unit("g")}`,kind:"num",ans:R(Math.round(p*V*10),10),sol:`m = ρ · V = ${fmt(p)} · ${V} = <b>${fmt(Math.round(p*V*10)/10)} g</b>.`}}
    const p=pick([.7,.9,1.2,2.7,7.9]);return CH(`Ein Stoff hat die Dichte ${fmt(p)} g/cm³. Wasser hat 1 g/cm³. Was passiert in Wasser?`,["Er schwimmt","Er sinkt"],p<1?0:1,`${p<1?"Kleinere Dichte als Wasser: <b>schwimmt</b>":"Größere Dichte als Wasser: <b>sinkt</b>"}.`)},
  geschw(){const t=ri(0,3);
    if(t===0){const v=pick([4,5,6,8,12,20,30]),h=pick([2,3,4,5]);return{q:`Ein Boot fährt ${v*h} km in ${h} Stunden. Wie schnell ist es im Mittel?${unit("km/h")}`,kind:"num",ans:R(v),sol:`v = s : t = ${v*h} km : ${h} h = <b>${v} km/h</b>.`}}
    if(t===1){const v=pick([18,36,54,72,90,108]);return{q:`Rechne ${v} km/h in m/s um.${unit("m/s")}`,kind:"num",ans:R(v*10,36),sol:`Durch 3,6 teilen: ${v} : 3,6 = <b>${fmt(v/3.6)} m/s</b>. (1 m/s = 3,6 km/h)`}}

    const v=pick([40,60,80,120]),h=pick([2,3,4]);return{q:`Ein Auto fährt mit ${v} km/h. Wie lange braucht es für ${v*h} km?${unit("Stunden")}`,kind:"num",ans:R(h),sol:`t = s : v = ${v*h} km : ${v} km/h = <b>${h} h</b>.`}},
  kraft(){const t=ri(0,2);

    const D=pick([5,10,20,50]),s=ri(2,10);

    return{q:`Eine Feder (D = ${D} N/cm) wird mit ${D*s} N belastet. Wie weit dehnt sie sich?${unit("cm")}`,kind:"num",ans:R(s),sol:`s = F : D = ${D*s} : ${D} = <b>${s} cm</b>.`}},
  hebel(){const F=ri(5,40),a=pick([20,40,60,80]),b=pick([10,20]);return{q:`Ein Hebel ist im Gleichgewicht. Links wirkt F₁ = ${F} N im Abstand ${a} cm vom Drehpunkt. Rechts ist der Abstand ${b} cm. Wie groß ist F₂?${unit("N")}`,kind:"num",ans:R(F*a/b),sol:`Hebelgesetz: F₁ · l₁ = F₂ · l₂ → F₂ = ${F} · ${a} : ${b} = <b>${fmt(F*a/b)} N</b>. Kurzer Hebelarm braucht mehr Kraft.`}},
  druck(){const t=ri(0,2);
    if(t===0){const p=pick([500,1000,2000,5000]),A=pick([.2,.5,2,4]);return{q:`Auf eine Fläche von ${fmt(A)} m² drückt eine Kraft von ${fmt(p*A)} N. Wie groß ist der Druck?${unit("Pa")}`,kind:"num",ans:R(p),sol:`p = F : A = ${fmt(p*A)} N : ${fmt(A)} m² = <b>${fmt(p)} Pa</b> (1 Pa = 1 N/m²).`}}
    const V=ri(2,40);if(t===1)return{q:`Ein Körper mit ${V} Litern Volumen ist ganz in Wasser getaucht. Wie groß ist die Auftriebskraft? Rechne mit 10 N pro Liter verdrängtem Wasser.${unit("N")}`,kind:"num",ans:R(10*V),sol:`Archimedes: Auftrieb = Gewichtskraft des verdrängten Wassers. ${V} l wiegen etwa ${V} kg, also ${10*V} N: <b>${10*V} N</b>.`};
    return{q:`Wie groß ist der Schweredruck in ${V} m Wassertiefe (zusätzlich zum Luftdruck)? Rechne mit 10 kPa pro Meter.${unit("kPa")}`,kind:"num",ans:R(10*V),sol:`Alle 10 m kommt etwa 1 bar (100 kPa) dazu, also 10 kPa je Meter: ${V} · 10 = <b>${10*V} kPa</b>.`}},
  arbeit(){const t=ri(0,2);
    if(t===0){const F=ri(10,200),s=ri(2,20);return{q:`Eine Kraft von ${F} N verschiebt einen Wagen ${s} m weit in Kraftrichtung. Wie groß ist die Arbeit?${unit("J")}`,kind:"num",ans:R(F*s),sol:`W = F · s = ${F} N · ${s} m = <b>${fmt(F*s)} J</b>.`}}
    if(t===1){const P=ri(2,20)*50,s=ri(2,10)*10;return{q:`Ein Motor verrichtet in ${s} s eine Arbeit von ${fmt(P*s)} J. Wie groß ist seine Leistung?${unit("W")}`,kind:"num",ans:R(P),sol:`P = W : t = ${fmt(P*s)} J : ${s} s = <b>${fmt(P)} W</b>.`}}
    const m=ri(2,50),h=ri(2,20);return{q:`Ein Körper (${m} kg) wird ${h} m hoch gehoben. Wie viel Lageenergie hat er? Rechne mit g = 10 N/kg.${unit("J")}`,kind:"num",ans:R(10*m*h),sol:`E = m · g · h = ${m} · 10 · ${h} = <b>${fmt(10*m*h)} J</b>.`}},
  ohm(){const t=ri(0,3),Rr=pick([10,20,25,50,100,200]),I=pick([.1,.2,.5,1,2]);
    if(t===0)return{q:`An einem Widerstand liegen ${fmt(Rr*I)} V an, es fließen ${fmt(I)} A. Wie groß ist der Widerstand?${unit("Ω")}`,kind:"num",ans:R(Rr),sol:`R = U : I = ${fmt(Rr*I)} V : ${fmt(I)} A = <b>${Rr} Ω</b>.`};
    if(t===1)return{q:`Durch einen Widerstand von ${Rr} Ω fließen ${fmt(I)} A. Welche Spannung liegt an?${unit("V")}`,kind:"num",ans:R(Rr*I*10,10),sol:`U = R · I = ${Rr} Ω · ${fmt(I)} A = <b>${fmt(Rr*I)} V</b>.`};
    if(t===2)return{q:`An ${Rr} Ω liegen ${fmt(Rr*I)} V. Wie groß ist die Stromstärke?${unit("A")}`,kind:"num",ans:R(Math.round(I*1000),1000),sol:`I = U : R = ${fmt(Rr*I)} V : ${Rr} Ω = <b>${fmt(I)} A</b>.`};
    const b=pick([10,20,30,50]);return{q:`Zwei Widerstände (${Rr} Ω und ${b} Ω) sind in <b>Reihe</b> geschaltet. Wie groß ist der Gesamtwiderstand?${unit("Ω")}`,kind:"num",ans:R(Rr+b),sol:`In Reihe addieren sich die Widerstände: ${Rr} + ${b} = <b>${Rr+b} Ω</b>.`}}
});

{const i=PH.bands.findIndex(b=>b.key==="6-7");PH.bands[i]={key:"6-7",title:"Klasse 6–7",topics:[
  T("p-licht","Licht und Schatten","Geradlinige Ausbreitung",["licht"],[["Licht läuft geradeaus",`<p>Licht breitet sich <b>geradlinig</b> aus, in Luft mit etwa 300.000 km/s. Trifft es auf einen undurchsichtigen Körper, entsteht dahinter ein <b>Schatten</b>. Wegen der geraden Strahlen gibt es Kernschatten und, bei größeren Lampen, Halbschatten.</p><p class="tip">Sonnen- und Mondfinsternis sind nur Schatten im All.</p>`]]),
  T("p-spiegel","Spiegel und Reflexion","Einfallswinkel = Reflexionswinkel",["spiegel"],[["Das Reflexionsgesetz",`<p>Winkel misst man immer zum <b>Lot</b> (der Senkrechten auf dem Spiegel).</p><p class="eq">Einfallswinkel = Reflexionswinkel</p><p>Ein ebener Spiegel zeigt das Bild genauso weit hinter dem Spiegel, wie der Gegenstand davor steht.</p>`]]),
  T("p-linse","Linsen und das Auge","Brennweite, Brechkraft",["linse"],[["Sammeln und Zerstreuen",`<p>Eine <b>Sammellinse</b> (in der Mitte dick) bündelt parallele Strahlen im <b>Brennpunkt</b>. Der Abstand heißt <b>Brennweite f</b>. Die <b>Brechkraft</b> D = 1/f (f in m) misst man in Dioptrien. Das Auge ist eine Sammellinse mit einstellbarer Brennweite; Brillen gleichen Fehler aus.</p>`]]),
  T("p-magnet","Magnetismus","Pole, Feldlinien",["magnet"],[["Pole und Felder",`<p>Jeder Magnet hat einen <b>Nord- und Südpol</b>. Gleiche Pole stoßen sich ab, ungleiche ziehen sich an. Das Magnetfeld macht man mit Eisenfeilspänen sichtbar: Die <b>Feldlinien</b> laufen außen von Nord nach Süd. Die Erde ist ein riesiger Magnet, daher zeigt der Kompass nach Norden.</p>`]]),

  T("p-leiter","Leiter und Isolatoren","Wer leitet den Strom?",["leiter"],[["Frei bewegliche Ladungen",`<p><b>Leiter</b> (Metalle, Graphit, Salzwasser) haben frei bewegliche Ladungsträger. <b>Isolatoren</b> (Kunststoff, Glas, Gummi, Holz, Luft) haben keine. Darum sind Kabel innen Kupfer und außen Kunststoff.</p><p class="warn">Leitungswasser leitet! Nie mit nassen Händen an Steckdosen oder Geräte.</p>`]]),
  T("p-waerme","Temperatur und Wärme","Celsius, Kelvin, Ausdehnung",["waerme"],[["Temperatur messen",`<p>Die Celsius-Skala hat Fixpunkte bei 0 °C (Eis schmilzt) und 100 °C (Wasser siedet). Physiker nutzen <b>Kelvin</b>: K = °C + 273. Bei 0 K (−273 °C) ruht die Teilchenbewegung.</p><p>Fast alle Stoffe <b>dehnen sich</b> beim Erwärmen aus, darum haben Brücken Dehnungsfugen. Wasser ist bei 4 °C am dichtesten.</p>`]]),
  T("p-dichte","Masse, Volumen und Dichte","ρ = m : V",["dichte"],[["Die Dichte",`<p class="eq">ρ = m : V</p><p>Die Dichte sagt, wie schwer 1 cm³ eines Stoffes ist. Wasser: 1 g/cm³, Eisen: 7,9 g/cm³, Aluminium: 2,7 g/cm³, Holz meist kleiner als 1.</p><p>Kleinere Dichte als Wasser: schwimmt. Größere: sinkt. Ein Schiff schwimmt, weil es mit der Luft im Rumpf insgesamt weniger dicht ist als Wasser.</p>`]])
]}}
{const i=PH.bands.findIndex(b=>b.key==="8-10");PH.bands.splice(i,1,{key:"8",title:"Klasse 8",topics:[
  T("p-v","Geschwindigkeit","v = s : t, km/h und m/s",["geschw"],[["Weg durch Zeit",`<p class="eq">v = s : t</p><p>Umrechnen: <b>km/h : 3,6 = m/s</b> und <b>m/s · 3,6 = km/h</b>. 36 km/h sind 10 m/s.</p><p class="tip">Fährt man 2 h mit 30 km/h und 2 h mit 60 km/h, ist der Durchschnitt 45 km/h (gleiche Zeiten), nicht je nach Strecke gemittelt.</p>`]]),
  T("p-kraft","Kraft","Gewichtskraft, Feder",["kraft"],[["Kraft und Masse",`<p>Kraft misst man in <b>Newton (N)</b>, Masse in kg. Die <b>Gewichtskraft</b> ist F = m · g mit g ≈ 9,81 N/kg (auf dem Mond nur 1,6). Eine Feder dehnt sich proportional zur Kraft: <b>Hookesches Gesetz F = D · s</b>.</p><p>Kräfte haben Betrag <b>und</b> Richtung und werden als Pfeile gezeichnet.</p>`]]),
  T("p-hebel","Hebel und Drehmoment","Kraft mal Kraftarm",["hebel"],[["Das Hebelgesetz",`<p class="eq">F₁ · l₁ = F₂ · l₂</p><p>Ein Hebel ist im Gleichgewicht, wenn die <b>Drehmomente</b> links und rechts gleich sind. Langer Hebelarm: wenig Kraft nötig. Beispiele: Wippe, Brechstange, Schere, Schubkarre.</p>`,"hebel"]]),
  T("p-druck","Druck und Auftrieb","Pascal, Schweredruck, Archimedes",["druck"],[["Druck",`<p class="eq">p = F : A</p><p>Einheit: Pascal (1 Pa = 1 N/m²). Derselbe Druck auf kleiner Fläche drückt stärker: Messer, Nägel, Schneeschuhe breit.</p><p><b>Schweredruck:</b> Alle 10 m Wassertiefe kommt etwa 1 bar dazu. <b>Auftrieb</b> (Archimedes): Ein Körper erfährt so viel Auftrieb, wie das von ihm verdrängte Wasser wiegt.</p>`]]),
  T("p-arbeit","Arbeit, Energie und Leistung","W = F · s, P = W : t",["arbeit"],[["Drei Größen",`<ul class="rules"><li><b>Arbeit:</b> W = F · s (in Joule)</li><li><b>Lageenergie:</b> E = m · g · h</li><li><b>Leistung:</b> P = W : t (in Watt)</li></ul><p>Energie geht nie verloren, sie wird nur umgewandelt (Energieerhaltung). Beim Fahrradfahren wird Muskelenergie zu Bewegung und etwas Wärme.</p>`]]),
  T("p-elektro","Spannung, Stromstärke, Widerstand","Ohmsches Gesetz",["ohm"],[["U, I und R",`<p class="eq">R = U : I</p><p><b>Spannung U</b> (Volt) treibt den Strom an. <b>Stromstärke I</b> (Ampere) sagt, wie viel Ladung pro Sekunde fließt. <b>Widerstand R</b> (Ohm) bremst ihn. In Reihe addieren sich Widerstände.</p>`,"ohm"]])
]},{key:"9-10",title:"Klasse 9–10",planned:["Beschleunigung","Kraft und die Newtonschen Gesetze","Elektromagnetismus und Motor","Radioaktivität","Wärmelehre und Energieerhaltung"]})}
Object.assign(KT,{
 "p-licht":`<p>Zu Hause: Taschenlampe, Gegenstand und Wand. Kind verschiebt die Lampe und beobachtet die Schattengröße. <b>Typischer Fehler:</b> Der Schatten sei „im Gegenstand“ und nicht fehlendes Licht.</p>`,
 "p-spiegel":`<p>Mit Taschenlampe und Handspiegel im Dunkeln ausprobieren. <b>Typischer Fehler:</b> Winkel zur Spiegelfläche statt zum Lot messen.</p>`,
 "p-linse":`<p>Mit einer Lupe ein Fensterbild auf Papier scharf stellen (nie in die Sonne schauen!). <b>Typischer Fehler:</b> Brennweite in cm in die Formel setzen statt in Meter.</p>`,
 "p-magnet":`<p>Büroklammern, Kompass und Eisenfeilspäne unter Papier zeigen das Feld. <b>Typischer Fehler:</b> „Magnete ziehen alle Metalle an“: Nur Eisen, Nickel, Kobalt.</p>`,
 "p-stromkreis":`<p>Mit Flachbatterie, Lämpchen und Draht selbst bauen. Schulen nutzen oft Experimentierkästen. <b>Typischer Fehler:</b> Strom werde im Lämpchen „verbraucht“. Die Stromstärke bleibt im Kreis gleich, Energie wird abgegeben.</p>`,
 "p-leiter":`<p>Testkreis bauen und Gegenstände aus dem Haushalt prüfen lassen, vorher raten. <b>Typischer Fehler:</b> „Alles Metallische leitet gleich gut“ und „Wasser isoliert“.</p>`,
 "p-waerme":`<p>Thermometer in Eiswasser und kochendem Wasser. <b>Typischer Fehler:</b> Wärme und Temperatur verwechseln: Ein See hat weniger Temperatur als ein Tee, aber viel mehr Wärme.</p>`,
 "p-dichte":`<p>Gegenstände in der Badewanne schwimmen oder sinken lassen und Dichten schätzen. <b>Typischer Fehler:</b> „Schwere Dinge sinken“: Entscheidend ist die Dichte, nicht das Gewicht.</p>`,
 "p-v":`<p>Mit Stoppuhr und Schritten auf dem Schulweg messen. <b>Typischer Fehler:</b> Beim Umrechnen km/h und m/s mit 3,6 falschherum verwenden. Merkhilfe: Die Zahl in m/s ist kleiner.</p>`,
 "p-kraft":`<p>Mit einer Federwaage Alltagsgegenstände wiegen. <b>Typischer Fehler:</b> kg und N gleichsetzen. Ein Körper mit 1 kg hat etwa 10 N Gewichtskraft.</p>`,
 "p-hebel":`<p>Eine Wippe auf dem Spielplatz oder Lineal auf einem Stift: Münzen verschieben. <b>Typischer Fehler:</b> Den Abstand vom Rand statt vom Drehpunkt messen.</p>`,
 "p-druck":`<p>Mit der Hand auf eine Nadel und auf einen Stempel drücken. Eine Ente in der Badewanne zeigt Auftrieb. <b>Typischer Fehler:</b> Druck und Kraft verwechseln.</p>`,
 "p-arbeit":`<p>Treppensteigen: Masse, Höhe, Zeit schätzen und Leistung ausrechnen. <b>Typischer Fehler:</b> Arbeit sei auch, wenn man einen Koffer waagerecht trägt. Physikalisch ist F senkrecht zu s: keine Arbeit.</p>`,
 "p-elektro":`<p>Wasserbild: Spannung ist der Wasserdruck, Strom die Menge pro Sekunde, Widerstand die enge Stelle im Rohr. <b>Typischer Fehler:</b> Die Einheiten V, A und Ω verwechseln.</p>`
});

/* ---------- Physik Klasse 9–12 ---------- */
const rd=(x,d=100)=>R(Math.round(x*d),d);
Object.assign(G,{
  beschl(){const t=ri(0,2),a=ri(1,6),s=ri(2,8);
    if(t===0)return{q:`Ein Auto beschleunigt aus dem Stand in ${s} s auf ${fmt(a*s)} m/s. Wie groß ist die Beschleunigung?${unit("m/s²")}`,kind:"num",ans:R(a),sol:`a = Δv : t = ${a*s} : ${s} = <b>${a} m/s²</b>.`};
    if(t===1)return{q:`Ein Körper beschleunigt aus der Ruhe mit a = ${a} m/s². Wie schnell ist er nach ${s} s?${unit("m/s")}`,kind:"num",ans:R(a*s),sol:`v = a · t = ${a} · ${s} = <b>${a*s} m/s</b>.`};
    const b=2*a;return{q:`Ein Körper beschleunigt aus der Ruhe mit a = ${b} m/s². Welchen Weg legt er in ${s} s zurück?${unit("m")}`,kind:"num",ans:R(b*s*s/2),sol:`s = ½ · a · t² = ½ · ${b} · ${s*s} = <b>${b*s*s/2} m</b>.`}},
  newton(){const t=ri(0,2),m=ri(2,20),a=ri(1,6);
    if(t===0)return{q:`Ein Körper (${m} kg) wird mit ${a} m/s² beschleunigt. Welche Kraft wirkt?${unit("N")}`,kind:"num",ans:R(m*a),sol:`2. Newtonsches Gesetz: F = m · a = ${m} · ${a} = <b>${m*a} N</b>.`};
    if(t===1)return{q:`Eine Kraft von ${m*a} N wirkt auf ${m} kg. Wie groß ist die Beschleunigung?${unit("m/s²")}`,kind:"num",ans:R(a),sol:`a = F : m = ${m*a} : ${m} = <b>${a} m/s²</b>.`};
    return CH("Ein Körper im Weltraum, auf den keine Kraft wirkt, …",["bleibt in gleichförmiger Bewegung","wird langsamer","bleibt sofort stehen"],0,"1. Newtonsches Gesetz (Trägheit): Ohne Kraft ändert sich die Geschwindigkeit nicht.")},
  emag(){if(Math.random()<.7){const n1=pick([100,200,500,1000]),k=pick([2,5,10]),U=pick([10,20,50,230]);return{q:`Ein Transformator hat primär ${n1} Windungen, sekundär ${n1/k}. Primärspannung ${U} V. Wie groß ist die Sekundärspannung?${unit("V")}`,kind:"num",ans:rd(U/k,10),tol:.06,sol:`U₁ : U₂ = N₁ : N₂ → U₂ = ${U} · ${n1/k} : ${n1} = <b>${fmt(U/k)} V</b>.`}}
    return CH("Ein Elektromotor wandelt …",["elektrische in mechanische Energie","mechanische in elektrische Energie","Wärme in Licht"],0,"Motor: Strom im Magnetfeld erfährt eine Kraft, es dreht sich. Der Generator ist die Umkehrung.")},
  radio(){const t=ri(0,2),N=pick([800,1600,320,640]),k=ri(1,4),T=pick([5,8,12,30]);
    if(t===0)return{q:`Ein Präparat hat ${N} Mio. Atomkerne und eine Halbwertszeit von ${T} Tagen. Wie viele sind nach ${k*T} Tagen noch nicht zerfallen (in Mio.)?${unit("Mio.")}`,kind:"num",ans:R(N,2**k),sol:`${k} Halbwertszeiten: ${N} : 2<sup>${k}</sup> = <b>${fmt(N/2**k)}</b>.`};
    if(t===1)return{q:`Von einem Stoff mit Halbwertszeit ${T} Tagen ist nach ${k*T} Tagen noch ${fmt(100/2**k)} % übrig. Wie viele Halbwertszeiten sind vergangen?`,kind:"num",ans:R(k),sol:`${k*T} : ${T} = <b>${k}</b>.`};
    return CH("Welche Strahlung durchdringt Materie am stärksten?",["Gammastrahlung","Betastrahlung","Alphastrahlung"],0,"Alpha stoppt schon Papier, Beta Aluminium, <b>Gamma</b> braucht dicke Blei- oder Betonschichten.")},
  waermel(){const t=ri(0,2);
    if(t===0){const m=ri(1,10),d=ri(5,60);return{q:`Wie viel Wärme braucht man, um ${m} kg Wasser um ${d} K zu erwärmen? Rechne mit c = 4,2 kJ/(kg·K).${unit("kJ")}`,kind:"num",ans:rd(4.2*m*d,10),tol:.06,sol:`Q = c · m · ΔT = 4,2 · ${m} · ${d} = <b>${fmt(4.2*m*d)} kJ</b>.`}}
    if(t===1){const a=pick([10,20,30]),b=a+pick([20,40,60]);return{q:`${fmt(1)} kg Wasser mit ${a} °C wird mit ${fmt(1)} kg Wasser mit ${b} °C gemischt. Welche Mischtemperatur ergibt sich?${unit("°C")}`,kind:"num",ans:R((a+b)/2),sol:`Gleiche Massen: Mittelwert (${a} + ${b}) : 2 = <b>${(a+b)/2} °C</b>.`}}
    const z=pick([100,200,500]),e=pick([20,25,40]);return{q:`Eine Maschine bekommt ${z} J Energie und gibt ${z*e/100} J nutzbar ab. Wie groß ist der Wirkungsgrad?${unit("%")}`,kind:"num",ans:R(e),sol:`η = Nutzen : Aufwand = ${z*e/100} : ${z} = <b>${e} %</b>. Der Rest geht als Wärme verloren.`}},
  wurf(){const t=ri(0,2),s=ri(1,4),h=5*s*s;
    if(t===0)return{q:`Ein Ball fällt (waagerechter Wurf) aus ${h} m Höhe. Wie lange dauert der Fall? Rechne mit g = 10 m/s².${unit("s")}`,kind:"num",ans:R(s),sol:`h = ½ · g · t² → t = √(2h : g) = √${2*h/10} = <b>${s} s</b>.`};
    if(t===1){const v=ri(2,10);return{q:`Ein Ball wird aus ${h} m Höhe waagerecht mit ${v} m/s geworfen (g = 10 m/s²). Wie weit fliegt er?${unit("m")}`,kind:"num",ans:R(v*s),sol:`Fallzeit t = ${s} s. Waagerecht gleichförmig: x = v · t = ${v} · ${s} = <b>${v*s} m</b>.`}}
    return{q:`Ein Stein fällt ${s} s lang frei (g = 10 m/s²). Aus welcher Höhe fiel er?${unit("m")}`,kind:"num",ans:R(h),sol:`h = ½ · g · t² = 5 · ${s*s} = <b>${h} m</b>.`}},
  impuls(){const t=ri(0,2),m=ri(2,10),v=ri(2,12);
    if(t===0)return{q:`Wie groß ist der Impuls eines Körpers mit ${m} kg und ${v} m/s?${unit("kg·m/s")}`,kind:"num",ans:R(m*v),sol:`p = m · v = ${m} · ${v} = <b>${m*v} kg·m/s</b>.`};
    if(t===1){const m2=m*ri(1,3),v1=(m+m2)*ri(1,4);return{q:`Ein Wagen (${m} kg, ${v1} m/s) stößt unelastisch gegen einen ruhenden Wagen (${m2} kg). Beide bleiben aneinander. Wie schnell sind sie danach?${unit("m/s")}`,kind:"num",ans:R(m*v1,m+m2),sol:`Impulserhaltung: ${m} · ${v1} = (${m} + ${m2}) · v → v = ${m*v1} : ${m+m2} = <b>${fmt(m*v1/(m+m2))} m/s</b>.`}}
    const tt=pick([2,5,10]);return{q:`Ein Körper mit Impuls ${m*v*tt} kg·m/s wird in ${tt} s abgebremst. Wie groß ist die mittlere Kraft?${unit("N")}`,kind:"num",ans:R(m*v),sol:`F = Δp : t = ${m*v*tt} : ${tt} = <b>${m*v} N</b>.`}},
  kreisb(){const t=ri(0,2),r=pick([2,4,5,10]),v=pick([2,4,5,10,20]);
    if(t===0)return{q:`Ein Körper läuft mit ${v} m/s auf einer Kreisbahn mit r = ${r} m. Wie groß ist die Zentripetalbeschleunigung?${unit("m/s²")}`,kind:"num",ans:R(v*v,r),tol:.006,sol:`a = v² : r = ${v*v} : ${r} = <b>${fmt(v*v/r)} m/s²</b>.`};
    if(t===1){const T=pick([2,4,5,10,20]);return{q:`Ein Rad dreht sich einmal in ${T} s. Wie groß ist die Frequenz?${unit("Hz")}`,kind:"num",ans:R(1,T),tol:.0006,sol:`f = 1 : T = 1 : ${T} = <b>${fmt(1/T)} Hz</b>.`}}
    const m=ri(1,5);return{q:`Ein Körper (${m} kg) läuft mit ${v} m/s auf einer Kreisbahn mit r = ${r} m. Wie groß ist die Zentripetalkraft?${unit("N")}`,kind:"num",ans:R(m*v*v,r),tol:.006,sol:`F = m · v² : r = ${m} · ${v*v} : ${r} = <b>${fmt(m*v*v/r)} N</b>.`}},
  grav(){const t=ri(0,2),k=ri(2,4);
    if(t===0)return{q:`Der Abstand zweier Massen wird auf das ${k}-fache vergrößert. Auf welchen Bruchteil sinkt die Gravitationskraft?<p class="muted small">Als Bruch oder Dezimalzahl.</p>`,kind:"frac",ans:R(1,k*k),tol:.002,sol:`F ~ 1/r²: ${F(1,k)}² = <b>${F(1,k*k)}</b>.`};
    if(t===1)return{q:`Eine Masse wird verdoppelt, die andere verdreifacht. Das Wievielfache der Gravitationskraft ergibt sich?`,kind:"num",ans:R(6),sol:`F ~ m₁ · m₂ → 2 · 3 = <b>6</b>.`};
    const m=ri(2,60);return{q:`Auf dem Mond ist g = 1,6 N/kg. Welche Gewichtskraft hat ein Körper mit ${m} kg dort?${unit("N")}`,kind:"num",ans:rd(1.6*m,10),tol:.06,sol:`F = m · g = ${m} · 1,6 = <b>${fmt(1.6*m)} N</b>.`}},
  efeld(){const t=ri(0,2);
    if(t===0){const d=pick([2,4,5,10]),U=pick([100,200,500,1000]);return{q:`Zwischen zwei Platten im Abstand ${d} cm liegen ${U} V. Wie stark ist das Feld E = U : d?${unit("V/cm")}`,kind:"num",ans:R(U,d),tol:.006,sol:`E = ${U} V : ${d} cm = <b>${fmt(U/d)} V/cm</b>.`}}
    if(t===1){const U=pick([5,10,20]),C=pick([2,4,10]);return{q:`Ein Kondensator mit C = ${C} µF wird auf ${U} V geladen. Wie groß ist seine Ladung Q = C · U?${unit("µC")}`,kind:"num",ans:R(C*U),sol:`Q = ${C} · ${U} = <b>${C*U} µC</b>.`}}
    const U=pick([10,20]),C=pick([2,4,10]);return{q:`Wie viel Energie steckt in einem Kondensator (C = ${C} µF, U = ${U} V)? E = ½ · C · U²${unit("µJ")}`,kind:"num",ans:R(C*U*U,2),sol:`E = ½ · ${C} · ${U*U} = <b>${fmt(C*U*U/2)} µJ</b>.`}},
  induk(){if(Math.random()<.5){const N=pick([50,100,200,500]),p=pick([2,4,5,10]),dt=pick([2,5,10]);return{q:`Eine Spule mit ${N} Windungen erlebt eine Flussänderung von ${p} mWb in ${dt} s. Wie groß ist die Induktionsspannung U = N · ΔΦ : Δt?${unit("mV")}`,kind:"num",ans:R(N*p,dt),tol:.006,sol:`U = ${N} · ${p} : ${dt} = <b>${fmt(N*p/dt)} mV</b>.`}}
    const B=pick([.1,.2,.5,1]),I=ri(2,10),l=pick([.2,.5,1]);return{q:`Ein Leiter (${fmt(l)} m) trägt ${I} A im Magnetfeld B = ${fmt(B)} T (senkrecht). Wie groß ist die Kraft F = B · I · l?${unit("N")}`,kind:"num",ans:rd(B*I*l,100),tol:.006,sol:`F = ${fmt(B)} · ${I} · ${fmt(l)} = <b>${fmt(Math.round(B*I*l*100)/100)} N</b>.`}},
  schwing(){const t=ri(0,2);
    if(t===0){const T=pick([.1,.2,.5,2,4]);return{q:`Ein Schwinger braucht ${fmt(T)} s für eine Schwingung. Wie groß ist die Frequenz?${unit("Hz")}`,kind:"num",ans:rd(1/T,1000),tol:.006,sol:`f = 1 : T = 1 : ${fmt(T)} = <b>${fmt(1/T)} Hz</b>.`}}
    if(t===1){const f=pick([2,4,5,10,50]);return{q:`Ein Körper schwingt mit ${f} Hz. Wie lang ist die Periodendauer?${unit("s")}`,kind:"num",ans:rd(1/f,1000),tol:.0006,sol:`T = 1 : f = 1 : ${f} = <b>${fmt(1/f)} s</b>.`}}
    const l=pick([.25,1,4]),T=2*Math.PI*Math.sqrt(l/9.81);return{q:`Ein Fadenpendel ist ${fmt(l)} m lang. Berechne T = 2π · √(l : g) mit g = 9,81 m/s². Runde auf zwei Nachkommastellen.${unit("s")}`,kind:"num",ans:rd(T,100),tol:.016,sol:`T = 2π · √(${fmt(l)} : 9,81) ≈ <b>${fmt(Math.round(T*100)/100)} s</b>. Die Masse spielt keine Rolle.`}},
  wellen(){const t=ri(0,2);
    if(t===0){const f=pick([2,5,10,50,100]),l=pick([2,4,5,10]);return{q:`Eine Welle hat die Frequenz ${f} Hz und die Wellenlänge ${l} m. Wie groß ist ihre Ausbreitungsgeschwindigkeit?${unit("m/s")}`,kind:"num",ans:R(f*l),sol:`c = λ · f = ${l} · ${f} = <b>${f*l} m/s</b>.`}}
    if(t===1){const s=ri(2,9);return{q:`Zwischen Blitz und Donner liegen ${s} s. Wie weit ist das Gewitter entfernt? Schall: 340 m/s.${unit("m")}`,kind:"num",ans:R(340*s),sol:`s = v · t = 340 · ${s} = <b>${fmt(340*s)} m</b>. (Der Blitz kommt praktisch sofort an.)`}}
    return CH("Zwei gleiche Wellen treffen mit einem Gangunterschied von einer halben Wellenlänge zusammen. Was passiert?",["Auslöschung","Verstärkung","Nichts"],0,"Berg trifft Tal: <b>destruktive Interferenz</b>. Bei ganzer Wellenlänge verstärken sie sich.")},
  photo(){const t=ri(0,2);
    if(t===0){const l=pick([620,310,248,124]);return{q:`Wie groß ist die Energie eines Photons mit λ = ${l} nm? Rechne E = 1240 : λ (E in eV, λ in nm).${unit("eV")}`,kind:"num",ans:R(1240,l),sol:`E = 1240 : ${l} = <b>${fmt(1240/l)} eV</b>.`}}
    if(t===1){const W=pick([2,2.5,4]),E=W+ri(1,3);return{q:`Licht mit ${fmt(E)} eV trifft auf Metall mit der Austrittsarbeit ${fmt(W)} eV. Wie groß ist die maximale kinetische Energie der Elektronen?${unit("eV")}`,kind:"num",ans:rd(E-W,10),sol:`E<sub>kin</sub> = E<sub>Photon</sub> ${MINUS} W<sub>A</sub> = ${fmt(E)} ${MINUS} ${fmt(W)} = <b>${fmt(E-W)} eV</b>.`}}
    return CH("Beim Photoeffekt hängt die Energie der ausgelösten Elektronen ab von …",["der Frequenz des Lichts","der Helligkeit des Lichts","der Dauer der Bestrahlung"],0,"Nur die Frequenz bestimmt die Photonenenergie (E = h · f). Mehr Helligkeit bedeutet mehr Elektronen, nicht schnellere.")},
  atom(){const t=ri(0,2);
    if(t===0){const n=ri(1,4);return{q:`Im Wasserstoffatom gilt E<sub>n</sub> = ${MINUS}13,6 eV : n². Wie groß ist die Energie auf der Bahn n = ${n}? Runde auf eine Nachkommastelle.${unit("eV")}`,kind:"num",ans:rd(-13.6/n**2,10),tol:.06,sol:`E = ${MINUS}13,6 : ${n*n} ≈ <b>${fmt(Math.round(-136/n**2)/10)} eV</b>.`}}
    if(t===1){const n=pick([2,3]),d=13.6*(1-1/n**2);return{q:`Ein Wasserstoffatom springt von n = ${n} auf n = 1. Welche Photonenenergie wird frei? Runde auf eine Nachkommastelle.${unit("eV")}`,kind:"num",ans:rd(d,10),tol:.06,sol:`ΔE = 13,6 · (1 ${MINUS} 1/${n*n}) ≈ <b>${fmt(Math.round(d*10)/10)} eV</b>.`}}

Object.assign(KT,{
 "p-beschl":`<p>Mit Spielzeugauto und Stoppuhr eine Rampe messen. <b>Typischer Fehler:</b> Geschwindigkeit und Beschleunigung verwechseln.</p>`,
 "p-newton":`<p>Tischtuch-Trick mit Geschirr, Skateboard-Beispiele. <b>Typischer Fehler:</b> Actio und Reactio greifen am <b>selben</b> Körper an. Sie greifen an verschiedenen an.</p>`,
 "p-emag":`<p>Nagel mit Draht und Batterie wird zum Elektromagneten. <b>Typischer Fehler:</b> Der Trafo funktioniert nur mit Wechselspannung.</p>`,
 "p-radio":`<p>Das Würfelmodell: 100 Würfel werfen, Sechser aussortieren, wiederholen. <b>Typischer Fehler:</b> Nach zwei Halbwertszeiten sei alles weg. Es ist ein Viertel übrig.</p>`,
 "p-waermel":`<p>Wasserkocher: Zeit stoppen und mit Q = c·m·ΔT vergleichen. <b>Typischer Fehler:</b> Temperatur in °C und Temperaturdifferenz in K verwechseln, sie haben aber gleiche Schrittgröße.</p>`,
 "p-wurf":`<p>Zwei Bälle: einer fällt, einer wird waagerecht geworfen. Sie landen gleichzeitig. <b>Typischer Fehler:</b> Die waagerechte Geschwindigkeit habe Einfluss auf die Fallzeit.</p>`,
 "p-impuls":`<p>Murmeln oder Billardkugeln stoßen lassen. <b>Typischer Fehler:</b> Impuls und Energie gleichsetzen. Impuls ist ein Vektor mit Richtung.</p>`,
 "p-kreisb":`<p>Eimer mit Wasser am Seil schwingen. <b>Typischer Fehler:</b> „Die Zentrifugalkraft zieht nach außen“: Der Körper möchte nur geradeaus weiter.</p>`,
 "p-grav":`<p>Gewicht auf der Waage vs. Mond. <b>Typischer Fehler:</b> Masse und Gewichtskraft gleichsetzen; im All ist man schwerelos, die Masse bleibt.</p>`,
 "p-efeld":`<p>Luftballon reiben und Papierschnipsel anheben. <b>Typischer Fehler:</b> Spannung und Ladung verwechseln.</p>`,
 "p-induk":`<p>Magnet durch eine Spule mit Messgerät schieben. <b>Typischer Fehler:</b> Ein ruhender Magnet in der Spule induziere Spannung. Nur die Änderung zählt.</p>`,
 "p-schwing":`<p>Fadenpendel mit unterschiedlicher Masse und Länge testen. <b>Typischer Fehler:</b> Die Masse ändere die Periodendauer.</p>`,
 "p-wellen":`<p>Wasserwellen in der Wanne oder Gewitter-Zählen. <b>Typischer Fehler:</b> Das Wasser wandere mit der Welle mit.</p>`,
 "p-photo":`<p>Schule nutzt meist Zink-Platte und UV-Lampe als Versuch. <b>Typischer Fehler:</b> Mit mehr Helligkeit würden die Elektronen schneller.</p>`,
 "p-atom":`<p>Spektroskop (oder Handy-Beugungsgitter) und Energiesparlampe. <b>Typischer Fehler:</b> Elektronen kreisen wie Planeten. Das Bohrsche Bild ist ein Modell.</p>`
});

const B34=(su,topics)=>{const s=SUBJECTS.find(x=>x.id===su),i=s.bands.findIndex(b=>b.key==="3-4");s.bands[i]={key:"3-4",title:"Klasse 3–4 · Sachunterricht",topics}};
B34("bio",[
 SA("b34-keim","Pflanzen: Keimen und Wachsen","Vom Samen zur Pflanze","Ein Samen keimt, wenn er <b>Wasser</b> und <b>Wärme</b> bekommt. Zuerst wächst die Wurzel nach unten, dann der Spross nach oben. Erst die junge Pflanze braucht <b>Licht</b>. Mit dem Kind: Bohnen im Glas auf feuchter Watte keimen lassen und jeden Tag messen.",[["Was braucht ein Samen zum Keimen?","Ohne Wasser quillt der Samen nicht auf. Licht braucht erst die junge Pflanze.","Wasser und Wärme","Nur Licht","Nur Erde"],["Welcher Teil wächst beim Keimen zuerst aus dem Samen?","Die Keimwurzel kommt zuerst: Sie verankert die Pflanze und holt Wasser.","Die Wurzel","Die Blüte","Die Frucht"]]),
 SA("b34-tiere","Tiere im Jahreslauf","Winterschlaf, Zugvögel, Vorräte","Tiere überstehen den Winter verschieden: Manche <b>ziehen weg</b> (Rauchschwalbe), manche halten <b>Winterschlaf</b> (Igel, Fledermaus), manche <b>Winterruhe</b> und Vorräte (Eichhörnchen), viele bleiben aktiv (Reh, Fuchs).",[["Welcher Vogel zieht im Herbst nach Süden?","Schwalben finden im Winter keine Insekten und ziehen nach Afrika.","Rauchschwalbe","Haussperling","Kohlmeise"],["Was macht das Eichhörnchen im Herbst?","Es legt Vorräte an und hält nur Winterruhe, es wacht oft auf.","Vorräte vergraben","Tiefen Winterschlaf","In den Süden fliegen"]]),
 SA("b34-igel","Der Igel und der Winterschlaf","Energie sparen","Im Winter gibt es kaum Insekten und Schnecken. Der Igel frisst sich im Herbst Fettreserven an und schläft. Dabei sinken Körpertemperatur und Herzschlag stark. Mit dem Kind: Im Garten Laubhaufen für Igel liegen lassen.",[["Warum hält der Igel Winterschlaf?","Im Winter findet er kaum Nahrung. Im Schlaf braucht er wenig Energie.","Weil er kaum Nahrung findet","Weil er Schnee mag","Weil er vom Sommer müde ist"],["Wie schlägt das Igelherz im Winterschlaf?","Es schlägt nur etwa 10 bis 20 Mal pro Minute statt über 150.","Sehr viel langsamer","Schneller","Gleich schnell"]]),
 SA("b34-koerper","Unser Körper: Knochen und Muskeln","Stützen und Bewegen","Das <b>Skelett</b> stützt den Körper und schützt Organe (Brustkorb: Herz und Lunge, Schädel: Gehirn). <b>Muskeln</b> ziehen sich zusammen und bewegen so die Knochen. Sie können nur ziehen, darum arbeiten sie paarweise (Beuger und Strecker).",[["Wofür ist das Skelett wichtig?","Es stützt den Körper und schützt Organe.","Es stützt und schützt","Es macht warm","Es verdaut Essen"],["Wie bewegen Muskeln die Knochen?","Muskeln ziehen sich zusammen und ziehen am Knochen.","Sie ziehen sich zusammen","Sie schieben den Knochen","Sie werden hart wie Stein"]]),
 SA("b34-zaehne","Zähne und Zahnpflege","Putzen und Karies","Kinder haben 20 <b>Milchzähne</b>, Erwachsene 32 Zähne. Bakterien machen aus Zucker Säure, die den Zahnschmelz angreift: <b>Karies</b>. Darum zweimal täglich putzen, wenig Süßes, regelmäßig zum Zahnarzt.",[["Wie oft sollte man Zähne putzen?","Morgens und abends, jeweils zwei bis drei Minuten.","Zweimal am Tag","Einmal pro Woche","Nur bei Schmerzen"],["Was macht Zähne kaputt?","Bakterien machen aus Zucker Säure, die den Schmelz angreift.","Zucker und Bakterien","Wasser","Zahnseide"]]),
 SA("b34-essen","Gesunde Ernährung","Essen und Trinken","Der Körper braucht Energie und Baustoffe. Gesund ist: viel <b>Gemüse und Obst</b>, Vollkorn, ausreichend <b>Wasser</b>, Süßes und Fettiges nur selten. Mit dem Kind: gemeinsam einen bunten Teller zusammenstellen.",[["Was gehört zu gesunder Ernährung?","Viel Gemüse, Obst und Wasser. Süßes nur selten.","Viel Gemüse, Obst und Wasser","Nur Süßigkeiten","Nur Fleisch"],["Was sollte man am meisten trinken?","Wasser oder ungesüßten Tee. Limonade und Saft enthalten viel Zucker.","Wasser","Limonade","Cola"]]),
 SA("b34-wiese","Lebensraum Wiese","Blumen, Insekten, Vögel","Auf der Wiese wachsen Gräser und Blumen, davon leben Insekten (Bienen, Schmetterlinge, Heuschrecken). Die fressen Vögel und Mäuse, davon leben Greifvögel und Füchse: eine <b>Nahrungskette</b>. Bienen bestäuben Blüten.",[["Wer lebt auf der Wiese?","Insekten leben von Wiesenblumen und Gräsern.","Schmetterlinge und Bienen","Pinguine","Haie"],["Was machen Bienen auf der Blüte?","Sie sammeln Nektar und Pollen und bestäuben dabei die Blüten.","Nektar sammeln und bestäuben","Blüten abfressen","Eier legen"]]),
 SA("b34-teich","Lebensraum Teich","Frosch, Fisch, Wasserpflanzen","Im Teich leben Pflanzen, Insekten, Fische und Frösche. Der Frosch legt <b>Laich</b>. Daraus schlüpfen Kaulquappen mit Kiemen, später bekommen sie Beine und Lungen: eine <b>Verwandlung</b> (Metamorphose).",[["Welches Tier legt im Frühling Laich im Teich?","Frösche legen Laich. Daraus werden Kaulquappen.","Frosch","Igel","Hase"],["Was ist eine Kaulquappe?","Sie atmet mit Kiemen im Wasser und verwandelt sich später in einen Frosch.","Das Jungtier vom Frosch","Eine Wasserpflanze","Ein Fisch"]])
]);
B34("chemie",[
 SA("c34-loesen","Stoffe lösen sich in Wasser","Zucker, Salz, Sand","Zucker und Salz <b>lösen</b> sich in Wasser: Man sieht sie nicht mehr, sie sind aber noch da (das Wasser schmeckt süß oder salzig). Sand löst sich nicht, er setzt sich ab. Warmes Wasser und Umrühren lösen schneller.",[["Was passiert mit Zucker in Wasser?","Er löst sich auf: Er ist noch da, nur sehr fein verteilt.","Er löst sich auf","Er verschwindet für immer","Er wird zu Salz"],["Wie löst sich Zucker schneller?","In warmem Wasser und beim Umrühren geht es schneller.","Warm und umrühren","Kalt und stehen lassen","In Öl"]]),
 SA("c34-wasser","Wasser: fest, flüssig, gasförmig","Eis, Wasser, Dampf","Wasser hat drei Zustände: <b>Eis</b> (fest, unter 0 °C), <b>Wasser</b> (flüssig) und <b>Wasserdampf</b> (gasförmig, ab 100 °C). Dabei bleibt es derselbe Stoff. Mit dem Kind: Eiswürfel schmelzen lassen und Wasser im Topf erhitzen (Vorsicht heiß).",[["Was passiert mit Wasser bei 0 °C?","Es gefriert zu Eis.","Es gefriert","Es kocht","Es verdampft sofort"],["Bei welcher Temperatur kocht Wasser?","Bei 100 °C wird flüssiges Wasser zu Dampf.","100 °C","50 °C","0 °C"]]),
 SA("c34-feuer","Feuer, Kerze und Verbrennung","Das Verbrennungsdreieck","Feuer braucht <b>Brennstoff</b>, <b>Sauerstoff</b> und <b>Wärme</b>. Fehlt eines, geht es aus. Eine Kerze unter einem Glas verbraucht den Sauerstoff. Zum Löschen: Wasser kühlt, eine Decke nimmt den Sauerstoff. Im Notfall: 112.",[["Was braucht Feuer zum Brennen?","Brennstoff, Sauerstoff und Wärme. Fehlt eines, geht es aus.","Brennstoff, Sauerstoff und Wärme","Nur Holz","Nur Wasser"],["Warum geht eine Kerze unter einem Glas aus?","Die Kerze verbraucht den Sauerstoff im Glas.","Der Sauerstoff wird verbraucht","Das Glas ist zu kalt","Wasser tropft hinein"]]),
 SA("c34-muell","Mülltrennung und Recycling","Wohin mit dem Müll?","Getrennter Müll kann wiederverwendet werden: <b>Papier</b> (blau), <b>Verpackungen</b> aus Kunststoff und Metall (gelb), <b>Bioabfall</b> (braun), <b>Glas</b> (Container), Rest in die Restmülltonne. Das spart Rohstoffe und Energie.",[["In welche Tonne gehört eine Zeitung?","Papier wird zu neuem Papier verarbeitet.","Papier (blau)","Gelbe Tonne","Restmüll"],["Was gehört in die gelbe Tonne?","Verpackungen aus Kunststoff und Metall, zum Beispiel Joghurtbecher.","Joghurtbecher","Bananenschale","Glasflasche"]])
]);
B34("physik",[
 SA("p34-schwimm","Schwimmen und Sinken","Was trägt Wasser?","Manche Dinge <b>schwimmen</b> (Holz, Styropor, Korken), andere <b>sinken</b> (Stein, Münze). Es kommt nicht auf die Größe an, sondern darauf, wie dicht der Stoff ist. Knete sinkt als Kugel, schwimmt aber als Schiffchen, weil sie mehr Wasser verdrängt.",[["Was schwimmt in Wasser?","Holz ist leichter als gleich viel Wasser.","Holz","Stein","Münze"],["Wie bringt man Knete zum Schwimmen?","Als Schiffchen verdrängt sie viel Wasser und wird getragen.","Zu einem Schiffchen formen","Fester drücken","Kleiner machen"]]),
 SA("p34-magnet","Magnete","Anziehen und Abstoßen","Magnete ziehen <b>Eisen</b> an (auch Nickel und Kobalt), aber kein Holz, Plastik oder Papier. Jeder Magnet hat zwei Pole. Gleiche Pole stoßen sich ab, ungleiche ziehen sich an.",[["Was zieht ein Magnet an?","Magnete ziehen Eisen an.","Eisennagel","Holzstück","Gummiband"],["Zwei Nordpole werden zusammengehalten. Was passiert?","Gleiche Pole stoßen sich ab.","Sie stoßen sich ab","Sie ziehen sich an","Nichts"]]),
 SA("p34-strom","Der einfache Stromkreis","Batterie, Kabel, Lampe","Eine Lampe leuchtet nur in einem <b>geschlossenen Stromkreis</b>: Batterie, Kabel und Lampe im Kreis. Ein <b>Schalter</b> öffnet oder schließt ihn. Wichtig: Nie mit Steckdosen experimentieren, nur mit Batterien!",[["Was braucht eine Lampe zum Leuchten?","Der Stromkreis muss ganz geschlossen sein.","Einen geschlossenen Stromkreis","Nur ein Kabel","Nur eine Batterie"],["Was macht ein Schalter?","Er öffnet oder schließt den Stromkreis.","Er unterbricht den Stromkreis","Er macht Strom","Er speichert Strom"]]),
 SA("p34-licht","Licht und Schatten","Lichtquelle und Schatten","Eine <b>Lichtquelle</b> (Sonne, Lampe) sendet Licht aus. Licht breitet sich geradlinig aus. Ein undurchsichtiger Gegenstand wirft einen <b>Schatten</b>. Steht die Sonne tief, sind Schatten lang.",[["Wie entsteht ein Schatten?","Ein Gegenstand lässt kein Licht durch, dahinter ist es dunkler.","Der Gegenstand hält Licht auf","Licht wird zu Farbe","Der Boden schluckt Licht"],["Wann ist dein Schatten am längsten?","Bei tiefem Sonnenstand, morgens und abends.","Morgens und abends","Mittags","Nachts"]]),
 SA("p34-schall","Schall: Wie wir hören","Schwingungen","Wenn etwas <b>schwingt</b> (Gitarrensaite, Stimmband), schwingt die Luft mit. Das Ohr fängt diese Schwingungen auf. Schall braucht Luft oder einen anderen Stoff, im Weltraum ist es still. Mit dem Kind: Lineal über die Tischkante schwingen lassen.",[["Wie entsteht Schall?","Schwingende Gegenstände bringen die Luft zum Schwingen.","Durch Schwingungen","Durch Magnete","Durch Schatten"],["Wo gibt es keinen Schall?","Schall braucht Luft oder einen Stoff. Im leeren Weltraum ist es still.","Im leeren Weltraum","Unter Wasser","In einem Zimmer"]]),

const GEN_NAMES_BIO={};
/* Thema mit Erklärseiten und Fragenpool. qs: [Frage, Erklärung, richtige Antwort, falsche Antworten …]. Die Fragen werden gemischt und wiederholen sich in einer Sitzung nicht. */
const BT=(id,title,sub,steps,qs,more=[])=>{let deck=[];
  G[id]=()=>{if(!deck.length)deck=shuffle(qs);const [q,s,c,...w]=deck.pop(),o=shuffle([c,...w]);return{q,kind:"choice",opts:o,correct:o.indexOf(c),sol:s}};
  GEN_NAMES_BIO[id]=title;
  return{id,title,sub,gens:[id,...more],steps:steps.map(([t,b,w,wo])=>{const o={title:t,body:b};if(w){o.w=w;o.wo=wo||{}}return o})}};
const mixc=(p,c="var(--surface)")=>`fill:color-mix(in srgb,${p} 32%,${c})`;

/* Zahlenaufgaben Biologie */
Object.assign(G,{
  mikro(){const oc=pick([5,10,15]),ob=pick([4,10,20,40]);
    if(Math.random()<.6)return{q:`Ein Mikroskop hat ein ${oc}-fach vergrößerndes Okular und ein ${ob}-fach vergrößerndes Objektiv. Wie stark wird insgesamt vergrößert?${unit("fach")}`,kind:"num",ans:R(oc*ob),sol:`Vergrößerung = Okular · Objektiv = ${oc} · ${ob} = <b>${oc*ob}-fach</b>.`};
    return{q:`Das Okular vergrößert ${oc}-fach, insgesamt wird ${fmt(oc*ob)}-fach vergrößert. Wie stark vergrößert das Objektiv?${unit("fach")}`,kind:"num",ans:R(ob),sol:`${fmt(oc*ob)} : ${oc} = <b>${ob}</b>. Das Objektiv vergrößert ${ob}-fach.`}},
  zellvermehrung(){const n=ri(2,7);
    return{q:`Eine Zelle teilt sich, danach teilen sich alle Tochterzellen, und das insgesamt ${n}-mal. Wie viele Zellen sind es dann?${unit("Zellen")}`,kind:"num",ans:R(2**n),sol:`Jede Teilung verdoppelt die Zahl: 2<sup>${n}</sup> = <b>${2**n}</b>.`}},
  atemvol(){const v=pick([.4,.5,.6]),f=pick([12,14,15,16,18]);
    return{q:`Pro Atemzug werden ${fmt(v)} l Luft bewegt, man atmet ${f}-mal pro Minute. Wie groß ist das Atemminutenvolumen?${unit("Liter pro Minute")}`,kind:"num",decimal:true,ans:R(Math.round(v*f*10),10),tol:.01,sol:`${fmt(v)} l · ${f} = <b>${fmt(Math.round(v*f*10)/10)} l pro Minute</b>.`}},
  hzv(){const p=pick([60,65,70,75,80,90,100]),sv=pick([60,70,80,100]);const x=p*sv/1000;
    return{q:`Das Herz schlägt ${p}-mal pro Minute und pumpt je Schlag ${sv} ml. Wie viele Liter pumpt es pro Minute (Herzzeitvolumen)?${unit("Liter pro Minute")}`,kind:"num",decimal:true,ans:R(Math.round(x*1000),1000),tol:.006,sol:`${p} · ${sv} ml = ${fmt(p*sv)} ml = <b>${fmt(x)} l pro Minute</b>.`}},
  energie(){const t=pick([["Kohlenhydrate",17],["Eiweiß",17],["Fett",39]]),a=ri(5,60);
    return{q:`Ein Lebensmittel enthält ${a} g ${t[0]}. ${t[0]} liefern etwa ${t[1]} kJ pro Gramm. Wie viel Energie ist das?${unit("kJ")}`,kind:"num",ans:R(a*t[1]),sol:`${a} · ${t[1]} kJ = <b>${fmt(a*t[1])} kJ</b>.`}}
});

WIDGETS.diagramm=function(el,opt={}){const w=wid("dg"),ks=opt.ks||[opt.k];let cur=0,sel=null;
  el.innerHTML=`<div class="wg">${ks.length>1?`<div class="row seg" role="group">${ks.map((k,i)=>`<button type="button" class="btn small ghost" aria-pressed="${i===0}" data-i="${i}">${DIAG[k].name}</button>`).join("")}</div>`:""}<div class="wg-vis" id="${w}-o"></div><div class="ideas" id="${w}-b"></div><p class="wg-out" id="${w}-t"></p></div>`;
  const o=el.querySelector("#"+w+"-o"),b=el.querySelector("#"+w+"-b"),t=el.querySelector("#"+w+"-t");
  const draw=()=>{const D=DIAG[ks[cur]];
    o.innerHTML=`<svg viewBox="0 0 300 220" width="100%" style="max-width:340px" role="img" aria-label="${D.alt}">${D.svg}</svg>`;
    o.querySelectorAll("[data-p]").forEach(n=>{n.style.opacity=sel&&n.dataset.p!==sel?".18":"1";n.style.transition="opacity .2s"});
    b.innerHTML="";D.parts.forEach(([id,lab])=>{const x=document.createElement("button");x.type="button";x.className="idea";x.textContent=lab;x.setAttribute("aria-pressed",id===sel);x.onclick=()=>{sel=sel===id?null:id;draw()};b.append(x)});
    const p=D.parts.find(q=>q[0]===sel);t.innerHTML=p?`<b>${p[1]}:</b> ${p[2]}`:"Tippe auf einen Teil, dann wird er hervorgehoben und erklärt."};
  el.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{cur=+x.dataset.i;sel=null;el.querySelectorAll("[data-i]").forEach(y=>y.setAttribute("aria-pressed",y===x));draw()});
  draw()};

WIDGETS.fotosynth=function(el){const w=wid("fs");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"l","Lichtstärke",0,100,30,5)}${slider(w+"c","Kohlenstoffdioxid in der Luft",0,100,80,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const L=el.querySelector("#"+w+"l"),C=el.querySelector("#"+w+"c");
  const bar=(y,lab,v,col)=>`<text x="0" y="${y+14}" font-size="12" font-family="var(--f-body)" fill="var(--ink)">${lab}</text><rect x="110" y="${y}" width="180" height="18" rx="6" fill="var(--sunk)" stroke="var(--line)"/><rect x="110" y="${y}" width="${1.8*v}" height="18" rx="6" fill="${col}"/>`;
  const draw=()=>{const l=+L.value,c=+C.value,r=Math.min(l,c);el.querySelector("#"+w+"l-v").textContent=l;el.querySelector("#"+w+"c-v").textContent=c;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 100" width="100%" style="max-width:340px" role="img" aria-label="Licht, Kohlenstoffdioxid und Zuckerbildung">${bar(4,"Licht",l,"var(--signal)")}${bar(34,"CO₂",c,"var(--s-mathe)")}${bar(70,"Zucker + O₂",r,"var(--s-bio)")}</svg>`;
    el.querySelector("#"+w+"-t").innerHTML=r===0?"Ohne Licht oder ohne Kohlenstoffdioxid gibt es keine Fotosynthese.":l<c?"<b>Licht begrenzt</b> die Fotosynthese. Mehr CO₂ würde nichts bringen, mehr Licht schon.":c<l?"<b>Kohlenstoffdioxid begrenzt</b> die Fotosynthese. Mehr Licht würde nichts bringen (Gewächshäuser düngen deshalb mit CO₂).":"Beide Faktoren sind gleich knapp. Jetzt hilft nur, beide zu erhöhen."};
  L.oninput=C.oninput=draw;draw()};

WIDGETS.enzym=function(el){const w=wid("ez");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"t","Temperatur (°C)",0,70,20,1)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Tm=el.querySelector("#"+w+"t");
  const act=T=>T<=37?Math.pow(2,(T-37)/10):Math.max(0,1-(T-37)/22);
  const X=T=>30+T*(260/70),Y=a=>130-a*110;
  let path="";for(let T=0;T<=70;T++)path+=(T?"L":"M")+X(T).toFixed(1)+","+Y(act(T)).toFixed(1);
  const draw=()=>{const T=+Tm.value,a=act(T);el.querySelector("#"+w+"t-v").textContent=T;
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 160" width="100%" style="max-width:340px" role="img" aria-label="Enzymaktivität in Abhängigkeit von der Temperatur"><line x1="30" y1="130" x2="292" y2="130" stroke="var(--ink)" stroke-width="1.5"/><line x1="30" y1="14" x2="30" y2="130" stroke="var(--ink)" stroke-width="1.5"/>${[0,20,40,60].map(t=>`<text x="${X(t)}" y="146" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">${t}°</text>`).join("")}<text x="6" y="22" font-size="10" font-family="var(--f-mono)" fill="var(--muted)">Aktivität</text><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="${X(T)}" cy="${Y(a).toFixed(1)}" r="7" fill="var(--signal)" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=T<15?"<b>Zu kalt:</b> Die Teilchen bewegen sich langsam, die Reaktion läuft sehr langsam. Das Enzym bleibt aber intakt (darum konserviert Tiefkühlen).":T<33?"Mit steigender Temperatur läuft die Reaktion schneller (etwa doppelt so schnell pro 10 °C).":T<=41?"<b>Optimum:</b> Beim Menschen arbeiten die Enzyme bei etwa 37 °C am schnellsten.":T<=55?"Über dem Optimum zerfällt die Raumstruktur des Enzyms. Es wird <b>denaturiert</b>, die Aktivität sinkt rasch.":"<b>Denaturiert:</b> Das Enzym ist dauerhaft zerstört. Abkühlen hilft nicht mehr, wie bei einem gekochten Ei."};
  Tm.oninput=draw;draw()};
