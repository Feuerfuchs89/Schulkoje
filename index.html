   ["Wie heißt es, wenn Pollen auf die Narbe gelangt?","Das ist die Bestäubung. Die Befruchtung kommt danach.","Bestäubung","Befruchtung","Keimung"],
   ["Wozu sind die bunten Kronblätter da?","Sie locken Bestäuber wie Bienen und Schmetterlinge an.","Insekten anlocken","Fotosynthese","Wasser aufnehmen"],
   ["Woraus wird nach der Befruchtung die Frucht?","Der Fruchtknoten wächst zur Frucht, die Samenanlagen werden zu Samen.","Aus dem Fruchtknoten","Aus dem Staubbeutel","Aus dem Kelchblatt"],
   ["Wie verbreitet sich der Löwenzahn?","Seine Früchte sind Schirmchenflieger und segeln im Wind.","Mit dem Wind","Im Fell von Tieren","Über das Wasser"],
   ["Was passiert bei der Befruchtung?","Eine Spermazelle verschmilzt mit der Eizelle.","Spermazelle und Eizelle verschmelzen","Pollen landet auf der Narbe","Die Blüte öffnet sich"],
   ["Was leiten die Wasserleitbahnen im Spross?","Sie bringen Wasser und Mineralstoffe von der Wurzel zu den Blättern.","Wasser nach oben","Zucker nach unten","Pollen zur Narbe"]]),

 BT("b-foto","Fotosynthese einfach erklärt","Aus Licht, Wasser und Luft wird Zucker",[
  ["Die Grundgleichung",`<p>Grüne Pflanzen stellen ihre Nahrung selbst her:</p><p class="eq">Kohlenstoffdioxid + Wasser + Lichtenergie → Traubenzucker + Sauerstoff</p><p class="eq">6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂</p><p>Sie läuft in den <b>Chloroplasten</b> ab. Das Blattgrün (<b>Chlorophyll</b>) fängt das Licht ein. Das CO₂ kommt durch die <b>Spaltöffnungen</b> der Blätter, das Wasser aus der Wurzel. Der Sauerstoff geht in die Luft.</p>`],
  ["Was bremst die Fotosynthese?",`<p>Wie schnell Zucker entsteht, bestimmt der <b>knappste Faktor</b>. Probiere es aus: Verändere Licht und CO₂.</p>`,"fotosynth"],
  ["Zucker, Stärke und ein Irrtum",`<p>Der Traubenzucker dient als Energiequelle, als Baustoff (Zellulose) oder wird zu <b>Stärke</b> gespeichert (Kartoffel, Getreide). Stärke weist man mit <b>Iodlösung</b> nach: Sie färbt sich blauschwarz. Sauerstoff erkennt man mit der <b>Glimmspanprobe</b>: Der Span flammt auf.</p><p class="warn"><b>Irrtum:</b> „Pflanzen atmen CO₂ ein und O₂ aus, Tiere umgekehrt.“ Pflanzen atmen <b>auch</b> (Zellatmung, Tag und Nacht). Bei Licht bilden sie aber mehr Sauerstoff, als sie verbrauchen.</p>`]],
  [["Welche Stoffe nimmt die Pflanze für die Fotosynthese auf?","Sie braucht Kohlenstoffdioxid aus der Luft und Wasser aus dem Boden.","Kohlenstoffdioxid und Wasser","Sauerstoff und Zucker","Stickstoff und Salz"],
   ["Was entsteht bei der Fotosynthese?","Traubenzucker als Nährstoff und Sauerstoff als Abgas.","Traubenzucker und Sauerstoff","Kohlenstoffdioxid und Wasser","Nur Wasser"],
   ["Welcher Farbstoff fängt das Licht ein?","Chlorophyll, das Blattgrün, absorbiert das Licht.","Chlorophyll","Hämoglobin","Melanin"],
   ["Womit weist man Stärke nach?","Iodlösung färbt Stärke blauschwarz.","Iodlösung","Spülmittel","Essig"],
   ["Wie weist man Sauerstoff nach?","Ein glimmender Holzspan flammt in Sauerstoff auf.","Mit der Glimmspanprobe","Mit Iodlösung","Mit Salzwasser"],
   ["Pflanzen atmen auch nachts. Stimmt das?","Zellatmung läuft immer. Nachts fehlt nur das Licht für die Fotosynthese.","Ja, sie atmen Tag und Nacht","Nein, nie","Nur Tiere atmen"],
   ["Wo nimmt das Blatt das Kohlenstoffdioxid auf?","Durch die Spaltöffnungen, vor allem an der Blattunterseite.","Durch die Spaltöffnungen","Durch die Blüte","Durch die Wurzel"],
   ["Eine Pflanze steht im dunklen Keller. Was passiert?","Ohne Licht gibt es keine Fotosynthese. Die Pflanze verhungert langsam.","Sie vergilbt und stirbt","Sie wächst schneller","Sie braucht nur Dünger"]]),

 BT("b-wirbel","Wirbeltiere im Vergleich","Fische, Amphibien, Reptilien, Vögel, Säugetiere",[
  ["Die fünf Klassen",`<div class="tbl-wrap"><table class="tbl"><tr><th>Klasse</th><th>Haut</th><th>Atmung</th><th>Fortpflanzung</th></tr><tr><td>Fische</td><td>Schuppen</td><td>Kiemen</td><td>Laich im Wasser</td></tr><tr><td>Amphibien</td><td>nackt, feucht</td><td>Larve: Kiemen, später Lunge und Haut</td><td>Laich, Metamorphose</td></tr><tr><td>Reptilien</td><td>Hornschuppen</td><td>Lunge</td><td>Eier mit Lederhülle an Land</td></tr><tr><td>Vögel</td><td>Federn</td><td>Lunge mit Luftsäcken</td><td>Eier mit Kalkschale, Brutpflege</td></tr><tr><td>Säugetiere</td><td>Haare, Fell</td><td>Lunge</td><td>lebende Junge, Milch</td></tr></table></div>`],
  ["Wechselwarm und gleichwarm",`<p><b>Wechselwarme</b> Tiere (Fische, Amphibien, Reptilien) haben eine Körpertemperatur, die von der Umgebung abhängt. Eine Eidechse sonnt sich, um warm zu werden. Im Winter erstarren sie.</p><p><b>Gleichwarme</b> Tiere (Vögel, Säugetiere) halten ihre Temperatur konstant, brauchen dafür aber viel Nahrung.</p><p class="warn">Ein <b>Wal</b> ist ein Säugetier, kein Fisch: Er atmet mit Lungen, bekommt lebende Junge und säugt sie. Die <b>Fledermaus</b> ist auch ein Säugetier.</p>`]],
  [["Welche Tiere sind gleichwarm?","Vögel und Säugetiere halten ihre Körpertemperatur konstant.","Vögel und Säugetiere","Fische und Amphibien","Reptilien und Fische"],
   ["Warum ist ein Wal ein Säugetier?","Er atmet Luft mit Lungen, bringt lebende Junge zur Welt und säugt sie.","Lungen, lebende Junge, Milch","Er lebt im Wasser","Er ist groß"],
   ["Was bedeutet wechselwarm?","Die Körpertemperatur folgt der Umgebungstemperatur.","Temperatur hängt von der Umgebung ab","Der Körper ist immer 37 °C","Das Tier schwitzt"],
   ["Welche Gruppe durchläuft eine Metamorphose?","Der Frosch wird aus einer Kaulquappe mit Kiemen zum lungenatmenden Tier.","Amphibien","Reptilien","Vögel"],
   ["Hornschuppen, Lungen, Eier an Land. Welche Klasse?","Das sind die Merkmale der Reptilien.","Reptilien","Fische","Amphibien"],
   ["Womit atmen Fische?","Kiemen nehmen Sauerstoff aus dem Wasser auf.","Mit Kiemen","Mit Lungen","Mit Luftsäcken"],
   ["Die Fledermaus ist ein …","Sie hat Fell, bringt lebende Junge zur Welt und säugt sie.","Säugetier","Vogel","Reptil"],
   ["Wozu dienen Vögeln die Federn?","Federn ermöglichen den Flug und halten warm.","Fliegen und Wärme halten","Atmen","Schwimmen unter Wasser"]]),

 BT("b-see","Ökosystem See","Zonen, Nahrungskette und Jahreslauf",[
  ["Zonen im See",`<ul class="rules"><li><b>Uferzone:</b> viel Licht, Schilf, Seerosen, Libellenlarven, Frösche.</li><li><b>Freiwasserzone:</b> Schwebeorganismen (<b>Plankton</b>): Algen und Wasserflöhe, darüber Fische.</li><li><b>Tiefenzone:</b> kaum Licht, keine Fotosynthese. Hier leben Schlammbewohner und Bakterien.</li></ul>`],
  ["Die Nahrungskette",`<p class="eq">Alge → Wasserfloh → Plötze → Hecht</p><ul class="rules"><li><b>Produzenten</b> (Algen, Wasserpflanzen) bilden per Fotosynthese Nährstoffe.</li><li><b>Konsumenten</b> fressen andere: Wasserfloh (1. Ordnung), Plötze, Hecht.</li><li><b>Destruenten</b> (Bakterien, Pilze) zersetzen Totes zu Mineralstoffen, die Algen wieder nutzen. So schließt sich der <b>Stoffkreislauf</b>.</li></ul>`],
  ["Der See im Jahreslauf",`<p>Wasser ist bei <b>4 °C am dichtesten</b>. Darum schwimmt Eis oben, und tiefe Seen frieren nicht bis zum Grund zu. Wähle eine Jahreszeit:</p>`,"seeprofil"]],
  [["Was sind die Produzenten im See?","Algen und Wasserpflanzen bilden per Fotosynthese Nährstoffe.","Algen und Wasserpflanzen","Hechte","Bakterien"],
   ["Wer zersetzt tote Pflanzen und Tiere zu Mineralstoffen?","Destruenten wie Bakterien und Pilze.","Destruenten","Produzenten","Raubfische"],
   ["Welche Reihe ist eine richtige Nahrungskette?","Der Pfeil zeigt vom Gefressenen zum Fresser.","Alge → Wasserfloh → Plötze → Hecht","Hecht → Alge → Wasserfloh → Plötze","Plötze → Alge → Hecht → Wasserfloh"],
   ["Bei welcher Temperatur ist Wasser am dichtesten?","Bei 4 °C. Kälteres und wärmeres Wasser ist leichter.","4 °C","0 °C","100 °C"],
   ["Warum friert ein tiefer See nicht bis zum Grund zu?","Eis schwimmt oben, am Grund sammelt sich das dichteste Wasser mit 4 °C.","Eis schwimmt, unten bleibt es 4 °C warm","Fische wärmen das Wasser","Am Grund ist Salz"],
   ["Was ist die Sprungschicht?","Im Sommer fällt dort die Temperatur auf wenigen Metern stark ab.","Schicht mit schnellem Temperaturabfall","Die Eisdecke","Die Uferzone"],
   ["Was bewirken Frühjahrs- und Herbstzirkulation?","Das Wasser mischt sich durch: Sauerstoff kommt in die Tiefe, Nährstoffe nach oben.","Durchmischung des ganzen Sees","Der See friert zu","Algen sterben"],
   ["Warum wachsen in der Tiefenzone keine Wasserpflanzen?","Ohne Licht ist keine Fotosynthese möglich.","Dort kommt kaum Licht an","Dort ist es zu warm","Dort fehlt Wasser"],
   ["Zu welcher Zone gehört das Schilf?","Es wächst im flachen Wasser am Ufer, wo viel Licht hinkommt.","Uferzone","Tiefenzone","Freiwasserzone"]]),

 BT("b-wald","Ökosystem Wald","Stockwerke, Boden und Kreislauf",[
  ["Die Stockwerke",`<p>Vom Boden nach oben: <b>Moosschicht</b>, <b>Krautschicht</b> (Gräser, Farne, Blumen), <b>Strauchschicht</b> und <b>Baumschicht</b> (Kronendach). Das Licht nimmt nach unten stark ab. Wo wenig Licht ankommt, wachsen Schattenpflanzen.</p><p><b>Frühblüher</b> wie Buschwindröschen nutzen das Licht im Frühjahr, bevor die Bäume ihr Laub ausgetrieben haben. Danach ziehen sie ein.</p><p>Laubbäume (Buche, Eiche) werfen im Herbst die Blätter ab, Nadelbäume (Fichte, Kiefer) tragen Nadeln das ganze Jahr.</p>`],
  ["Boden und Kreislauf",`<p>Das Falllaub wird von <b>Zersetzern</b> verarbeitet: Regenwürmer, Asseln, Springschwänze, Pilze und Bakterien. Es entsteht <b>Humus</b> mit Mineralstoffen für die Bäume.</p><p>Der Wald speichert Wasser, filtert Luft, bindet Kohlenstoffdioxid, liefert Holz und ist Erholungsraum. Reine <b>Fichtenforste</b> sind anfällig: Gleichartige, flach wurzelnde Bäume leiden unter Sturm, Trockenheit und Borkenkäfer. Mischwälder sind stabiler.</p>`]],
  [["Wie heißen die Stockwerke von unten nach oben?","Moos-, Kraut-, Strauch-, Baumschicht.","Moos-, Kraut-, Strauch-, Baumschicht","Strauch-, Kraut-, Moos-, Baumschicht","Baum-, Moos-, Strauch-, Krautschicht"],
   ["Warum blühen Buschwindröschen früh im Jahr?","Im Frühjahr fällt noch Licht durch das unbelaubte Kronendach.","Es ist noch hell im Wald","Sie brauchen Frost","Sie brauchen keine Blätter"],
   ["Wer zersetzt das Falllaub?","Zersetzer wie Regenwürmer, Asseln und Pilze.","Regenwürmer, Asseln, Pilze","Rehe","Spechte"],
   ["Was entsteht aus zersetztem Laub?","Humus ist nährstoffreicher Boden.","Humus","Sand","Kalk"],
   ["Welcher Baum ist ein Nadelbaum?","Die Fichte trägt Nadeln.","Fichte","Buche","Eiche"],
   ["Warum sind reine Fichtenwälder anfällig?","Gleichartige Bäume mit flachen Wurzeln werden von Sturm, Trockenheit und Borkenkäfer leichter geschädigt.","Sturm, Trockenheit, Borkenkäfer","Fichten brauchen kein Licht","Fichten brauchen kein Wasser"],
   ["Was bildet das Dach des Waldes?","Die Baumschicht heißt auch Kronendach.","Die Baumschicht","Die Krautschicht","Die Moosschicht"],
   ["Wozu nutzt uns der Wald?","Er liefert Holz, speichert Wasser und Kohlenstoff, filtert Luft und dient der Erholung.","Holz, Wasser- und CO₂-Speicher, Erholung","Er macht das Wetter schlechter","Er braucht keine Pflege"]]),

 BT("b-sinne","Sinnesorgane: Auge und Ohr","Vom Reiz zur Wahrnehmung",[
  ["Reiz, Rezeptor, Gehirn",`<p>Sinneszellen (<b>Rezeptoren</b>) nehmen einen <b>Reiz</b> auf, Nerven leiten ihn als elektrisches Signal zum Gehirn, dort entsteht die <b>Wahrnehmung</b>. Neben Sehen, Hören, Riechen, Schmecken und Tasten gibt es Temperatur-, Schmerz- und Gleichgewichtssinn.</p>`],
  ["Das Auge",`<p>Licht fällt durch Hornhaut, Pupille und Linse und erzeugt auf der <b>Netzhaut</b> ein Bild. Es steht auf dem Kopf; das Gehirn dreht es um. <b>Stäbchen</b> sehen hell und dunkel (auch bei wenig Licht), <b>Zapfen</b> sehen Farben. Beim Nahsehen wölbt sich die Linse stärker.</p>`,"diagramm",{ks:["auge"]}],
  ["Die Pupille als Blende",`<p>Die Pupille passt sich dem Licht an, wie die Blende einer Kamera.</p>`,"pupille"],
  ["Das Ohr",`<p>Der Schall gelangt so zu den Sinneszellen:</p><ol class="rules"><li>Ohrmuschel fängt den Schall, der Gehörgang leitet ihn.</li><li>Das <b>Trommelfell</b> schwingt mit.</li><li>Die drei <b>Gehörknöchelchen</b> (Hammer, Amboss, Steigbügel) verstärken die Schwingung.</li><li>In der flüssigkeitsgefüllten <b>Schnecke</b> reizen sie die Hörsinneszellen.</li><li>Der <b>Hörnerv</b> leitet die Signale zum Gehirn.</li></ol><p>Im Innenohr sitzen auch die <b>Bogengänge</b> für den Gleichgewichtssinn.</p><p class="warn">Dauerhafter Lärm zerstört Hörsinneszellen. Sie wachsen nicht nach.</p>`]],
  [["Wo entsteht das Bild im Auge?","Auf der Netzhaut sitzen die Lichtsinneszellen.","Auf der Netzhaut","Auf der Hornhaut","In der Linse"],
   ["Was passiert mit der Pupille bei hellem Licht?","Sie wird eng und schützt so die Netzhaut.","Sie wird kleiner","Sie wird größer","Sie bleibt gleich"],
   ["Welche Sinneszellen erkennen Farben?","Zapfen sind für das Farbsehen zuständig.","Zapfen","Stäbchen","Haarzellen"],
   ["Wofür sind die Stäbchen da?","Sie sind sehr lichtempfindlich, aber farbenblind.","Sehen bei wenig Licht","Farben sehen","Hören"],
   ["Was ändert die Linse beim Nahsehen?","Die Linse wölbt sich stärker und bricht das Licht kräftiger.","Sie wölbt sich stärker","Die Pupille wird größer","Die Netzhaut wandert"],
   ["Welche Reihenfolge stimmt für den Schall?","Der Schall läuft vom Trommelfell über die Gehörknöchelchen zur Schnecke.","Trommelfell, Gehörknöchelchen, Schnecke","Schnecke, Trommelfell, Gehörknöchelchen","Gehörknöchelchen, Ohrmuschel, Schnecke"],
   ["Wo sitzen die Hörsinneszellen?","In der Schnecke im Innenohr.","In der Schnecke","Im Trommelfell","In der Ohrmuschel"],
   ["Wofür sind die Bogengänge im Innenohr da?","Sie melden dem Gehirn Drehbewegungen des Kopfes.","Gleichgewicht","Hören hoher Töne","Lärmschutz"],
   ["Wie steht das Bild auf der Netzhaut?","Es steht auf dem Kopf, das Gehirn dreht es um.","Auf dem Kopf","Richtig herum","Doppelt"]]),

 BT("b-verdau","Ernährung und Verdauung","Nährstoffe und der Weg der Nahrung",[
  ["Die Nährstoffe",`<div class="tbl-wrap"><table class="tbl"><tr><th>Nährstoff</th><th>Aufgabe</th><th>Energie</th></tr><tr><td>Kohlenhydrate (Stärke, Zucker)</td><td>Hauptenergiequelle</td><td>17 kJ/g</td></tr><tr><td>Fette</td><td>Energiespeicher, Zellbaustoff</td><td>39 kJ/g</td></tr><tr><td>Eiweiße</td><td>Baustoff für Muskeln, Haut, Zellen</td><td>17 kJ/g</td></tr></table></div><p>Dazu kommen <b>Vitamine</b>, <b>Mineralstoffe</b> (Calcium für Knochen, Eisen fürs Blut), <b>Wasser</b> und <b>Ballaststoffe</b> (unverdauliche Pflanzenfasern, die die Verdauung anregen).</p>`],
  ["Der Weg der Nahrung",`<ol class="rules"><li><b>Mund:</b> Zähne zerkleinern, Speichel beginnt die Stärkeverdauung.</li><li><b>Speiseröhre:</b> Muskelwellen schieben den Bissen weiter.</li><li><b>Magen:</b> Magensäure tötet Keime, Enzyme beginnen die Eiweißverdauung.</li><li><b>Dünndarm:</b> Hauptverdauung mit Säften aus Bauchspeicheldrüse und Galle (hilft bei Fetten). Die Nährstoffe gehen über die <b>Darmzotten</b> ins Blut.</li><li><b>Dickdarm:</b> entzieht Wasser, der Rest wird ausgeschieden.</li></ol>`]],
  [["Welcher Nährstoff liefert pro Gramm die meiste Energie?","Fett hat mit etwa 39 kJ pro Gramm mehr als doppelt so viel wie Kohlenhydrate oder Eiweiß.","Fett","Eiweiß","Kohlenhydrate"],
   ["Wofür braucht der Körper Eiweiße vor allem?","Eiweiße bauen Muskeln, Haut und Zellen auf.","Als Baustoff","Zum Wärmen","Zum Verdauen"],
   ["Wo beginnt die Stärkeverdauung?","Schon im Mund spaltet der Speichel Stärke.","Im Mund","Im Magen","Im Dickdarm"],
   ["Wo werden die meisten Nährstoffe ins Blut aufgenommen?","Im Dünndarm über die Darmzotten.","Im Dünndarm","Im Magen","Im Dickdarm"],
   ["Was entzieht der Dickdarm dem Speisebrei?","Er dickt den Rest durch Wasserentzug ein.","Wasser","Eiweiß","Fett"],
   ["Welche Aufgabe hat die Galle?","Sie hilft, Fette zu zerlegen und aufzunehmen.","Fettverdauung unterstützen","Speichel bilden","Stärke spalten"],
   ["Wie wird der Bissen durch die Speiseröhre transportiert?","Wellenförmige Muskelbewegungen schieben ihn auch im Liegen.","Durch Muskelwellen","Durch Schwerkraft allein","Durch Luftdruck"],
   ["Was sind Ballaststoffe?","Unverdauliche Pflanzenfasern regen die Darmbewegung an.","Unverdauliche Pflanzenfasern","Zucker","Vitamine"],
   ["Wofür braucht man Calcium?","Calcium macht Knochen und Zähne fest.","Knochen und Zähne","Sauerstofftransport","Sehen"]],["energie"]),

 BT("b-skelett","Skelett und Muskeln","Stützen, Schützen, Bewegen",[
  ["Das Skelett",`<p>Ein Erwachsener hat etwa <b>206 Knochen</b>. Das Skelett <b>stützt</b>, <b>schützt</b> (Schädel das Gehirn, Brustkorb Herz und Lunge), ist Ansatz für Muskeln, <b>bildet Blut</b> (rotes Knochenmark) und speichert Mineralstoffe. Die Wirbelsäule hat 7 Hals-, 12 Brust- und 5 Lendenwirbel und ist doppelt-S-förmig, das federt Stöße ab.</p>`],
  ["Gelenke",`<ul class="rules"><li><b>Kugelgelenk:</b> Schulter, Hüfte, in alle Richtungen beweglich.</li><li><b>Scharniergelenk:</b> Ellbogen, Knie, nur Beugen und Strecken.</li><li><b>Sattelgelenk:</b> Daumen.</li></ul><p>Im Gelenk überzieht <b>Knorpel</b> die Enden, <b>Gelenkschmiere</b> verringert Reibung, die <b>Gelenkkapsel</b> schließt alles ein, <b>Bänder</b> halten die Knochen zusammen.</p>`],
  ["Muskeln",`<p>Muskeln können nur <b>ziehen</b>, nicht schieben. Darum arbeiten sie als <b>Gegenspieler</b>: Beim Beugen des Arms zieht sich der <b>Bizeps</b> zusammen, der <b>Trizeps</b> entspannt sich; beim Strecken umgekehrt. <b>Sehnen</b> verbinden Muskeln mit Knochen, <b>Bänder</b> verbinden Knochen mit Knochen.</p><p class="tip">Muskelkater sind winzige Risse in den Muskelfasern, nicht „Übersäuerung“.</p>`]],
  [["Wie viele Knochen hat ein Erwachsener etwa?","Es sind etwa 206 Knochen.","Etwa 206","Etwa 50","Etwa 500"],
   ["Welches Gelenk ist ein Kugelgelenk?","Schulter und Hüfte sind Kugelgelenke.","Schulter","Knie","Ellbogen"],
   ["Was verbindet Muskeln mit Knochen?","Sehnen sind straffe, zugfeste Stränge.","Sehnen","Bänder","Knorpel"],
   ["Was verbindet Knochen mit Knochen im Gelenk?","Bänder halten das Gelenk zusammen.","Bänder","Sehnen","Muskeln"],
   ["Warum arbeiten Muskeln paarweise?","Muskeln können nur ziehen, der Gegenspieler zieht zurück.","Sie können nur ziehen","Jeder Muskel hat zwei Knochen","Das spart Energie"],
   ["Welcher Muskel zieht sich beim Beugen des Arms zusammen?","Der Bizeps beugt, der Trizeps streckt.","Der Bizeps","Der Trizeps","Beide gleich stark"],
   ["Welche Aufgabe hat das rote Knochenmark?","Dort werden Blutzellen gebildet.","Blutzellen bilden","Verdauen","Gleichgewicht halten"],
   ["Wozu dient die Gelenkschmiere?","Sie verringert die Reibung im Gelenk.","Reibung verringern","Kühlen","Färben"],
   ["Wie viele Halswirbel hat der Mensch?","Sieben, wie fast alle Säugetiere, auch die Giraffe.","7","12","5"]]),

 BT("b-puber","Pubertät und Entwicklung","Hormone, Zyklus und Schwangerschaft",[
  ["Was in der Pubertät passiert",`<p>Zwischen etwa 9 und 15 Jahren beginnt der Körper, erwachsen zu werden. Das Gehirn schickt Signale an die Keimdrüsen, die <b>Geschlechtshormone</b> bilden: <b>Östrogen</b> in den Eierstöcken, <b>Testosteron</b> in den Hoden. Sie lösen Wachstumsschub, Körperbehaarung, Veränderung von Stimme und Körperformen und die Geschlechtsreife aus.</p><p>Zeitpunkt und Tempo sind sehr verschieden und völlig normal. Gefühlsschwankungen gehören dazu, weil auch das Gehirn umgebaut wird.</p>`],
  ["Zyklus und Befruchtung",`<ul class="rules"><li>Im <b>Zyklus</b> (im Mittel etwa 28 Tage) reift eine Eizelle heran. Der <b>Eisprung</b> ist etwa in der Zyklusmitte. Die Gebärmutterschleimhaut baut sich auf.</li><li>Kommt es nicht zur Befruchtung, wird die Schleimhaut mit der <b>Regelblutung</b> abgestoßen.</li><li>Bei der <b>Befruchtung</b>, meist im <b>Eileiter</b>, verschmilzt ein Spermium mit der Eizelle. Die Zelle teilt sich und nistet sich in der Gebärmutter ein.</li><li>Die <b>Schwangerschaft</b> dauert etwa 40 Wochen. Bis zur 8. Woche heißt das Kind Embryo, danach Fötus.</li></ul><p>Das <b>Kondom</b> verhütet und schützt zugleich vor sexuell übertragbaren Infektionen.</p>`]],
  [["Wodurch werden die Veränderungen in der Pubertät ausgelöst?","Hormone aus den Keimdrüsen steuern sie.","Durch Geschlechtshormone","Durch Vitamine","Durch Sport"],
   ["Wie heißen die männlichen Geschlechtszellen?","Spermien werden in den Hoden gebildet.","Spermien","Eizellen","Pollen"],
   ["Wann ist beim Zyklus etwa der Eisprung?","Etwa in der Mitte des Zyklus.","In der Zyklusmitte","Am ersten Tag","Am letzten Tag"],

  ["Die Nervenzelle",`<p>Eine <b>Nervenzelle</b> (Neuron) hat einen Zellkörper mit Kern, kurze <b>Dendriten</b> (empfangen Signale) und ein langes <b>Axon</b> (leitet weiter). Am Ende liegt die <b>Synapse</b>: Dort wird das Signal chemisch mit <b>Botenstoffen</b> (Transmittern) auf die nächste Zelle übertragen. Eine Isolierschicht (Myelin) macht die Leitung schneller, bis etwa 100 m/s.</p><p class="eq">Reiz → Rezeptor → sensorische Bahn → Gehirn/Rückenmark → motorische Bahn → Effektor</p>`],

  transkript(){const cs=shuffle(CODONS).slice(0,2),m=cs.join(" "),t=templateFromMrna(m);

  nerv(){const [v,s,t]=pick([[100,1,10],[100,1.5,15],[100,2,20],[50,1,20],[50,.5,10],[10,.5,50],[10,1,100],[1,.02,20]]);

WIDGETS.logistisch=function(el){const w=wid("lg2");
  el.innerHTML=`<div class="wg"><div class="wg-vis" id="${w}-o"></div><div class="wg-ctl">${slider(w+"r","Wachstumsrate r",.1,1,.4,.1)}${slider(w+"k","Kapazität K",200,1000,600,100)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const Rr=el.querySelector("#"+w+"r"),K=el.querySelector("#"+w+"k");
  const draw=()=>{const r=+Rr.value,k=+K.value;el.querySelector("#"+w+"r-v").textContent=fmt(r);el.querySelector("#"+w+"k-v").textContent=k;
    const X=t=>30+t*(260/20),Y=n=>140-n*(120/1000);let ex="",lo="";
    for(let t=0;t<=20;t+=.5){const e=10*Math.exp(r*t),l=k/(1+(k-10)/10*Math.exp(-r*t));ex+=(t?"L":"M")+X(t).toFixed(1)+","+Y(Math.min(e,1000)).toFixed(1);lo+=(t?"L":"M")+X(t).toFixed(1)+","+Y(l).toFixed(1)}
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 300 160" width="100%" style="max-width:340px" role="img" aria-label="Exponentielles und logistisches Wachstum"><line x1="30" y1="140" x2="292" y2="140" stroke="var(--ink)"/><line x1="30" y1="14" x2="30" y2="140" stroke="var(--ink)"/><line x1="30" y1="${Y(k)}" x2="292" y2="${Y(k)}" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="290" y="${Y(k)-3}" text-anchor="end" font-size="9" font-family="var(--f-mono)" fill="var(--muted)">K = ${k}</text><path d="${ex}" fill="none" stroke="var(--s-chemie)" stroke-width="2.5" stroke-dasharray="5 3"/><path d="${lo}" fill="none" stroke="var(--accent)" stroke-width="3"/><text x="292" y="156" text-anchor="end" font-size="9" font-family="var(--f-mono)" fill="var(--muted)">Zeit</text></svg>`;
    el.querySelector("#"+w+"-t").innerHTML=`<span style="color:var(--s-chemie)"><b>Gestrichelt:</b> exponentiell</span> ohne Grenzen. <span style="color:var(--accent)"><b>Durchgezogen:</b> logistisch</span>: Nahrung, Platz und Krankheiten bremsen, die Population nähert sich der Kapazität K. Bei r = ${fmt(r)} geht es ${r>=.7?"sehr schnell":r>=.4?"zügig":"langsam"}.`};
  Rr.oninput=K.oninput=draw;draw()};

  ["Aufbau der DNA",`<p>Ein <b>Nukleotid</b> besteht aus Phosphat, dem Zucker <b>Desoxyribose</b> und einer Base (A, T, G oder C). Zwei Stränge bilden die <b>Doppelhelix</b> (Watson und Crick 1953, mit Röntgenbildern von Rosalind Franklin). Die Basen paaren sich komplementär: <b>A–T</b> (2 Wasserstoffbrücken) und <b>G–C</b> (3). Daraus folgt die Regel von Chargaff: A = T und G = C.</p>`,"diagramm",{ks:["dna"]}],
  ["Replikation",`<p>Die Replikation ist <b>semikonservativ</b> (Meselson und Stahl 1958): Jede neue DNA enthält einen alten und einen neuen Strang.</p><ol class="rules"><li><b>Helicase</b> öffnet die Doppelhelix an der Replikationsgabel.</li><li><b>Primase</b> setzt kurze RNA-Starter (Primer).</li><li><b>DNA-Polymerase</b> baut den neuen Strang nur in <b>5′→3′-Richtung</b>. Der <b>Leitstrang</b> wird durchgehend gebaut, der <b>Folgestrang</b> in Stücken (<b>Okazaki-Fragmente</b>).</li><li><b>Ligase</b> verbindet die Fragmente.</li></ol>`],
  ["Mutationen",`<ul class="rules"><li><b>Genmutation</b> (Punktmutation): Austausch, Verlust oder Einbau einzelner Basen.</li><li><b>Chromosomenmutation:</b> Stück geht verloren, wird verdoppelt, verlagert.</li><li><b>Genommutation:</b> Zahl der Chromosomen ändert sich (Trisomie 21).</li></ul><p>Mutationen entstehen zufällig, zum Beispiel durch Kopierfehler, UV-Strahlung oder Chemikalien. Meist sind sie neutral oder schädlich, selten nützlich. Sie sind der Rohstoff der Evolution.</p>`]],
  [["Welche Basen paaren sich?","A–T über 2 und G–C über 3 Wasserstoffbrücken.","A–T und G–C","A–G und T–C","A–C und G–T"],
   ["Woraus besteht ein DNA-Nukleotid?","Phosphat, Desoxyribose und eine Base.","Phosphat, Desoxyribose, Base","Phosphat, Ribose, Base","Aminosäure und Zucker"],
   ["Was bedeutet semikonservativ?","Jede Tochter-DNA besteht aus einem alten und einem neuen Strang.","Ein alter, ein neuer Strang","Beide Stränge neu","Beide Stränge alt"],
   ["Was macht die Helicase?","Sie öffnet die Doppelhelix, indem sie Wasserstoffbrücken löst.","Doppelstrang öffnen","Nukleotide verknüpfen","Fragmente verbinden"],
   ["Was macht die DNA-Polymerase?","Sie verknüpft Nukleotide zum neuen Strang (5′→3′).","Neuen Strang synthetisieren","DNA entwinden","Proteine bauen"],
   ["Warum gibt es Okazaki-Fragmente?","Die Polymerase arbeitet nur in 5′→3′-Richtung, der Folgestrang wird in Stücken gebaut.","Folgestrang wird stückweise gebaut","Es sind Fehler","Sie sind Stoppsignale"],
   ["Was verbindet die Okazaki-Fragmente?","Die Ligase schließt die Lücken im Zucker-Phosphat-Rückgrat.","Ligase","Helicase","Primase"],
   ["Was ist eine Punktmutation?","Austausch, Verlust oder Einbau einzelner Nukleotide.","Veränderung einzelner Basen","Verlust eines Chromosoms","Verdopplung des Genoms"],
   ["Trisomie 21 ist eine …","Es liegt ein Chromosom mehr vor, die Chromosomenzahl ist geändert.","Genommutation","Genmutation","Chromosomenmutation im engeren Sinn"]],["b12-dna","dnakomp","dnaanteil"]),

 BT("b12-protein","Proteinbiosynthese","Von der DNA zum Protein",[
  ["Transkription",`<p>Im <b>Zellkern</b> wird ein Gen in <b>mRNA</b> umgeschrieben. Die <b>RNA-Polymerase</b> liest den <b>codogenen Strang</b> (Matrize) und baut komplementär die RNA, in der <b>Uracil (U)</b> an die Stelle von Thymin tritt. Bei Eukaryoten wird die mRNA noch bearbeitet: <b>Spleißen</b> entfernt die Introns, die Exons werden verbunden, dazu kommen Kappe und Poly-A-Schwanz.</p><p class="eq">DNA 3′-TAC GGG-5′ → mRNA 5′-AUG CCC-3′</p>`],
  ["Translation",`<p>Am <b>Ribosom</b> im Zellplasma wird die mRNA in ein Protein übersetzt. Je drei Basen bilden ein <b>Codon</b>, das für eine Aminosäure steht. Die <b>tRNA</b> trägt eine Aminosäure und hat das passende <b>Anticodon</b>. Das Ribosom verknüpft die Aminosäuren zur Kette.</p><ul class="rules"><li><b>Start:</b> AUG (Methionin)</li><li><b>Stopp:</b> UAA, UAG, UGA</li><li>Der Code ist <b>degeneriert</b> (mehrere Codons je Aminosäure), <b>kommafrei</b> und fast <b>universell</b>.</li></ul>`],
  ["Mutationen im Code",`<ul class="rules"><li><b>Stille Mutation:</b> neues Codon, gleiche Aminosäure.</li><li><b>Missense:</b> andere Aminosäure (Sichelzellanämie: ein Basenaustausch).</li><li><b>Nonsense:</b> Stoppcodon entsteht, das Protein ist verkürzt.</li><li><b>Rasterschub:</b> Einbau oder Verlust von Basen, die nicht durch 3 teilbar sind, ändert alle folgenden Codons.</li></ul>`]],
  [["Wo findet die Transkription bei Eukaryoten statt?","Im Zellkern wird die DNA in mRNA umgeschrieben.","Im Zellkern","Am Ribosom","Im Golgi-Apparat"],
   ["Was unterscheidet RNA von DNA?","RNA hat Ribose und Uracil statt Thymin.","Uracil statt Thymin","Thymin statt Uracil","Keine Basen"],
   ["Was ist ein Codon?","Ein Basentriplett der mRNA codiert eine Aminosäure.","Triplett aus drei Basen","Ein Ribosom","Ein Enzym"],
   ["Was trägt die tRNA?","Sie trägt eine Aminosäure und hat ein Anticodon.","Aminosäure und Anticodon","Die DNA","Ribosomen"],
   ["Wo findet die Translation statt?","Am Ribosom im Zellplasma.","Am Ribosom","Im Zellkern","In der Vakuole"],
   ["Welches ist das Startcodon?","AUG codiert Methionin und startet die Translation.","AUG","UAA","GGG"],
   ["Was bedeutet „degenerierter“ Code?","Mehrere Codons können dieselbe Aminosäure codieren.","Mehrere Codons für eine Aminosäure","Jedes Codon codiert mehrere","Der Code ist fehlerhaft"],
   ["Was geschieht beim Spleißen?","Introns werden herausgeschnitten, Exons verbunden.","Introns werden entfernt","Exons werden entfernt","DNA wird verdoppelt"],
   ["Welche Mutation verschiebt das Leseraster?","Insertion oder Deletion einzelner Basen verschiebt alle folgenden Tripletts.","Deletion einer Base","Austausch einer Base","Verdopplung eines Chromosoms"]],["b12-protein","transkript","translat"]),

 BT("b12-regul","Genregulation","Operon-Modell und Differenzierung",[
  ["Das lac-Operon",`<p>Jacob und Monod beschrieben bei <i>E. coli</i>, wie Bakterien Enzyme nur bei Bedarf bilden. Das <b>Regulatorgen</b> codiert einen <b>Repressor</b>. Er bindet am <b>Operator</b> und blockiert die RNA-Polymerase am <b>Promotor</b>. Laktose (Induktor) bindet den Repressor, er löst sich, die <b>Strukturgene</b> werden abgelesen: <b>Substratinduktion</b>.</p>`,"lacop"],
  ["Endproduktrepression und Eukaryoten",`<p>Beim <b>trp-Operon</b> ist es umgekehrt: Das Endprodukt Tryptophan aktiviert den Repressor und schaltet die Synthese ab (<b>Endproduktrepression</b>).</p><p>Bei Eukaryoten steuern <b>Transkriptionsfaktoren</b> an <b>Enhancern</b> die Genaktivität. <b>Epigenetik:</b> <b>DNA-Methylierung</b> und Histonmodifikation schalten Gene ab oder an, ohne die Sequenz zu ändern. So haben alle Körperzellen dasselbe Erbgut, aber unterschiedliche aktive Gene: <b>Differenzierung</b>.</p>`]],
  [["Was bindet der Repressor im lac-Operon?","Er bindet am Operator und blockiert die RNA-Polymerase.","Den Operator","Den Promotor","Laktose dauerhaft"],
   ["Wann werden die lac-Strukturgene abgelesen?","Laktose bindet den Repressor, der sich vom Operator löst.","Wenn Laktose vorhanden ist","Wenn Laktose fehlt","Immer"],
   ["Warum ist das System sinnvoll?","Enzyme werden nur bei Bedarf gebildet, das spart Energie und Material.","Enzyme nur bei Bedarf","Enzyme immer","Kein Vorteil"],
   ["Was ist ein Induktor?","Ein Stoff, der den Repressor inaktiviert und so die Genaktivität anschaltet.","Schaltet die Genaktivität an","Ein Enzym","Ein Promotor"],
   ["Was ist die Aufgabe des Regulatorgens?","Es codiert den Repressor.","Es codiert den Repressor","Es codiert Laktose","Es ist der Promotor"],
   ["Muskel- und Nervenzelle haben dasselbe Erbgut und sind doch verschieden. Warum?","Unterschiedliche Gene sind aktiv (Genregulation, Differenzierung).","Unterschiedliche Genaktivität","Unterschiedliche DNA","Unterschiedliche Chromosomenzahl"],
   ["Was sind Transkriptionsfaktoren?","Proteine, die an DNA binden und die Transkription fördern oder hemmen.","Proteine, die die Genaktivität steuern","Enzyme der Replikation","Teile des Ribosoms"],
   ["Was bedeutet Epigenetik?","Veränderte Genaktivität ohne Änderung der DNA-Sequenz.","Genaktivität ohne Sequenzänderung","Mutation der Sequenz","Änderung der Chromosomenzahl"],
   ["Wie wirkt DNA-Methylierung meist?","Methylgruppen an der DNA schalten Gene oft ab.","Sie schaltet Gene oft ab","Sie schaltet Gene an","Sie repliziert die DNA"]]),

 BT("b12-ap","Ruhepotenzial und Aktionspotenzial","Elektrik der Nervenzelle",[
  ["Das Ruhepotenzial",`<p>An der Membran einer ruhenden Nervenzelle liegt eine Spannung von etwa <b>−70 mV</b> (innen negativ). Ursachen: <b>K⁺-Ionen</b> strömen über offene Kaliumkanäle aus (Konzentrationsgefälle), große organische <b>Anionen</b> bleiben innen, und die <b>Natrium-Kalium-Pumpe</b> transportiert unter ATP-Verbrauch <b>3 Na⁺ hinaus und 2 K⁺ hinein</b>.</p>`],
  ["Das Aktionspotenzial",`<p>Ein überschwelliger Reiz löst ein <b>Aktionspotenzial</b> aus. Es gilt das <b>Alles-oder-Nichts-Gesetz</b>: Die Größe hängt nicht von der Reizstärke ab, nur die Frequenz. Gehe die Phasen durch:</p>`,"ap"],
  ["Erregungsleitung",`<ul class="rules"><li><b>Kontinuierlich</b> bei marklosen Axonen: Das AP wandert Stück für Stück, langsam (etwa 1 m/s).</li><li><b>Saltatorisch</b> bei markhaltigen Axonen: Die Myelinscheide isoliert, nur an den <b>Ranvier-Schnürringen</b> entstehen APs. Es springt von Ring zu Ring, bis etwa 100 m/s, und spart Energie.</li></ul><p>Die <b>Refraktärzeit</b> sorgt dafür, dass die Erregung nur in eine Richtung läuft.</p>`]],
  [["Wie hoch ist das Ruhepotenzial etwa?","Innen etwa 70 mV negativer als außen.","−70 mV","+30 mV","0 mV"],
   ["Wodurch entsteht das Ruhepotenzial hauptsächlich?","K⁺ strömt über offene Kanäle aus, organische Anionen bleiben innen.","K⁺-Ausstrom","Na⁺-Einstrom","Cl⁻-Ausstrom"],
   ["Was macht die Natrium-Kalium-Pumpe?","Unter ATP-Verbrauch: 3 Na⁺ hinaus, 2 K⁺ hinein.","3 Na⁺ raus, 2 K⁺ rein","3 K⁺ raus, 2 Na⁺ rein","Sie leitet Wasser"],
   ["Was passiert bei der Depolarisation?","Spannungsgesteuerte Na⁺-Kanäle öffnen, Na⁺ strömt ein.","Na⁺ strömt ein","K⁺ strömt ein","Ca²⁺ strömt aus"],
   ["Was besagt das Alles-oder-Nichts-Gesetz?","Wird der Schwellenwert erreicht, läuft das AP immer gleich ab.","AP gleich groß oder gar keins","Stärkerer Reiz, größeres AP","Das AP wird immer kleiner"],
   ["Was bewirkt die Refraktärzeit?","Kein neues AP ist auslösbar, die Erregung läuft nur vorwärts.","Erregung läuft nur in eine Richtung","Das AP wird verstärkt","Die Pumpe stoppt"],
   ["Was ist saltatorische Erregungsleitung?","Das AP springt bei markhaltigen Axonen von Schnürring zu Schnürring.","Sprünge von Schnürring zu Schnürring","Leitung durch Blut","Leitung durch Zufall"],
   ["Warum leiten markhaltige Axone schneller?","Die Myelinscheide isoliert, APs entstehen nur an den Schnürringen.","Isolation und Sprünge","Dickere Kerne","Mehr Wasser"],
   ["Was geschieht bei der Repolarisation?","Na⁺-Kanäle inaktivieren, K⁺-Kanäle öffnen, K⁺ strömt aus.","K⁺ strömt aus","Na⁺ strömt ein","Die Pumpe stoppt"]],["b12-ap","nerv"]),

 BT("b12-syn","Synapse und Muskelkontraktion","Signalübertragung und Bewegung",[
  ["Die chemische Synapse",`<p>Gehe die Teile durch. Ablauf: AP erreicht das Endknöpfchen → Ca²⁺-Kanäle öffnen → <b>Ca²⁺ strömt ein</b> → Vesikel verschmelzen mit der Membran → <b>Transmitter</b> (Acetylcholin) gelangt in den Spalt → bindet an Rezeptoren → Na⁺-Kanäle öffnen → <b>EPSP</b>. Danach wird der Transmitter abgebaut (<b>Acetylcholinesterase</b>) oder wieder aufgenommen.</p>`,"diagramm",{ks:["synapse"]}],
  ["Hemmung, Summation, Gifte",`<ul class="rules"><li><b>Hemmende Synapse:</b> Transmitter (GABA) öffnet Cl⁻-Kanäle, es entsteht ein <b>IPSP</b> (Hyperpolarisation).</li><li><b>Summation:</b> <b>zeitlich</b> (EPSPs schnell hintereinander) und <b>räumlich</b> (mehrere Synapsen gleichzeitig) addieren sich bis zum Schwellenwert.</li><li><b>Curare</b> blockiert die ACh-Rezeptoren: Lähmung.</li><li><b>Botulinumtoxin</b> verhindert die Transmitterfreisetzung: Lähmung.</li><li><b>Nervengase</b> hemmen die Acetylcholinesterase: Dauererregung, Krämpfe.</li></ul>`],
  ["Muskelkontraktion",`<p>Ein Muskel besteht aus Fasern mit Myofibrillen, gegliedert in <b>Sarkomere</b>. Dicke <b>Myosinfilamente</b> und dünne <b>Aktinfilamente</b> gleiten ineinander (<b>Gleitfilamenttheorie</b>), das Sarkomer verkürzt sich.</p><ol class="rules"><li>Ein AP lässt Ca²⁺ aus dem sarkoplasmatischen Retikulum frei.</li><li>Ca²⁺ gibt am Aktin die Bindestellen frei (Troponin, Tropomyosin).</li><li>Das Myosinköpfchen bindet und macht den <b>Kraftschlag</b>.</li><li><b>ATP</b> löst das Köpfchen wieder ab und spannt es neu. Ohne ATP bleiben die Köpfchen gebunden: <b>Totenstarre</b>.</li></ol>`]],
  [["Welcher Ionenstrom löst die Transmitterfreisetzung aus?","Ca²⁺ strömt ins Endknöpfchen, Vesikel verschmelzen mit der Membran.","Ca²⁺-Einstrom","Na⁺-Ausstrom","K⁺-Einstrom"],
   ["Wie heißt der Überträgerstoff an der motorischen Endplatte?","Acetylcholin überträgt das Signal auf den Muskel.","Acetylcholin","Insulin","Adrenalin"],
   ["Welches Enzym baut Acetylcholin im Spalt ab?","Die Acetylcholinesterase spaltet es.","Acetylcholinesterase","Amylase","Katalase"],
   ["Was bewirkt Curare?","Es blockiert die ACh-Rezeptoren: Der Muskel bekommt kein Signal.","Blockiert die ACh-Rezeptoren","Hemmt den Abbau von ACh","Bildet mehr Transmitter"],
   ["Nervengase hemmen die Acetylcholinesterase. Folge?","ACh bleibt im Spalt: Dauererregung und Krämpfe.","Dauererregung","Lähmung durch fehlendes ACh","Keine Wirkung"],
   ["Was ist ein IPSP?","Ein hemmendes Potenzial, oft durch Cl⁻-Einstrom.","Hemmendes postsynaptisches Potenzial","Erregendes Potenzial","Aktionspotenzial"],
   ["Was ist zeitliche Summation?","Schnell aufeinanderfolgende EPSPs addieren sich.","EPSPs addieren sich in kurzer Folge","Räumlich verteilte Signale","Ein AP summiert sich"],
   ["Was gleitet bei der Kontraktion ineinander?","Aktin- und Myosinfilamente, das Sarkomer verkürzt sich.","Aktin und Myosin","Haut und Knochen","Sehne und Blut"],
   ["Wozu braucht der Muskel ATP?","ATP löst die Myosinköpfchen vom Aktin. Ohne ATP: Totenstarre.","Lösen und Spannen der Myosinköpfchen","Nur für Wärme","Zur Bildung von Ca²⁺"]]),

 BT("b12-atp","Zellatmung im Detail","Von der Glucose zum ATP",[
  ["Überblick",`<p class="eq">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O (+ etwa 30 ATP)</p><ol class="rules"><li><b>Glykolyse</b> (Cytoplasma): Glucose → 2 Pyruvat, netto <b>2 ATP</b> und 2 NADH, ohne Sauerstoff.</li><li><b>Oxidative Decarboxylierung</b> (Matrix): Pyruvat → Acetyl-CoA + <b>CO₂</b> + NADH.</li><li><b>Citratzyklus</b> (Matrix): Acetyl-CoA wird abgebaut, <b>CO₂</b>, NADH, FADH₂ und etwas ATP entstehen.</li><li><b>Atmungskette</b> (innere Membran): NADH und FADH₂ geben Elektronen ab, Protonen werden in den Intermembranraum gepumpt. Die <b>ATP-Synthase</b> nutzt den Rückfluss und bildet den Großteil des ATP. <b>Sauerstoff</b> ist der Endakzeptor, es entsteht Wasser.</li></ol>`],
  ["Das Mitochondrium",`<p>Tippe die Teile an.</p>`,"diagramm",{ks:["mito"]}],
  ["Gärung",`<p>Ohne Sauerstoff geht nur die Glykolyse weiter, das NADH muss regeneriert werden.</p><ul class="rules"><li><b>Alkoholische Gärung</b> (Hefe): Pyruvat → Ethanol + CO₂ (Bier, Brot, Wein).</li><li><b>Milchsäuregärung</b> (Milchsäurebakterien, auch Muskel bei O₂-Mangel): Pyruvat → Laktat (Joghurt, Sauerkraut).</li></ul><p>Ausbeute nur <b>2 ATP</b> pro Glucose, gegenüber etwa 30 bei der Atmung.</p>`]],
  [["Wo läuft die Glykolyse ab?","Im Cytoplasma, ohne Sauerstoff.","Im Cytoplasma","In der Matrix","An der inneren Membran"],
   ["Wo läuft der Citratzyklus ab?","In der Matrix der Mitochondrien.","In der Matrix","Im Zellkern","Im Cytoplasma"],
   ["Wo sitzt die Atmungskette?","An der inneren Mitochondrienmembran.","Innere Membran","Äußere Membran","Matrix"],
   ["Welche Rolle hat Sauerstoff in der Atmungskette?","Er nimmt als Endakzeptor Elektronen und Protonen auf, es entsteht Wasser.","Endakzeptor, es entsteht Wasser","Er liefert Energie","Er wird zu CO₂"],
   ["Welches Enzym bildet die meisten ATP?","Die ATP-Synthase nutzt den Protonengradienten.","ATP-Synthase","Amylase","Helicase"],
   ["Was entsteht bei der alkoholischen Gärung?","Hefen bilden Ethanol und CO₂.","Ethanol und CO₂","Milchsäure","Wasser und CO₂"],
   ["Wie viel ATP bringt die Glykolyse netto pro Glucose?","Netto 2 ATP.","2","30","0"],
   ["Was passiert bei Sauerstoffmangel im Muskel?","Milchsäuregärung: Pyruvat wird zu Laktat, NADH wird regeneriert.","Milchsäuregärung","Alkoholische Gärung","Zellatmung läuft schneller"],
   ["Wo entsteht das CO₂ der Zellatmung?","Bei der oxidativen Decarboxylierung und im Citratzyklus.","Decarboxylierung und Citratzyklus","In der Atmungskette","In der Glykolyse"]],["b12-atp","atpbil"]),

 BT("b12-foto","Fotosynthese im Detail","Lichtreaktion und Calvin-Zyklus",[
  ["Der Chloroplast",`<p>Der Chloroplast hat zwei Hüllmembranen. Innen liegen <b>Thylakoide</b>, gestapelt zu <b>Grana</b>, umgeben vom <b>Stroma</b>.</p>`,"diagramm",{ks:["chloro"]}],
  ["Lichtreaktion (Thylakoidmembran)",`<ol class="rules"><li>Chlorophyll in den <b>Photosystemen</b> II und I absorbiert Licht, Elektronen werden angeregt.</li><li><b>Photolyse:</b> Wasser wird gespalten in <b>O₂</b>, H⁺ und Elektronen. Der Sauerstoff stammt aus dem <b>Wasser</b>, nicht aus dem CO₂.</li><li>Elektronentransportkette pumpt H⁺ in den Thylakoidraum. Die <b>ATP-Synthase</b> bildet <b>ATP</b>.</li><li>Am Photosystem I entsteht <b>NADPH</b>.</li></ol><p>Chlorophyll absorbiert vor allem <b>blaues und rotes</b> Licht, Grün wird zurückgeworfen.</p>`],
  ["Calvin-Zyklus (Stroma)",`<ol class="rules"><li><b>Fixierung:</b> <b>RuBisCO</b> bindet CO₂ an Ribulose-1,5-bisphosphat (RuBP).</li><li><b>Reduktion:</b> Mit ATP und NADPH entsteht Glycerinaldehyd-3-phosphat (G3P).</li><li><b>Regeneration:</b> Aus G3P wird RuBP neu gebildet (ATP). Ein Teil des G3P wird zu Glucose.</li></ol><p>Er läuft nur mit den Produkten der Lichtreaktion, daher bei Nacht nicht lange. <b>C₄-Pflanzen</b> (Mais) und <b>CAM-Pflanzen</b> (Kakteen) haben Anpassungen an Hitze und Trockenheit.</p>`]],
  [["Wo läuft die Lichtreaktion ab?","An den Thylakoidmembranen der Grana.","Thylakoidmembran","Stroma","Zellkern"],
   ["Wo läuft der Calvin-Zyklus ab?","Im Stroma des Chloroplasten.","Im Stroma","Im Thylakoid","In der Vakuole"],
   ["Woher stammt der freigesetzte Sauerstoff?","Aus der Photolyse des Wassers.","Aus Wasser","Aus CO₂","Aus Glucose"],
   ["Was liefert die Lichtreaktion dem Calvin-Zyklus?","ATP und NADPH.","ATP und NADPH","Glucose","CO₂"],
   ["Welches Enzym fixiert CO₂?","RuBisCO bindet CO₂ an RuBP.","RuBisCO","ATP-Synthase","Helicase"],
   ["Welche Lichtfarben absorbiert Chlorophyll vor allem?","Blau und Rot. Grün wird zurückgeworfen.","Blau und Rot","Grün","Gelb"],
   ["Was ist die Photolyse?","Spaltung von Wasser durch Lichtenergie in O₂, Protonen und Elektronen.","Wasserspaltung durch Licht","Spaltung von CO₂","Spaltung von Glucose"],
   ["Wie entsteht der Protonengradient der Lichtreaktion?","Der Elektronentransport pumpt H⁺ in den Thylakoidraum, die ATP-Synthase nutzt den Rückstrom.","Protonen werden in den Thylakoidraum gepumpt","Protonen kommen aus Glucose","Es gibt keinen Gradienten"],
   ["Wozu dient der Calvin-Zyklus?","Er baut mit ATP und NADPH aus CO₂ Zucker auf.","Zuckeraufbau aus CO₂","Wasserspaltung","Sauerstoffbildung"]]),

 BT("b12-pop","Populationsökologie","Faktoren, Wachstum, Beziehungen",[
  ["Umweltfaktoren und Toleranz",`<p><b>Abiotische</b> Faktoren (Licht, Temperatur, Wasser, pH) und <b>biotische</b> (Konkurrenz, Fressfeinde, Parasiten) wirken auf Lebewesen. Die <b>Toleranzkurve</b> zeigt: Zwischen <b>Minimum</b> und <b>Maximum</b> ist Leben möglich, im <b>Optimum</b> am besten, am Rand im <b>Pessimum</b> gerade noch. Der Toleranzbereich ist die <b>ökologische Potenz</b>.</p>`],
  ["Populationswachstum",`<p>Ohne Grenzen wächst eine Population <b>exponentiell</b> (J-Kurve). Real bremsen Nahrung, Platz und Krankheiten: <b>logistisches Wachstum</b> (S-Kurve) nähert sich der <b>Kapazität K</b>. <b>Dichteabhängig</b> wirken Konkurrenz, Krankheiten, Räuber. <b>Dichteunabhängig</b> wirken Frost, Dürre. <b>r-Strategen</b> (Mäuse): viele Nachkommen, wenig Pflege. <b>K-Strategen</b> (Elefanten): wenige Nachkommen, viel Pflege.</p>`,"logistisch"],
  ["Beziehungen zwischen Arten",`<ul class="rules"><li><b>Räuber-Beute:</b> Die Zahlen schwanken periodisch, die Räuberkurve folgt der Beutekurve phasenverschoben (Lotka-Volterra).</li><li><b>Konkurrenzausschlussprinzip:</b> Arten mit gleicher <b>ökologischer Nische</b> können nicht dauerhaft koexistieren.</li><li><b>Symbiose:</b> Vorteil für beide (Knöllchenbakterien, Flechten).</li><li><b>Parasitismus:</b> Vorteil für einen, Schaden für den Wirt.</li></ul>`]],
  [["Was beschreibt die Toleranzkurve?","Wie das Gedeihen vom Umweltfaktor abhängt.","Abhängigkeit vom Umweltfaktor","Die Zahl der Nachkommen","Die Nahrungskette"],

   ["Was sagt das Konkurrenzausschlussprinzip?","Zwei Arten mit gleicher Nische können dauerhaft nicht nebeneinander bestehen.","Gleiche Nische: eine Art verdrängt die andere","Arten ergänzen sich","Es gibt keine Konkurrenz"],
   ["Wie schwanken Räuber und Beute?","Periodisch und phasenverschoben: Die Räuber folgen der Beute.","Periodisch, Räuber folgen der Beute","Parallel","Gar nicht"],

 BT("b12-art","Artbildung","Isolation, Gendrift, Hardy-Weinberg",[
  ["Was ist eine Art?",`<p>Nach dem biologischen Artbegriff bilden Individuen eine Art, die sich untereinander fortpflanzen und <b>fruchtbare Nachkommen</b> haben. Pferd und Esel paaren sich, das Maultier ist aber unfruchtbar: zwei Arten.</p><p>Der <b>Genpool</b> ist die Gesamtheit aller Allele einer Population.</p>`],
  ["Wie entstehen Arten?",`<ul class="rules"><li><b>Allopatrische Artbildung:</b> Eine räumliche Barriere (Gebirge, Meer) trennt Populationen. Sie entwickeln sich getrennt (Mutation, Selektion, <b>Gendrift</b>) und werden fortpflanzungsmäßig isoliert.</li><li><b>Sympatrische Artbildung:</b> ohne räumliche Trennung, zum Beispiel durch ökologische Spezialisierung oder Polyploidie bei Pflanzen.</li><li><b>Gründereffekt:</b> Wenige Individuen besiedeln ein Gebiet, ihr Genpool ist zufällig.</li><li><b>Flaschenhals:</b> Die Population schrumpft stark, viele Allele gehen verloren.</li><li><b>Adaptive Radiation:</b> Aus einer Stammart entstehen schnell viele Arten (Darwinfinken, Buntbarsche).</li></ul>`],
  ["Selektionsformen und Hardy-Weinberg",`<ul class="rules"><li><b>Stabilisierend:</b> Extreme werden benachteiligt.</li><li><b>Transformierend:</b> Ein Extrem wird begünstigt, der Mittelwert verschiebt sich.</li><li><b>Aufspaltend (disruptiv):</b> Beide Extreme werden begünstigt, kann zur Artbildung führen.</li></ul><p class="eq">p + q = 1 und p² + 2pq + q² = 1</p><p>p, q: Häufigkeiten der Allele A, a. p² = AA, 2pq = Aa, q² = aa. Das <b>Hardy-Weinberg-Gleichgewicht</b> gilt nur ohne Mutation, Selektion, Migration, Gendrift und bei Zufallspaarung. Es dient als Vergleichsmodell: Weicht eine Population ab, wirkt Evolution.</p>`]],
  [["Wie definiert man eine biologische Art?","Individuen, die sich fortpflanzen und fruchtbare Nachkommen haben.","Fruchtbare Nachkommen untereinander","Gleiches Aussehen","Gleicher Lebensraum"],
   ["Warum bilden Pferd und Esel keine Art?","Das Maultier ist unfruchtbar.","Das Maultier ist unfruchtbar","Sie sehen verschieden aus","Sie leben getrennt"],
   ["Was ist allopatrische Artbildung?","Räumliche Trennung isoliert Populationen.","Artbildung durch räumliche Trennung","Ohne räumliche Trennung","Durch Zufall im selben Gebiet"],
   ["Was ist der Gründereffekt?","Wenige Individuen besiedeln ein Gebiet, der Genpool ist zufällig klein.","Kleiner Genpool durch wenige Gründer","Mehr Mutationen","Starke Selektion"],
   ["Was ist Gendrift?","Zufällige Änderung der Allelhäufigkeiten, besonders in kleinen Populationen.","Zufällige Allelhäufigkeitsänderung","Gezielte Mutation","Wanderung"],
   ["Was bedeutet adaptive Radiation?","Aus einer Stammart entstehen schnell viele Arten in verschiedenen Nischen.","Viele Arten aus einer Stammart","Aussterben vieler Arten","Rückbildung von Organen"],
   ["Welche Selektion begünstigt beide Extreme?","Aufspaltende (disruptive) Selektion kann zu Artbildung führen.","Aufspaltende Selektion","Stabilisierende Selektion","Transformierende Selektion"],
   ["Was bedeutet Hardy-Weinberg-Gleichgewicht?","Allel- und Genotyphäufigkeiten bleiben konstant, wenn keine Evolutionsfaktoren wirken.","Konstante Häufigkeiten ohne Evolution","Dauernde Veränderung","Aussterben"],
   ["Die Gleichung p² + 2pq + q² = 1 beschreibt …","p² = AA, 2pq = Aa, q² = aa.","Die Genotyphäufigkeiten","Die Allelzahl","Die Mutationsrate"]],["b12-art","hw"]),

 BT("b12-immun","Immunbiologie: Antikörper und Impfung","Spezifische Abwehr im Detail",[
  ["Humorale und zelluläre Abwehr",`<ul class="rules"><li><b>Antigenpräsentation:</b> Fresszellen (Makrophagen, dendritische Zellen) zeigen Bruchstücke des Erregers auf ihrer Oberfläche (MHC).</li><li><b>T-Helferzellen</b> erkennen das und koordinieren die Abwehr.</li><li><b>Humoral:</b> <b>B-Zellen</b> werden aktiviert und vermehren sich zu <b>Plasmazellen</b>, die <b>Antikörper</b> ins Blut abgeben.</li><li><b>Zellulär:</b> <b>Cytotoxische T-Zellen</b> töten infizierte Körperzellen.</li><li><b>Gedächtniszellen</b> bleiben zurück.</li></ul>`],

  [["Welche Zellen bilden Antikörper?","Aus B-Zellen entstehen Plasmazellen, die Antikörper abgeben.","Plasmazellen (aus B-Zellen)","Cytotoxische T-Zellen","Makrophagen"],
   ["Wie ist ein Antikörper aufgebaut?","Y-förmig mit zwei variablen Antigenbindestellen.","Y-förmig, zwei Bindestellen","Kugelförmig ohne Bindestelle","Als DNA-Schleife"],

   ["Was liefert eine mRNA-Impfung?","Die Bauanleitung für ein Antigen, das Körperzellen herstellen.","Bauanleitung für ein Antigen","Abgeschwächte Erreger","Fertige Antikörper"],
   ["Was ist Herdenimmunität?","Hoher Immunanteil schützt auch Ungeimpfte, da der Erreger sich schlecht ausbreitet.","Schutz auch für Ungeimpfte","Alle sind krank","Schutz durch Antibiotika"],
   ["Welche Zellen greift HIV an?","HIV befällt T-Helferzellen.","T-Helferzellen","Rote Blutzellen","Nervenzellen"],
   ["Was ist eine Autoimmunerkrankung?","Das Immunsystem greift körpereigenes Gewebe an.","Angriff auf körpereigenes Gewebe","Schwäche gegen Erreger","Überreaktion auf Pollen"]])

Object.assign(KT,{
 "b12-dna":`<p>Mit Gummibärchen oder Perlen in 4 Farben eine DNA bauen und den Gegenstrang legen. Erdbeer-DNA aus Spülmittel, Salz und Spiritus sichtbar machen. <b>Typischer Fehler:</b> A mit G oder T mit C paaren, oder RNA und DNA vermischen.</p>`,
 "b12-protein":`<p>Eine Codetabelle als Geheimschrift nutzen: mRNA-Karten, Kind „übersetzt“ in Aminosäuren. <b>Typischer Fehler:</b> Transkription und Translation verwechseln, oder die Matrize nicht mit der mRNA gleichsetzen: Sie ist komplementär.</p>`,
 "b12-regul":`<p>Ein Lichtschalter-Bild: Der Repressor ist ein Riegel, der Induktor zieht ihn weg. <b>Typischer Fehler:</b> Der Induktor bindet am Operator. Er bindet den Repressor.</p>`,
 "b12-ap":`<p>Wasserhahn- und Schleusenbild: Ionenkanäle als Tore, die Pumpe als Eimer. Spannung zeichnen und beschriften lassen. <b>Typischer Fehler:</b> Ruhepotenzial als Zustand „ohne Ionenbewegung“. Es ist ein Fließgleichgewicht.</p>`,
 "b12-syn":`<p>Dominosteine als Erregungsleitung, ein Briefkasten als Synapse. Rudern oder Liegestütz: Muskelfasern ziehen, ATP wird verbraucht. <b>Typischer Fehler:</b> Das AP „springt“ über den Spalt. Es wird chemisch übertragen.</p>`,
 "b12-atp":`<p>Wo die Energie herkommt: Brot lange kauen, Sauerteig oder Hefeteig beobachten (Gärung, CO₂). <b>Typischer Fehler:</b> Zellatmung = Atmen. Die Zellatmung ist der Abbau in den Zellen.</p>`,
 "b12-foto":`<p>Wasserpest im Licht und im Dunkeln: Bläschenzählen. Spinatblätter mit Spiritus ausziehen, Farbstoffe per Papierchromatografie trennen. <b>Typischer Fehler:</b> Sauerstoff stamme aus CO₂. Er stammt aus der Wasserspaltung.</p>`,
 "b12-pop":`<p>Mit Hefe in Zuckerlösung oder Linsen auf dem Tisch das Wachstum nachspielen. Beispiele aus dem Garten: Blattläuse, Marienkäfer. <b>Typischer Fehler:</b> Räuber und Beute schwanken gleichzeitig. Die Räuber folgen verzögert.</p>`,
 "b12-art":`<p>Das Gen-Pool-Spiel: Eine Schale bunter Perlen, zufällig ziehen und neu auffüllen. Die Farbanteile driften. <b>Typischer Fehler:</b> „Arten entstehen, weil sie es brauchen.“ Isolation und Zufall sind die Treiber.</p>`,
 "b12-immun":`<p>Mit Schlüsseln und Schlössern die Antikörper-Antigen-Passung zeigen. Impfpass gemeinsam lesen. <b>Typischer Fehler:</b> „Impfen ist eine Mini-Krankheit.“ Es trainiert nur das Gedächtnis.</p>`
});

{const BS=SUBJECTS.find(s=>s.id==="bio");

/* ---------- Chemie: Grunddaten ---------- */
/* Formeln: ch("Fe2O3") → Fe<sub>2</sub>O<sub>3</sub>, ch("Mg^2+") → Mg<sup>2+</sup> */
const ch=s=>String(s).replace(/\^(\d*[+−-])/g,(_,c)=>`<sup>${c.replace("-",MINUS)}</sup>`).replace(/([A-Za-z\)\]])(\d+)/g,"$1<sub>$2</sub>");
/* [Z, Symbol, Name, Atommasse, Hauptgruppe (0 = Nebengruppe), Periode, EN, Massenzahl häufigstes Isotop, Metall?] */
const ELS=[[1,"H","Wasserstoff",1.008,1,1,2.2,1,0],[2,"He","Helium",4.0,8,1,null,4,0],[3,"Li","Lithium",6.9,1,2,1.0,7,1],[4,"Be","Beryllium",9.0,2,2,1.6,9,1],[5,"B","Bor",10.8,3,2,2.0,11,0],[6,"C","Kohlenstoff",12.0,4,2,2.6,12,0],[7,"N","Stickstoff",14.0,5,2,3.0,14,0],[8,"O","Sauerstoff",16.0,6,2,3.4,16,0],[9,"F","Fluor",19.0,7,2,4.0,19,0],[10,"Ne","Neon",20.2,8,2,null,20,0],
  [11,"Na","Natrium",23.0,1,3,.9,23,1],[12,"Mg","Magnesium",24.3,2,3,1.3,24,1],[13,"Al","Aluminium",27.0,3,3,1.6,27,1],[14,"Si","Silicium",28.1,4,3,1.9,28,0],[15,"P","Phosphor",31.0,5,3,2.2,31,0],[16,"S","Schwefel",32.1,6,3,2.6,32,0],[17,"Cl","Chlor",35.5,7,3,3.2,35,0],[18,"Ar","Argon",39.9,8,3,null,40,0],[19,"K","Kalium",39.1,1,4,.8,39,1],[20,"Ca","Calcium",40.1,2,4,1.0,40,1],[35,"Br","Brom",79.9,7,4,3.0,79,0]];
const EL=Object.fromEntries(ELS.map(e=>[e[1],{z:e[0],sym:e[1],name:e[2],m:e[3],g:e[4],p:e[5],en:e[6],A:e[7],metal:!!e[8]}]));
const shellsOf=z=>{const caps=[2,8,8,18],r=[];let left=z;for(const c of caps){if(left<=0)break;const k=Math.min(c,left);r.push(k);left-=k}return r};
const GRP={1:"Alkalimetalle",2:"Erdalkalimetalle",3:"Borgruppe",4:"Kohlenstoffgruppe",5:"Stickstoffgruppe",6:"Chalkogene (Sauerstoffgruppe)",7:"Halogene",8:"Edelgase"};
const MM={H:1,C:12,N:14,O:16,Na:23,Mg:24,Al:27,S:32,Cl:35.5,K:39,Ca:40,Fe:56,Cu:63.5};
function atomsOf(f){const out={},re=/([A-Z][a-z]?)(\d*)|\(([^)]+)\)(\d+)/g;let m;
  while((m=re.exec(f))){if(m[1]){out[m[1]]=(out[m[1]]||0)+(+m[2]||1)}else{const inner=atomsOf(m[3]);for(const k in inner)out[k]=(out[k]||0)+inner[k]*(+m[4])}}return out}
const molMass=f=>{const a=atomsOf(f);return Object.entries(a).reduce((s,[k,n])=>s+MM[k]*n,0)};
const cvar=(n,el=document.documentElement)=>{try{return getComputedStyle(el).getPropertyValue(n).trim()||"#888"}catch(e){return"#888"}};
const GEN_NAMES_CH={};

/* ---------- Chemie: Zahlenaufgaben ---------- */
Object.assign(G,{
  c_atom(){const e=EL[pick(Object.keys(EL).filter(k=>EL[k].z<=20))],t=ri(0,3);
    if(t===0)return{q:`Wie viele <b>Protonen</b> hat ein ${e.name}-Atom (${e.sym})?`,kind:"num",ans:R(e.z),sol:`Die Ordnungszahl im Periodensystem ist die Protonenzahl: ${e.sym} steht an Platz ${e.z}, also <b>${e.z} Protonen</b>. Ein neutrales Atom hat genauso viele Elektronen.`};
    if(t===1)return{q:`Ein ${e.name}-Atom hat die Massenzahl ${e.A}. Wie viele <b>Neutronen</b> hat es?`,kind:"num",ans:R(e.A-e.z),sol:`Neutronen = Massenzahl ${MINUS} Protonen = ${e.A} ${MINUS} ${e.z} = <b>${e.A-e.z}</b>. Die Massenzahl zählt alle Teilchen im Kern.`};
    if(t===2){const sh=shellsOf(e.z);return{q:`Wie viele Elektronen hat ${e.name} (${e.sym}) auf der <b>äußersten Schale</b>?`,kind:"num",ans:R(sh[sh.length-1]),sol:`${e.z} Elektronen verteilen sich auf die Schalen: ${sh.join(", ")}. Außen sind <b>${sh[sh.length-1]}</b>.${e.g?` Das passt zur ${e.g}. Hauptgruppe: Die Gruppennummer ist die Zahl der Außenelektronen${e.g===8&&e.z===2?" (Ausnahme Helium: 2)":""}.`:""}`}}
    const sh=shellsOf(e.z);return{q:`Wie viele <b>Elektronenschalen</b> hat ein ${e.name}-Atom (${e.sym})?`,kind:"num",ans:R(sh.length),sol:`${e.sym} steht in der ${e.p}. Periode (Zeile). Die Periode ist die Zahl der Schalen: <b>${sh.length}</b> (${sh.join(", ")}).`}},
  c_ion(){const e=EL[pick(["Li","Na","K","Mg","Ca","Al","O","S","F","Cl","N","Br"])],c=e.g<=3?e.g:e.g-8;
    return{q:`Welche <b>Ladung</b> hat das Ion, das ${e.name} (${e.sym}) bildet?<p class="muted small">Als Zahl mit Vorzeichen, z. B. +2 oder ${MINUS}1.</p>`,kind:"num",ans:R(c),
      sol:`${e.sym} hat ${e.g} Außenelektron${e.g>1?"en":""}. ${c>0?`Als Metall gibt es ${c} ab, so ist die Schale darunter voll. Ion: <b>${ch(e.sym+"^"+(c>1?c:"")+"+")}</b>.`:`Als Nichtmetall nimmt es ${-c} auf, bis 8 außen sind (Edelgaskonfiguration). Ion: <b>${ch(e.sym+"^"+(c<-1?-c:"")+"-")}</b>.`}`}},
  c_salz(){const M=pick(["Na","K","Mg","Ca","Al","Li"]),X=pick(["Cl","O","S","F","Br","N"]),m=EL[M],x=EL[X],cm=m.g,cx=8-x.g,L=lcm(cm,cx),a=L/cm,b=L/cx;
    const f=`${M}${a>1?a:""}${X}${b>1?b:""}`,wrong=[`${M}${X}`,`${M}${b>1?b:""}${X}${a>1?a:""}`,`${M}${cm>1?cm:""}${X}${cx>1?cx:""}`,`${M}${a+1}${X}`].filter(w=>w!==f);
    const opts=shuffle([f,...shuffle([...new Set(wrong)]).slice(0,3)]);
    return{q:`Welche Formel hat das Salz aus <b>${m.name}</b> und <b>${x.name}</b>?`,kind:"choice",opts:opts.map(ch),correct:opts.indexOf(f),
      sol:`Ionen: ${ch(M+"^"+(cm>1?cm:"")+"+")} und ${ch(X+"^"+(cx>1?cx:"")+"-")}. Die Ladungen müssen sich aufheben: kgV(${cm}, ${cx}) = ${L}. Also ${a}× ${M} (${a} · ${cm}+ = ${L}+) und ${b}× ${X} (${b} · ${cx}${MINUS} = ${L}${MINUS}): <b>${ch(f)}</b>.`}},
  c_ausgl(){const [L,Rr]=pick(REAKTIONEN),all=[...L,...Rr],i=ri(0,all.length-1),show=(side,off)=>side.map((x,k)=>`${off+k===i?"<b class='blank'>?</b>":x[0]>1?x[0]:""} ${ch(x[1])}`).join(" + ");
    return{q:`Gleiche die Reaktionsgleichung aus. Welche Zahl gehört an die Stelle mit dem Fragezeichen?<div class="eq">${show(L,0)} → ${show(Rr,L.length)}</div>`,kind:"num",ans:R(all[i][0]),
      sol:`Ausgeglichen: ${L.map(x=>(x[0]>1?x[0]+" ":"")+ch(x[1])).join(" + ")} → ${Rr.map(x=>(x[0]>1?x[0]+" ":"")+ch(x[1])).join(" + ")}. Links und rechts muss von jeder Atomsorte gleich viel stehen: ${Object.entries(sideAtoms(L)).map(([k,n])=>`${n} ${k}`).join(", ")}. Nur die Zahlen <b>vor</b> den Formeln dürfen geändert werden, nie die kleinen Zahlen in der Formel.`}},
  c_molmasse(){const f=pick(["H2O","CO2","NaCl","O2","NH3","CH4","H2SO4","CaCO3","NaOH","HCl","C6H12O6","MgO","Fe2O3","C2H5OH","Al2O3","CuSO4"]),a=atomsOf(f),M=molMass(f);
    return{q:`Berechne die molare Masse von <b>${ch(f)}</b>.<p class="muted small">Atommassen: ${Object.keys(a).map(k=>`${k} = ${fmt(MM[k])}`).join(", ")} g/mol</p>${unit("g/mol")}`,kind:"num",ans:R(Math.round(M*10),10),tol:.06,
      sol:`Alle Atome zusammenzählen: ${Object.entries(a).map(([k,n])=>`${n} · ${fmt(MM[k])}`).join(" + ")} = <b>${fmt(M)} g/mol</b>.`}},
  c_mol(){const f=pick(["H2O","CO2","NaCl","O2","CH4","NaOH","CaCO3","MgO"]),M=molMass(f),t=ri(0,2);
    if(t===0){const n=pick([.1,.2,.25,.5,1,2,3]),m=n*M;return{q:`Wie viel Stoffmenge sind <b>${fmt(m)} g</b> ${ch(f)}? (M = ${fmt(M)} g/mol)${unit("mol")}`,kind:"num",ans:R(Math.round(n*1000),1000),tol:.006,sol:`n = m : M = ${fmt(m)} g : ${fmt(M)} g/mol = <b>${fmt(n)} mol</b>.`}}
    if(t===1){const n=pick([.1,.2,.5,1.5,2,4]);return{q:`Welche Masse haben <b>${fmt(n)} mol</b> ${ch(f)}? (M = ${fmt(M)} g/mol)${unit("g")}`,kind:"num",ans:R(Math.round(n*M*10),10),tol:.06,sol:`m = n · M = ${fmt(n)} mol · ${fmt(M)} g/mol = <b>${fmt(n*M)} g</b>.`}}
    const n=pick([.05,.1,.2,.5,1]),V=pick([.25,.5,1,2]);return{q:`${fmt(n)} mol Salz werden zu ${fmt(V)} l Lösung aufgefüllt. Wie groß ist die Konzentration?${unit("mol/l")}`,kind:"num",ans:R(Math.round(n/V*1000),1000),tol:.006,sol:`c = n : V = ${fmt(n)} mol : ${fmt(V)} l = <b>${fmt(n/V)} mol/l</b>.`}},
  c_massenanteil(){const s=pick([5,10,20,25,30,50]),w=pick([45,80,95,100,150,170,200,250]);const t=s+w,p=s/t*100;if(Math.abs(p*10-Math.round(p*10))>1e-9)return G.c_massenanteil();

  c_zustand(){const st=pick([["Wasser",0,100],["Ethanol (Alkohol)",-114,78],["Kochsalz",801,1465],["Eisen",1538,2862],["Sauerstoff",-218,-183],["Quecksilber",-39,357],["Butan (Feuerzeuggas)",-138,-1],["Kerzenwachs",60,350],["Zinn",232,2602]]),T=pick([-50,-20,0,20,25,80,150,500,1000]);

  c_titration(){const Vs=pick([10,20,25,50]),cs=pick([.1,.2,.5]),Vb=pick([10,12.5,20,25,40]),cb=cs*Vs/Vb;if(Math.abs(cb*1000-Math.round(cb*1000))>1e-6)return G.c_titration();

  c_oxzahl(){const [f,el,v,how]=pick([["SO2","S",4,"O zählt −2, zwei O: −4. Gesamt 0, also S = +4"],["H2SO4","S",6,"H +1 (zweimal: +2), O −2 (viermal: −8). +2 + S − 8 = 0 → S = +6"],["CO2","C",4,"zwei O: −4, also C = +4"],["CH4","C",-4,"vier H: +4, also C = −4"],["NH3","N",-3,"drei H: +3, also N = −3"],["HNO3","N",5,"H +1, drei O −6: +1 + N − 6 = 0 → N = +5"],["Fe2O3","Fe",3,"drei O: −6, auf zwei Fe verteilt: je +3"],["FeO","Fe",2,"ein O: −2, also Fe = +2"],["HCl","Cl",-1,"H +1, also Cl = −1"],["Cl2","Cl",0,"Elemente haben immer die Oxidationszahl 0"],["MnO4^-","Mn",7,"vier O: −8, Gesamtladung −1: Mn − 8 = −1 → Mn = +7"],["H2O2","O",-1,"zwei H: +2, auf zwei O verteilt: je −1 (Ausnahme Peroxid)"],["CuO","Cu",2,"ein O: −2, also Cu = +2"],["Na","Na",0,"reines Element: 0"]]);

  c_mwg(){const A=pick([.1,.2,.5,1]),B=pick([.1,.2,.5,1]),C=pick([.2,.4,.5,1,2]),D=pick([.2,.4,.5,1]),K=C*D/(A*B);

  c_rgt(){const d=pick([10,20,30,40]);return{q:`Faustregel (RGT-Regel): 10 °C mehr verdoppeln die Reaktionsgeschwindigkeit. Wie viel schneller läuft eine Reaktion, wenn man um ${d} °C erwärmt?${unit("fach")}`,kind:"num",ans:R(2**(d/10)),sol:`${d/10}-mal verdoppeln: 2<sup>${d/10}</sup> = <b>${2**(d/10)}</b>-fach. Darum hält der Kühlschrank Lebensmittel länger frisch.`}},
  c_puffer(){const pk=pick([[4.76,"Essigsäure/Acetat"],[6.35,"Kohlensäure/Hydrogencarbonat"],[7.2,"Dihydrogenphosphat/Hydrogenphosphat"],[9.25,"Ammonium/Ammoniak"]]),r=pick([[1,1],[10,1],[1,10]]),ph=pk[0]+Math.log10(r[0]/r[1]);

/* Teilchenmodell: Wasser bei verschiedenen Temperaturen */
WIDGETS.teilchen=function(el){const w=wid("tm");
  el.innerHTML=`<div class="wg"><div class="wg-vis"><canvas id="${w}-c" width="300" height="200" style="width:100%;max-width:300px;border-radius:8px;border:1px solid var(--line);background:var(--surface)" role="img" aria-label="Wasserteilchen im Teilchenmodell"></canvas></div><div class="wg-ctl">${slider(w,"Temperatur",-40,140,20,5)}</div><p class="wg-out" id="${w}-t"></p></div>`;
  const cv=el.querySelector("#"+w+"-c"),cx=cv.getContext("2d"),Sl=el.querySelector("#"+w),N=36,P=[];
  for(let i=0;i<N;i++){const gx=i%6,gy=Math.floor(i/6);P.push({hx:90+gx*24,hy:62+gy*22,x:90+gx*24,y:62+gy*22,vx:Math.random()-.5,vy:Math.random()-.5})}
  const txt=()=>{const T=+Sl.value;el.querySelector("#"+w+"-v").textContent=T+" °C";
    el.querySelector("#"+w+"-t").innerHTML=T<0?"<b>Fest (Eis):</b> Die Teilchen sitzen auf festen Plätzen und zittern nur. Sie halten sich gegenseitig fest.":T<100?"<b>Flüssig:</b> Die Teilchen sind noch dicht beieinander, können aber aneinander vorbeigleiten. Darum fließt Wasser.":"<b>Gasförmig (Wasserdampf):</b> Die Teilchen fliegen schnell und weit voneinander entfernt durch den ganzen Raum."};
  txt();Sl.oninput=txt;
  const still=reduceMotion();let last=0;
  const frame=t=>{if(!cv.isConnected)return;const T=+Sl.value,state=T<0?0:T<100?1:2,sp=.4+Math.max(0,T+40)/45;
    const ac=cvar("--accent"),ink=cvar("--ink");cx.clearRect(0,0,300,200);
    P.forEach(p=>{if(state===0){p.x+=(p.hx-p.x)*.2+(Math.random()-.5)*sp*.6;p.y+=(p.hy-p.y)*.2+(Math.random()-.5)*sp*.6}
      else{p.vx+=(Math.random()-.5)*.3*sp;p.vy+=(Math.random()-.5)*.3*sp+(state===1?.12:0);const lim=state===1?1.2*sp:2.2*sp,m=Math.hypot(p.vx,p.vy);if(m>lim){p.vx*=lim/m;p.vy*=lim/m}
        p.x+=p.vx;p.y+=p.vy;const top=state===1?110:8;if(p.x<8||p.x>292){p.vx*=-1;p.x=Math.max(8,Math.min(292,p.x))}if(p.y<top){p.vy=Math.abs(p.vy);p.y=top}if(p.y>192){p.vy=-Math.abs(p.vy);p.y=192}}
      if(state===1){for(const q of P){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<15&&d>0){p.x-=dx/d*.6;p.y-=dy/d*.6}}}
      cx.beginPath();cx.arc(p.x,p.y,7,0,7);cx.fillStyle=ac;cx.fill();cx.strokeStyle=ink;cx.lineWidth=1;cx.stroke()});
    
    if(!still)requestAnimationFrame(frame)};
  requestAnimationFrame(frame);if(still)Sl.addEventListener("input",()=>{for(let i=0;i<60;i++)frame(0)})};

    el.querySelector("#"+w+"-t").innerHTML=`<b style="font-size:1.15rem">${e.name} (${e.sym})</b><br>Ordnungszahl ${e.z}: <b>${e.z} Protonen</b>, ${e.z} Elektronen, ${e.A-e.z} Neutronen (Massenzahl ${e.A})<br>Schalen: ${sh.join(" · ")} → <b>${sh[sh.length-1]} Außenelektron${sh[sh.length-1]>1?"en":""}</b> (gelb)<br>${e.p}. Periode, ${e.g}. Hauptgruppe: ${GRP[e.g]}<br>${e.metal?"Metall":e.g===8?"Edelgas":"Nichtmetall"}${e.en?`, Elektronegativität ${fmt(e.en)}`:""}`};

/* Chemisches Gleichgewicht: A ⇌ B */
WIDGETS.gleichgewicht=function(el){const w=wid("gg");let A=100,B=0,hist=[];
  el.innerHTML=`<div class="wg"><div class="wg-vis wide" id="${w}-o"></div><div class="wg-ctl">${slider(w,"Temperatur (verschiebt K)",1,5,3,1)}</div><div class="row"><button class="btn small" type="button" data-a="addA">A zugeben</button><button class="btn small" type="button" data-a="remB">B entfernen</button><button class="btn ghost small" type="button" data-a="reset">Neu starten</button></div><p class="wg-out" id="${w}-t"></p></div>`;
  const Sl=el.querySelector("#"+w),K=()=>[.25,.5,1,2,4][+Sl.value-1];
  const run=n=>{for(let i=0;i<n;i++){const kh=.04,kr=kh/K(),d=kh*A-kr*B;A-=d;B+=d;hist.push([A,B]);if(hist.length>160)hist.shift()}};
  const draw=()=>{const pl=plot({xmin:0,xmax:160,ymin:0,ymax:Math.max(110,...hist.map(h=>h[0]+h[1]))*1.02,w:300,h:170,step:20,labels:false});
    const pA=hist.map((h,i)=>`${i?"L":"M"}${pl.X(i).toFixed(1)},${pl.Y(h[0]).toFixed(1)}`).join(""),pB=hist.map((h,i)=>`${i?"L":"M"}${pl.X(i).toFixed(1)},${pl.Y(h[1]).toFixed(1)}`).join("");
    el.querySelector("#"+w+"-o").innerHTML=pl.wrap(`<path d="${pA}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="${pB}" fill="none" stroke="var(--s-chemie)" stroke-width="2.5"/>`);
    el.querySelector("#"+w+"-v").textContent=`K = ${fmt(K())}`;
    el.querySelector("#"+w+"-t").innerHTML=`<span style="color:var(--accent);font-weight:700">A: ${fmt(Math.round(A))}</span> &nbsp; <span style="color:var(--s-chemie);font-weight:700">B: ${fmt(Math.round(B))}</span> &nbsp; B : A = ${fmt(Math.round(B/Math.max(A,.01)*100)/100)}<br>Die Hinreaktion (A → B) und die Rückreaktion (B → A) laufen ständig. Im <b>Gleichgewicht</b> sind beide gleich schnell, die Mengen ändern sich nicht mehr. Wird A zugegeben oder B entfernt, weicht das System aus und bildet neues B (<b>Prinzip von Le Chatelier</b>).`};
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==="addA")A+=50;if(a==="remB")B*=.4;if(a==="reset"){A=100;B=0;hist=[]}run(a==="reset"?1:0);draw()});
  Sl.oninput=draw;run(1);draw();
  const still=reduceMotion();const tick=()=>{if(!el.isConnected)return;run(still?40:1);draw();if(!still)setTimeout(tick,60)};if(still){run(150);draw()}else setTimeout(tick,60)};

  Tt.oninput=()=>{upd();mk()};Nn.oninput=()=>{upd();mk()};Kk.onchange=mk;upd();mk();
  const frame=()=>{if(!cv.isConnected)return;const T=+Tt.value,sp=.6+T*.7,Ea=Kk.checked?.35:.75;cx.clearRect(0,0,300,180);
    P.forEach(p=>{p.x+=Math.cos(p.a)*sp;p.y+=Math.sin(p.a)*sp;if(p.x<8||p.x>292)p.a=Math.PI-p.a;if(p.y<8||p.y>172)p.a=-p.a;p.x=Math.max(8,Math.min(292,p.x));p.y=Math.max(8,Math.min(172,p.y))});
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const p=P[i],q=P[j];if(p.done||q.done||p.t===q.t)continue;if(Math.hypot(p.x-q.x,p.y-q.y)<14){const e=Math.random()*T/3;
      if(e>Ea){p.done=q.done=true;products++;hits.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2,ok:1,life:20})}else{hits.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2,ok:0,life:10});const tmp=p.a;p.a=q.a;q.a=tmp}}}
    P.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,6,0,7);cx.fillStyle=p.done?cvar("--signal"):p.t?cvar("--accent"):cvar("--s-chemie");cx.fill()});
    hits=hits.filter(h=>{cx.beginPath();cx.arc(h.x,h.y,h.ok?14:9,0,7);cx.strokeStyle=h.ok?cvar("--signal"):cvar("--muted");cx.lineWidth=2;cx.stroke();return--h.life>0});
    const sec=Math.max(1,(performance.now()-t0)/1000);
    el.querySelector("#"+w+"-t").innerHTML=`Rosa und Grün reagieren nur, wenn sie <b>schnell genug</b> zusammenstoßen (Aktivierungsenergie). Gelb: neues Produkt. Bisher <b>${products}</b> Reaktionen in ${Math.round(sec)} s. Wärmer: mehr und heftigere Stöße. Mehr Teilchen: mehr Stöße. Katalysator: Die nötige Energie sinkt.`;
    if(P.every(p=>p.done||P.filter(q=>!q.done&&q.t!==p.t).length===0)&&sec>2)mk();
    if(!reduceMotion())requestAnimationFrame(frame)};
  requestAnimationFrame(frame)};

WIDGETS.zelle=function(el){const w=wid("ze");let a="Zn",b="Cu";const M=Object.keys(POT);
  el.innerHTML=`<div class="wg"><div class="grid2"><label for="${w}a">Linke Halbzelle<select id="${w}a" class="field">${M.map(m=>`<option value="${m}">${POT[m][1]} (${fmt(POT[m][0])} V)</option>`).join("")}</select></label><label for="${w}b">Rechte Halbzelle<select id="${w}b" class="field">${M.map(m=>`<option value="${m}">${POT[m][1]} (${fmt(POT[m][0])} V)</option>`).join("")}</select></label></div><div class="wg-vis wide" id="${w}-o"></div><p class="wg-out" id="${w}-t"></p></div>`;
  const sa=el.querySelector("#"+w+"a"),sb=el.querySelector("#"+w+"b");sa.value=a;sb.value=b;
  const draw=()=>{a=sa.value;b=sb.value;const U=Math.abs(POT[a][0]-POT[b][0]),leftAnode=POT[a][0]<POT[b][0];
    const beaker=(x,m,an)=>`<rect x="${x}" y="70" width="100" height="80" rx="6" fill="var(--s-mathe)" fill-opacity=".15" stroke="var(--ink)" stroke-width="1.5"/><rect x="${x+42}" y="40" width="16" height="95" fill="${an?"var(--muted)":"var(--s-physik)"}" stroke="var(--ink)"/><text x="${x+50}" y="168" text-anchor="middle" font-size="12" font-weight="700" font-family="var(--f-mono)" fill="var(--ink)">${m} · ${a===b?"":an?"Anode (−)":"Kathode (+)"}</text><text x="${x+50}" y="125" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--ink)">${m}²⁺</text>`.replace(`${m}²⁺`,m==="Ag"?"Ag⁺":m+"²⁺");
    let arrow="";if(a!==b){const dir=leftAnode?1:-1,x1=leftAnode?100:220,x2=leftAnode?220:100;arrow=`<path d="M${x1},38 L${x2},38" stroke="var(--signal)" stroke-width="3" marker-end="url(#${w}ar)"/><text x="160" y="52" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--ink)">Elektronen e⁻</text>`}
    el.querySelector("#"+w+"-o").innerHTML=`<svg viewBox="0 0 320 175" width="100%" style="max-width:340px" role="img" aria-label="Galvanische Zelle"><defs><marker id="${w}ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--signal)"/></marker></defs><path d="M58,40 V22 H262 V40" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="160" cy="22" r="13" fill="var(--surface)" stroke="var(--ink)"/><text x="160" y="26" text-anchor="middle" font-size="10" font-weight="700" font-family="var(--f-mono)" fill="var(--ink)">${fmt(Math.round(U*100)/100)}V</text>${arrow}<path d="M90,85 V60 H230 V85" fill="none" stroke="var(--muted)" stroke-width="8" stroke-linecap="round" opacity=".5"/>${beaker(8,a,leftAnode)}${beaker(212,b,!leftAnode)}</svg>`;
    const an=leftAnode?a:b,ka=leftAnode?b:a;
    el.querySelector("#"+w+"-t").innerHTML=a===b?"Gleiche Metalle: keine Spannung. Erst zwei verschieden edle Metalle treiben Elektronen an.":`<b>${POT[an][1]}</b> ist unedler und gibt Elektronen ab (Oxidation an der Anode: ${an} → ${an==="Ag"?"Ag⁺ + e⁻":an+"²⁺ + 2 e⁻"}). Die Elektronen fließen durch den Draht zum <b>${POT[ka][1]}</b>. Dort nehmen Metall-Ionen sie auf (Reduktion an der Kathode). Spannung: ${fmt(POT[ka][0])} ${MINUS} ${P(POT[an][0])} = <b>${fmt(Math.round(U*100)/100)} V</b>. Die Salzbrücke (grau) schließt den Stromkreis.`};
  sa.onchange=sb.onchange=draw;draw()};

const CH78=[
 BT("c-stoffe","Stoffe und ihre Eigenschaften","Woran man Stoffe erkennt",[
  ["Alles ist aus Stoffen",`<p>Chemie ist die Lehre von den <b>Stoffen</b> und wie sie sich verwandeln. Ein Stoff ist das Material, aus dem etwas besteht: Ein Löffel ist ein Gegenstand, <b>Edelstahl</b> ist sein Stoff. Ein Plastiklöffel hat dieselbe Form, aber einen anderen Stoff.</p><p>Stoffe erkennt man an ihren <b>Eigenschaften</b>, wie ein Detektiv an Spuren:</p><ul class="rules"><li>Farbe, Geruch, Glanz (nur riechen durch Zufächeln!)</li><li>Härte, Verformbarkeit</li><li>Löslichkeit in Wasser</li><li>elektrische Leitfähigkeit, Wärmeleitfähigkeit</li><li>Dichte (schwimmt oder sinkt)</li><li><b>Schmelz- und Siedetemperatur</b>: der Fingerabdruck eines Stoffes</li></ul>`],
  ["Die drei Aggregatzustände",`<p>Jeder Stoff kann <b>fest</b>, <b>flüssig</b> oder <b>gasförmig</b> sein. Das hängt von der Temperatur ab. Im <b>Teilchenmodell</b> stellt man sich vor: Alles besteht aus winzigen Teilchen, die sich bewegen. Je wärmer, desto schneller.</p>`,"teilchen"],
  ["Übergänge haben Namen",`<table class="tbl"><tr><th>von → nach</th><th>Name</th></tr><tr><td>fest → flüssig</td><td>schmelzen</td></tr><tr><td>flüssig → fest</td><td>erstarren</td></tr><tr><td>flüssig → gasförmig</td><td>verdampfen (sieden)</td></tr><tr><td>gasförmig → flüssig</td><td>kondensieren</td></tr><tr><td>fest → gasförmig</td><td>sublimieren</td></tr><tr><td>gasförmig → fest</td><td>resublimieren</td></tr></table><p class="tip">Beim Schmelzen und Sieden ändert sich nur die Anordnung der Teilchen, <b>nicht der Stoff</b>. Eis, Wasser und Dampf sind alles Wasser. Das ist noch keine chemische Reaktion.</p>`]],
  [["Was ist ein Stoff?","Der Stoff ist das Material, nicht der Gegenstand. Ein Glas und eine Flasche können aus demselben Stoff sein.","Das Material, aus dem ein Gegenstand besteht","Ein Gegenstand mit bestimmter Form","Alles, was flüssig ist"],
   ["Welche Eigenschaft ist am besten geeignet, einen Stoff eindeutig zu bestimmen?","Farbe oder Form haben viele Stoffe gemeinsam. Schmelz- und Siedetemperatur sind für jeden Reinstoff typisch.","Schmelz- und Siedetemperatur","Die Farbe","Die Form","Das Gewicht"],
   ["Wie nennt man den Übergang von gasförmig zu flüssig?","Wasserdampf kondensiert zum Beispiel an einem kalten Badezimmerspiegel.","Kondensieren","Verdampfen","Erstarren","Sublimieren"],
   ["Was passiert im Teilchenmodell beim Erwärmen?","Wärme ist Bewegungsenergie der Teilchen. Die Teilchen selbst werden nicht größer.","Die Teilchen bewegen sich schneller","Die Teilchen werden größer","Es entstehen neue Teilchen","Die Teilchen werden schwerer"],
   ["Wie riecht man in der Chemie sicher an einem Stoff?","Nie direkt die Nase drüber halten. Mit der Hand die Luft zufächeln.","Mit der Hand vorsichtig Luft zufächeln","Tief einatmen direkt über dem Glas","Gar nicht, Chemiker riechen nie","Mit der Zunge prüfen"],
   ["Warum leiten Metalle elektrischen Strom?","In Metallen gibt es frei bewegliche Elektronen. Sie wandern durch den Draht.","Sie haben frei bewegliche Elektronen","Sie sind schwer","Sie glänzen","Sie sind kalt"],
   ["Trockeneis (festes CO₂) wird direkt zu Gas, ohne flüssig zu werden. Wie heißt das?","Direkt von fest nach gasförmig heißt sublimieren. Auch Schnee kann in trockener, kalter Luft sublimieren.","Sublimieren","Schmelzen","Kondensieren","Verdunsten"]],["c_zustand"]),

 BT("c-gemische","Reinstoffe und Gemische","Lösung, Suspension, Emulsion, Legierung",[
  ["Rein oder gemischt?",`<p>Ein <b>Reinstoff</b> besteht nur aus einer Sorte Teilchen: destilliertes Wasser, reines Gold, Zucker. Er hat feste Eigenschaften, etwa eine genaue Siedetemperatur.</p><p>Ein <b>Gemisch</b> besteht aus mehreren Stoffen, die nur vermischt, aber nicht verbunden sind. Fast alles im Alltag ist ein Gemisch: Luft, Leitungswasser, Milch, Beton.</p><p>Man unterscheidet:</p><ul class="rules"><li><b>homogen</b> (einheitlich): Man sieht die Bestandteile auch mit Lupe nicht. Beispiel: Salzwasser.</li><li><b>heterogen</b> (uneinheitlich): Man sieht die Bestandteile. Beispiel: Müsli, Orangensaft mit Fruchtfleisch.</li></ul>`],
  ["Die Gemischarten",`<table class="tbl"><tr><th>Name</th><th>Was mit was?</th><th>Beispiel</th></tr><tr><td>Lösung</td><td>fest oder gasförmig in flüssig, unsichtbar</td><td>Salzwasser, Sprudel</td></tr><tr><td>Suspension</td><td>fest in flüssig, sichtbar</td><td>Schlammwasser, O-Saft</td></tr><tr><td>Emulsion</td><td>flüssig in flüssig</td><td>Milch, Mayonnaise</td></tr><tr><td>Legierung</td><td>Metall in Metall</td><td>Messing, Bronze, Stahl</td></tr><tr><td>Gemenge</td><td>fest in fest</td><td>Sand, Müsli</td></tr><tr><td>Rauch</td><td>fest in gasförmig</td><td>Ruß in Luft</td></tr><tr><td>Nebel</td><td>flüssig in gasförmig</td><td>Wolken, Deospray</td></tr><tr><td>Schaum</td><td>gasförmig in flüssig</td><td>Seifenschaum, Sahne</td></tr></table>`],
  ["Konzentration",`<p>Wie viel gelöst ist, gibt man oft als <b>Massenanteil</b> an: Masse des gelösten Stoffes durch Masse der ganzen Lösung.</p><p class="eq">10 g Salz + 90 g Wasser = 100 g Lösung → 10 %</p><p class="warn">Durch die ganze Lösung teilen, nicht nur durch das Wasser!</p>`]],
  [["Ist Leitungswasser ein Reinstoff?","Leitungswasser enthält gelöste Mineralstoffe (Kalk, Salze). Es ist eine homogene Lösung. Nur destilliertes Wasser ist ein Reinstoff.","Nein, ein Gemisch (Lösung)","Ja, ein Reinstoff","Nein, eine Suspension"],
