const CH1112=[
 BT("c-gg","Chemisches Gleichgewicht","Hin- und Rückreaktion, Le Chatelier",[
  ["Reaktionen in beide Richtungen",`<p>Viele Reaktionen laufen nicht vollständig ab, sondern auch <b>rückwärts</b>. Man schreibt einen Doppelpfeil: A + B ⇌ C + D.</p><p>Am Anfang läuft vor allem die Hinreaktion. Je mehr Produkte entstehen, desto schneller läuft die Rückreaktion. Irgendwann sind beide gleich schnell: <b>chemisches Gleichgewicht</b>. Es sieht aus, als stünde alles still, aber auf Teilchenebene geht es ständig hin und her (<b>dynamisches Gleichgewicht</b>).</p>`,"gleichgewicht"],
  ["Massenwirkungsgesetz",`<p>Im Gleichgewicht ist das Verhältnis von Produkten zu Edukten bei fester Temperatur immer gleich:</p><p class="eq">K = (c(C) · c(D)) : (c(A) · c(B))</p><p>Großes K (> 1): Das Gleichgewicht liegt auf der Seite der Produkte. Kleines K: bei den Edukten. Kommen Teilchen mehrfach vor (2 A), wird die Konzentration hoch 2 genommen.</p>`],
  ["Das Prinzip von Le Chatelier",`<p>Stört man ein Gleichgewicht, <b>weicht es dem Zwang aus</b>:</p><ul class="rules"><li><b>Konzentration:</b> Edukt zugeben oder Produkt entfernen → mehr Produkt entsteht.</li><li><b>Temperatur:</b> Erwärmen begünstigt die endotherme Richtung, Kühlen die exotherme.</li><li><b>Druck:</b> Druck erhöhen begünstigt die Seite mit weniger Gasteilchen.</li></ul><p class="tip">Haber-Bosch-Verfahren: N₂ + 3 H₂ ⇌ 2 NH₃ (exotherm). Hoher Druck hilft (4 Gasteilchen → 2). Ammoniak ist der Grundstoff für Kunstdünger, der heute die Hälfte der Menschheit ernährt.</p>`]],
  [["Was ist im chemischen Gleichgewicht gleich?","Die Geschwindigkeit von Hin- und Rückreaktion. Die Konzentrationen sind konstant, aber meist nicht gleich groß.","Die Geschwindigkeiten von Hin- und Rückreaktion","Die Konzentrationen aller Stoffe","Die Massen der Stoffe","Die Temperaturen"],
   ["Warum heißt das Gleichgewicht dynamisch?","Hin- und Rückreaktion laufen weiter, nur gleich schnell.","Hin- und Rückreaktion laufen ständig weiter","Es ändert sich ständig sichtbar","Weil es schnell erreicht wird","Weil Energie fließt"],
   ["Man entfernt ständig ein Produkt. Was passiert?","Das System bildet nach (Le Chatelier): Die Ausbeute steigt.","Es bildet sich mehr Produkt nach","Die Reaktion stoppt","Es bildet sich mehr Edukt","Nichts"],
   ["Eine Reaktion ist exotherm. Wie wirkt Erwärmen auf das Gleichgewicht?","Erwärmen begünstigt die endotherme Rückreaktion: weniger Produkt.","Es verschiebt sich zu den Edukten","Es verschiebt sich zu den Produkten","Gar nicht","Die Reaktion wird exothermer"],
   ["Was bedeutet K = 0,001?","Sehr kleines K: Im Gleichgewicht liegen fast nur Edukte vor.","Das Gleichgewicht liegt fast ganz bei den Edukten","Fast nur Produkte","Gleich viel von allem","Die Reaktion ist sehr schnell"],
   ["Was bewirkt ein Katalysator beim Gleichgewicht?","Er beschleunigt Hin- und Rückreaktion gleich stark: Das Gleichgewicht stellt sich schneller ein, die Lage bleibt gleich.","Es stellt sich schneller ein, die Lage bleibt gleich","Mehr Produkte","Mehr Edukte","Es verschwindet"]],["c_mwg"]),

 BT("c-kinetik","Reaktionsgeschwindigkeit und Katalyse","Stoßtheorie, Temperatur, Katalysator",[
  ["Damit Teilchen reagieren …",`<p>Nach der <b>Stoßtheorie</b> müssen Teilchen zusammenstoßen, und zwar <b>heftig genug</b> (mindestens mit der Aktivierungsenergie) und in der richtigen Richtung. Die Geschwindigkeit steigt mit:</p><ul class="rules"><li><b>Konzentration:</b> mehr Teilchen, mehr Stöße</li><li><b>Temperatur:</b> schnellere Teilchen, mehr erfolgreiche Stöße. RGT-Regel: 10 °C mehr ≈ doppelt so schnell.</li><li><b>Zerteilungsgrad:</b> Pulver hat mehr Oberfläche als ein Klotz (Mehlstaub kann explodieren!)</li><li><b>Katalysator</b></li></ul>`,"stoss"],
  ["Katalysatoren",`<p>Ein <b>Katalysator</b> senkt die Aktivierungsenergie, indem er einen anderen Reaktionsweg ermöglicht. Er wird dabei nicht verbraucht und liegt am Ende unverändert vor.</p><ul class="rules"><li><b>Autokatalysator:</b> Platin wandelt giftiges CO und Stickoxide in CO₂ und N₂ um.</li><li><b>Enzyme:</b> Biokatalysatoren im Körper. Ohne sie würde die Verdauung Jahre dauern.</li><li>Industrie: Über 80 % aller chemischen Produkte werden mit Katalysatoren hergestellt.</li></ul>`]],
  [["Warum reagiert Mehlstaub viel heftiger als ein Stück Brot?","Der Staub hat eine riesige Oberfläche: Viel mehr Teilchen können gleichzeitig mit Sauerstoff reagieren.","Größere Oberfläche","Mehl ist ein anderer Stoff","Staub ist wärmer","Brot ist nass"],
   ["Was macht ein Katalysator?","Er senkt die Aktivierungsenergie und wird nicht verbraucht.","Er senkt die Aktivierungsenergie","Er liefert Energie","Er wird verbraucht","Er verschiebt das Gleichgewicht"],
   ["Warum halten Lebensmittel im Kühlschrank länger?","Kälte verlangsamt die Reaktionen von Verderb und Bakterienstoffwechsel (RGT-Regel).","Reaktionen laufen bei Kälte langsamer","Kälte tötet alle Bakterien","Im Kühlschrank fehlt Sauerstoff","Wegen des Lichts"],
   ["Was braucht ein Stoß, damit Teilchen reagieren?","Genug Energie (mindestens die Aktivierungsenergie) und die passende Ausrichtung.","Genug Energie und richtige Ausrichtung","Nur Berührung","Licht","Einen Katalysator, immer"],
   ["Wie heißen die Katalysatoren im Körper?","Enzyme sind Proteine, die als Biokatalysatoren wirken.","Enzyme","Hormone","Vitamine","Ionen"]],["c_rgt"]),

 BT("c-puffer","Säure-Base-Gleichgewichte und Puffer","Starke und schwache Säuren, Henderson-Hasselbalch",[
  ["Stark oder schwach?",`<p>Eine <b>starke Säure</b> (HCl) gibt praktisch alle H⁺ ab. Eine <b>schwache Säure</b> (Essigsäure) gibt nur einen kleinen Teil ab, der Rest bleibt im Gleichgewicht:</p><p class="eq">CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺</p><p>Wie stark eine Säure ist, sagt der <b>pKs-Wert</b>: je kleiner, desto stärker. Salzsäure ca. ${MINUS}6, Essigsäure 4,76, Ammonium 9,25.</p><p>Nach Brønsted gehören Säure und Base paarweise zusammen: Gibt eine Säure ihr H⁺ ab, wird sie zur <b>korrespondierenden Base</b>.</p>`],
  ["Puffer",`<p>Ein <b>Puffer</b> ist ein Gemisch aus einer schwachen Säure und ihrer korrespondierenden Base, zum Beispiel Essigsäure und Acetat. Er fängt zugegebene Säure oder Lauge ab, der pH bleibt fast gleich:</p><ul class="rules"><li>Säure kommt dazu: Das Acetat fängt das H⁺ ab.</li><li>Lauge kommt dazu: Die Essigsäure gibt H⁺ ab und neutralisiert das OH⁻.</li></ul><p class="eq">pH = pKs + lg(c(A⁻) : c(HA))</p><p>(Henderson-Hasselbalch-Gleichung). Bei gleichen Mengen ist der pH = pKs.</p><p class="tip">Dein Blut ist mit dem Kohlensäure-Hydrogencarbonat-Puffer auf pH 7,4 gepuffert. Schon pH 7,0 oder 7,8 wären lebensgefährlich. Wer hyperventiliert, atmet zu viel CO₂ ab, der pH steigt: Kribbeln in den Händen.</p>`]],
  [["Was ist der Unterschied zwischen starker und schwacher Säure?","Starke Säuren geben fast alle H⁺ ab, schwache nur teilweise.","Starke geben fast alle H⁺ ab, schwache nur einen Teil","Starke Säuren sind konzentrierter","Schwache Säuren sind ungefährlich","Starke Säuren sind immer heiß"],
   ["Je kleiner der pKs-Wert, desto …","Kleiner pKs: Die Säure gibt H⁺ bereitwillig ab, sie ist stärker.","stärker die Säure","schwächer die Säure","höher der pH","größer das Molekül"],
   ["Woraus besteht ein Puffer?","Aus einer schwachen Säure und ihrer korrespondierenden Base.","Schwache Säure und ihre korrespondierende Base","Starke Säure und starke Lauge","Nur Wasser","Salz und Zucker"],
   ["Welchen pH-Wert hat menschliches Blut?","Das Blut ist auf pH 7,35 bis 7,45 gepuffert.","etwa 7,4","etwa 5,5","etwa 2","etwa 9"],
   ["Was ist die korrespondierende Base der Essigsäure?","Gibt CH₃COOH ein H⁺ ab, bleibt das Acetat-Ion CH₃COO⁻.","Acetat-Ion (CH₃COO⁻)","Natronlauge","Wasser","Ethanol"]],["c_puffer","c_ph"]),

 BT("c-elektrochemie","Elektrochemie","Batterie, Akku, Elektrolyse",[
  ["Die galvanische Zelle",`<p>Bei einer Redoxreaktion wandern Elektronen. Trennt man Oxidation und Reduktion in zwei <b>Halbzellen</b> und verbindet sie mit einem Draht, fließen die Elektronen durch den Draht: Strom! Das ist das Prinzip jeder <b>Batterie</b>.</p><ul class="rules"><li>Das <b>unedlere Metall</b> gibt Elektronen ab (Oxidation, <b>Anode</b>, Minuspol).</li><li>Am <b>edleren Metall</b> werden Elektronen aufgenommen (Reduktion, <b>Kathode</b>, Pluspol).</li><li>Eine <b>Salzbrücke</b> lässt Ionen wandern und schließt den Stromkreis.</li></ul>`,"zelle"],
  ["Spannungsreihe und Elektrolyse",`<p>Die <b>Spannungsreihe</b> ordnet Metalle nach ihrem Standardpotenzial E°. Je weiter zwei Metalle auseinanderliegen, desto höher die Spannung: <b>U = E°(Kathode) ${MINUS} E°(Anode)</b>. Zink-Kupfer: 0,34 ${MINUS} (${MINUS}0,76) = 1,10 V.</p><p>Bei der <b>Elektrolyse</b> läuft es umgekehrt: Man legt Spannung an und erzwingt eine Reaktion, die von allein nicht abläuft. So gewinnt man Aluminium, Chlor oder Wasserstoff, und so lädt man einen <b>Akku</b> wieder auf.</p><p class="tip">Korrosionsschutz: Ein Stück Zink oder Magnesium an einem Bootsrumpf (<b>Opferanode</b>) wird statt des Stahls oxidiert. Darum hängen Zinkanoden an Außenbordern und Schiffsschrauben.</p>`]],
  [["Welches Metall ist in einer Zink-Kupfer-Zelle die Anode?","Zink ist unedler (kleineres E°), es wird oxidiert: Anode.","Zink","Kupfer","Beide","Keins"],
   ["Was passiert an der Kathode einer galvanischen Zelle?","Reduktion: Elektronen werden aufgenommen.","Reduktion (Elektronen werden aufgenommen)","Oxidation","Neutralisation","Nichts"],
   ["Wozu dient die Salzbrücke?","Ionen können wandern und gleichen die Ladungen aus. Sonst stoppt der Strom sofort.","Sie schließt den Stromkreis über wandernde Ionen","Sie liefert Elektronen","Sie kühlt die Zelle","Sie misst die Spannung"],
   ["Was ist eine Elektrolyse?","Eine durch angelegte Spannung erzwungene Redoxreaktion.","Eine durch Strom erzwungene Redoxreaktion","Eine Batterie","Eine Neutralisation","Ein Trennverfahren für Gemische"],
   ["Warum schützt eine Zinkanode ein Stahlboot?","Zink ist unedler als Eisen und wird bevorzugt oxidiert. Der Stahl bleibt verschont.","Zink ist unedler und wird statt des Stahls oxidiert","Zink ist härter","Zink stößt Wasser ab","Zink ist magnetisch"],
   ["Was passiert beim Laden eines Akkus?","Die Entladereaktion wird durch eine angelegte Spannung umgekehrt: eine Elektrolyse.","Eine Elektrolyse kehrt die Reaktion um","Es entstehen neue Elektronen","Der Akku wird mit Strom gefüllt wie ein Tank","Nichts Chemisches"]],["c_spannung","c_oxzahl"]),

 BT("c-mechanismen","Organische Reaktionsmechanismen","Substitution, Addition, Eliminierung",[
  ["Die drei Grundtypen",`<ul class="rules"><li><b>Substitution</b> (Austausch): Ein Atom wird gegen ein anderes getauscht. Methan + Chlor → Chlormethan + HCl (radikalische Substitution, braucht Licht).</li><li><b>Addition</b> (Anlagerung): An eine Doppelbindung lagert sich etwas an, die Doppelbindung wird zur Einfachbindung. Ethen + Brom → Dibromethan.</li><li><b>Eliminierung</b> (Abspaltung): Ein kleines Molekül wird abgespalten, es entsteht eine Doppelbindung. Ethanol → Ethen + Wasser.</li></ul><p class="tip">Nachweis von Doppelbindungen: Bromwasser (braun) wird durch Addition an eine C=C-Doppelbindung <b>entfärbt</b>.</p>`],
  ["Wer greift wen an?",`<p>Mechanismen erklären, <b>wie</b> eine Reaktion Schritt für Schritt abläuft:</p><ul class="rules"><li><b>Radikale</b> haben ein ungepaartes Elektron und sind sehr reaktiv. Sie entstehen zum Beispiel durch UV-Licht.</li><li><b>Elektrophile</b> („elektronenliebend“) sind positiv oder δ+ und greifen elektronenreiche Stellen wie Doppelbindungen an.</li><li><b>Nukleophile</b> („kernliebend“) haben freie Elektronenpaare oder negative Ladung und greifen δ+-Atome an.</li></ul><p>Typisches Beispiel: An Ethen (elektronenreiche Doppelbindung) greift ein Br⁺-artiges Teilchen elektrophil an. Das nennt man <b>elektrophile Addition</b>.</p>`]],
  [["Ethen reagiert mit Brom, die Doppelbindung verschwindet. Welcher Typ?","Etwas lagert sich an die Doppelbindung an: Addition.","Addition","Substitution","Eliminierung","Neutralisation"],
   ["Bei welchem Reaktionstyp wird ein Atom gegen ein anderes ausgetauscht?","Austausch heißt Substitution.","Substitution","Addition","Eliminierung","Oxidation"],
   ["Wie weist man eine C=C-Doppelbindung nach?","Bromwasser wird entfärbt, weil Brom an die Doppelbindung addiert wird.","Bromwasser wird entfärbt","Kalkwasser wird trüb","Es riecht nach Essig","Universalindikator wird blau"],
   ["Was ist ein Radikal?","Ein Teilchen mit einem ungepaarten Elektron, sehr reaktiv.","Ein Teilchen mit ungepaartem Elektron","Ein geladenes Ion","Ein Edelgas","Ein Katalysator"],
   ["Ein Nukleophil greift bevorzugt …","Nukleophile sind elektronenreich und greifen positiv polarisierte (δ+) Atome an.","positiv polarisierte Atome an","Doppelbindungen an","Edelgase an","negative Ionen an"],
   ["Aus Ethanol entsteht Ethen und Wasser. Welcher Typ?","Ein kleines Molekül (Wasser) wird abgespalten, eine Doppelbindung entsteht: Eliminierung.","Eliminierung","Addition","Substitution","Veresterung"]]),

 BT("c-kunststoffe","Kunststoffe","Polymere: lange Ketten aus kleinen Bausteinen",[
  ["Aus Monomeren werden Polymere",`<p>Kunststoffe bestehen aus <b>Makromolekülen</b>: Riesenmoleküle aus Tausenden gleichen Bausteinen (<b>Monomeren</b>), die sich zu langen Ketten (<b>Polymeren</b>) verbinden.</p><ul class="rules"><li><b>Polymerisation:</b> Monomere mit Doppelbindung hängen sich aneinander. Ethen → Polyethylen (PE: Tüten, Flaschen).</li><li><b>Polykondensation:</b> Bausteine verbinden sich unter Abspaltung von Wasser. PET (Getränkeflaschen), Nylon (Polyamid, Seile, Segeltuch).</li><li><b>Polyaddition:</b> Polyurethan (Schaumstoff, Lacke).</li></ul>`],
  ["Drei Sorten",`<table class="tbl"><tr><th>Typ</th><th>Aufbau</th><th>Verhalten beim Erwärmen</th></tr><tr><td>Thermoplaste</td><td>lose, unvernetzte Ketten</td><td>werden weich, formbar, recycelbar (PE, PET)</td></tr><tr><td>Duroplaste</td><td>eng vernetzt</td><td>bleiben hart, zersetzen sich (Steckdosen, Bootsrümpfe aus Polyester)</td></tr><tr><td>Elastomere</td><td>locker vernetzt</td><td>gummielastisch (Reifen, Dichtungen, Neopren)</td></tr></table><p class="tip">Kunststoffe sind langlebig, das ist ihr Vorteil und ihr Problem: Im Meer zerfallen sie zu <b>Mikroplastik</b>, das jahrhundertelang bleibt.</p>`]],
  [["Was ist ein Monomer?","Ein kleiner Baustein, aus dem durch Verknüpfung ein Polymer entsteht.","Ein kleiner Baustein eines Kunststoffs","Ein fertiger Kunststoff","Ein Metall","Ein Katalysator"],
   ["Welcher Kunststofftyp lässt sich durch Erwärmen neu formen?","Thermoplaste haben unvernetzte Ketten, die beim Erwärmen aneinander vorbeigleiten.","Thermoplast","Duroplast","Elastomer","Keiner"],
   ["Woraus besteht Polyethylen?","Aus vielen Ethen-Molekülen, die durch Polymerisation verknüpft sind.","Aus vielen Ethen-Bausteinen","Aus Zucker","Aus Eisen","Aus Salz"],
   ["Neopren im Neoprenanzug ist ein …","Gummielastisch durch weitmaschige Vernetzung: Elastomer.","Elastomer","Thermoplast","Duroplast","Metall"],
   ["Was wird bei der Polykondensation abgespalten?","Meist Wasser, wenn sich die Bausteine verbinden.","Ein kleines Molekül, meist Wasser","Ein Elektron","Sauerstoff","Nichts"]]),

 BT("c-biomolekuele","Biomoleküle","Kohlenhydrate, Fette, Proteine",[
  ["Die drei großen Nährstoffe",`<ul class="rules"><li><b>Kohlenhydrate:</b> aus C, H, O. Einfachzucker (Glucose, Fructose), Zweifachzucker (Saccharose = Haushaltszucker), Vielfachzucker (Stärke, Cellulose, Glykogen). Hauptenergielieferant.</li><li><b>Fette:</b> Ester aus Glycerin und drei Fettsäuren. Gesättigte Fettsäuren (ohne Doppelbindung, fest, Butter) und ungesättigte (mit Doppelbindungen, flüssig, Olivenöl). Energiespeicher, Wärmeisolierung.</li><li><b>Proteine (Eiweiße):</b> Ketten aus 20 verschiedenen <b>Aminosäuren</b>, verbunden über Peptidbindungen. Baustoffe (Muskeln, Kollagen, Haare) und Werkzeuge (Enzyme, Antikörper).</li></ul>`],

/* ---------- Chemie: Für den Küchentisch ---------- */
Object.assign(KT,{
 "c-stoffe":`<p>Kinder lernen Chemie heute als <b>Detektivarbeit</b>: Stoffe untersuchen und am Steckbrief erkennen. Zu Hause: Zucker, Salz, Mehl und Backpulver sehen gleich aus. Mit Wasser, Lupe und Essig kann man sie unterscheiden (nie probieren, das ist im Labor tabu). <b>Typischer Fehler:</b> Gegenstand und Stoff verwechseln. <b>Prüffrage:</b> „Woraus ist dein Trinkbecher, und woraus könnte er noch sein?“</p>`,
 "c-gemische":`<p>Die Küche ist voller Gemische: Saft, Milch, Salatsoße (schütteln: Emulsion, stehen lassen: trennt sich wieder). Lass dein Kind Gemische suchen und benennen. <b>Typischer Fehler:</b> Gelöste Stoffe seien „weg“. Salzwasser probieren (ein Tropfen) oder eindampfen zeigt: Das Salz ist noch da.</p>`,
 "c-trennen":`<p>Schönes Experiment: Schwarzen Filzstift auf einen Kaffeefilter malen, Ende in Wasser stellen, zuschauen, wie sich die Farben trennen. Oder Salz aus Salzwasser in der Pfanne zurückgewinnen. <b>Typischer Fehler:</b> Filtern könne alles trennen. Gelöstes geht durch jeden Filter.</p>`,
 "c-reaktion":`<p>Backpulver mit Essig in einer Flasche, Luftballon drüber: Der Ballon bläst sich auf. Ein neuer Stoff (CO₂) ist entstanden. <b>Typischer Fehler:</b> Schmelzen oder Lösen für eine Reaktion halten. Prüffrage: „Ist danach ein neuer Stoff da, oder sieht der alte nur anders aus?“</p>`,
 "c-verbrennung":`<p>Teelicht unter ein umgedrehtes Glas stellen: Es geht aus, weil der Sauerstoff verbraucht ist. Gute Gelegenheit, Brandschutz zu üben (112, Fluchtweg, Fettbrand). <b>Typischer Fehler:</b> „Beim Verbrennen verschwindet der Stoff.“ Er wird zu Gasen, die man nicht sieht.</p>`,
 "c-atom":`<p>Das Schalenmodell lässt sich mit Linsen oder Erbsen auf Papierkreisen legen. Wichtig: Kinder lernen in Klasse 7 bis 8 meist nur das <b>Schalenmodell</b>, nicht die Orbitale. <b>Typischer Fehler:</b> Protonen und Elektronen verwechseln. Merkhilfe: <b>P</b>roton = <b>P</b>lus.</p>`,
 "c-pse":`<p>Ein Periodensystem als Poster ans Kinderzimmer hängen. Viele Schulen erlauben in Arbeiten ein PSE als Hilfsmittel, man muss es nicht auswendig können, aber <b>lesen</b> können. Übt das Ablesen: Wie viele Außenelektronen? Wie viele Schalen? <b>Typischer Fehler:</b> Periode und Gruppe verwechseln. Zeilen sind Perioden (wie Zeilen in einem Text).</p>`,
 "c-ionen":`<p>Salzkristalle unter der Lupe: Sie sind kleine Würfel, weil sich die Ionen ordentlich stapeln. <b>Typischer Fehler:</b> Beim Abgeben von Elektronen werde das Atom „negativ“. Gerade umgekehrt: Wer negative Elektronen verliert, wird positiv. Bild: Wer Schulden abgibt, steht besser da.</p>`,
 "c-gleichung":`<p>Für viele Kinder ist das die erste große Hürde in Chemie. Hilft sehr: Atome mit Legosteinen oder Gummibärchen in Farben legen (rot = O, weiß = H). Dann sieht man, dass links und rechts gleich viele Steine sein müssen. <b>Typischer Fehler:</b> Aus H₂O einfach H₂O₂ machen, um mehr O zu bekommen. Das ist ein anderer Stoff (Wasserstoffperoxid, Bleichmittel)!</p>`,
 "c-ebind":`<p>Gummibärchen und Zahnstocher für Moleküle: H₂O, CO₂, CH₄. Jedes Atom muss so viele Zahnstocher haben, wie es Bindungen bildet (H 1, O 2, N 3, C 4). <b>Typischer Fehler:</b> Freie Elektronenpaare vergessen, dann stimmt die 8 nicht.</p>`,
 "c-polar":`<p>Wasser-Experimente: Ein Glas randvoll mit Wasser, dann Münzen hineinlegen, bis es überläuft (Oberflächenspannung). Eine Büroklammer vorsichtig aufs Wasser legen, sie schwimmt. Ein Tropfen Spülmittel, sie sinkt. <b>Typischer Fehler:</b> Wasserstoffbrücken für echte Bindungen im Molekül halten. Sie wirken <b>zwischen</b> Molekülen.</p>`,
 "c-saeuren":`<p>Saure und alkalische Haushaltsstoffe sammeln: Zitrone, Essig, Cola, Seife, Natron, Backpulver. <b>Sicherheit:</b> Abfluss- und WC-Reiniger nicht für Experimente verwenden. <b>Typischer Fehler:</b> „Säuren sind immer gefährlich.“ Wir essen jeden Tag Säuren, es kommt auf die Konzentration an.</p>`,
 "c-ph":`<p>Rotkohlsaft als Indikator: Rotkohl klein schneiden, mit heißem Wasser übergießen, abseihen. Der violette Saft wird mit Essig rot, mit Natron grünblau. Das begeistert jedes Kind. <b>Typischer Fehler:</b> pH 4 sei „doppelt so sauer“ wie pH 8. Die Skala ist in Zehnerschritten und neutral liegt bei 7.</p>`,
 "c-neutral":`<p>Rotkohlsaft mit Essig rot färben, dann löffelweise Natron-Lösung dazugeben, bis er wieder violett ist: eine Küchen-Titration. <b>Typischer Fehler:</b> Bei der Neutralisation verschwinde alles. Es bleibt ein Salz in Wasser übrig.</p>`,
 "c-redox":`<p>Ein blanker Eisennagel in Kupfersulfat-Lösung (aus dem Chemiekasten) wird kupferrot überzogen: Eisen gibt Elektronen ab, Kupfer nimmt sie auf. Alternativ: angeschnittener Apfel wird braun (Oxidation), mit Zitronensaft bleibt er hell. <b>Typischer Fehler:</b> Oxidation und Reduktion vertauschen. OIL RIG hilft.</p>`,
 "c-mol":`<p>Das Mol ist für Kinder sehr abstrakt. Vergleich, der hilft: Ein Bäcker zählt Brötchen nicht einzeln, sondern wiegt 1 kg ab und weiß, wie viele es ungefähr sind. Genauso zählen Chemiker Atome über die Masse. <b>Typischer Fehler:</b> n = m · M statt m : M. Einheitenkontrolle hilft: g geteilt durch g/mol ergibt mol.</p>`,
 "c-alkane":`<p>Moleküle mit Knete und Zahnstochern bauen: Methan, Ethan, Propan. Gärung beobachten: Hefe, Zucker und warmes Wasser in eine Flasche, Ballon drüber. <b>Typischer Fehler:</b> Die Vorsilben verwechseln. Der Merkspruch „Mama Esst Pudding Bei Oma“ hilft.</p>`,
 "c-ester":`<p>Duftexperiment: an Banane, Ananas und Klebstoff (Uhu) riechen, alles Ester. <b>Typischer Fehler:</b> Ester für Säuren halten, weil sie aus einer Säure entstehen. Ester sind nicht mehr sauer.</p>`,
 "c-gg":`<p>Bildlich: Zwei Kinder werfen im Garten Bälle über einen Zaun hin und her. Irgendwann fliegen gleich viele in beide Richtungen, die Zahl auf jeder Seite bleibt gleich, obwohl ständig geworfen wird. <b>Typischer Fehler:</b> Im Gleichgewicht seien von allem gleich viele da. Gleich ist nur die Geschwindigkeit.</p>`,
 "c-kinetik":`<p>Brausetablette ganz und zerbröselt in Wasser, und in kaltem und warmem Wasser: Stoppuhr mitlaufen lassen. <b>Typischer Fehler:</b> Ein Katalysator werde verbraucht oder liefere Energie. Er senkt nur die Hürde.</p>`,
 "c-puffer":`<p>In der Oberstufe ist viel Rechnen dabei, oft mit dem Taschenrechner (lg-Taste). Die Henderson-Hasselbalch-Gleichung steht meist in der Formelsammlung. <b>Typischer Fehler:</b> Puffer könne unbegrenzt abfangen. Jeder Puffer hat eine Kapazität, dann ist Schluss.</p>`,
 "c-elektrochemie":`<p>Zitronenbatterie: Kupfermünze und verzinkter Nagel in eine Zitrone stecken, mit einem Multimeter messen (etwa 0,9 V). Mehrere in Reihe bringen eine kleine LED zum Leuchten. <b>Typischer Fehler:</b> Anode sei immer Plus. Bei der Batterie ist die Anode der Minuspol, bei der Elektrolyse der Pluspol. Merkhilfe: An der <b>A</b>node läuft immer die Oxid<b>a</b>tion.</p>`,
 "c-mechanismen":`<p>Hier arbeiten Schulen viel mit Pfeilen, die Elektronenbewegungen zeigen. Ein Kind sollte die Pfeile mit dem Finger „nachlaufen“ können. <b>Typischer Fehler:</b> Die Pfeile zeigen nicht, wohin ein Atom wandert, sondern wohin ein <b>Elektronenpaar</b> geht.</p>`,
 "c-kunststoffe":`<p>Kunststoff-Detektive: Recycling-Dreiecke auf Verpackungen suchen (1 PET, 2 HDPE, 4 LDPE, 5 PP). Eine Büroklammer als Monomer-Kette zeigt, wie Polymere aufgebaut sind. <b>Typischer Fehler:</b> Alle Kunststoffe seien gleich und recycelbar. Duroplaste kann man nicht einschmelzen.</p>`,
 "c-biomolekuele":`<p>Iod-Test in der Küche: Ein Tropfen Iodtinktur (Apotheke) auf Kartoffel, Brot und Apfel. Wo Stärke ist, wird es blau-schwarz. Oder ein Ei kochen und über Denaturierung sprechen. <b>Typischer Fehler:</b> Eiweiß nur als das Weiße im Ei verstehen. Proteine sind in jeder Zelle.</p>`,
});

/* line:  {kind:"line",min,max,step,major,ans,ansText}  → Antwort = Zahl
   order: {kind:"order",items:[html],order:[Indizes klein→groß]} → Antwort = Indexfolge

function lineLabel(v,ex){if(ex.fracLabels){const d=Math.round(1/ex.step);return Number.isInteger(v)?fmt(v):F(Math.round(v*d),d)}return fmt(Math.round(v*1000)/1000)}
function lineInput(ex,onSet){
  const W=320,pad=20,X=v=>pad+(v-ex.min)/(ex.max-ex.min)*(W-2*pad),V=x=>ex.min+(x-pad)/(W-2*pad)*(ex.max-ex.min);
  const n=Math.round((ex.max-ex.min)/ex.step);let ticks="";
  for(let i=0;i<=n;i++){const v=ex.min+i*ex.step,maj=Math.abs(v/ex.major-Math.round(v/ex.major))<1e-6;
    ticks+=`<line x1="${X(v)}" y1="${maj?36:41}" x2="${X(v)}" y2="${maj?60:55}" stroke="var(--ink)" stroke-width="${maj?1.8:1}"/>`;
    if(maj)ticks+=`<text x="${X(v)}" y="78" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--muted)">${ex.fracLabels?fmt(v):fmt(Math.round(v*1000)/1000)}</text>`}
  const el=h(`<div class="linein"><svg viewBox="0 0 ${W} 92" width="100%" role="slider" aria-label="Zahlenstrahl, tippe die Stelle an" tabindex="0" aria-valuemin="${ex.min}" aria-valuemax="${ex.max}"><rect x="0" y="0" width="${W}" height="92" fill="transparent"/><line x1="${pad-10}" y1="48" x2="${W-pad+10}" y2="48" stroke="var(--ink)" stroke-width="2"/>${ticks}<g class="mk" style="display:none"><path d="M0,-2 l-8,-14 h16z" fill="var(--signal)" stroke="var(--ink)" stroke-width="1.2"/><circle r="6" cy="0" fill="var(--signal)" stroke="var(--ink)" stroke-width="1.2"/></g><g class="ok" style="display:none"><circle r="7" fill="none" stroke="var(--ok)" stroke-width="3"/></g></svg><p class="muted small">Tippe auf die Stelle oder ziehe die Markierung. Pfeiltasten gehen auch.</p></div>`);
  const svg=$("svg",el),mk=$(".mk",svg);let val=null,locked=false,drag=false;
  const set=v=>{v=Math.max(ex.min,Math.min(ex.max,ex.min+Math.round((v-ex.min)/ex.step)*ex.step));val=Math.round(v*1e6)/1e6;mk.style.display="";mk.setAttribute("transform",`translate(${X(val)},48)`);svg.setAttribute("aria-valuenow",val);onSet(val)};
  const fromEv=e=>{const r=svg.getBoundingClientRect();return V((e.clientX-r.left)/r.width*W)};
  svg.addEventListener("pointerdown",e=>{if(locked)return;drag=true;try{svg.setPointerCapture(e.pointerId)}catch(x){}set(fromEv(e))});
  svg.addEventListener("pointermove",e=>{if(drag&&!locked)set(fromEv(e))});
  svg.addEventListener("pointerup",()=>{drag=false});
  svg.addEventListener("keydown",e=>{if(locked)return;if(e.key==="ArrowRight"||e.key==="ArrowUp"){e.preventDefault();set((val??ex.min)+ex.step)}if(e.key==="ArrowLeft"||e.key==="ArrowDown"){e.preventDefault();set((val??ex.max)-ex.step)}});
  el.lock=()=>{locked=true;const o=$(".ok",svg);o.style.display="";o.setAttribute("transform",`translate(${X(ex.ans)},48)`)};
  el.value=()=>val;return el}
function orderInput(ex,onChange){
  const el=h(`<div class="orderin stack" style="gap:10px"><div class="ord-slot" aria-label="Deine Reihenfolge"><span class="muted small ord-hint">Tippe die Zahlen von der kleinsten zur größten an.</span></div><div class="ord-pool"></div></div>`);
  const slot=$(".ord-slot",el),pool=$(".ord-pool",el);let seq=[],locked=false;
  const draw=()=>{slot.querySelectorAll(".chip-o").forEach(x=>x.remove());pool.innerHTML="";$(".ord-hint",el).hidden=seq.length>0;
    seq.forEach((k,j)=>{const b=h(`<button type="button" class="chip-o in">${ex.items[k]}</button>`);if(j)b.prepend(h(`<span class="lt">&lt;</span>`));b.onclick=()=>{if(locked)return;seq.splice(j,1);draw();onChange(seq)};slot.append(b)});
    ex.items.forEach((it,k)=>{if(seq.includes(k))return;const b=h(`<button type="button" class="chip-o">${it}</button>`);b.onclick=()=>{if(locked)return;seq.push(k);draw();onChange(seq)};pool.append(b)})};
  el.lock=ok=>{locked=true;slot.classList.add(ok?"right":"wrong");if(!ok){const c=h(`<div class="ord-slot right"></div>`);ex.order.forEach((k,j)=>{const b=h(`<span class="chip-o in">${ex.items[k]}</span>`);if(j)b.prepend(h(`<span class="lt">&lt;</span>`));c.append(b)});el.append(h(`<span class="muted small">Richtig wäre:</span>`));el.append(c)}};
  el.value=()=>seq.slice();draw();return el}
function pairsInput(ex,onDone){
  const L=shuffle(ex.pairs.map((p,i)=>[p[0],i])),Rr=shuffle(ex.pairs.map((p,i)=>[p[1],i]));let selL=null,selR=null,miss=0,found=0;
  const el=h(`<div class="pairsin"><div class="pcol"></div><div class="pcol"></div><p class="muted small" style="grid-column:1/-1">Tippe links und rechts zwei Karten an, die zusammengehören.</p></div>`);
  const [cl,cr]=el.querySelectorAll(".pcol");
  const tryMatch=()=>{if(selL==null||selR==null)return;const bl=cl.children[selL[0]],br=cr.children[selR[0]];
    if(selL[1]===selR[1]){[bl,br].forEach(b=>{b.classList.add("right");b.disabled=true;b.setAttribute("aria-pressed","false")});found++;if(found===ex.pairs.length)setTimeout(()=>onDone(miss),350)}
    else{miss++;[bl,br].forEach(b=>{b.classList.add("wrong");setTimeout(()=>{b.classList.remove("wrong");b.setAttribute("aria-pressed","false")},450)})}
    selL=selR=null};
  L.forEach(([t,i],j)=>{const b=h(`<button type="button" class="opt pc" aria-pressed="false">${t}</button>`);b.onclick=()=>{if(b.disabled)return;[...cl.children].forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");selL=[j,i];tryMatch()};cl.append(b)});
  Rr.forEach(([t,i],j)=>{const b=h(`<button type="button" class="opt pc" aria-pressed="false">${t}</button>`);b.onclick=()=>{if(b.disabled)return;[...cr.children].forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");selR=[j,i];tryMatch()};cr.append(b)});
  el.misses=()=>miss;el.lock=()=>{};return el}

  ordnen_neg(){const s=new Set();while(s.size<5)s.add(ri(-15,15));const v=[...s],ord=v.map((x,i)=>[x,i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    return{q:"Ordne von klein nach groß.",kind:"order",items:v.map(x=>fmt(x)),order:ord,sol:`Am Zahlenstrahl von links nach rechts: ${ord.map(i=>fmt(v[i])).join(" &lt; ")}. Bei negativen Zahlen gilt: Je größer die Zahl hinter dem Minus, desto kleiner ist sie.`}},
  ordnen_dez(){const P=[.03,.3,.25,.305,.5,.45,.125,.2,.09,.9,.405,.035,.7,.07];let v;do v=shuffle(P).slice(0,5);while(new Set(v).size<5);const ord=v.map((x,i)=>[x,i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    return{q:"Ordne von klein nach groß.",kind:"order",items:v.map(x=>fmt(x)),order:ord,sol:`Trick: alle auf gleich viele Nachkommastellen auffüllen. ${ord.map(i=>String(v[i].toFixed(3)).replace(".",",")).join(" &lt; ")}. Die Anzahl der Ziffern sagt nichts über die Größe: 0,3 ist größer als 0,25.`}},
  ordnen_bruch(){const P=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[1,6],[5,6],[3,8],[5,8],[7,10],[1,10]];let v;do v=shuffle(P).slice(0,4);while(new Set(v.map(x=>x[0]/x[1])).size<4);
    const ord=v.map((x,i)=>[x[0]/x[1],i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

  GT("k1-zaehlen","Zahlen bis 10","Zählen, Würfelbilder, Mengen",["k1_zaehlen"],[["Zählen und sehen",`<p>Zuerst lernen Kinder, Dinge zu <b>zählen</b>: jedes genau einmal antippen und dabei laut zählen. Danach sollen sie kleine Mengen <b>auf einen Blick</b> erkennen, ohne zu zählen: Würfelbilder, Finger, Fünferreihen.</p><p>Wichtig ist die <b>Kraft der Fünf</b>: Fünf Punkte in einer Reihe (wie eine Hand) erkennt man sofort. 7 ist dann „eine volle Fünf und noch zwei“.</p>`]]),
  GT("k1-zehner","Zahlen bis 20","Zehnerfeld, Nachbarzahlen",["k1_zehner"],[["Das Zehnerfeld",`<p>Ein <b>Zehnerfeld</b> hat zwei Reihen mit je fünf Plätzen. Ist es voll, sind es genau 10. Damit sieht man jede Zahl bis 20 als „10 und noch ein paar“: 14 ist ein volles Feld und 4.</p><p>Tippe die Knöpfe und füll das Feld:</p>`,"zehnerfeld"]]),
  GT("k1-plus10","Plus und Minus bis 10","Dazutun, wegnehmen, zerlegen",["k1_plus10"],[["Rechnen mit Bildern",`<p><b>Plus</b> heißt dazutun, <b>Minus</b> heißt wegnehmen. Kinder rechnen zuerst mit Dingen zum Anfassen, dann mit Bildern, erst danach nur mit Zahlen.</p><p>Ganz wichtig: die <b>Zerlegungen der 10</b> (1 + 9, 2 + 8, 3 + 7, 4 + 6, 5 + 5). Wer sie auswendig kann, rechnet später viel schneller. In der Schule heißen sie oft „verliebte Zahlen“ oder „Zehnerfreunde“.</p>`,"zehnerfeld"]]),
  GT("k1-plus20","Rechnen bis 20","Über die 10 rechnen",["k1_plus20"],[["Der Zehnerübergang",`<p>8 + 5 ist schwerer als 3 + 4, weil man über die 10 muss. Der Trick heißt <b>Teilschritte</b>:</p><p class="eq">8 + 5 = 8 + 2 + 3 = 10 + 3 = 13</p><p>Erst bis zur 10 auffüllen (dafür braucht man die Zehnerfreunde), dann den Rest dazu. Beim Minus genauso rückwärts: 13 ${MINUS} 5 = 13 ${MINUS} 3 ${MINUS} 2 = 8.</p><p class="tip">Auch hilfreich: Verdoppeln (6 + 6 = 12, also ist 6 + 7 = 13).</p>`]]),
  GT("k1-formen","Formen","Kreis, Dreieck, Viereck",["k1_formen"],[["Formen erkennen",`<p>Kreis, Dreieck, Quadrat und Rechteck: Kinder suchen sie in der Umgebung (Teller, Dach, Fenster, Tür) und zählen Ecken und Seiten. Ein <b>Quadrat</b> ist ein besonderes Rechteck: Alle Seiten sind gleich lang.</p>`]]),
  GT("k1-muster","Muster und Folgen","Was kommt als Nächstes?",["k1_muster"],[["Regeln entdecken",`<p>Muster schulen das mathematische Denken: Rot, Blau, Rot, Blau … oder 2, 4, 6, 8. Das Kind soll die <b>Regel finden</b> und weiterführen. Später heißt das Folgen und Funktionen.</p>`]]),
  GT("k1-geld","Euro und Münzen","Geld erkennen und zählen",["k1_geld"],[["Unser Geld",`<p>In Klasse 1 geht es um Euro-Münzen (1 €, 2 €) und Scheine (5 €, 10 €, 20 €). Kinder sollen sie erkennen und kleine Beträge zusammenzählen. Cent kommen meist in Klasse 2.</p><p class="tip">Echtes Geld ist der beste Lehrer: beim Bäcker selbst bezahlen lassen.</p>`]]),
]};
const BAND2={key:"2",title:"Klasse 2",topics:[
  GT("k2-zahl100","Zahlen bis 100","Zehner und Einer",["k2_zahl100","k2_tap"],[["Bündeln in Zehnern",`<p>Bis 100 zählt man nicht mehr einzeln, sondern in <b>Zehnern</b>. Eine Zehnerstange sind 10 Würfel. 37 sind 3 Stangen und 7 einzelne Würfel.</p><p>Achtung beim Sprechen: Wir sagen <b>sieben</b>und<b>dreißig</b>, also die Einer zuerst, schreiben aber die 3 zuerst. Darum vertauschen viele Kinder die Ziffern (73 statt 37).</p>`,"hunderter"]]),
  GT("k2-plus100","Rechnen bis 100","Zehner und Einer getrennt",["k2_plus100"],[["Schrittweise rechnen",`<p>Bei 46 + 27 rechnen Kinder in Schritten, meist erst die Zehner, dann die Einer:</p><p class="eq">46 + 20 = 66<br>66 + 7 = 73</p><p>Es gibt viele erlaubte Wege (Zehner und Einer getrennt, Hilfsaufgabe 46 + 30 ${MINUS} 3 …). Die Schule lässt oft eigene Wege zu. Wichtig ist, dass das Kind seinen Weg erklären kann.</p>`]]),
  GT("k2-mal","Malnehmen","Malaufgaben als Punktefeld",["k2_mal","paare_1x1"],[["Mal ist schnelles Plus",`<p>3 · 4 heißt: 3-mal die 4, also 4 + 4 + 4 = 12. Im <b>Punktefeld</b> sind es 3 Reihen mit je 4 Punkten.</p><p>Zuerst lernen Kinder die <b>Kernaufgaben</b>: · 1, · 2, · 5 und · 10. Daraus leiten sie die anderen ab.</p>`,"malfeld"]]),
  GT("k2-geteilt","Teilen","Gerecht verteilen",["k2_geteilt"],[["Verteilen und Aufteilen",`<p><b>Verteilen:</b> 12 Bonbons an 3 Kinder, wie viele bekommt jedes? <b>Aufteilen:</b> 12 Bonbons in Tüten zu je 3, wie viele Tüten? Beides ist 12 : 3 = 4.</p><p>Teilen ist die Umkehrung vom Malnehmen: 12 : 3 = 4, weil 3 · 4 = 12.</p>`]]),
  GT("k2-uhr","Die Uhr","Volle, halbe und Viertelstunden",["k2_uhr"],[["Kurzer und langer Zeiger",`<p>Der <b>kurze Zeiger</b> zeigt die Stunde, der <b>lange</b> die Minuten. Steht der lange oben auf der 12, ist es eine volle Stunde.</p><p>Dreh die Uhr selbst:</p>`,"uhrlesen"]]),
  GT("k2-laenge","Längen messen","Zentimeter und Meter",["k2_laenge"],[["Messen mit dem Lineal",`<p>Länge misst man in <b>Zentimetern</b> (cm) und <b>Metern</b> (m): 1 m = 100 cm. Beim Lineal wird bei der <b>0</b> angelegt, nicht beim Rand.</p><p>Stützpunkte zum Schätzen: Ein Finger ist etwa 1 cm breit, ein großer Schritt etwa 1 m.</p>`]]),
  GT("k2-geld","Geld bis 100 €","Euro und Cent",["k2_geld"],[["Cent und Euro",`<p><b>100 Cent sind 1 Euro.</b> Kinder legen Beträge mit Münzen und rechnen Rückgeld durch <b>Ergänzen</b> aus: Ein Eis kostet 3 €, ich bezahle mit 10 €: 3 + 7 = 10, also 7 € zurück.</p><p>Leg selbst Geld in den Beutel:</p>`,"geldbeutel"]]),
]};

  GT("k3-zahl1000","Zahlen bis 1000","Hunderter, Zehner, Einer",["k3_zahl1000"],[["Der Tausenderraum",`<p>Jetzt kommen die <b>Hunderter</b> dazu: 10 Zehner sind 1 Hunderter, 10 Hunderter sind 1 Tausender. In der Stellenwerttafel steht 352 als 3 H, 5 Z, 2 E.</p><p class="tip">Anschaulich: 1000 Würfel sind ein großer Würfel, 100 eine Platte, 10 eine Stange.</p>`]]),
  GT("k3-rechnen","Rechnen bis 1000","Schrittweise plus und minus",["k3_rechnen"],[["Halbschriftlich rechnen",`<p>Vor dem schriftlichen Rechnen (Klasse 4) wird <b>halbschriftlich</b> gerechnet: in Schritten, die man aufschreibt.</p><p class="eq">456 + 237<br>456 + 200 = 656<br>656 + 30 = 686<br>686 + 7 = 693</p><p>Manche Schulen führen das schriftliche Addieren schon in Klasse 3 ein.</p>`]]),
  GT("k3-mal","Mal und geteilt","Großes Einmaleins halbschriftlich",["k3_mal"],[["Zerlegen macht es leicht",`<p>7 · 23 rechnet man mit dem <b>Zerlegungstrick</b>: 7 · 20 = 140 und 7 · 3 = 21, zusammen 161.</p><p>Beim Teilen genauso: 84 : 4 = 80 : 4 + 4 : 4 = 20 + 1 = 21.</p><p>Am Ende der 3. Klasse sollte das <b>kleine Einmaleins</b> automatisch sitzen. Dafür eignet sich das Blitzrechnen-Spiel im Training.</p>`]]),
  GT("k3-groessen","Gewichte und Längen","g, kg, m, km",["k3_groessen"],[["Größen im Alltag",`<table class="tbl"><tr><td>1 km</td><td>= 1000 m</td></tr><tr><td>1 m</td><td>= 100 cm</td></tr><tr><td>1 kg</td><td>= 1000 g</td></tr></table><p>Stützpunkte: Eine Tafel Schokolade wiegt 100 g, eine Packung Zucker 1 kg. Ein Kilometer ist etwa 15 Minuten zu Fuß.</p>`]]),
  GT("k3-spiegel","Spiegeln und Symmetrie","Achsensymmetrische Figuren",["k3_spiegel","formen"],[["Falten und spiegeln",`<p>Eine Figur ist <b>achsensymmetrisch</b>, wenn man sie so falten kann, dass beide Hälften genau aufeinanderliegen. Die Faltlinie heißt <b>Spiegelachse</b>.</p><p>Viele Buchstaben sind symmetrisch (A, H, M, T), andere nicht (F, R, S). Klecksbilder (Farbe auf Papier, zusammenklappen) sind immer symmetrisch.</p>`]]),
]};
{const M=SUBJECTS[0];M.bands.unshift(BAND1,BAND2,BAND3)}

B12("bio",[
 SA("b12-sinne","Unsere Sinne","Sehen, hören, riechen, schmecken, fühlen","Wir haben fünf Sinne: Mit den <b>Augen</b> sehen wir, mit den <b>Ohren</b> hören wir, mit der <b>Nase</b> riechen wir, mit der <b>Zunge</b> schmecken wir und mit der <b>Haut</b> fühlen wir. Spiel dazu: Fühlsäckchen mit Gegenständen und mit geschlossenen Augen raten.",[["Womit riechen wir?","Gerüche nehmen wir mit der Nase wahr.","Mit der Nase","Mit den Ohren","Mit den Augen"],["Wie viele Sinne haben wir?","Sehen, Hören, Riechen, Schmecken und Fühlen: fünf.","5","3","10"],["Womit fühlen wir, ob etwas warm ist?","Die Haut spürt Wärme, Kälte, Druck und Schmerz.","Mit der Haut","Mit der Zunge","Mit der Nase"],["Womit schmecken wir, ob etwas süß ist?","Die Zunge schmeckt süß, sauer, salzig und bitter.","Mit der Zunge","Mit den Augen","Mit den Ohren"]]),
 SA("b12-jahreszeiten","Die Jahreszeiten","Frühling, Sommer, Herbst, Winter","Ein Jahr hat vier Jahreszeiten: Im <b>Frühling</b> blühen die ersten Blumen, im <b>Sommer</b> ist es warm, im <b>Herbst</b> fallen die Blätter, im <b>Winter</b> ist es kalt und manchmal schneit es. Mit dem Kind: einen Baum vor dem Haus jede Jahreszeit fotografieren.",[["Wann fallen die Blätter von den Bäumen?","Im Herbst werden die Blätter bunt und fallen ab.","Im Herbst","Im Frühling","Im Sommer"],["Wie viele Jahreszeiten gibt es?","Frühling, Sommer, Herbst, Winter.","4","2","12"],["Welche Jahreszeit kommt nach dem Winter?","Nach dem Winter kommt der Frühling, dann wird es wärmer.","Frühling","Herbst","Sommer"],["Wann ist es am wärmsten?","Im Sommer scheint die Sonne am längsten und am höchsten.","Im Sommer","Im Winter","Im Herbst"]]),
 SA("b12-tiere","Tiere und ihre Kinder","Wer gehört zu wem?","Tierkinder haben oft eigene Namen: Die Kuh hat ein <b>Kalb</b>, das Pferd ein <b>Fohlen</b>, das Schaf ein <b>Lamm</b>, der Hund einen <b>Welpen</b>, die Katze ein <b>Kätzchen</b>, das Huhn ein <b>Küken</b>. Manche Tiere legen Eier (Huhn, Ente), andere bringen lebende Junge zur Welt.",[["Wie heißt das Kind der Kuh?","Ein junges Rind heißt Kalb.","Kalb","Fohlen","Ferkel"],["Wie heißt das Kind des Pferdes?","Ein junges Pferd heißt Fohlen.","Fohlen","Lamm","Kalb"],["Welches Tier legt Eier?","Das Huhn legt Eier, aus denen Küken schlüpfen.","Huhn","Hund","Katze"],["Wie heißt das Kind des Schafes?","Ein junges Schaf heißt Lamm.","Lamm","Küken","Welpe"],["Wie heißt das Kind des Schweins?","Ein junges Schwein heißt Ferkel.","Ferkel","Kalb","Fohlen"]]),
 SA("b12-obst","Obst und Gemüse","Was wächst wo?","<b>Obst</b> wächst meist an Bäumen und Sträuchern und schmeckt süß (Apfel, Kirsche, Erdbeere). <b>Gemüse</b> sind andere essbare Pflanzenteile: Wurzeln (Möhre), Blätter (Salat), Knollen (Kartoffel). Gemeinsam auf dem Markt oder im Garten anschauen.",[["Was ist Gemüse?","Die Möhre ist eine Wurzel und zählt zum Gemüse.","Möhre","Apfel","Kirsche"],["Wo wachsen Äpfel?","Äpfel wachsen an Bäumen.","An Bäumen","In der Erde","Im Wasser"],["Welcher Teil der Möhre wird gegessen?","Bei der Möhre essen wir die Wurzel.","Die Wurzel","Die Blüte","Die Frucht"],["Was ist Obst?","Die Erdbeere ist Obst.","Erdbeere","Kartoffel","Salat"]]),
 SA("b12-gesund","Gesund bleiben","Hände waschen, schlafen, bewegen","Gesund bleiben wir, wenn wir die <b>Hände waschen</b> (nach dem Klo und vor dem Essen, so lange wie zweimal „Happy Birthday“ singen), genug <b>schlafen</b>, uns <b>bewegen</b>, Wasser trinken und zweimal am Tag die <b>Zähne putzen</b>.",[["Wann wäscht man die Hände?","Vor dem Essen und nach dem Klo, damit keine Keime in den Mund kommen.","Vor dem Essen und nach dem Klo","Nur am Abend","Nur wenn sie schmutzig aussehen"],["Wie oft putzt man am Tag die Zähne?","Morgens und abends: zweimal.","Zweimal","Einmal in der Woche","Nie"],["Was ist das beste Getränk gegen Durst?","Wasser löscht den Durst ohne Zucker.","Wasser","Cola","Limonade"]]),
]);

 SA("p12-tagnacht","Tag und Nacht","Warum es dunkel wird","Die Erde dreht sich einmal am Tag um sich selbst. Die Seite, die zur <b>Sonne</b> zeigt, hat <b>Tag</b>, die andere Seite hat <b>Nacht</b>. Die Sonne geht im Osten auf und im Westen unter. Mit dem Kind: Taschenlampe als Sonne, einen Ball langsam drehen.",[["Warum wird es nachts dunkel?","Unsere Seite der Erde dreht sich von der Sonne weg.","Die Erde dreht sich von der Sonne weg","Die Sonne geht aus","Der Mond deckt die Sonne zu"],["Wo geht die Sonne auf?","Die Sonne geht im Osten auf.","Im Osten","Im Westen","Im Norden"],["Wie lange dauert eine Drehung der Erde?","Eine Drehung dauert einen Tag, also 24 Stunden.","Einen Tag","Eine Woche","Ein Jahr"]]),

Object.assign(KT,{
 "k1-zaehlen":`<p>Kinder zählen anfangs oft zu schnell oder doppelt. Hilft: Gegenstände beim Zählen zur Seite schieben. Würfelspiele (Mensch ärgere dich nicht, Kniffel für Kinder) trainieren das Erkennen von Mengen nebenbei. <b>Prüffrage:</b> Drei Finger kurz zeigen und wieder verstecken: „Wie viele waren es?“</p>`,
 "k1-zehner":`<p>Ein Eierkarton mit 10 Plätzen ist ein perfektes Zehnerfeld. <b>Typischer Fehler:</b> Bei Zahlen über 10 wird wieder von 1 gezählt, statt die volle 10 zu sehen. <b>Prüffrage:</b> „Wie viele fehlen bis 10?“</p>`,
 "k1-plus10":`<p>Die Zehnerfreunde als Spiel üben: Du sagst 3, das Kind ruft 7. Fingerrechnen ist am Anfang erlaubt und normal, das Ziel ist aber, dass es später ohne Finger geht. <b>Typischer Fehler:</b> Beim Minus wird die Startzahl mitgezählt (7 ${MINUS} 3: „7, 6, 5“ und dann 5 als Ergebnis).</p>`,
 "k1-plus20":`<p>Der Zehnerübergang ist die größte Hürde der 1. Klasse. Viele Schulen nutzen das Rechenschiffchen oder den Rechenrahmen mit roten und blauen Perlen. <b>Typischer Fehler:</b> zählendes Rechnen bleibt bestehen (8 + 5: „9, 10, 11, 12, 13“). Das funktioniert, wird aber bei größeren Zahlen zur Falle. Lieber den Weg über die 10 üben.</p>`,
 "k1-formen":`<p>Formen-Jagd in der Wohnung: Wer findet die meisten Kreise? <b>Typischer Fehler:</b> Ein schräg gedrehtes Quadrat wird nicht mehr als Quadrat erkannt (es sei eine „Raute“). Das Blatt drehen hilft.</p>`,
 "k1-muster":`<p>Ketten mit Perlen fädeln, Muster mit Legosteinen legen und das Kind fortsetzen lassen. Dann tauschen: Das Kind legt ein Muster, du setzt fort (gern auch absichtlich falsch).</p>`,
 "k1-geld":`<p>Kaufladen spielen mit echtem Kleingeld ist unschlagbar. <b>Typischer Fehler:</b> Kinder denken, mehr Münzen sind mehr Geld (drei 1-€-Münzen gegen einen 5-€-Schein).</p>`,
 "k2-zahl100":`<p>Die Zahlendreher (73 statt 37) sind im Deutschen völlig normal, weil wir die Einer zuerst sprechen. Hilft: Zahlen mit Geld legen (Zehner-Scheine, Einer-Münzen) und erst die Zehner schreiben lassen. <b>Prüffrage:</b> „Was ist mehr: 37 oder 73?“</p>`,
 "k2-plus100":`<p>Lass dein Kind <b>laut erklären</b>, wie es rechnet. Es gibt mehrere richtige Wege, und Schulen wollen oft, dass Kinder verschiedene ausprobieren. <b>Typischer Fehler:</b> Zehner und Einer vermischen (46 + 27 = 613, weil 4 + 2 = 6 und 6 + 7 = 13 nebeneinander geschrieben werden).</p>`,
 "k2-mal":`<p>Malaufgaben überall entdecken: Eierkarton (2 · 5), Schokoladentafel (4 · 6), Fenster. In Sachsen wird das Einmaleins in Klasse 2 eingeführt und bis Ende Klasse 3 sicher gelernt. <b>Typischer Fehler:</b> Mal und Plus verwechseln (3 · 4 = 7).</p>`,
 "k2-geteilt":`<p>Beim Teilen von Süßigkeiten unter Geschwistern lernen Kinder das von selbst, ihr habt mit Zwillingen da sogar einen Vorteil. <b>Typischer Fehler:</b> Teilen wird nicht als Umkehrung vom Malnehmen gesehen. Frage: „Welche Malaufgabe hilft dir?“</p>`,
 "k2-uhr":`<p>In Sachsen sagt man oft <b>„viertel vier“</b> für 3:15 und <b>„dreiviertel vier“</b> für 3:45. In der Schule und in vielen Büchern heißt es „Viertel nach drei“ und „Viertel vor vier“. Sprecht beide Varianten an, damit das Kind beim Opa nicht verwirrt ist. Eine Lernuhr zum Drehen ist ihr Geld wert. <b>Typischer Fehler:</b> Den Stundenzeiger bei halb falsch lesen (bei halb vier steht er zwischen 3 und 4).</p>`,
 "k2-laenge":`<p>Mit Zollstock und Maßband durch die Wohnung: Wie lang ist das Bett, wie breit der Tisch? Erst schätzen, dann messen. <b>Typischer Fehler:</b> Beim Lineal ab dem Rand statt ab der 0 messen.</p>`,
 "k2-geld":`<p>Beim Einkaufen den Kassenbon gemeinsam lesen und Rückgeld vorher schätzen. <b>Typischer Fehler:</b> 1,50 € als 1 € 5 ct lesen. Hinter dem Komma stehen immer zwei Stellen Cent.</p>`,
 "k3-zahl1000":`<p>Zahlen bis 1000 lassen sich mit Geld (Hunderter-Scheine aus dem Spiel) oder mit Seitenzahlen in Büchern erleben. <b>Typischer Fehler:</b> Bei Zahlen mit Null (305) wird die Null weggelassen (35).</p>`,
 "k3-rechnen":`<p>Halbschriftlich heißt: Jeder Schritt wird aufgeschrieben. Lass dein Kind lieber eine Zeile mehr schreiben als im Kopf durcheinanderzukommen. <b>Typischer Fehler:</b> Beim Minus über den Hunderter (603 ${MINUS} 8) den Übergang vergessen.</p>`,
 "k3-mal":`<p>Das Blitzrechnen-Spiel unter Training ist genau dafür gemacht: Ziel ist das kleine Einmaleins ohne Nachdenken. 5 Minuten täglich bringen mehr als eine Stunde am Wochenende. <b>Typischer Fehler:</b> Beim Zerlegen einen Teil vergessen (7 · 23 = 140 + 3).</p>`,
 "k3-groessen":`<p>Mit der Küchenwaage wiegen: Wie schwer ist ein Apfel, ein Buch, ein Kuscheltier? <b>Typischer Fehler:</b> Gramm und Kilogramm verwechseln, und beim Umrechnen 100 statt 1000.</p>`,
 "k3-spiegel":`<p>Klecksbilder und Spiegel-Spiele (das Kind spiegelt deine Bewegungen) machen Symmetrie greifbar. <b>Typischer Fehler:</b> Beim Spiegeln auf Karopapier die Abstände zur Achse nicht gleich lassen.</p>`,
});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function h(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}
function md(s){ // kleines Markdown für KI-Texte
  return esc(String(s)).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>/^[-•] /m.test(x)?"<ul class='rules'>"+x.split(/\n/).map(l=>"<li>"+l.replace(/^[-•]\s*/,"")+"</li>").join("")+"</ul>":"<p>"+x.replace(/\n/g,"<br>")+"</p>").join("")}
function plain(html){const d=document.createElement("div");d.innerHTML=html;
  d.querySelectorAll(".fr").forEach(f=>{const [a,b]=f.children;f.replaceWith(`(${a.textContent}/${b.textContent})`)});
  d.querySelectorAll("svg").forEach(s=>s.replaceWith(" [Abbildung] "));return d.textContent.replace(/\s+/g," ").trim()}
const slug=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const ELC=(q,right,wrong,sol)=>{const o=shuffle([right,...wrong]);return CH(q,o,o.indexOf(right),sol)};
const EL_TOPICS=[];
const loopf=f=>{for(let i=0;i<300;i++){const r=f();if(r)return r}return f()};

/* ---------- Kapitel 1: Spannung, Strom, Widerstand ---------- */
Object.assign(G,{
  el1_einh(){ /* leicht */
    if(Math.random()<.5){const x=pick([20,50,100,250,500,750,1500,2000]);
      return{q:`Ein Gerät braucht einen Strom von ${fmt(x)} mA. Wie viel sind das in Ampere?${unit("A")}`,kind:"num",ans:R(x,1000),
        sol:`1 A = 1000 mA. Also durch 1000 teilen: ${fmt(x)} : 1000 = <b>${fmt(x/1000)} A</b>.`}}
    const a=pick([.02,.05,.1,.25,.5,1.5,2]),m=Math.round(a*1000);
    return{q:`Ein Ladegerät liefert ${fmt(a)} A. Wie viel sind das in Milliampere?${unit("mA")}`,kind:"num",ans:R(m),
      sol:`1 A = 1000 mA. Also mit 1000 malnehmen: ${fmt(a)} · 1000 = <b>${fmt(m)} mA</b>.`}},
  el1_vergl(){ /* mittel */
    const vals=shuffle([20,50,150,300,450,800,1200]).slice(0,3);
    const lab=v=>v>=100?`${fmt(v/1000)} A`:`${fmt(v)} mA`;
    const mx=Math.max(...vals),k=vals.indexOf(mx);
    return CH("Drei Geräte ziehen unterschiedlich viel Strom. Welcher Strom ist am <b>größten</b>?",vals.map(lab),k,
      `Alles in mA umrechnen: ${vals.map(v=>fmt(v)+" mA").join(", ")}. Der größte Wert ist <b>${lab(mx)}</b>. Tipp: Erst alles in dieselbe Einheit umrechnen, dann vergleichen.`)},
  el1_prop(){ /* schwer */
    const I0=pick([120,240,360,600]);
    const sc=pick([
      {t:"Der Widerstand wird <b>doppelt</b> so groß. Die Spannung bleibt gleich.",n:1,d:2,s:"Bei gleicher Spannung gilt: doppelter Widerstand, halber Strom."},
      {t:"Der Widerstand wird <b>dreimal</b> so groß. Die Spannung bleibt gleich.",n:1,d:3,s:"Bei gleicher Spannung gilt: dreifacher Widerstand, ein Drittel des Stroms."},
      {t:"Der Widerstand wird <b>halbiert</b>. Die Spannung bleibt gleich.",n:2,d:1,s:"Bei gleicher Spannung gilt: halber Widerstand, doppelter Strom."},
      {t:"Die Spannung wird <b>verdoppelt</b>. Der Widerstand bleibt gleich.",n:2,d:1,s:"Bei gleichem Widerstand gilt: doppelte Spannung, doppelter Strom."},
      {t:"Die Spannung wird <b>verdreifacht</b>. Der Widerstand bleibt gleich.",n:3,d:1,s:"Bei gleichem Widerstand gilt: dreifache Spannung, dreifacher Strom."},
      {t:"Die Spannung wird <b>halbiert</b>. Der Widerstand bleibt gleich.",n:1,d:2,s:"Bei gleichem Widerstand gilt: halbe Spannung, halber Strom."}]);
    const res=I0*sc.n/sc.d;
    return{q:`Ein Stromkreis besteht aus einer Spannungsquelle und einem Widerstand. Es fließen ${fmt(I0)} mA. ${sc.t} Wie groß ist die Stromstärke danach?${unit("mA")}`,kind:"num",ans:R(I0*sc.n,sc.d),
      sol:`${sc.s} ${fmt(I0)} mA ${sc.n===1?":":"·"} ${sc.n===1?sc.d:sc.n}${sc.n!==1&&sc.d!==1?" : "+sc.d:""} = <b>${fmt(res)} mA</b>.`}},
  el1_quiz(){ /* Quiz */
    return pick([
      ()=>ELC("In welcher Einheit misst man die Stromstärke?","Ampere (A)",["Volt (V)","Ohm (Ω)"],"Die Stromstärke I misst man in <b>Ampere (A)</b>. Volt ist die Einheit der Spannung, Ohm die des Widerstands."),
      ()=>ELC("Was treibt den Strom in einem Stromkreis an?","Die Spannung der Quelle",["Der Widerstand","Die Leitung selbst"],"Die <b>Spannung</b> (zum Beispiel einer Batterie) treibt die Ladungen an. Der Widerstand bremst sie."),
      ()=>ELC("Im Wasserbild entspricht der elektrische Widerstand …","einer engen Stelle im Rohr",["dem Wasserdruck der Pumpe","der Wassermenge pro Sekunde"],"Druck der Pumpe = Spannung, Wassermenge pro Sekunde = Stromstärke, <b>enge Stelle = Widerstand</b>.")
    ])()}
});
Object.assign(GEN_NAMES,{el1_einh:"Strom: mA und A umrechnen",el1_vergl:"Ströme vergleichen",el1_prop:"Strom bei anderer Spannung oder Widerstand",el1_quiz:"Quiz: Spannung, Strom, Widerstand"});

EL_TOPICS.push(T("p-el1","Spannung, Strom, Widerstand","V, A, Ω: die drei Grundgrößen",["el1_einh","el1_vergl","el1_prop","el1_quiz"],[
 ["Lernziel und Wasserbild",`<p class="tip">Lernziel: Du kannst erklären, was Spannung, Stromstärke und Widerstand sind, und du kennst ihre Einheiten V, A und Ω.</p><p>Ein <b>Stromkreis</b> ist ein geschlossener Weg, auf dem elektrische Ladung fließt. Am besten stellst du dir einen Wasserkreislauf vor: Eine Pumpe drückt Wasser durch ein Rohr.</p><ul class="rules"><li><b>Pumpe</b> = Batterie (die <b>Quelle</b>)</li><li><b>Wasserdruck</b> = Spannung</li><li><b>Wassermenge pro Sekunde</b> = Stromstärke</li><li><b>Enge Stelle im Rohr</b> = Widerstand</li></ul><p>Was in den Drähten fließt, sind winzige, negativ geladene Teilchen, die <b>Elektronen</b>. Warum sie das tun, klären wir in Teil 3.</p>`],
 ["Spannung U in Volt (V)",`<p>Die <b>Spannung</b> sagt, wie stark die Quelle die Ladungen antreibt. Man misst sie in <b>Volt (V)</b>, Formelzeichen U.</p><div class="tbl-wrap"><table class="tbl"><tr><th>Quelle</th><th>Spannung</th></tr><tr><td>Mignon-Batterie (AA)</td><td>1,5 V</td></tr><tr><td>Flachbatterie</td><td>4,5 V</td></tr><tr><td>Auto-Batterie</td><td>etwa 12 V</td></tr><tr><td>Steckdose</td><td>230 V (lebensgefährlich)</td></tr></table></div><p>Spannung ist auch da, wenn gar nichts fließt, wie Druck im Schlauch bei zugedrehtem Hahn.</p>`],
 ["Stromstärke I in Ampere (A)",`<p>Die <b>Stromstärke</b> sagt, wie viel Ladung pro Sekunde durch den Draht fließt. Einheit: <b>Ampere (A)</b>, Formelzeichen I.</p><p>Kleine Ströme gibt man in <b>Milliampere (mA)</b> an. Milli heißt Tausendstel: <b>1 A = 1000 mA</b>. Eine kleine LED braucht meist etwa 10 bis 20 mA, ein Handy-Ladegerät oft 1 bis 2 A.</p><p class="tip">Alltagsbild: Im Gartenschlauch ist die Stromstärke die Menge Wasser, die pro Sekunde herauskommt.</p>`],
 ["Widerstand R in Ohm (Ω)",`<p>Der <b>Widerstand</b> bremst den Strom. Man misst ihn in <b>Ohm (Ω)</b>, das ist der griechische Buchstabe Omega. Formelzeichen R. Große Werte schreibt man mit <b>Kilo</b>: <b>1 kΩ = 1000 Ω</b>.</p><p>Ein langer, dünner Draht hat mehr Widerstand als ein kurzer, dicker. Kupferkabel haben sehr wenig Widerstand, Gummi so viel, dass praktisch kein Strom fließt.</p><p>Bei gleicher Spannung gilt: <b>doppelter Widerstand, halber Strom.</b> Bei gleichem Widerstand gilt: <b>doppelte Spannung, doppelter Strom.</b></p>`],
 ["Merkkasten",`<p class="eq">U in Volt (V)<br>I in Ampere (A)<br>R in Ohm (Ω)</p><ul class="rules"><li>Die <b>Spannung treibt</b> den Strom an.</li><li>Der <b>Widerstand bremst</b> ihn.</li><li>1 A = 1000 mA und 1 kΩ = 1000 Ω.</li><li>Gleiche Spannung: Widerstand verdoppelt, Strom halbiert.</li></ul>`],
 ["Sicherheit",`<p class="warn">Probiere nur mit Kleinspannung bis 12 V Gleichspannung (zum Beispiel Batterien). Die Steckdose (230 V) ist lebensgefährlich: nie damit experimentieren. Eine Batterie darf man nie nur mit einem Draht verbinden (Kurzschluss), denn der Draht wird heiß. Unter 14 Jahren nur mit einem Erwachsenen.</p>`]
]));
Object.assign(KT,{"p-el1":`<p><b>Experiment: Widerstand erleben.</b> Material: Flachbatterie 4,5 V (oder drei 1,5-V-Batterien im Halter), Glühlämpchen für 3,5 bis 4,5 V mit Fassung, 3 Kabel mit Krokodilklemmen, Büroklammer, Alufolienstreifen, Bleistiftmine (etwa 5 cm), Radiergummi.</p><ol class="rules"><li>Baue den Stromkreis: Batterie, Kabel, Lämpchen, Kabel zurück zur Batterie. Das Lämpchen leuchtet.</li><li>Löse ein Kabel in der Mitte und klemme nacheinander Büroklammer, Alufolie, Bleistiftmine und Radiergummi in die Lücke.</li><li>Beobachte die Helligkeit. Büroklammer und Alufolie: hell. Bleistiftmine: dunkler oder gar nicht (das hängt von der Mine ab, bitte ausprobieren). Radiergummi: aus.</li></ol><p>Erklärung: Je größer der Widerstand, desto weniger Strom fließt und desto dunkler leuchtet das Lämpchen.</p><p class="warn">Nur Batterie bis 4,5 V verwenden. Nie die Batterie kurzschließen. Die Mine kann warm werden, den Kreis nach kurzer Zeit wieder öffnen. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p><p><b>Typischer Fehler:</b> „Strom wird im Lämpchen verbraucht.“ Die Stromstärke ist im ganzen Kreis gleich, das Lämpchen gibt Energie ab.</p>`});

/* ---------- Kapitel 2: Ohmsches Gesetz ---------- */
Object.assign(G,{
  el2_i(){ /* leicht: I = U : R */
    const U=pick([3,4.5,6,9,12]),Rr=pick([10,15,20,30,50,60,100]);
    return{q:`Ein Lämpchen hat im Betrieb einen Widerstand von ${fmt(Rr)} Ω und hängt an ${fmt(U)} V. Wie groß ist die Stromstärke?${unit("A")}`,kind:"num",ans:R(Math.round(U*10),Rr*10),
      sol:`I = U : R = ${fmt(U)} V : ${fmt(Rr)} Ω = <b>${fmt(U/Rr)} A</b>.`}},
  el2_ur(){ /* mittel: U oder R, mit mA */
    if(Math.random()<.5){let Rr,mA,u;do{Rr=pick([100,150,220,330,470]);mA=pick([10,20,30,40,50]);u=Rr*mA/1000}while(u>12);
      return{q:`Durch einen Widerstand von ${fmt(Rr)} Ω fließen ${fmt(mA)} mA. Welche Spannung liegt an ihm an?${unit("V")}`,kind:"num",ans:R(Rr*mA,1000),
        sol:`Erst in Ampere umrechnen: ${fmt(mA)} mA = ${fmt(mA/1000)} A. Dann U = R · I = ${fmt(Rr)} Ω · ${fmt(mA/1000)} A = <b>${fmt(u)} V</b>.`}}
    const U=pick([3,6,9,12]),mA=pick([20,30,40,50,60,100,150,200,300,500]),Rr=U*1000/mA;
    return{q:`An einem Bauteil liegen ${fmt(U)} V an, es fließen ${fmt(mA)} mA. Wie groß ist der Widerstand?${unit("Ω")}`,kind:"num",ans:R(U*1000,mA),
      sol:`Erst in Ampere umrechnen: ${fmt(mA)} mA = ${fmt(mA/1000)} A. Dann R = U : I = ${fmt(U)} V : ${fmt(mA/1000)} A = <b>${fmt(Rr)} Ω</b>.`}},
  el2_zwei(){ /* schwer: zwei Schritte */
    const Rr=pick([10,20,30,40,60,100]),U1=pick([3,6,9,12]);let U2;do{U2=pick([3,6,9,12])}while(U2===U1);
    const I1=U1*1000/Rr,I2=U2*1000/Rr;
    return{q:`Ein gewöhnlicher Widerstand liegt an ${fmt(U1)} V. Dabei fließen ${fmt(I1)} mA. Nun wird er an ${fmt(U2)} V angeschlossen. Wie groß ist der Strom dann?${unit("mA")}`,kind:"num",ans:R(U2*1000,Rr),
      sol:`Schritt 1: Widerstand ausrechnen. ${fmt(I1)} mA = ${fmt(I1/1000)} A, also R = U : I = ${fmt(U1)} V : ${fmt(I1/1000)} A = ${fmt(Rr)} Ω.<br>Schritt 2: I = U : R = ${fmt(U2)} V : ${fmt(Rr)} Ω = ${fmt(U2/Rr)} A = <b>${fmt(I2)} mA</b>.`}},
  el2_quiz(){
    return pick([
      ()=>ELC("Wie lautet das Ohmsche Gesetz, umgestellt nach der Spannung?","U = R · I",["U = R : I","U = I : R"],"Aus R = U : I folgt durch Malnehmen mit I: <b>U = R · I</b>. Probe: 10 Ω · 0,5 A = 5 V, und 5 V : 0,5 A = 10 Ω."),
      ()=>ELC("Ein Widerstand hat 100 Ω. Die Spannung an ihm wird verdoppelt. Was passiert mit dem Strom?","Er wird doppelt so groß",["Er wird halb so groß","Er bleibt gleich"],"Bei gleichem Widerstand gilt I = U : R. Doppelte Spannung ergibt <b>doppelten Strom</b>."),
      ()=>ELC("Wo gilt das Ohmsche Gesetz mit gleichbleibendem Widerstand?","Bei einem Metalldraht mit gleicher Temperatur",["Bei einer LED","Bei einer Glühlampe, die sich aufheizt"],"Nur bei Bauteilen mit <b>konstantem Widerstand</b>. Bei der Glühlampe steigt R mit der Hitze, die LED hat eine eigene Kennlinie (mehr dazu in Kapitel 7).")
    ])()}
});
Object.assign(GEN_NAMES,{el2_i:"Ohm: Strom berechnen",el2_ur:"Ohm: Spannung oder Widerstand",el2_zwei:"Ohm: Aufgaben in zwei Schritten",el2_quiz:"Quiz: Ohmsches Gesetz"});

EL_TOPICS.push(T("p-el2","Das Ohmsche Gesetz","U = R · I, rechnen mit V, A und Ω",["el2_i","el2_ur","el2_zwei","el2_quiz"],[
 ["Lernziel und Idee",`<p class="tip">Lernziel: Du kannst aus zwei der drei Größen U, I und R die dritte ausrechnen.</p><p>In Kapitel 1 hast du gesehen: Bei gleichem Widerstand gibt doppelte Spannung doppelten Strom. Der Physiker Georg Simon Ohm hat das in eine Formel gefasst, das <b>Ohmsche Gesetz</b>:</p><p class="eq">R = U : I</p><p>Du kannst die Formel umstellen, je nachdem, was gesucht ist:</p><p class="eq">U = R · I<br>I = U : R<br>R = U : I</p><p class="tip">Merkhilfe: Zeichne ein Dreieck mit U oben und R und I unten. Halte die gesuchte Größe zu: Was übrig bleibt, ist die Rechnung. U oben heißt „R mal I“, I unten heißt „U durch R“.</p>`],
 ["Beispiel 1: Taschenlampe",`<p>Eine Taschenlampe mit Flachbatterie (4,5 V). Das Glühlämpchen hat im Betrieb etwa 15 Ω. Gesucht: die Stromstärke.</p><p class="eq">I = U : R<br>I = 4,5 V : 15 Ω = 0,3 A</p><p>Es fließen also 0,3 A, das sind 300 mA.</p>`],
 ["Beispiel 2: LED und Vorwiderstand",`<p>Vor eine LED wird ein Widerstand von 150 Ω geschaltet (warum, lernst du in Kapitel 7). Es sollen 20 mA fließen. Gesucht: die Spannung, die am Widerstand anliegt.</p><p class="eq">20 mA = 0,02 A<br>U = R · I<br>U = 150 Ω · 0,02 A = 3 V</p><p class="tip">Immer zuerst auf Grundeinheiten umrechnen: mA in A und kΩ in Ω. Sonst kommen falsche Zahlen heraus.</p>`],
 ["Wann gilt das Gesetz?",`<p>Das Ohmsche Gesetz in dieser Form gilt für Bauteile mit <b>gleichbleibendem Widerstand</b>, zum Beispiel normale Widerstände oder Metalldrähte bei gleicher Temperatur.</p><p>Bei einer <b>Glühlampe</b> steigt der Widerstand, wenn der Draht heiß wird. Bei einer <b>LED</b> fließt unterhalb einer bestimmten Spannung fast nichts, darüber sehr viel. Dort rechnest du mit dem Gesetz nur für einen einzelnen Betriebspunkt.</p>`],
 ["Merkkasten",`<p class="eq">U = R · I<br>I = U : R<br>R = U : I</p><ul class="rules"><li>U in Volt (V), I in Ampere (A), R in Ohm (Ω).</li><li>Vor dem Rechnen umrechnen: 1 A = 1000 mA, 1 kΩ = 1000 Ω.</li><li>Gilt für Bauteile mit gleichbleibendem Widerstand.</li></ul>`],
 ["Sicherheit",`<p class="warn">Rechne mit Kleinspannung, probiere nur bis 12 V Gleichspannung. Auch wenn man mit 230 V rechnen könnte: Das ist lebensgefährlich und kein Versuch. Widerstände werden warm, wenn zu viel Strom fließt: Bleibe bei den Werten aus der Anleitung. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p>`]
]));
Object.assign(KT,{"p-el2":`<p><b>Experiment: Erst rechnen, dann messen.</b> Material: Flachbatterie 4,5 V, drei Widerstände (220 Ω, 470 Ω, 1 kΩ, je ¼ Watt), Multimeter, Kabel mit Krokodilklemmen.</p><ol class="rules"><li>Lies den Wert des Widerstands von der Verpackung ab (Farbcode lernst du in Kapitel 6).</li><li>Rechne vorher: I = U : R. Mit 4,5 V sind das etwa 20 mA (220 Ω), 10 mA (470 Ω) und 4,5 mA (1 kΩ).</li><li>Miss die Spannung der Batterie: Multimeter auf Gleichspannung (V, DC), rote Leitung an Plus, schwarze an Minus.</li><li>Rechne mit dem gemessenen Wert nach. Eine gebrauchte Batterie hat oft etwas weniger als 4,5 V.</li><li>Optional mit einem Erwachsenen: Strom messen. Das Multimeter wird dazu <b>in Reihe</b> in den Kreis gesetzt (Batterie, Widerstand, Multimeter, zurück). Die genaue Anleitung kommt in Kapitel 9.</li></ol><p class="warn">Nur Batterie bis 4,5 V. Das Multimeter im Strommessbereich <b>nie direkt an die Batterie</b> halten, das ist ein Kurzschluss. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p><p><b>Typischer Fehler:</b> mA nicht in A umrechnen. 20 mA sind 0,02 A, nicht 20 A.</p>`});

/* ---------- Kapitel 3: Leistung ---------- */
Object.assign(G,{
  el3_p(){ /* leicht: P = U · I */
    const U=pick([3,4.5,5,6,9,12]),I=pick([.1,.2,.3,.5,1,2]),who=pick(["Ein kleiner Motor","Ein Lämpchen","Ein Ladegerät","Ein Lüfter"]);
    return{q:`${who} liegt an ${fmt(U)} V, es fließen ${fmt(I)} A. Welche Leistung setzt es um?${unit("W")}`,kind:"num",ans:R(Math.round(U*10)*Math.round(I*10),100),
      sol:`P = U · I = ${fmt(U)} V · ${fmt(I)} A = <b>${fmt(Math.round(U*10)*Math.round(I*10)/100)} W</b>.`}},
  el3_umr(){ /* mittel: Umrechnen und I = P : U */
    const t=ri(0,2);
    if(t===0){const U=pick([5,12]),I=pick([1,2,3,5]),P=U*I;
      return{q:`Ein Gerät mit ${fmt(P)} W Leistung hängt an ${fmt(U)} V. Wie groß ist die Stromstärke?${unit("A")}`,kind:"num",ans:R(P,U),
        sol:`P = U · I, also I = P : U = ${fmt(P)} W : ${fmt(U)} V = <b>${fmt(I)} A</b>.`}}
    if(t===1){const U=pick([3,5,6,9,12]),mA=pick([100,200,250,400,500]),P=U*mA/1000;
      return{q:`An einem Bauteil liegen ${fmt(U)} V an, es fließen ${fmt(mA)} mA. Welche Leistung wird umgesetzt?${unit("W")}`,kind:"num",ans:R(U*mA,1000),
        sol:`Erst umrechnen: ${fmt(mA)} mA = ${fmt(mA/1000)} A. Dann P = U · I = ${fmt(U)} V · ${fmt(mA/1000)} A = <b>${fmt(P)} W</b>.`}}
    const k=pick([.5,1.2,1.5,2,2.5,3]);
    return{q:`Ein Gerät hat eine Leistung von ${fmt(k)} kW. Wie viel sind das in Watt?${unit("W")}`,kind:"num",ans:R(Math.round(k*1000)),
      sol:`1 kW = 1000 W. Also ${fmt(k)} · 1000 = <b>${fmt(Math.round(k*1000))} W</b>.`}},

        sol:`Bei ${n} gleichen Widerständen parallel gilt: R = R<sub>1</sub> : ${n} = ${fmt(Rr)} Ω : ${n} = <b>${fmt(Rr/n)} Ω</b>. Der Gesamtwiderstand ist kleiner als jeder einzelne.`}}
    const a=pick([.1,.2,.3,.4,.5]),mb=pick([150,250,350,450]),sum=a+mb/1000;

      sol:`Erst umrechnen: ${fmt(mb)} mA = ${fmt(mb/1000)} A. Bei Parallelschaltung addieren sich die Teilströme: ${fmt(a)} A + ${fmt(mb/1000)} A = <b>${fmt(sum)} A</b>.`}},
  el5_zwei(){ /* schwer: Spannung am Widerstand in Reihe */
    const pr=pick([[100,200,[3,6,9,12]],[100,100,[4,6,8,12]],[200,300,[5,10]],[50,150,[4,8,12]],[100,300,[4,8,12]]]),[r1,r2,us]=pr,U=pick(us),sum=r1+r2,I=U/sum,w=pick([1,2]),rx=w===1?r1:r2,Ux=rx*U/sum;
    return{q:`Zwei Widerstände (R<sub>1</sub> = ${fmt(r1)} Ω, R<sub>2</sub> = ${fmt(r2)} Ω) liegen in Reihe an ${fmt(U)} V. Wie groß ist die Spannung an R<sub>${w}</sub>?${unit("V")}`,kind:"num",ans:R(rx*U,sum),

      ()=>ELC("Zwei Widerstände mit je 100 Ω sind parallel geschaltet. Der Gesamtwiderstand ist …","50 Ω",["200 Ω","100 Ω"],"Parallel gilt R = 100 Ω : 2 = <b>50 Ω</b>. Die 200 Ω wären die Reihenschaltung.")

  el6_sich(){ /* schwer: Gesamtstrom und Sicherung */

EL_TOPICS.push(T("p-el6","Widerstand, Schalter, Sicherung","Farbcode, Schalten und Schützen",["el6_farb","el6_umr","el6_sich","el6_quiz"],[
 ["Lernziel und Idee",`<p class="tip">Lernziel: Du erkennst Widerstand, Schalter und Sicherung, liest den Farbcode eines Widerstands und weißt, wozu die Sicherung da ist.</p><p>Drei einfache Bauteile, die in fast jeder Schaltung vorkommen: Der <b>Widerstand</b> bremst den Strom gezielt. Der <b>Schalter</b> öffnet und schließt den Kreis. Die <b>Sicherung</b> schützt vor zu viel Strom.</p>`],
 ["Der Widerstand",`<p>Ein Widerstand besteht aus einem Keramikkörper mit einer dünnen Schicht aus Kohle oder Metall, der Widerstandsschicht, und zwei Drähten zum Anschließen. Er <b>begrenzt den Strom</b>, zum Beispiel vor einer LED, oder teilt eine Spannung auf.</p><p>Außer dem Wert in Ω hat jeder Widerstand eine <b>Belastbarkeit</b> in Watt, die angibt, wie viel Leistung er als Wärme verträgt. Kleine Bauteile haben oft ¼ W (siehe Kapitel 3).</p><p>Es gibt nur bestimmte <b>Normwerte</b>, zum Beispiel 10, 22, 47, 100, 220, 470 Ω und 1 kΩ. Die Zahlen 10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 82 kehren mit Faktor 10, 100, 1000 immer wieder.</p>`],
 ["Der Farbcode",`<p>Kleine Widerstände haben keinen Platz für Zahlen und tragen deshalb <b>Farbringe</b>. Halte den Widerstand so, dass der goldene oder silberne Ring rechts ist, und lies von links:</p><ul class="rules"><li>1. Ring: erste Ziffer</li><li>2. Ring: zweite Ziffer</li><li>3. Ring: Multiplikator (mal 10, 100, …)</li><li>4. Ring: Toleranz</li></ul><div class="tbl-wrap"><table class="tbl"><tr><th>Farbe</th><th>Ziffer</th><th>Multiplikator</th></tr><tr><td>schwarz</td><td>0</td><td>· 1</td></tr><tr><td>braun</td><td>1</td><td>· 10</td></tr><tr><td>rot</td><td>2</td><td>· 100</td></tr><tr><td>orange</td><td>3</td><td>· 1000</td></tr><tr><td>gelb</td><td>4</td><td>· 10 000</td></tr><tr><td>grün</td><td>5</td><td>· 100 000</td></tr><tr><td>blau</td><td>6</td><td>· 1 000 000</td></tr><tr><td>violett</td><td>7</td><td></td></tr><tr><td>grau</td><td>8</td><td></td></tr><tr><td>weiß</td><td>9</td><td></td></tr></table></div><p>Toleranz: gold ±5 %, silber ±10 %, braun ±1 %, rot ±2 %. Sie sagt, wie weit der echte Wert vom Aufdruck abweichen darf.</p><p class="eq">braun – schwarz – rot – gold<br>= 10 · 100 = 1000 Ω = 1 kΩ, ±5 %<br>gelb – violett – rot – gold<br>= 47 · 100 = 4700 Ω = 4,7 kΩ, ±5 %</p><p>Genaue Widerstände haben fünf Ringe: drei Ziffern, ein Multiplikator, eine Toleranz. Beispiel braun – schwarz – schwarz – braun – braun = 100 · 10 = 1 kΩ, ±1 %.</p>`],
 ["Schalter und Taster",`<p>Ein <b>Schalter</b> öffnet oder schließt den Stromkreis und rastet ein. Ein <b>Taster</b> schließt ihn nur, solange du drückst, wie bei einer Klingel. Ein <b>Schließer</b> leitet, wenn er betätigt wird, ein <b>Öffner</b> leitet im Ruhezustand und trennt, wenn er betätigt wird.</p><p>Jeder Schalter hat eine Obergrenze für Spannung und Strom. Sie steht oft auf dem Gehäuse, zum Beispiel 12 V und 2 A. Der Schalter liegt in <b>Reihe</b> zum Verbraucher.</p>`],
 ["Die Sicherung",`<p>Eine <b>Sicherung</b> enthält einen dünnen Draht, der bei zu viel Strom schmilzt und den Kreis öffnet. So schützt sie Leitungen und Geräte vor Überhitzung bei Überlast oder Kurzschluss. Sie liegt in <b>Reihe</b> in der Leitung.</p><p>Wichtig ist der <b>Nennstrom</b> in Ampere. Beispiel: Ein Gerät mit 12 V und 36 W zieht 36 W : 12 V = 3 A. Eine 5-A-Sicherung passt: Sie hält den normalen Betrieb aus und löst bei deutlich mehr Strom aus. Es gibt flinke (F) und träge (T) Sicherungen, träge halten kurze Stromspitzen beim Einschalten aus.</p><p class="warn">Eine durchgebrannte Sicherung nie mit Draht oder Alufolie überbrücken und keine mit viel größerem Nennstrom einsetzen. Dann schützt sie nicht mehr, und die Leitung kann brennen.</p>`],
 ["Merkkasten",`<ul class="rules"><li>Widerstand: begrenzt den Strom, Wert in Ω, Belastbarkeit in W.</li><li>Farbcode: Ziffer, Ziffer, Multiplikator, Toleranz.</li><li>Schalter und Sicherung liegen in Reihe im Kreis.</li><li>Sicherung: Nennstrom in A, nie überbrücken.</li></ul><p class="eq">braun 1 · rot 2 · orange 3 · gelb 4<br>grün 5 · blau 6 · violett 7 · grau 8 · weiß 9<br>schwarz 0</p>`],
 ["Sicherheit",`<p class="warn">Sicherungen und Schalter im Haus (230 V) gehören ausschließlich in die Hand einer Elektrofachkraft. Probiere nur mit Batterien bis 12 V. Widerstände können nach Betrieb heiß sein. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p>`]
]));
Object.assign(KT,{"p-el6":`<p><b>Experiment: Ablesen, rechnen, nachmessen.</b> Material: 5 Widerstände mit Farbringen (zum Beispiel 220 Ω, 470 Ω, 1 kΩ, 4,7 kΩ, 10 kΩ), Multimeter, Zettel.</p><ol class="rules"><li>Halte den ersten Widerstand so, dass der goldene Ring rechts ist. Notiere die Farben von links nach rechts.</li><li>Berechne den Wert mit der Tabelle und notiere ihn mit Toleranz. Beispiel: 220 Ω ±5 % liegt zwischen 209 Ω und 231 Ω.</li><li>Stelle das Multimeter auf den Widerstandsbereich (Ω). Halte die Messspitzen an die beiden Drähte, ohne die Metallspitzen mit den Fingern zu berühren, sonst misst du dich mit.</li><li>Vergleiche: Liegt der gemessene Wert innerhalb der Toleranz?</li></ol><p class="warn">Nur einzelne Widerstände ohne Spannung messen, nie in einem Stromkreis unter Spannung. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p><p><b>Typischer Fehler:</b> Die Ringe von der falschen Seite lesen. Der goldene oder silberne Toleranzring ist immer rechts.</p>`});

  el7a(){ /* leicht: Spannung am Vorwiderstand */

      sol:`U<sub>R</sub> = ${r.UQ} V − ${r.UL} V = ${r.UQ-r.UL} V. ${r.mA} mA = ${fmt(r.mA/1000)} A. R = U : I = ${r.UQ-r.UL} V : ${fmt(r.mA/1000)} A = <b>${fmt(r.Rr)} Ω</b>.`}},
  el7c(){ /* schwer: Normwert wählen */

      sol:`R = (${fmt(UQ)} V − ${UL} V) : ${fmt(mA/1000)} A = ${fmt(Math.round(Rc*10)/10)} Ω. Der nächstgrößere Normwert (so bleibt der Strom unter ${mA} mA) ist <b>${fmt(Rn)} Ω</b>.`}},
  el7q(){return pick([

    ()=>ELC("Welches Bein einer neuen LED ist die Anode (Pluspol)?","Das längere",["Das kürzere","Beide sind gleich"],"Das <b>längere Bein</b> ist die Anode (Plus), die abgeflachte Seite am Gehäuse zeigt die Kathode (Minus)."),
    ()=>ELC("Eine Diode wird in Sperrrichtung angeschlossen. Was passiert?","Es fließt (fast) kein Strom",["Sie leitet besonders gut","Sie leuchtet immer"],"Eine Diode lässt den Strom nur in <b>einer Richtung</b> durch. In Sperrrichtung blockiert sie.")])()}

EL_TOPICS.push(T("p-el7","LED mit Vorwiderstand und Diode","Strom in einer Richtung, sicher begrenzt",["el7a","el7b","el7c","el7q"],[
 ["Lernziel und Idee",`<p class="tip">Lernziel: Du kannst den Vorwiderstand für eine LED berechnen und erklären, was eine Diode tut.</p><p>Eine <b>Diode</b> ist ein Bauteil, das den Strom nur in <b>eine Richtung</b> durchlässt, wie ein Rückschlagventil. Eine <b>LED</b> (Leuchtdiode) ist eine Diode, die dabei leuchtet. Die Anschlüsse heißen <b>Anode</b> (Plus) und <b>Kathode</b> (Minus).</p>`],
 ["Warum ein Vorwiderstand?",`<p>Eine LED braucht eine bestimmte <b>Flussspannung</b> U<sub>LED</sub>, damit sie leitet. Typisch sind etwa 2 V für rote, gelbe und grüne LEDs und etwa 3 bis 3,3 V für blaue und weiße (bitte im Datenblatt prüfen). Danach steigt der Strom steil an. Ohne Begrenzung brennt sie durch.</p><p>Deshalb kommt ein <b>Vorwiderstand</b> in Reihe. Er bekommt die restliche Spannung, und das Ohmsche Gesetz sagt, wie groß er sein muss:</p><p class="eq">R = (U<sub>Quelle</sub> − U<sub>LED</sub>) : I<sub>LED</sub></p><p>Für Standard-LEDs nimmt man meist 10 bis 20 mA.</p>`],
 ["Beispiel: LED an 9 V",`<p>Rote LED (2 V), Batterie 9 V, gewünscht 20 mA.</p><p class="eq">U<sub>R</sub> = 9 V − 2 V = 7 V<br>R = 7 V : 0,02 A = 350 Ω</p><p>350 Ω gibt es nicht. Nimm den nächstgrößeren Normwert <b>390 Ω</b>. Dann fließen 7 V : 390 Ω ≈ 18 mA, also etwas weniger als 20 mA und damit sicher.</p>`],
 ["Die Diode",`<p>Eine normale <b>Diode</b> hat einen Ring an der Kathode. Fließt der Strom von Anode zu Kathode, leitet sie (Durchlassrichtung) und braucht dazu eine Spannung von etwa 0,7 V bei Silizium. In der Gegenrichtung sperrt sie.</p><p>Anwendungen: Schutz vor falsch herum angeschlossener Batterie und Umwandlung von Wechsel- in Gleichspannung (Gleichrichten).</p>`],
 ["Merkkasten",`<p class="eq">R = (U<sub>Quelle</sub> − U<sub>LED</sub>) : I</p><ul class="rules"><li>LED nie ohne Vorwiderstand an eine Quelle.</li><li>Längeres Bein = Anode (Plus).</li><li>Normwert aufrunden, nicht abrunden.</li><li>Diode: Durchlassrichtung leitet, Sperrrichtung sperrt.</li></ul>`],
 ["Sicherheit",`<p class="warn">Schließe eine LED nie ohne Vorwiderstand an eine Batterie oder ein Netzteil an. Sie kann zerstört werden und heiß werden. Nur Kleinspannung bis 12 V Gleichspannung. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p>`]

Object.assign(G,{

      sol:`Erst umrechnen: ${fmt(r.Rk)} kΩ = ${fmt(r.Rk*1000)} Ω und ${fmt(r.C)} µF = ${fmt(r.C/1e6)} F. τ = R · C = ${fmt(r.Rk*1000)} Ω · ${fmt(r.C/1e6)} F = <b>${fmt(r.tau)} s</b>.`}},
  el8b(){ /* mittel: parallele Kondensatoren */

    return{q:`Zwei Kondensatoren (${fmt(a)} µF und ${fmt(b)} µF) werden parallel geschaltet. Wie groß ist die Gesamtkapazität?${unit("µF")}`,kind:"num",ans:R(a+b),sol:`Parallel addieren sich die Kapazitäten: ${fmt(a)} µF + ${fmt(b)} µF = <b>${fmt(a+b)} µF</b>.`}},
  el8c(){ /* schwer: Relaisspule, Leistung */
    const Rr=pick([120,240,400,480]),U=12,I=U/Rr,P=U*U/Rr;
    return{q:`Die Spule eines Relais hat bei ${U} V einen Widerstand von ${fmt(Rr)} Ω. Welche Leistung nimmt die Spule auf?${unit("W")}`,kind:"num",ans:R(U*U*10,Rr*10),
      sol:`Schritt 1: I = U : R = ${U} V : ${fmt(Rr)} Ω = ${fmt(I)} A. Schritt 2: P = U · I = ${U} V · ${fmt(I)} A = <b>${fmt(P)} W</b>.`}},
  el8q(){return pick([
    ()=>ELC("Worauf muss man bei einem Elektrolytkondensator (Elko) besonders achten?","Auf die richtige Polung und die Spannungsfestigkeit",["Auf die Farbe","Auf die Länge der Beine"],"Ein Elko hat Plus und Minus. Falsch herum oder mit zu hoher Spannung kann er <b>platzen</b>."),
    ()=>ELC("Was macht ein Relais?","Ein kleiner Strom schaltet über einen Magneten einen Kontakt",["Es speichert Ladung","Es macht aus Wechsel- Gleichstrom"],"Der Strom durch die Spule macht einen Elektromagneten, der einen <b>Schalter</b> bewegt."),
    ()=>ELC("Nach einer Zeitkonstante τ ist ein Kondensator etwa …","zu 63 % geladen",["voll geladen","zur Hälfte geladen"],"Nach τ = R · C sind es rund <b>63 %</b>, nach 5 τ ist er praktisch voll.")])()},
  el8d(){const U=pick([10,20,5,50]);return{q:`Ein Kondensator wird über einen Widerstand an ${U} V geladen. Wie viel Volt hat er nach einer Zeitkonstante τ? (Rechne mit 63 %)${unit("V")}`,kind:"num",ans:R(63*U,100),sol:`Nach τ sind es 63 % der Quellspannung: ${U} V · 0,63 = <b>${fmt(0.63*U)} V</b>.`}}
});

EL_TOPICS.push(T("p-el8","Kondensator und Relais","Speichern und Schalten",["el8a","el8b","el8c","el8d","el8q"],[
 ["Lernziel und Idee",`<p class="tip">Lernziel: Du erklärst, was ein Kondensator speichert und was ein Relais schaltet, und du rechnest die Ladezeit.</p><p>Ein <b>Kondensator</b> speichert elektrische Ladung, ähnlich wie ein kleiner Wassertank. Ein <b>Relais</b> ist ein Schalter, der von einem Elektromagneten betätigt wird, so schaltet ein kleiner Strom einen großen.</p>`],
 ["Der Kondensator",`<p>Die Speicherfähigkeit heißt <b>Kapazität C</b>, Einheit <b>Farad (F)</b>. Praktisch ist ein Farad riesig: 1 mF = 0,001 F, 1 µF = 0,000001 F.</p><p>Beim Laden über einen Widerstand R steigt die Spannung zuerst schnell, dann immer langsamer. Das Maß dafür ist die <b>Zeitkonstante</b>:</p><p class="eq">τ = R · C</p><p>Nach τ ist er zu etwa 63 % geladen, nach 5 τ praktisch voll. Beispiel: 10 kΩ und 100 µF ergeben 10 000 Ω · 0,0001 F = 1 s.</p><p>Alltag: Blitz im Fotoapparat, Glätten der Spannung im Netzteil. Bei <b>parallel</b> geschalteten Kondensatoren addieren sich die Kapazitäten.</p>`],
 ["Das Relais",`<p>Ein Relais hat eine <b>Spule</b> mit Eisenkern, einen <b>Anker</b> und <b>Kontakte</b>. Fließt Strom durch die Spule, zieht der Elektromagnet den Anker an, und die Kontakte schalten. Die Spule hat eine Nennspannung, zum Beispiel 12 V, und einen Widerstand, zum Beispiel 240 Ω. Dann fließen 12 V : 240 Ω = 50 mA.</p><p>Der Vorteil: Spulenkreis und Schaltkreis sind elektrisch getrennt. Mit einem kleinen Strom kann man größere Lasten schalten.</p>`],

 ["Sicherheit",`<p class="warn">Ein Elektrolytkondensator darf nie falsch herum oder mit mehr als seiner aufgedruckten Spannung betrieben werden, sonst kann er heiß werden und platzen. Große Kondensatoren aus Geräten können noch lange gefährlich geladen sein: Nie öffnen. Nur Kleinspannung bis 12 V. Unter 14 Jahren mit Aufsicht eines Erwachsenen.</p>`]
]));
